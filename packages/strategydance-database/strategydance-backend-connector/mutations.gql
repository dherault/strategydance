# Starts a call the thread shows, before the worker makes it, so a worker fenced out never makes
# one: `RUNNING`, with when it started. A call drawn and never started, one a crash left started
# with no result, which runs again, and one a stop cancelled, which a resumed run runs, all start
# here; a finished one never does. The call is found by its id in the run's conversation, whichever
# run drew it, so a resumed run starts what the run it carries on drew. Fenced as
# `RenewConversationRunLease` is
mutation StartConversationToolCall(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $messageId: UUID!
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  ) @check(expr: "this == 1", message: "The run is no longer this worker's")
  conversationMessage_updateMany(
    where: {
      id: { eq: $messageId }
      conversationId: { eq: $conversationId }
      kind: { eq: TOOL_CALL }
      toolStatus: { in: [RUNNING, CANCELLED] }
    }
    data: { toolStatus: RUNNING, toolStartedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "The call has finished already")
}

# Records what a call came to, once it has: succeeded or failed, its output as JSON text, lossless
# as the transcript is, and how long it took, only while it is still running, so a call that
# answers after its time was up changes nothing. The run keeps the results of its turn's calls that
# have finished (`$pendingToolResults`, JSON text), in the fenced write, until the entry that sends
# them is stored, so a worker taking over after a crash runs none of them again. The preview
# follows the call only while it shows it. Fenced as `RenewConversationRunLease` is
mutation FinishConversationToolCall(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $messageId: UUID!
  $toolStatus: ConversationToolStatus!
  $toolOutput: String!
  $toolDurationMs: Int!
  $pendingToolResults: String!
  $preview: Any!
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { pendingToolResults: $pendingToolResults, leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  )
    @check(expr: "this == 1", message: "The run is no longer this worker's")
    @check(
      expr: "vars.toolStatus == 'SUCCEEDED' || vars.toolStatus == 'FAILED'"
      message: "A call finishes succeeded or failed"
    )
  conversationMessage_updateMany(
    where: {
      id: { eq: $messageId }
      conversationId: { eq: $conversationId }
      kind: { eq: TOOL_CALL }
      toolStatus: { eq: RUNNING }
    }
    data: { toolStatus: $toolStatus, toolOutput: $toolOutput, toolDurationMs: $toolDurationMs }
  ) @check(expr: "this == 1", message: "The call is no longer running")
  conversation_updateMany(
    where: { id: { eq: $conversationId }, previewMessageId: { eq: $messageId } }
    data: { preview: $preview }
  )
}

# Starts a call to an integration's tool, before the worker makes it, so a worker fenced out never
# makes one: `RUNNING`, with when it started, and the server marked used, at most once a minute,
# in a write no live query refreshes on. Only a call that never started: an auto-approved one drawn
# running, or cancelled by a stop before it started, or an approval the member allowed. A call that
# started is never made again, since it went to another company's server, which may have acted on
# it: whoever finds it unfinished answers it as interrupted. Fenced as `RenewConversationRunLease` is
mutation StartConversationIntegrationCall(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $messageId: UUID!
  $integrationId: UUID!
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  ) @check(expr: "this == 1", message: "The run is no longer this worker's")
  conversationMessage_updateMany(
    where: {
      _and: [
        {
          id: { eq: $messageId }
          conversationId: { eq: $conversationId }
          integrationId: { eq: $integrationId }
          toolStartedAt: { isNull: true }
        }
        {
          _or: [
            { kind: { eq: TOOL_CALL }, toolStatus: { in: [RUNNING, CANCELLED] } }
            { kind: { eq: APPROVAL }, approvalState: { eq: ALLOWED } }
          ]
        }
      ]
    }
    data: { toolStatus: RUNNING, toolStartedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "The call started already, or was never allowed")
  organizationIntegration_updateMany(
    where: {
      _and: [
        { id: { eq: $integrationId }, organizationId: { eq: $organizationId } }
        { _or: [{ lastUsedAt: { isNull: true } }, { lastUsedAt: { lt_time: { now: true, sub: { minutes: 1 } } } }] }
      ]
    }
    data: { lastUsedAt_expr: "request.time" }
  )
}

# Records what a call to an integration's tool came to, as `FinishConversationToolCall` does for
# Strategy Dance's own tools, with what that one never sees: a call that started and was left
# unfinished, by a crash or a stop, `CANCELLED` or still `RUNNING`, is finished here as interrupted,
# never made again, and an approval whose server, tool or credential changed since the member saw it
# is denied, `$approvalState`. `$toolDurationMs` is left out for a call that was not timed. Fenced as
# `RenewConversationRunLease` is
mutation FinishConversationIntegrationCall(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $messageId: UUID!
  $toolStatus: ConversationToolStatus!
  $toolOutput: String!
  $toolDurationMs: Int
  $approvalState: ConversationApprovalState
  $pendingToolResults: String!
  $preview: Any!
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { pendingToolResults: $pendingToolResults, leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  )
    @check(expr: "this == 1", message: "The run is no longer this worker's")
    @check(
      expr: "(vars.toolStatus == 'SUCCEEDED' || vars.toolStatus == 'FAILED') && (!has(vars.approvalState) || vars.approvalState == null || vars.approvalState == 'DENIED')"
      message: "A call finishes succeeded or failed, and an approval it finishes can only be denied"
    )
  conversationMessage_updateMany(
    where: {
      id: { eq: $messageId }
      conversationId: { eq: $conversationId }
      kind: { in: [TOOL_CALL, APPROVAL] }
      integrationId: { isNull: false }
      toolStatus: { in: [RUNNING, CANCELLED] }
      toolStartedAt: { isNull: false }
    }
    data: {
      toolStatus: $toolStatus
      toolOutput: $toolOutput
      toolDurationMs: $toolDurationMs
      approvalState: $approvalState
    }
  ) @check(expr: "this == 1", message: "The call is no longer running")
  conversation_updateMany(
    where: { id: { eq: $conversationId }, previewMessageId: { eq: $messageId } }
    data: { preview: $preview }
  )
}

# Records a call to a module's write that a run left started and unfinished, cancelled when the run
# ended, as what the module stored under its idempotency key once the backend found it there: the
# write landed, and its output is the result the module answered. Only once the run has let go of
# the conversation, `activeRunId` null, so it never meets a worker still writing: a worker whose lease
# lapsed passes its fence until its run is finalized. Settling a call twice changes nothing, and a
# call that finished or never started is left as it is.
#
# `$userId` is the uid the backend verified, and `$conversationId` what the conversation's page
# refreshes on
mutation SettleConversationToolCall(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $messageId: UUID!
  $toolOutput: String!
) @auth(level: NO_ACCESS) {
  conversationMessage_updateMany(
    where: {
      id: { eq: $messageId }
      kind: { eq: TOOL_CALL }
      toolStatus: { in: [RUNNING, CANCELLED] }
      toolStartedAt: { isNull: false }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        activeRunId: { isNull: true }
      }
    }
    data: { toolStatus: SUCCEEDED, toolOutput: $toolOutput }
  )
}

# Stores the results of a turn's calls in the transcript, after the turn, as the user entry that
# answers them, in their order, then goes round to Claude. The run lets go of the results it kept
# meanwhile, in the fenced write.
#
# A run that carried a waiting turn on to make the calls its member allowed stores that turn's
# results, and is anchored on them from then on, `$anchorPosition`, as a run an answer started is
# anchored on its answers: a Retry then keeps the calls it made, which went to other companies'
# servers. Left out, the anchor stays as it is. Fenced as `RenewConversationRunLease` is
mutation StoreConversationToolResults(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $entryId: UUID!
  $position: Int!
  $content: String!
  $anchorPosition: Int
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: {
      pendingToolResults: null
      anchorPosition: $anchorPosition
      leaseExpiresAt_time: { now: true, add: { seconds: 60 } }
    }
  )
    @check(expr: "this == 1", message: "The run is no longer this worker's")
    @check(
      expr: "!has(vars.anchorPosition) || vars.anchorPosition == null || vars.anchorPosition == vars.position"
      message: "A run is anchored on the results it stores, or where it was"
    )
  conversationTranscriptEntry_insert(
    data: {
      id: $entryId
      conversationId: $conversationId
      runId: $runId
      position: $position
      role: USER
      content: $content
    }
  )
}

# Tags a conversation with the aspects the agent picked from its first exchange, as the agent's,
# with the aspects note that says so, at a position claimed on the counter, only while nobody has
# set its aspects: a member who set them, on the draft or since, keeps them, and so does a
# conversation tagged already. Refused at 2000 entries, as the member's note is. `$usage` settles the
# tagging request in the run's ledger, in the fenced write.
#
# The note belongs to no run, as the member's does: it stays out of the entries a run draws, and a
# Retry of the exchange keeps it with the aspects it shows. It never becomes the preview and adds
# nothing to the unread count. Fenced as `RenewConversationRunLease` is
mutation TagConversationAspects(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $usage: Any!
  $aspects: [CompanyAspect!]!
  $noteId: UUID!
  $position: Int!
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { usage: $usage, leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  )
    @check(expr: "this == 1", message: "The run is no longer this worker's")
    @check(
      expr: "size(vars.aspects) >= 1 && size(vars.aspects) <= 3 && vars.aspects.all(aspect, vars.aspects.exists_one(other, other == aspect))"
      message: "The agent tags a conversation with one to three aspects, each at most once"
    )
  conversation_updateMany(
    where: {
      id: { eq: $conversationId }
      deletedAt: { isNull: true }
      aspectsSetBy: { isNull: true }
      nextMessagePosition: { eq: $position }
      messageCount: { lt: 2000 }
    }
    data: {
      aspects: $aspects
      aspectsSetBy: AGENT
      nextMessagePosition_update: { inc: 1 }
      messageCount_update: { inc: 1 }
    }
  ) @check(expr: "this == 1", message: "The conversation could not be tagged at that position")
  conversationMessage_insert(
    data: {
      id: $noteId
      conversationId: $conversationId
      kind: ASPECTS
      aspects: $aspects
      aspectsSetBy: AGENT
      position: $position
    }
  )
}

# Ends a run on the questions its turn asked: `WAITING`, with `$usage` settling what its requests
# used, until an answer or a send consumes its turn. A call a stop kept from starting is cancelled,
# and `$preview`, given when the preview shows that call, says so. The conversation lets go of the
# run where it still names it, and waits for the member's answer, which the sidebar's badge and the
# list read. Fenced as `RenewConversationRunLease` is
mutation FinishConversationRunWaiting(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $usage: Any
  $preview: Any
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        parentId: { isNull: true }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { status: WAITING, usage: $usage, endedAt_expr: "request.time", leaseExpiresAt: null }
  ) @check(expr: "this == 1", message: "The run is no longer this worker's")
  conversationMessage_updateMany(
    where: { conversationId: { eq: $conversationId }, kind: { in: [TOOL_CALL, APPROVAL] }, toolStatus: { eq: RUNNING } }
    data: { toolStatus: CANCELLED }
  )
  conversation_updateMany(
    where: { id: { eq: $conversationId }, activeRunId: { eq: $runId } }
    data: { activeRunId: null, isAwaitingAnswer: true, preview: $preview, updatedAt_expr: "request.time" }
  )
}

# Ends a run its worker brought to an end: `COMPLETED`, or `STOPPED` in a conversation deleted
# meanwhile, with `$usage` settling what its requests used, left as it was when omitted. A call the
# deletion kept from finishing is cancelled. The conversation lets go of it only while it still
# names it, deleted or not, so a conversation restored later is not stuck busy. Fenced as
# `RenewConversationRunLease` is, on a conversation that is no subagent: a subagent's run ends through
# the `…SubagentRun` endings, which write its report, and so do this one's three neighbours
mutation FinishConversationRun(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $status: ConversationRunStatus!
  $usage: Any
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        parentId: { isNull: true }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { status: $status, usage: $usage, endedAt_expr: "request.time", leaseExpiresAt: null }
  )
    @check(expr: "this == 1", message: "The run is no longer this worker's")
    @check(
      expr: "vars.status == 'COMPLETED' || vars.status == 'STOPPED'"
      message: "A run ends this way completed or stopped"
    )
  conversationMessage_updateMany(
    where: { conversationId: { eq: $conversationId }, kind: { in: [TOOL_CALL, APPROVAL] }, toolStatus: { eq: RUNNING } }
    data: { toolStatus: CANCELLED }
  )
  conversation_updateMany(
    where: { id: { eq: $conversationId }, activeRunId: { eq: $runId } }
    data: { activeRunId: null }
  )
}

# Ends a run its worker brought to an end with a note the thread draws, such as a run at a limit
# that sends no further request: the conversation takes the note at a position claimed on its
# counter and lets go of the run in the same write. A note can take a conversation past its 2000
# messages, as the turn before it can. Each status takes its own note: a failed run says it failed
# or is full, a stopped one that it stopped, a refused one that Claude refused. `$isFull` marks the
# conversation full when its next request would not fit Claude's context, which the send route then
# refuses, `$usage` settles what the run's requests used, and `$failure` says why it ended, for the
# logs; each is left as it was when omitted. Fenced as `RenewConversationRunLease` is
mutation FinishConversationRunWithNote(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $status: ConversationRunStatus!
  $noteKind: ConversationNoteKind!
  $noteId: UUID!
  $position: Int!
  $preview: Any!
  $usage: Any
  $isFull: Boolean
  $failure: String
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        parentId: { isNull: true }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { status: $status, usage: $usage, failure: $failure, endedAt_expr: "request.time", leaseExpiresAt: null }
  )
    @check(expr: "this == 1", message: "The run is no longer this worker's")
    @check(
      expr: "(vars.status == 'FAILED' && (vars.noteKind == 'FAILED' || vars.noteKind == 'FULL')) || (vars.status == 'STOPPED' && vars.noteKind == 'STOPPED') || (vars.status == 'REFUSED' && vars.noteKind == 'REFUSED')"
      message: "A run ends with its own note: failed or full, stopped, or refused"
    )
  conversationMessage_updateMany(
    where: { conversationId: { eq: $conversationId }, kind: { in: [TOOL_CALL, APPROVAL] }, toolStatus: { eq: RUNNING } }
    data: { toolStatus: CANCELLED }
  )
  conversation_updateMany(
    # One `_and`, because a filter cannot put `_or` beside plain fields
    where: {
      _and: [
        { id: { eq: $conversationId } }
        { nextMessagePosition: { eq: $position } }
        { _or: [{ activeRunId: { eq: $runId } }, { activeRunId: { isNull: true } }] }
      ]
    }
    data: {
      activeRunId: null
      isFull: $isFull
      preview: $preview
      previewMessageId: $noteId
      nextMessagePosition_update: { inc: 1 }
      messageCount_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not take the note at that position")
  conversationMessage_insert(
    data: {
      id: $noteId
      conversationId: $conversationId
      runId: $runId
      kind: NOTE
      noteKind: $noteKind
      position: $position
    }
  )
}

# Ends a run whose author is no longer the member it was queued under, removed, invited back since
# or no longer staff, as `INTERRUPTED`, with its note and why, for the logs, so nothing is left for a
# later delivery to take up. Fenced on the run alone, at the attempt the worker read or claimed,
# since the membership the other writes match is the one that is gone
mutation InterruptConversationRun(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $noteId: UUID!
  $position: Int!
  $preview: Any!
  $failure: String
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { in: [QUEUED, RUNNING] }
      attempts: { eq: $attempts }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        parentId: { isNull: true }
      }
    }
    data: { status: INTERRUPTED, failure: $failure, endedAt_expr: "request.time", leaseExpiresAt: null }
  ) @check(expr: "this == 1", message: "The run is no longer this worker's")
  conversationMessage_updateMany(
    where: { conversationId: { eq: $conversationId }, kind: { in: [TOOL_CALL, APPROVAL] }, toolStatus: { eq: RUNNING } }
    data: { toolStatus: CANCELLED }
  )
  conversation_updateMany(
    # One `_and`, because a filter cannot put `_or` beside plain fields
    where: {
      _and: [
        { id: { eq: $conversationId } }
        { nextMessagePosition: { eq: $position } }
        { _or: [{ activeRunId: { eq: $runId } }, { activeRunId: { isNull: true } }] }
      ]
    }
    data: {
      activeRunId: null
      preview: $preview
      previewMessageId: $noteId
      nextMessagePosition_update: { inc: 1 }
      messageCount_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not take the note at that position")
  conversationMessage_insert(
    data: {
      id: $noteId
      conversationId: $conversationId
      runId: $runId
      kind: NOTE
      noteKind: INTERRUPTED
      position: $position
    }
  )
}

# The daily sweep's for the board: deletes every task deleted over a day ago, past its Undo, in
# every organization, its links cascading with it. `DeleteTask` prunes its organization's on the way
# through, which stays as the fast path, but leaves the last one deleted in a quiet organization,
# and a deleted task's links count against the cap of the tasks they join until it goes. An Undo is
# a few seconds long, so nothing restores one this old. Deleting what is gone already deletes
# nothing, so a sweep that failed is finished by the next
mutation PruneDeletedTasks @auth(level: NO_ACCESS) {
  task_deleteMany(where: { deletedAt: { lt_time: { now: true, sub: { days: 1 } } } })
}

# The daily sweep's first step: claims every conversation deleted over a day ago, past its Undo,
# that no sweep has claimed yet, whoever's it is. `RestoreConversation` refuses a claimed one, and
# both write the same row, so an Undo and a sweep never both win: whichever commits second finds
# the row no longer matching. What is claimed is then deleted, by `DeleteClaimedConversations`
mutation ClaimDeletedConversations @auth(level: NO_ACCESS) {
  conversation_updateMany(
    where: { deletedAt: { lt_time: { now: true, sub: { days: 1 } } }, pruneClaimedAt: { isNull: true } }
    data: { pruneClaimedAt_expr: "request.time" }
  )
}

# Deletes claimed conversations, with their messages, runs and transcript, which cascade. Only those
# still deleted over a day ago, so a conversation is never deleted on its claim alone. The ids are
# a batch `GetClaimedConversations` read, so each delete stays bounded. Deleting one twice deletes
# nothing, so a sweep that failed after claiming is finished by the next
mutation DeleteClaimedConversations($ids: [UUID!]!) @auth(level: NO_ACCESS) {
  conversation_deleteMany(
    where: {
      id: { in: $ids }
      pruneClaimedAt: { isNull: false }
      deletedAt: { lt_time: { now: true, sub: { days: 1 } } }
    }
  )
}

# Deletes what the module calls of conversations being pruned stored under their idempotency keys,
# each conversation's under its scope, `conversation:<id>`, which leads the table's key. The daily
# sweep deletes them for each batch of claimed conversations before the conversations themselves,
# since nothing references a conversation from them. Deleting them twice deletes nothing, so a sweep
# that failed between the two is finished by the next
mutation DeleteConversationModuleCallResults($scopes: [String!]!) @auth(level: NO_ACCESS) {
  moduleCallResult_deleteMany(where: { idempotencyScope: { in: $scopes } })
}

# Records a search of the caller's conversations, holding them to 120 in ten minutes in an
# organization (`MAX_CONVERSATION_SEARCHES` in strategydance-core: change the two together, as the
# operation cannot import it). The search route runs it before it searches anything.
#
# The first step writes the caller's membership, the lock a conversation's start takes too, so the
# count after it sees every search the caller made there that committed before it: two at once at
# 119 let exactly one through, whichever instances run them. The allowance is the membership's,
# per member and organization, which is exactly what the lock serializes. Read to 120, since past
# that a search is refused whatever the rest are. `$userId` is the uid the backend verified
mutation RecordConversationSearch($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) @transaction {
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  ) @redact @check(expr: "this != null", message: "Only a member of an organization can search its conversations")
  query @redact {
    conversationSearches(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { gt_time: { now: true, sub: { minutes: 10 } } }
      }
      limit: 120
    )
      @check(
        expr: "size(this) < 120"
        message: "Somebody searches their conversations at most 120 times in ten minutes in an organization"
      ) {
      id
    }
  }
  conversationSearch_insert(data: { userId: $userId, organizationId: $organizationId })
}

# The daily sweep's: deletes the searches made over a day ago, whoever made them, which no count
# reads any more. Deleting them twice deletes nothing, so a sweep that failed is finished by the next
mutation DeleteExpiredConversationSearches @auth(level: NO_ACCESS) {
  conversationSearch_deleteMany(where: { createdAt: { lt_time: { now: true, sub: { days: 1 } } } })
}

# Reserves the place of a file the caller uploads to a conversation, before any of its bytes is
# accepted: its row, `UPLOADING`, under the id the browser made for it, so an upload retried finds
# it. The conversation may not exist yet, a draft's, but one that does has to be the caller's and not
# deleted.
#
# The first step writes the caller's membership, the lock a conversation's start takes too, so the
# count after it sees every file the caller reserved there that committed before it: two uploads at
# once at 29 let exactly one through. Somebody has at most 30 files uploaded and not sent in an
# organization (`MAX_PENDING_CONVERSATION_ATTACHMENTS` in strategydance-core: change the two
# together), counting only those younger than two days, which is when a prune takes them. Read to
# 30, since past that the upload is refused whatever the rest are. The name, type and size are
# checked as the backend checked them, `CONVERSATION_ATTACHMENT_CONTENT_TYPES`,
# `MAX_CONVERSATION_ATTACHMENT_NAME_LENGTH` and `MAX_CONVERSATION_ATTACHMENT_SIZE`. `$userId` is the
# uid the backend verified
mutation ReserveConversationAttachment(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $attachmentId: UUID!
  $name: String!
  $contentType: String!
  $size: Int!
) @auth(level: NO_ACCESS) @transaction {
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this != null", message: "Only a member of an organization can send files in it")
    @check(
      expr: "size(vars.name) >= 1 && size(vars.name) <= 200 && vars.name.matches('^[^\\r\\n]*$') && vars.size >= 1 && vars.size <= 10485760 && vars.contentType in ['image/jpeg', 'image/png', 'image/gif', 'image/webp', 'application/pdf', 'text/plain', 'text/markdown', 'text/csv']"
      message: "A file has a name on one line of at most 200 characters, a type a conversation takes, and at most 10 MiB"
    )
  query @redact {
    # One `_and`, because a filter cannot put `_or` beside plain fields
    others: conversations(
      where: {
        _and: [
          { id: { eq: $conversationId } }
          {
            _or: [
              { userId: { ne: $userId } }
              { organizationId: { ne: $organizationId } }
              { deletedAt: { isNull: false } }
              { parentId: { isNull: false } }
            ]
          }
        ]
      }
      limit: 1
    ) @check(expr: "size(this) == 0", message: "The conversation is somebody else's, deleted or a subagent") {
      id
    }
    pending: conversationAttachments(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        messageId: { isNull: true }
        createdAt: { gt_time: { now: true, sub: { days: 2 } } }
      }
      limit: 30
    ) @check(expr: "size(this) < 30", message: "Somebody has at most 30 files waiting to be sent in an organization") {
      id
    }
  }
  conversationAttachment_insert(
    data: {
      id: $attachmentId
      userId: $userId
      organizationId: $organizationId
      conversationId: $conversationId
      status: UPLOADING
      name: $name
      contentType: $contentType
      size: $size
    }
  )
}

# Finishes the upload of a file whose place was reserved: stored, read back, counted and uploaded to
# the Files API, it turns `READY` with what was counted, only while it is still `UPLOADING`. A prune
# that claimed it meanwhile, or a retry of the same upload that finished first, refuses it, and the
# backend reads the row again to tell which
mutation CompleteConversationAttachmentUpload(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $attachmentId: UUID!
  $pageCount: Int
  $tokenCount: Int!
  $claudeFileId: String!
) @auth(level: NO_ACCESS) @transaction {
  conversationAttachment_updateMany(
    where: {
      id: { eq: $attachmentId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      conversationId: { eq: $conversationId }
      status: { eq: UPLOADING }
    }
    data: { status: READY, pageCount: $pageCount, tokenCount: $tokenCount, claudeFileId: $claudeFileId }
  ) @check(expr: "this == 1", message: "The file is no longer being uploaded")
}

# Claims the caller's unsent files that expired for pruning: a reservation still `UPLOADING` ten
# minutes on, whose upload failed, and any file uploaded over two days ago, whose pending object the
# bucket's lifecycle rule deletes. An upload runs it for its caller before it counts their files, so
# an abandoned draft never keeps their places for good. What a claim took, `PRUNING`, no upload
# finishes and no send takes, so only the prune deletes its files and then its row
mutation ClaimExpiredMemberConversationAttachments($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  # One `_and`, because a filter cannot put `_or` beside plain fields
  conversationAttachment_updateMany(
    where: {
      _and: [
        { userId: { eq: $userId } }
        { organizationId: { eq: $organizationId } }
        { messageId: { isNull: true } }
        {
          _or: [
            { status: { eq: UPLOADING }, createdAt: { lt_time: { now: true, sub: { minutes: 10 } } } }
            { status: { eq: READY }, createdAt: { lt_time: { now: true, sub: { days: 2 } } } }
          ]
        }
      ]
    }
    data: { status: PRUNING }
  )
}

# The daily sweep's: claims everybody's unsent files that expired, as
# `ClaimExpiredMemberConversationAttachments` claims one member's, for a member who never uploads
# again
mutation ClaimExpiredConversationAttachments @auth(level: NO_ACCESS) {
  # One `_and`, because a filter cannot put `_or` beside plain fields
  conversationAttachment_updateMany(
    where: {
      _and: [
        { messageId: { isNull: true } }
        {
          _or: [
            { status: { eq: UPLOADING }, createdAt: { lt_time: { now: true, sub: { minutes: 10 } } } }
            { status: { eq: READY }, createdAt: { lt_time: { now: true, sub: { days: 2 } } } }
          ]
        }
      ]
    }
    data: { status: PRUNING }
  )
}

# Gives back the place of a file whose upload was refused, its bytes not what they claimed or past
# what Claude takes: its row, only while it is still `UPLOADING`, is claimed for pruning, so a retry
# of the same upload that finished first keeps its file. Answers how many it claimed
mutation ReleaseConversationAttachment(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $attachmentId: UUID!
) @auth(level: NO_ACCESS) {
  conversationAttachment_updateMany(
    where: {
      id: { eq: $attachmentId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      conversationId: { eq: $conversationId }
      status: { eq: UPLOADING }
      messageId: { isNull: true }
    }
    data: { status: PRUNING }
  )
}

# Claims a file the caller removes from a draft for pruning, at once, so its place frees straight
# away: their own, in that conversation, uploading or stored, and not sent, since a sent file goes
# only with its conversation. Answers how many it claimed
mutation ClaimConversationAttachment(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $attachmentId: UUID!
) @auth(level: NO_ACCESS) {
  conversationAttachment_updateMany(
    where: {
      id: { eq: $attachmentId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      conversationId: { eq: $conversationId }
      status: { in: [UPLOADING, READY] }
      messageId: { isNull: true }
    }
    data: { status: PRUNING }
  )
}

# Deletes the rows of unsent files a prune claimed, once their files are gone. Only those still
# claimed and unsent, so a row is never deleted on its id alone. Deleting one twice deletes nothing
mutation DeletePrunedConversationAttachments($ids: [UUID!]!) @auth(level: NO_ACCESS) {
  conversationAttachment_deleteMany(where: { id: { in: $ids }, status: { eq: PRUNING }, messageId: { isNull: true } })
}

# The daily sweep's: deletes the rows of a claimed conversation's files, sent and unsent, once their
# files are gone, before the conversation's own rows go, which would set their `message` to null.
# Only the files of that conversation's author in its organization, since another member who learned
# a draft's id could have uploaded under it, and only while the conversation is claimed and deleted
# over a day ago, so no live conversation ever loses its files
mutation DeleteConversationAttachments($organizationId: UUID!, $userId: String!, $conversationId: UUID!)
@auth(level: NO_ACCESS)
@transaction {
  query @redact {
    claimed: conversations(
      where: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        pruneClaimedAt: { isNull: false }
        deletedAt: { lt_time: { now: true, sub: { days: 1 } } }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "Only a conversation a prune claimed loses its files") {
      id
    }
  }
  conversationAttachment_deleteMany(
    where: { conversationId: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
  )
}

# The Knowledge module's writes follow, named `…ForAgent`, as its reads are: see `queries.gql`.
#
# Each runs as one transaction that checks the membership the module read, then, when the call
# carries an idempotency key (`$isKeyed`), inserts its `ModuleCallResult` first, `$result` being
# what the module answers, and only then writes. A second call under the same key, at once or later,
# finds the key taken and writes nothing, and the module reads the row back. A call without a key
# skips the insert and keeps no row; its key's variables then say nothing and are not stored.
# `$expiresAt` is null for a row that lives as long as its scope.
#
# Each write is named in `GetLiveDocument`'s refreshes, on `$id`, so an open editor sees the
# revision move whichever agent made the edit, and in `GetOrganizationDocuments`' when it changes
# what a card shows, on `$organizationId`

# Seeds a document stored before the editor was shared, which has no snapshot, from its `content`,
# as `SeedDocumentState` does for a tab and under its condition, before anything hands out the ids
# of its blocks. Refused when a tab seeded it first, whose snapshot the module then reads
mutation SeedDocumentStateForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $state: String!
  $revision: Int!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The caller is no longer a member of the organization") {
      userId @check(expr: "size(vars.state) <= 2000000", message: "A document's state is at most 2000000 characters")
    }
  }
  document_updateMany(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      state: { isNull: true }
      revision: { eq: $revision }
    }
    data: { state: $state, revision_update: { inc: 1 } }
  ) @check(expr: "this == 1", message: "The document was seeded or changed elsewhere since it was read")
}

# Adds a document an agent wrote, its first snapshot built from the agent's Markdown, `content` and
# `contentText` beside it. Held to `CreateDocument`'s bounds and to the 1000 documents an
# organization keeps, counted under the same lock on the organization's row, so an agent and a page
# adding at once cannot pass it. It starts with agents allowed to read and change it, as a document
# made on the page does, so the agent that made it can go on with it, and the team can turn either
# off
mutation CreateDocumentForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $title: String!
  $aspects: [CompanyAspect!]!
  $state: String!
  $content: String!
  $contentText: String!
  $isKeyed: Boolean!
  $idempotencyScope: String!
  $idempotencyKey: String!
  $tool: String!
  $argumentsHash: String!
  $result: String!
  $expiresAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  organization_updateMany(
    where: {
      id: { eq: $organizationId }
      userOrganizations_on_organization: { exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } } }
    }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this == 1", message: "The caller is no longer a member of the organization")
    @check(
      expr: "!vars.isKeyed || (size(vars.idempotencyKey) >= 1 && size(vars.idempotencyKey) <= 200)"
      message: "An idempotency key is 1 to 200 characters"
    )
    @check(
      expr: "size(vars.title) <= 200 && vars.title.matches('^[^\\r\\n]*$')"
      message: "A document's title is at most 200 characters on one line"
    )
    @check(
      expr: "size(vars.content) <= 200000 && size(vars.contentText) <= 200000"
      message: "A document's content is at most 200000 characters"
    )
    @check(expr: "size(vars.state) <= 2000000", message: "A document's state is at most 2000000 characters")
    @check(
      expr: "vars.title.matches('[[:^space:]]') || vars.content != ''"
      message: "A document starts with a title or some text"
    )
    @check(
      expr: "vars.aspects.all(aspect, vars.aspects.exists_one(other, other == aspect))"
      message: "A document is tagged with each aspect at most once"
    )
  moduleCallResult_insert(
    data: {
      idempotencyScope: $idempotencyScope
      idempotencyKey: $idempotencyKey
      userId: $userId
      organizationId: $organizationId
      tool: $tool
      argumentsHash: $argumentsHash
      result: $result
      expiresAt: $expiresAt
    }
  ) @include(if: $isKeyed)
  query @redact {
    documents(where: { organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }, limit: 1000)
      @check(expr: "size(this) < 1000", message: "An organization keeps at most 1000 documents") {
      id
    }
  }
  document_insert(
    data: {
      id: $id
      organizationId: $organizationId
      createdById: $userId
      title: $title
      content: $content
      contentText: $contentText
      aspects: $aspects
      isAiReadable: true
      isAiWritable: true
      state: $state
    }
  )
}

# Stores an agent's edit of a document's text: the snapshot it read with every pending update
# merged in and the edit applied, `content` and `contentText` read from it, in one write of the row,
# with the title too when the call changes it, then deletes the updates it merged. As a tab's
# compaction does, it is refused unless `$revision` is still the stored one, which it moves on, so
# it never writes over a snapshot somebody folded more into; the module then reads again and
# reapplies the edit. A revision moves when a document is seeded too, so a fold of a document read
# without a snapshot seeds it under `SeedDocumentState`'s condition. Refused as well once the
# document is deleted, or the team keeps agents from reading or changing it.
#
# A push that lands meanwhile is not among `$updateIds` and stays pending, and merges with the edit
# as two members' edits merge. A whole document replaced (`$isWholeReplacement`) was replaced as
# the agent read it, so once the row is locked the fold also checks that no update is pending
# beyond those it merged, and the module reads again when one is.
#
# No bound on an update's length, as a fold writes the whole snapshot: `CompactDocument`'s bounds,
# on what the edit produced. `$title` is left out when the call does not change it, which leaves the
# column alone and is what `GetOrganizationDocuments`' refresh asks of a fold before it pushes the
# list, so an agent's writing pushes a card to nobody
mutation FoldDocumentForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $revision: Int!
  $state: String!
  $content: String!
  $contentText: String!
  $updateIds: [UUID!]!
  $title: String
  $isWholeReplacement: Boolean!
  $isKeyed: Boolean!
  $idempotencyScope: String!
  $idempotencyKey: String!
  $tool: String!
  $argumentsHash: String!
  $result: String!
  $expiresAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  moduleCallResult_insert(
    data: {
      idempotencyScope: $idempotencyScope
      idempotencyKey: $idempotencyKey
      userId: $userId
      organizationId: $organizationId
      tool: $tool
      argumentsHash: $argumentsHash
      result: $result
      expiresAt: $expiresAt
    }
  ) @include(if: $isKeyed)
  document_updateMany(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      isAiWritable: { eq: true }
      revision: { eq: $revision }
    }
    data: {
      state: $state
      content: $content
      contentText: $contentText
      title: $title
      revision_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The document was folded, deleted or closed to agents since it was read")
  # A mutation takes one query step, and the pending updates have to be read once the row above is
  # locked, so the membership and the variables are checked here too, after the writes before it:
  # a refusal rolls them back all the same
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The caller is no longer a member of the organization") {
      userId
        @check(
          expr: "!vars.isKeyed || (size(vars.idempotencyKey) >= 1 && size(vars.idempotencyKey) <= 200)"
          message: "An idempotency key is 1 to 200 characters"
        )
        @check(
          expr: "!has(vars.title) || vars.title == null || (size(vars.title) <= 200 && vars.title.matches('^[^\\r\\n]*$'))"
          message: "A document's title is at most 200 characters on one line"
        )
        @check(
          expr: "size(vars.content) <= 200000 && size(vars.contentText) <= 200000"
          message: "A document's content is at most 200000 characters"
        )
        @check(expr: "size(vars.state) <= 2000000", message: "A document's state is at most 2000000 characters")
    }
    # The title as committed, which a title this fold writes replaces: a document keeps a title or
    # some text, so an edit emptying the text of an untitled one is refused, a rename blanking the
    # title at the same moment included
    document(id: $id) {
      title
        @check(
          expr: "vars.content != '' || ((has(vars.title) && vars.title != null) ? vars.title.matches('[[:^space:]]') : this.matches('[[:^space:]]'))"
          message: "A document keeps a title or some text"
        )
    }
    pending: documentUpdates(where: { documentId: { eq: $id }, id: { nin: $updateIds } }, limit: 1)
      @check(
        expr: "!vars.isWholeReplacement || size(this) == 0"
        message: "The document was edited since it was read"
      ) {
      id
    }
  }
  documentUpdate_deleteMany(where: { documentId: { eq: $id }, id: { in: $updateIds } })
}

# Retitles a document for an agent, held to what `RenameDocument` holds a title to, when the call
# changes its title alone. A document keeps a title or some text, so a blank title is refused on one
# whose text is empty, nothing pending: checked once the row is locked, so a fold emptying the text
# at the same moment cannot pass it together with this. A mutation takes one query step, so the
# membership's and the variables' checks follow the writes too, which a refusal rolls back
mutation RenameDocumentForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $title: String!
  $isKeyed: Boolean!
  $idempotencyScope: String!
  $idempotencyKey: String!
  $tool: String!
  $argumentsHash: String!
  $result: String!
  $expiresAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  moduleCallResult_insert(
    data: {
      idempotencyScope: $idempotencyScope
      idempotencyKey: $idempotencyKey
      userId: $userId
      organizationId: $organizationId
      tool: $tool
      argumentsHash: $argumentsHash
      result: $result
      expiresAt: $expiresAt
    }
  ) @include(if: $isKeyed)
  document_updateMany(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      isAiWritable: { eq: true }
    }
    data: { title: $title, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "The document was deleted or closed to agents since it was read")
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The caller is no longer a member of the organization") {
      userId
        @check(
          expr: "!vars.isKeyed || (size(vars.idempotencyKey) >= 1 && size(vars.idempotencyKey) <= 200)"
          message: "An idempotency key is 1 to 200 characters"
        )
        @check(
          expr: "size(vars.title) <= 200 && vars.title.matches('^[^\\r\\n]*$')"
          message: "A document's title is at most 200 characters on one line"
        )
    }
    # The text as committed, which this mutation does not write
    document(id: $id)
      @check(
        expr: "vars.title.matches('[[:^space:]]') || this.content != '' || size(this.documentUpdates_on_document) > 0"
        message: "A document keeps a title or some text"
      ) {
      content
      documentUpdates_on_document(limit: 1) {
        id
      }
    }
  }
}

