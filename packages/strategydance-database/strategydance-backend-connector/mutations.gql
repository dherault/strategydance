# Invites somebody to an organization, from one of its administrators, and answers with the id
# the invitation's email carries.
#
# One address per call, which the backend makes once for each address in parallel: the generated
# Admin SDK cannot pass the `_Data` list `_insertMany` would need. Each call checks for itself
# that the inviter is an administrator, that the address belongs to no member, and that the team
# has room. The pair of organization and address is unique, so an address invited in the
# meantime fails its own call rather than being invited twice.
#
# A team holds at most 100 members and pending invitations together, `MAX_TEAM_SIZE` in
# strategydance-core. The first step takes the organization's row lock, so the calls for one
# organization run one after the other and each counts what the one before it committed: a
# batch, or two administrators inviting at once, cannot slip past the limit together
mutation CreateOrganizationInvitation($organizationId: UUID!, $userId: String!, $email: String!)
@auth(level: NO_ACCESS) @transaction {
  organization_update(id: $organizationId, data: { updatedAt_expr: "request.time" }) @redact
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can invite people to it") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can invite people")
    }
    userOrganizations(where: { organizationId: { eq: $organizationId }, user: { email: { eq: $email } } }, limit: 1)
      @check(expr: "size(this) == 0", message: "The address belongs to a member already", optional: true) {
      userId
    }
    organization(id: $organizationId)
      @check(
        expr: "size(this.userOrganizations_on_organization) + size(this.organizationInvitations_on_organization) < 100"
        message: "The team is full"
      ) {
      userOrganizations_on_organization(limit: 100) {
        userId
      }
      organizationInvitations_on_organization(limit: 100) {
        id
      }
    }
  }
  organizationInvitation_insert(data: { organizationId: $organizationId, email: $email, invitedById: $userId })
  # Counted against the inviter's hourly allowance, `MAX_INVITATIONS_PER_HOUR` in the backend's
  # `createOrganizationInvitations`, and their rows from before the hour it counts pruned
  sentInvitation_insert(data: { invitedById: $userId }) @redact
  sentInvitation_deleteMany(
    where: { invitedById: { eq: $userId }, createdAt: { lt_time: { now: true, sub: { hours: 1 } } } }
  ) @redact
}

# Claims the account's welcome email for the request that makes it, and answers how many rows it
# claimed: 1 when this request may send it, 0 when it went out already, another request holds it,
# the account is more than a week old, or it has no row.
#
# A claim is a ten-minute lease rather than a flag. A request that sends completes it; one that
# fails, or dies with its process, leaves it to lapse, and the next request after that sends
# again. Ten minutes outlasts any request Cloud Run lets run, so a live claim never lapses under
# the request holding it.
#
# One conditional update rather than a read and a write, so two requests landing together cannot
# both find it free: Postgres re-checks the condition on the row the first one locked, and the
# second claims nothing. `$userId` is the uid the backend verified
mutation ClaimWelcomeEmail($userId: String!) @auth(level: NO_ACCESS) {
  user_updateMany(
    # One `_and`, because a filter cannot put `_or` beside plain fields
    where: {
      _and: [
        { id: { eq: $userId } }
        { welcomeEmailSentAt: { isNull: true } }
        # `WELCOME_EMAIL_WINDOW_DAYS` in strategydance-core: an older account is never welcomed
        { createdAt: { ge_time: { now: true, sub: { days: 7 } } } }
        {
          _or: [
            { welcomeEmailClaimedAt: { isNull: true } }
            { welcomeEmailClaimedAt: { lt_time: { now: true, sub: { minutes: 10 } } } }
          ]
        }
      ]
    }
    data: { welcomeEmailClaimedAt_expr: "request.time" }
  )
}

# Records that the welcome email went out, which ends the claim for good
mutation CompleteWelcomeEmail($userId: String!) @auth(level: NO_ACCESS) {
  user_update(key: { id: $userId }, data: { welcomeEmailSentAt_expr: "request.time" })
}
