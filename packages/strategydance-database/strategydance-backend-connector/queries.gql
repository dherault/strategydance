# What inviting people to an organization has to know first, in one read:
#
# - the caller's membership, which says whether they may invite, and names them and the
#   organization for the email
# - the team as it stands, members and pending invitations, which says whether any of the
#   addresses is taken and whether the team has room
# - the invitations the caller sent in the last hour, newest first, which says whether they have
#   room for more and when they will. Read to 200, `MAX_INVITATIONS_PER_HOUR` in the backend:
#   past that, a request is refused whatever the rest are, and when it fits depends only on the
#   newest 200
#
# The two lists are read whole: the database keeps a team at 100 of both together, so a limit of
# 100 each is never a cut. `$userId` is the uid the backend verified, never one a client sent
query GetOrganizationInvitationContext($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    role
    user {
      displayName
      email
    }
    organization {
      name
    }
  }
  userOrganizations(where: { organizationId: { eq: $organizationId } }, limit: 100) {
    user {
      email
    }
  }
  organizationInvitations(where: { organizationId: { eq: $organizationId } }, limit: 100) {
    email
  }
  sentInvitations(
    where: { invitedById: { eq: $userId }, createdAt: { ge_time: { now: true, sub: { hours: 1 } } } }
    orderBy: [{ createdAt: DESC }]
    limit: 200
  ) {
    createdAt
  }
}

# Who the welcome email goes to and what it calls them, once the backend has claimed it
query GetWelcomeEmailRecipient($userId: String!) @auth(level: NO_ACCESS) {
  user(key: { id: $userId }) {
    email
    displayName
  }
}

# What somebody is in an organization, so a route only an administrator may call can refuse
# everybody else before it reads a body or touches Storage. The mutation behind the route checks
# again in its own transaction: this is the early answer, not the guard
query GetOrganizationMembership($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    role
  }
}

# Whether somebody is one of Strategy Dance's own administrators, which conversations are open to
# alone until they launch (`ARE_CONVERSATIONS_STAFF_ONLY` in strategydance-core)
query GetUserStaffStatus($userId: String!) @auth(level: NO_ACCESS) {
  user(key: { id: $userId }) {
    isAdministrator
  }
}

# What sending a message to a conversation has to know first, in one read:
#
# - the caller's membership, whose `createdAt` the run records, so a member removed and invited
#   back never passes for the one who sent
# - the conversation, when it exists: whose it is, whether it is deleted, the run in flight, its
#   counters and whether it is full
# - its transcript's last entry, after which the message's entry goes, and whose calls left open,
#   questions waiting or calls a stop kept from running, it answers first, and its latest run,
#   which it consumes when that run waits for an answer
# - the message by the id the browser made for it, when a send with that id went through already,
#   with the run it started, so a retried send answers with that run
# - the caller's runs in flight in the organization, deleted conversations' included, each with its
#   lease, so the dead ones are finalized before they are counted. Never more than 3
#   (`MAX_ACTIVE_RUNS_PER_MEMBER` in strategydance-core), since every start counts them under a lock
# - how many conversations the caller keeps there, deleted ones aside, so a send that would start
#   one past the 1000 (`MAX_CONVERSATIONS`) is refused as such. `StartConversation` counts them again
#   under its lock
#
# `$userId` is the uid the backend verified, never one a client sent
query GetConversationSendContext($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $messageId: UUID!)
@auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  conversation(id: $conversationId) {
    userId
    organizationId
    deletedAt
    activeRunId
    nextMessagePosition
    nextRunNumber
    messageCount
    isFull
  }
  conversationTranscriptEntries(
    where: { conversationId: { eq: $conversationId } }
    orderBy: [{ position: DESC }]
    limit: 1
  ) {
    id
    position
    role
    content
  }
  # The latest run, whose turn the message answers the open calls of first, and which it consumes
  # when it waits for an answer
  latestRuns: conversationRuns(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 1
  ) {
    id
    status
  }
  # The message's kind is selected at the top level of the operation, which is what has the
  # generated SDK declare its enum, here and for the other operations of the connector
  conversationMessages(where: { id: { eq: $messageId } }, limit: 1) {
    kind
    conversation {
      id
      userId
      organizationId
    }
    run {
      id
      status
      leaseExpiresAt
    }
  }
  conversationRuns(
    where: {
      status: { in: [QUEUED, RUNNING] }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 3
  ) {
    id
    status
    leaseExpiresAt
    conversation {
      id
    }
  }
  keptConversations: conversations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
  ) {
    _count
  }
}

# The usage ledgers of some runs of the caller's conversation, which say how each part they stored
# of a turn ended: the runs a resumed run carries the turn of, after crashes that each left a part
# paused
query GetConversationRunLedgers($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $runIds: [UUID!]!)
@auth(level: NO_ACCESS) {
  conversationRuns(
    where: {
      id: { in: $runIds }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 100
  ) {
    id
    usage
  }
}

# What a resume or a retry reads of a conversation before it starts a run on a run that ended:
#
# - the caller's membership, whose `createdAt` the run records
# - the conversation's counters, and which run it has in flight
# - its two latest runs: the one a resume or a retry acts on, and the one it started already when
#   it is sent again after its first try went through, with the results of the calls their turn
#   finished, which a resumed run carries on
# - the caller's runs in flight in the organization, which a dead one among is finalized before
#   they are counted
# - its two newest messages that are not aspects notes: a stopped note to resume, and what the
#   preview shows once it goes, with what the preview is built from
#
# Only the caller's conversation in that organization
query GetConversationRunControlContext($organizationId: UUID!, $userId: String!, $conversationId: UUID!)
@auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  conversation(id: $conversationId) {
    userId
    organizationId
    deletedAt
    activeRunId
    nextRunNumber
    nextMessagePosition
    messageCount
    historyRevision
  }
  latestRuns: conversationRuns(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 2
  ) {
    id
    number
    trigger
    status
    anchorPosition
    leaseExpiresAt
    pendingToolResults
  }
  conversationRuns(
    where: {
      status: { in: [QUEUED, RUNNING] }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 3
  ) {
    id
    status
    leaseExpiresAt
    conversation {
      id
    }
  }
  latestMessages: conversationMessages(
    where: {
      kind: { ne: ASPECTS }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: DESC }]
    limit: 2
  ) {
    id
    kind
    position
    text
    noteKind
    toolName
    toolStatus
    questionPrompt
    answerSelected
    answerOther
    isAnswerSkipped
    run {
      id
    }
  }
  # Whether a message follows the newest that is not an aspects note, which a resume refuses
  newestMessages: conversationMessages(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: DESC }]
    limit: 1
  ) {
    id
  }
}

# What a retry reads of the runs on the anchor it goes back to, the member's entry the retried run
# answers, besides the control context:
#
# - the runs on that anchor, the retried run and those it resumed, latest first, which a retry
#   received again answers with, the messages they drew being gone already
# - how many messages those runs drew, which the retry deletes, and the run of each, newest first,
#   which the page drops: as many as a conversation can hold, past its 2000 by what the last runs
#   drew. The member's message that started one names it too, and stays
# - the newest message the retry keeps that is not an aspects note, which the preview then shows
#
# Only the caller's conversation in that organization
query GetConversationRetryContext(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $anchorPosition: Int!
) @auth(level: NO_ACCESS) {
  anchorRuns: conversationRuns(
    where: {
      anchorPosition: { eq: $anchorPosition }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 100
  ) {
    id
  }
  drawnMessages: conversationMessages(
    where: {
      kind: { ne: MEMBER_TEXT }
      run: { anchorPosition: { eq: $anchorPosition } }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
  ) {
    _count
  }
  drawnRuns: conversationMessages(
    where: {
      kind: { ne: MEMBER_TEXT }
      run: { anchorPosition: { eq: $anchorPosition } }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: DESC }]
    limit: 5000
  ) {
    run {
      id
    }
  }
  keptMessages: conversationMessages(
    # One `_and`, because a filter cannot put `_or` beside plain fields
    where: {
      _and: [
        {
          conversation: {
            id: { eq: $conversationId }
            userId: { eq: $userId }
            organizationId: { eq: $organizationId }
          }
        }
        { kind: { ne: ASPECTS } }
        {
          _or: [
            { runId: { isNull: true } }
            { kind: { eq: MEMBER_TEXT } }
            { run: { anchorPosition: { ne: $anchorPosition } } }
          ]
        }
      ]
    }
    orderBy: [{ position: DESC }]
    limit: 1
  ) {
    id
    kind
    text
    noteKind
    toolName
    toolStatus
    questionPrompt
    answerSelected
    answerOther
    isAnswerSkipped
  }
}

# What a worker reads of a run before each step it takes, in one read:
#
# - the run, matched with the conversation, its author and its organization it was queued for, so a
#   worker told of a run elsewhere finds nothing
# - the conversation: whether it is deleted, the run it names, its counter and how many messages it
#   holds
# - the author's membership, whose `createdAt` has to be the one the run records, and whether they
#   are still staff
# - the transcript's last entry, with how many of its blocks the thread has drawn, which is where a
#   worker taking over after a crash carries on
# - the messages the run has drawn, which it may draw 100 of (`MAX_CONVERSATION_RUN_ENTRIES` in
#   strategydance-core): the member's message that started it is not one
# - the run's context, once built, and its usage, with each request it reserved and settled
# - the run's latest replies in the transcript, which the worker stores once each
#
# The reconcile route reads it too, with the caller the backend verified as `$userId`
query GetConversationRunContext($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $runId: UUID!)
@auth(level: NO_ACCESS) {
  conversationRuns(
    where: {
      id: { eq: $runId }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 1
  ) {
    id
    number
    trigger
    status
    attempts
    createdAt
    startedAt
    membershipCreatedAt
    leaseExpiresAt
    stopRequestedAt
    anchorPosition
    context
    usage
  }
  conversation(id: $conversationId) {
    deletedAt
    activeRunId
    nextMessagePosition
    messageCount
    previewMessageId
  }
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  user(key: { id: $userId }) {
    isAdministrator
  }
  conversationTranscriptEntries(
    where: { conversationId: { eq: $conversationId } }
    orderBy: [{ position: DESC }]
    limit: 1
  ) {
    id
    position
    role
    content
    drawnBlocks
    drawnPieces
    run {
      id
    }
  }
  # The run's latest replies, newest first, which a write refused partway stored some of: a turn
  # holds a few parts at most, and a run that calls tools stores a turn for each request
  runEntries: conversationTranscriptEntries(
    where: { conversationId: { eq: $conversationId }, runId: { eq: $runId }, role: { eq: ASSISTANT } }
    orderBy: [{ position: DESC }]
    limit: 10
  ) {
    id
    position
    content
    drawnBlocks
    drawnPieces
  }
  # A note's kind is selected at the top level here, which has the generated SDK declare its enum
  conversationMessages(where: { runId: { eq: $runId }, kind: { ne: MEMBER_TEXT } }, limit: 100) {
    id
    kind
    noteKind
    toolStatus
  }
}

# The calls of the turn a conversation's transcript ends on, by the ids Claude gave them, as the
# thread draws them: the questions with their answers, and the calls to Strategy Dance's own tools
# with their status, their output and whether they started. And the latest run, with the results of
# the calls of that turn which finished, kept until the entry that sends them is stored. What the
# worker reads before it runs a turn's calls, and what a send, a resume and a continuation read
# before they answer them. Only the caller's conversation in that organization
query GetConversationCalls($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $toolUseIds: [String!]!)
@auth(level: NO_ACCESS) {
  conversationMessages(
    where: {
      toolUseId: { in: $toolUseIds }
      kind: { in: [TOOL_CALL, QUESTION] }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: ASC }]
    limit: 1000
  ) {
    id
    kind
    toolUseId
    toolName
    toolStatus
    toolOutput
    toolStartedAt
    questionOptions
    isMultipleChoice
    answerSelected
    answerOther
    isAnswerSkipped
    answeredAt
  }
  latestRuns: conversationRuns(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 1
  ) {
    id
    status
    pendingToolResults
  }
}

# What answering a question, and carrying a conversation on once its questions are answered, read
# of it first, in one read:
#
# - the caller's membership, whose `createdAt` the run records
# - the conversation: whose it is, whether it is deleted, whether it waits for an answer, the run in
#   flight, which message its preview shows and its run counter
# - its two latest runs: the one waiting, and the one a continuation started already, when it is
#   reached again
# - the caller's runs in flight in the organization, which a dead one among is finalized before
#   they are counted
# - its transcript's last entry, the turn whose calls the answers go back with
# - the questions still waiting, conversation-wide, since only the turn it ends on can hold any
#
# Only the caller's conversation in that organization
query GetConversationTurnContext($organizationId: UUID!, $userId: String!, $conversationId: UUID!)
@auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  conversation(id: $conversationId) {
    userId
    organizationId
    deletedAt
    activeRunId
    isAwaitingAnswer
    previewMessageId
    nextRunNumber
  }
  latestRuns: conversationRuns(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 2
  ) {
    id
    number
    trigger
    status
    leaseExpiresAt
  }
  conversationRuns(
    where: {
      status: { in: [QUEUED, RUNNING] }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 3
  ) {
    id
    status
    leaseExpiresAt
    conversation {
      id
    }
  }
  conversationTranscriptEntries(
    where: {
      conversationId: { eq: $conversationId }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: DESC }]
    limit: 1
  ) {
    id
    position
    role
    content
  }
  waitingQuestions: conversationMessages(
    where: {
      kind: { eq: QUESTION }
      answeredAt: { isNull: true }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 1000
  ) {
    id
  }
}

# A question of the caller's conversation, by its id, as an answer is checked against it: its
# options, whether several may be chosen, and its answer once it has one. Its kind is selected at
# the top level, which has the generated SDK declare its enum
query GetConversationQuestion($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $messageId: UUID!)
@auth(level: NO_ACCESS) {
  conversationMessages(
    where: {
      id: { eq: $messageId }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 1
  ) {
    id
    kind
    toolUseId
    questionPrompt
    questionOptions
    isMultipleChoice
    answerSelected
    answerOther
    isAnswerSkipped
    answeredAt
  }
}

# Whether a run's member asked it to stop, which its worker reads every two seconds while a request
# streams, in the caller's conversation
query GetConversationRunStop($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $runId: UUID!)
@auth(level: NO_ACCESS) {
  conversationRuns(
    where: {
      id: { eq: $runId }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 1
  ) {
    status
    stopRequestedAt
  }
}

# A batch of the conversations the daily sweep has claimed and not deleted yet, whoever's they are,
# which it deletes next. Only those still deleted over a day ago, as the delete takes them. Twenty
# at a time, since each holds up to 2000 messages, which go with it
query GetClaimedConversations @auth(level: NO_ACCESS) {
  conversations(
    where: { pruneClaimedAt: { isNull: false }, deletedAt: { lt_time: { now: true, sub: { days: 1 } } } }
    limit: 20
  ) {
    id
  }
}

# A page of a conversation's transcript, after a position, in order, which the worker reads whole
# before each request to Claude, and from a run's anchor for the turn it draws: each entry's
# content as the JSON text it was sent as, with its role, its run, how much of it the thread has
# drawn and, on a context message, the hash of its profile part. A hundred at a time, since
# a reply that searched the web carries its encrypted results. Only the caller's conversation in
# that organization, whose author `$userId` is, as the backend verified it
query GetConversationTranscript($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $afterPosition: Int!)
@auth(level: NO_ACCESS) {
  conversationTranscriptEntries(
    where: {
      conversationId: { eq: $conversationId }
      position: { gt: $afterPosition }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: ASC }]
    limit: 100
  ) {
    id
    position
    role
    content
    contextHash
    drawnBlocks
    drawnPieces
    run {
      id
    }
  }
}

# What a run's request to Claude is built and measured from, besides the transcript:
#
# - the member, their membership and the organization, which the context message tells Claude of:
#   the member's name, time zone, language, bio, role and job title, and the organization's name,
#   brief and explored aspects
# - the conversation's aspects
# - its 20 latest runs' usage, whose latest request with its reply still in the transcript the
#   measurement starts from, so a conversation about to pass Claude's context is marked full
#
# `$userId` is the uid the backend verified, never one a client sent
query GetConversationRequestContext($organizationId: UUID!, $userId: String!, $conversationId: UUID!)
@auth(level: NO_ACCESS) {
  user(key: { id: $userId }) {
    displayName
    timezone
    locale
    bio
  }
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    role
    jobTitle
  }
  organization(id: $organizationId) {
    name
    brief
    exploredAspects
  }
  conversations(
    where: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    limit: 1
  ) {
    aspects
  }
  conversationRuns(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 20
  ) {
    id
    usage
  }
}

# Why `RecordConversationSearch` refused a search: whether the caller is still a member, and their
# searches in the organization in the last ten minutes, newest first, the 120th of which says when
# the next one fits. Read only once a search has been refused. `$userId` is the uid the backend
# verified
query GetConversationSearchQuota($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    role
  }
  conversationSearches(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      createdAt: { gt_time: { now: true, sub: { minutes: 10 } } }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 120
  ) {
    createdAt
  }
}

# The caller's conversations whose title holds every word of the query, through the title's
# full-text index (see `Conversation.title`): `PLAIN` splits the query into words and requires
# them all, in any order. All of them, as somebody keeps at most 1000 conversations in an
# organization. Only their own, while they are a member, and none deleted. `$userId` is the uid the
# backend verified
query SearchConversationTitles($organizationId: UUID!, $userId: String!, $query: String!) @auth(level: NO_ACCESS) {
  conversations_search(
    query: $query
    queryFormat: PLAIN
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq: $userId } } } }
    }
    limit: 1000
  ) {
    id
  }
}

# The member's and the agent's messages, in the caller's conversations, whose text holds every
# word of the query, through the text's full-text index (see `ConversationMessage.text`), most
# relevant first, and only their conversation's id, since the search answers with conversations.
#
# Read once rather than in pages: a `_search` is ordered by its relevance alone, which its
# `orderBy` cannot name, so pages read by offset could repeat a message across a tie at their
# boundary and skip another, and each page would rank every match again anyway. To 5001: the 5000
# most relevant, and one more, which says that a few conversations with thousands of matches used
# up the read, when the backend answers the best matches, and only then. Only the caller's own conversations, while they are a member, and none deleted.
# `$userId` is the uid the backend verified
query SearchConversationMessages($organizationId: UUID!, $userId: String!, $query: String!) @auth(level: NO_ACCESS) {
  conversationMessages_search(
    query: $query
    queryFormat: PLAIN
    where: {
      kind: { in: [MEMBER_TEXT, AGENT_TEXT] }
      conversation: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq: $userId } } } }
      }
    }
    limit: 5001
  ) {
    conversationId
  }
}

# The caller's conversations, most recently active first, with how many messages each holds, from
# which the backend picks those whose messages a search by substring reads. Only their own, while
# they are a member, and none deleted. `$userId` is the uid the backend verified
query GetConversationSearchCorpus($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  conversations(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq: $userId } } } }
    }
    # `id` breaks the tie between two conversations active in the same instant
    orderBy: [{ updatedAt: DESC }, { id: ASC }]
    limit: 1000
  ) {
    id
    messageCount
  }
}

# A search by substring, for Chinese and Japanese, which put no space between words, so the
# full-text indexes cannot find a word inside a sentence: the caller's conversations whose title
# matches every pattern, or, among `$recentIds`, holding a member's or an agent's message whose text
# matches every pattern. Each pattern is a LIKE pattern, `%word%` with the word's `%`, `_` and `\`
# escaped, ignoring case. Always eight, one a word: the backend fills those a query leaves over with
# `%`, which matches any text.
#
# No index serves such a match, so it reads a bounded corpus: the titles of at most 1000
# conversations, and the messages of `$recentIds`, the most recently active conversations whose
# messages add up to at most 20000 (`MAX_SUBSTRING_SEARCH_MESSAGES` in strategydance-core). Only
# the caller's own, while they are a member, and none deleted. `$userId` is the uid the backend
# verified
query SearchConversationsBySubstring(
  $organizationId: UUID!
  $userId: String!
  $recentIds: [UUID!]!
  $pattern0: String!
  $pattern1: String!
  $pattern2: String!
  $pattern3: String!
  $pattern4: String!
  $pattern5: String!
  $pattern6: String!
  $pattern7: String!
) @auth(level: NO_ACCESS) {
  conversations(
    # Data Connect refuses `_and` or `_or` beside plain fields, so each level is one or the other
    where: {
      _and: [
        {
          userId: { eq: $userId }
          organizationId: { eq: $organizationId }
          deletedAt: { isNull: true }
          organization: { userOrganizations_on_organization: { exist: { userId: { eq: $userId } } } }
        }
        {
          _or: [
            {
              _and: [
                { title: { pattern: { like: $pattern0, ignoreCase: true } } }
                { title: { pattern: { like: $pattern1, ignoreCase: true } } }
                { title: { pattern: { like: $pattern2, ignoreCase: true } } }
                { title: { pattern: { like: $pattern3, ignoreCase: true } } }
                { title: { pattern: { like: $pattern4, ignoreCase: true } } }
                { title: { pattern: { like: $pattern5, ignoreCase: true } } }
                { title: { pattern: { like: $pattern6, ignoreCase: true } } }
                { title: { pattern: { like: $pattern7, ignoreCase: true } } }
              ]
            }
            {
              id: { in: $recentIds }
              conversationMessages_on_conversation: {
                exist: {
                  _and: [
                    { kind: { in: [MEMBER_TEXT, AGENT_TEXT] } }
                    { text: { pattern: { like: $pattern0, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern1, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern2, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern3, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern4, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern5, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern6, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern7, ignoreCase: true } } }
                  ]
                }
              }
            }
          ]
        }
      ]
    }
    limit: 1000
  ) {
    id
  }
}

# The Knowledge module's operations follow, named `…ForAgent`: what an agent reads and writes of an
# organization's documents through it, Strategy Dance's own and a member's alike. Each takes the
# member the backend verified, `$userId`, and the `createdAt` of the membership it read,
# `$membershipCreatedAt`, so a member removed, or removed and invited back, stops every agent acting
# as them at its next call. Each holds to what the team lets agents do: a document whose
# `isAiReadable` is off is never loaded, whatever the call, and one whose `isAiWritable` is off is
# never changed.

# Whether the caller is still the member the module read, and what the team lets agents do with a
# document, read only to word a refusal once a read or a write that filters on them found nothing.
# Never anything of the document's text
query GetDocumentAccessForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!, $id: UUID!)
@auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  documents(where: { id: { eq: $id }, organizationId: { eq: $organizationId } }, limit: 1) {
    isAiReadable
    isAiWritable
    deletedAt
  }
}

# The organization's slug, which leads the web addresses an external agent's results carry, or its
# id while it has none
query GetOrganizationForAgent($organizationId: UUID!) @auth(level: NO_ACCESS) {
  organization(key: { id: $organizationId }) {
    id
    slug
  }
}

# Up to 20 documents agents may read whose title and plain text together hold every word of the
# query, by Data Connect's full-text search: one `tsvector` over both columns, with the `simple`
# configuration, read through its index. Tagged with every aspect named, `[]` naming none: a null
# list would match nothing. Only the plain text is loaded, to cut the excerpts, never `content` or
# `state`
query SearchDocumentsForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $query: String!
  $aspects: [CompanyAspect!]!
) @auth(level: NO_ACCESS) {
  documents_search(
    query: $query
    queryFormat: PLAIN
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      aspects: { includesAll: $aspects }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 20
  ) {
    id
    title
    aspects
    updatedAt
    isAiWritable
    contentText
  }
}

# The 100 documents agents may read that changed last (`MAX_SUBSTRING_SEARCH_DOCUMENTS` in
# strategydance-core), whose text a search in Chinese or Japanese reads, since no index serves a
# match inside a sentence
query GetDocumentSearchCorpusForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $aspects: [CompanyAspect!]!
) @auth(level: NO_ACCESS) {
  documents(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      aspects: { includesAll: $aspects }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    # `id` breaks the tie between two documents changed in the same instant
    orderBy: [{ updatedAt: DESC }, { id: ASC }]
    limit: 100
  ) {
    id
  }
}

# A search in Chinese or Japanese, by substring: every pattern in the title of any document agents
# may read, or in the plain text of one of the recent ones, each pattern in either, as the full-text
# search takes each word from the title or the text, up to 20. Always eight patterns, those a query
# leaves over `%`
query SearchDocumentsBySubstringForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $aspects: [CompanyAspect!]!
  $recentIds: [UUID!]!
  $pattern0: String!
  $pattern1: String!
  $pattern2: String!
  $pattern3: String!
  $pattern4: String!
  $pattern5: String!
  $pattern6: String!
  $pattern7: String!
) @auth(level: NO_ACCESS) {
  documents(
    # Data Connect refuses `_and` or `_or` beside plain fields, so each level is one or the other
    where: {
      _and: [
        {
          organizationId: { eq: $organizationId }
          deletedAt: { isNull: true }
          isAiReadable: { eq: true }
          aspects: { includesAll: $aspects }
          organization: {
            userOrganizations_on_organization: {
              exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
            }
          }
        }
        {
          _or: [
            { title: { pattern: { like: $pattern0, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern0, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern1, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern1, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern2, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern2, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern3, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern3, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern4, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern4, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern5, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern5, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern6, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern6, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern7, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern7, ignoreCase: true } } }] }
          ]
        }
      ]
    }
    limit: 20
  ) {
    id
    title
    aspects
    updatedAt
    isAiWritable
    contentText
  }
}

# Documents agents may read that are not indexed yet, read before a search to index them from their
# `content`: up to 21, so the backend indexes 20 and knows whether more remain. Only a page from
# before `contentText` leaves one so once the release has run its backfill. With the membership, so
# a search refuses a caller who is no longer the member it read rather than find nothing
query GetUnindexedDocumentsForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!)
@auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  documents(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      contentText: { isNull: true }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 21
  ) {
    id
    content
    revision
  }
}

# A page of the documents agents may read, latest changed first and then by id, since two can share
# an instant. A filter on a UUID takes no `gt`, so the page is read in two parts around the cursor's
# instant: the documents changed at it, all of them, by id, which the backend keeps past the
# cursor's id, and up to 51 changed before it, which say whether more remain. The first page names
# an instant past every document, so it reads the second part alone. With the membership, so a
# caller who is no longer the member the module read is refused rather than shown nothing
query ListDocumentsForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $aspects: [CompanyAspect!]!
  $before: Timestamp!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  atCursor: documents(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      aspects: { includesAll: $aspects }
      updatedAt: { eq: $before }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    orderBy: [{ id: ASC }]
    limit: 1000
  ) {
    id
    title
    aspects
    updatedAt
    isAiWritable
  }
  beforeCursor: documents(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      aspects: { includesAll: $aspects }
      updatedAt: { lt: $before }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    orderBy: [{ updatedAt: DESC }, { id: ASC }]
    limit: 51
  ) {
    id
    title
    aspects
    updatedAt
    isAiWritable
  }
}

# One document agents may read, with everything its text is read from: the snapshot, the updates
# pending since, as `GetDocument` reads them, and `content`, which seeds a document that has no
# snapshot yet. Nothing when the team keeps it from agents, which `GetDocumentAccessForAgent` then
# tells apart from a document that is not there
query GetDocumentForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!, $id: UUID!)
@auth(level: NO_ACCESS) {
  documents(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 1
  ) {
    title
    aspects
    isAiWritable
    revision
    state
    content
    updatedAt
    documentUpdates_on_document(orderBy: [{ createdAt: ASC }, { id: ASC }], limit: 100) {
      id
      payload
    }
  }
}

# What a module's write answered under an idempotency key, read before the write runs, and again
# when the write finds its key taken
query GetModuleCallResult($idempotencyScope: String!, $idempotencyKey: String!) @auth(level: NO_ACCESS) {
  moduleCallResult(key: { idempotencyScope: $idempotencyScope, idempotencyKey: $idempotencyKey }) {
    userId
    organizationId
    tool
    argumentsHash
    result
  }
}

# The backfill's, run by hand after a release: up to 100 documents of any organization not indexed
# yet, deleted ones included, leaving out those it could not index, so it pages through them and can
# stop and start again at any point
query GetUnindexedDocuments($skippedIds: [UUID!]!) @auth(level: NO_ACCESS) {
  documents(where: { contentText: { isNull: true }, id: { nin: $skippedIds } }, limit: 100) {
    id
    content
    revision
  }
}
