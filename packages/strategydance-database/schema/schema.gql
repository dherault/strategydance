# The languages the product speaks. A second declaration of `Locale` in strategydance-core,
# which is what the message catalogues and the language picker are built from, and the two have
# to agree: `schema.test.ts` is what fails when they stop agreeing
enum Locale {
  EN
  FR
  ES
  DE
  PT
  ZH
  JA
}

# How somebody proves who they are. An enum rather than a string, so Postgres refuses a value
# this app never defined and the generated SDK types it as a union rather than as `string[]`
enum AuthenticationProvider {
  PASSWORD
  GOOGLE
}

# The reader's account, one row per Firebase Auth uid.
#
# Distinct from the Firebase account itself, which the SDK holds and this table only mirrors:
# `email`, `displayName` and `imageUrl` are copies kept in step so a join can render somebody's
# name without a round trip to the auth service, which has no bulk read anyway.
type User @table {
  # `@default(expr: "auth.uid")` fills this in from the caller's token on insert and upsert, so
  # the key is never something a client chooses and nobody can write a row as somebody else
  id: String! @default(expr: "auth.uid")
  # Mandatory and unique, which is what lets the sign-in screen ask about an address before
  # anybody has signed in. Firebase is configured one account per email address, so two rows
  # sharing one would be a bug rather than a pair of accounts
  email: String! @unique
  displayName: String
  imageUrl: String
  # The picture fitted inside 256 pixels, which the page makes as it uploads one, for where it is
  # drawn small. Not a copy of anything Firebase holds: null for a picture from before, or from
  # Google, and for one whose thumbnail could not be made, where the picture itself is drawn
  imageThumbnailUrl: String
  # The reader's language, as a hint for anything sent to them rather than rendered for them.
  # Written at creation in the language the account was created in, then by the account page
  # whenever it saves. The interface language is a preference the browser holds, which that page
  # sets along with this one
  locale: Locale!
  # An IANA identifier, validated against `Intl` before it is sent. Unlike `locale` this is
  # observed rather than chosen, so the newest answer overwrites the stored one
  timezone: String
  # Which buttons this account can sign in with, so a screen can say so without asking Firebase
  # and getting an answer shaped by email enumeration protection
  authenticationProviders: [AuthenticationProvider!]!
  # What they work on, in their own words, as the account page saves it for their team and agents
  # to read. Unlike `displayName` it mirrors nothing: this row is where it lives. Null until
  # somebody writes one
  bio: String
  # When a request last claimed the account's welcome email, which it holds for ten minutes while
  # it sends, so two requests cannot both mail. Left to lapse rather than handed back when the
  # send fails or the process dies, so a later request retries it, never sooner. Only the
  # backend's connector reads or writes it
  welcomeEmailClaimedAt: Timestamp
  # When the account's one welcome email went out, and null until it has. Only the backend's
  # connector writes it. The reader's own row carries it, so the web app knows to ask for it
  welcomeEmailSentAt: Timestamp
  # Whether this account administers Strategy Dance itself, which opens the administration pages,
  # as opposed to administering an organization, which is `UserOrganization.role`. No connector
  # operation writes it, so no client can grant it to itself. Locally,
  # `bun run grant:administrator <email>` sets it in the emulators
  isAdministrator: Boolean! @default(value: false)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# The aspects of a company the product guides it through. This order is the Postgres enum's, and
# reordering its values is a breaking migration, so the order a reader sees is the frontend's
# `COMPANY_ASPECTS` instead. Add a value here and there both
enum CompanyAspect {
  STRATEGY
  PEOPLE
  FINANCES
  PRODUCT
  ENGINEERING
  DESIGN
  MARKETING
  SALES
  LEGAL
}

# What somebody can do inside an organization
enum OrganizationRole {
  MEMBER
  ADMINISTRATOR
}

# A team. It names no members: `UserOrganization` owns those, so adding or removing somebody
# does not touch this row
type Organization @table {
  # Written out rather than left implicit, so `response.organization.id` in `CreateOrganization`
  # refers to something on the page
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  # The segment that leads each of its pages' paths, as in `/strategy-dance-ad34/today`: its name
  # in lowercase words joined by dashes, then a dash and four random letters or digits, as
  # strategydance-core's `createOrganizationSlug` draws it. Set once, when it is created, and kept
  # through a rename, so a link to it never breaks. Null only for one a page from before slugs
  # created, which the app addresses by its id
  slug: String @unique
  # The aspects the organization has started working on, each once. None to begin with: the
  # sidebar lists these, and the rest wait behind the explore page
  exploredAspects: [CompanyAspect!]! @default(sql: "'{}'")
  # How it appears to its team, the community and agents, as its administrators set it on its
  # profile page. The two pictures are Storage download URLs, and only the backend writes them: putting a
  # file in Storage on an administrator's word is something a Storage rule cannot check, since it
  # cannot read who administers what. Null until somebody uploads one
  logoUrl: String
  # The logo fitted inside 256 pixels, which the page makes and the backend stores beside it, for
  # where it is drawn small. Null for a logo from before, where the logo itself is drawn
  logoThumbnailUrl: String
  bannerUrl: String
  # Six uppercase hex digits behind a `#`, filling the mark where there is no logo. Null until an
  # administrator picks one, which means strategydance-core's `DEFAULT_ORGANIZATION_COLOR`
  color: String
  # What the company does, for whom, and where it is headed, in its administrators' words. Null
  # until somebody writes one
  brief: String
  # Whether anybody may see its name, pictures and brief, or only its members. Nothing reads it
  # yet: it keeps the administrators' choice for the public profile to come. On unless they turn
  # it off, as the design has it
  isPublic: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Which organizations somebody is in, and as what.
#
# Two reference fields as the primary key is what tells Data Connect this is a join table. The
# pair is unique, so a repeated insert is an error rather than a second membership, and `user`
# leads because a composite key indexes left to right: filtering on it is the read this table
# exists for
type UserOrganization @table(key: ["user", "organization"]) {
  # Implies a `userId: String!` column, String because `User.id` is a Firebase uid
  user: User!
  # Implies an `organizationId: UUID!` column, cascade deleting
  organization: Organization!
  # No default. An insert has to say which, so nobody becomes an administrator by omission
  role: OrganizationRole!
  # What they do there, like "Product designer", written by them or by an administrator. On the
  # membership rather than on `User`, since one person does different things in different
  # organizations. Null until somebody writes one. Named apart from the design's "Role" column
  # it fills, because `role` above is already something else
  jobTitle: String
  # The one thing they are moving forward, in their words, which their team reads on its Today
  # page and the build in public cards draw. BlockNote's blocks, serialized, at most 100000
  # characters (`MAX_TOP_PRIORITY_LENGTH` in strategydance-core). It is somebody else's for every
  # reader but its author, so it is drawn only through the design system's `RichText`, as
  # `LogEntry.content` is. One set before the editor was BlockNote's, as plain text or as Lexical's
  # editor state, reads as no priority. Kept until they change it rather than cleared each day, and
  # null until they first set one
  topPriority: String
  # When `topPriority` was last set, so a priority left for weeks can be told from today's
  topPriorityUpdatedAt: Timestamp
  # How their own Today page lists the team's priorities: user ids in the order they dragged
  # them into, and the ones they hid. Theirs alone, since no operation reads another member's.
  # Members missing from the order follow in joined-at order, and the page drops the ids of
  # people who left on its next save, so neither list outgrows the team
  priorityOrder: [String!]! @default(sql: "'{}'")
  hiddenPriorities: [String!]! @default(sql: "'{}'")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Somebody asked to join an organization, by email, who has not answered yet.
#
# Every row is pending: accepting inserts the `UserOrganization` and deletes this row, and
# declining or canceling deletes it alone. The pair of organization and address is unique, so
# nobody is invited to the same organization twice.
#
# `id` doubles as the secret in the invitation's link. Holding it is what proves the email
# reached its reader, which the address on a token cannot: password accounts are never verified.
# So no operation a member can call selects it, and only the backend reads it, to put it in the
# email
type OrganizationInvitation @table @unique(fields: ["organization", "email"]) {
  id: UUID! @default(expr: "uuidV4()")
  # Implies an `organizationId: UUID!` column, cascade deleting
  organization: Organization!
  # Lowercased before it is written, because Firebase Auth lowercases the address on a token and
  # accepting compares the two
  email: String!
  # Who sent it, for the page the link opens to name
  invitedBy: User!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# An invitation somebody sent, kept after the invitation itself is accepted, declined or
# canceled, so the backend can hold everybody to an hourly number of invitation emails. Counted
# in the database rather than in a server's memory, because Cloud Run spreads one caller's
# requests over several instances, and each would keep its own count.
#
# Written in the same transaction as the invitation, and read only by the backend. Every invitation
# prunes the rows older than the window, whoever sent them, so the table holds about the last hour
# of everybody's invitations
type SentInvitation @table @index(fields: ["invitedById", "createdAt"]) {
  id: UUID! @default(expr: "uuidV4()")
  # Implies an `invitedById: String!` column, cascade deleting
  invitedBy: User!
  createdAt: Timestamp! @default(expr: "request.time")
}

# One of the habits on somebody's checklist in an organization, a column they tick on each day they
# keep it, such as "Talk to users". Their team reads it, and only they write it.
#
# It references the account and the organization rather than the membership, so removing somebody,
# which deletes the membership and nothing else, keeps their checklist and its history where they
# left it should they be invited again. Deleting the account or the organization cascades.
#
# Deleted by setting `deletedAt`, so an Undo brings the column back with every day it was ticked,
# which reaches further back than the page has read. `DeleteChecklistItem` prunes the caller's ones
# deleted over a day ago, their ticks cascading with them, lazily: the ones deleted in the day
# before somebody's latest delete stay, read by nothing but `RestoreChecklistItem`, until they
# delete another. So they are at most what one person deletes in a day, and a guaranteed expiry
# would take a scheduled job
type ChecklistItem @table @index(fields: ["userId", "organizationId"]) {
  id: UUID! @default(expr: "uuidV4()")
  # Implies a `userId: String!` column, cascade deleting
  user: User!
  # Implies an `organizationId: UUID!` column, cascade deleting
  organization: Organization!
  # One line of at most 40 characters (`MAX_CHECKLIST_ITEM_NAME_LENGTH` in strategydance-core), short
  # enough to read slanted above its column
  name: String!
  # Where its column sits, ascending. A move writes this one row, halfway between its new
  # neighbours, since the SDK cannot batch a renumbering
  position: Float!
  deletedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# A day somebody kept one of their habits. The row is the tick: unticking deletes it, so a day
# nobody ticked costs nothing. Keyed by the item and the day, so a day is ticked at most once
type ChecklistCompletion @table(key: ["checklistItem", "date"]) {
  # Implies a `checklistItemId: UUID!` column, cascade deleting
  checklistItem: ChecklistItem!
  # The owner's day, in their time zone, as their page reads it rather than as the server does
  date: Date!
  createdAt: Timestamp! @default(expr: "request.time")
}

# What a member moved forward on a day, in their words, which the whole team reads on its Today
# page as a feed. One a day: the member, the organization and the day are unique together, so a
# second entry for a day is refused and the page offers to edit the first instead.
#
# It references the account and the organization rather than the membership, as `ChecklistItem` does:
# the feed leaves out whoever is not a member any more, and shows their entries again should they
# be invited back
type LogEntry @table @unique(fields: ["user", "organization", "date"]) @index(fields: ["organizationId", "date"]) {
  id: UUID! @default(expr: "uuidV4()")
  # Implies a `userId: String!` column, cascade deleting
  user: User!
  # Implies an `organizationId: UUID!` column, cascade deleting
  organization: Organization!
  # The author's day, in their time zone, as their page reads it
  date: Date!
  # BlockNote's blocks, serialized, at most 50000 characters (`MAX_LOG_ENTRY_LENGTH` in
  # strategydance-core). It is somebody else's for every reader but its author, so the page never
  # hands it to an editor or to the DOM: it draws it through the design system's `RichText`, which
  # reads an allowlist of blocks and nothing else. One written before the editor was BlockNote's is
  # Lexical's editor state, which reads as nothing
  content: String!
  createdAt: Timestamp! @default(expr: "request.time")
  # Later than `createdAt` once the author has edited it, which the feed says
  updatedAt: Timestamp! @default(expr: "request.time")
}

# A day a member changed something in an organization: their top priority, their checklist or their
# log on their Today page, or any task on the team's board. The build in public page counts their
# streak from these rows. The row is the day, keyed by the member, the organization and the day, so
# a second change that day writes nothing new.
#
# The day is when the change was made, not the day it was about: ticking yesterday's checklist
# today marks today. `RecordActivity` writes it, after the change itself, and holds the day to the
# member's today, so a past day cannot be marked.
#
# It references the account and the organization rather than the membership, as `ChecklistItem` does,
# so a member removed and invited again keeps their streak's history
type ActivityDay @table(key: ["user", "organization", "date"]) {
  # Implies a `userId: String!` column, cascade deleting
  user: User!
  # Implies an `organizationId: UUID!` column, cascade deleting
  organization: Organization!
  # The member's day, in their time zone, as a log entry's is
  date: Date!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Where a task stands on its organization's board, one column each, in the board's order. This
# order is the Postgres enum's, and reordering its values is a breaking migration: append one,
# never reorder
enum TaskStatus {
  BACKLOG
  TODO
  ONGOING
  DONE
}

# A piece of work on an organization's board, which the Tasks page lays out in a column per status.
# Any member reads, writes, moves and deletes any of its organization's tasks: the board is the
# team's, not its author's, as the knowledge is.
#
# Deleted by setting `deletedAt`, so an Undo is one update that brings it back with the links other
# tasks had to it. `DeleteTask` prunes the organization's tasks deleted over a day ago, their links
# cascading with them, as lazily as `DeleteDocument` prunes documents
type Task @table @index(fields: ["organizationId", "status", "position"]) {
  # Made by the page, which shows the task before the server answers
  id: UUID! @default(expr: "uuidV4()")
  # Implies an `organizationId: UUID!` column, cascade deleting
  organization: Organization!
  # Who added it. Optional, which Data Connect makes a foreign key that is set to null when the
  # account goes, so deleting an account keeps its team's tasks
  createdBy: User
  # One line of at most 120 characters (`MAX_TASK_NAME_LENGTH` in strategydance-core), with no
  # space at either end
  name: String!
  # BlockNote's blocks, a post's, serialized, at most 20000 characters
  # (`MAX_TASK_DESCRIPTION_LENGTH`), and an empty string when there is none. It is somebody else's for
  # most readers, so it is drawn only through the design system's `RichText`, as a log entry is
  description: String! @default(value: "")
  status: TaskStatus!
  # Where it sits in its column, ascending. A move writes this one row, halfway between its new
  # neighbours, since the SDK cannot batch a renumbering. Ties, as two members adding at once can
  # make, fall back to `createdAt`
  position: Float!
  # The member doing it, or null. Optional, set to null when the account goes, and by
  # `RemoveOrganizationMember` when they leave the organization, so a task is never left with
  # somebody who cannot see it
  assignee: User
  # Whether Strategy Dance itself is doing it, rather than a member. Never alongside an `assignee`:
  # the mutations that set either refuse both at once
  isAssignedToAgent: Boolean! @default(value: false)
  # The day it should be done by, the same day for every member whatever their time zone
  dueDate: Date
  # Which aspects of the company it is about, each once, in no particular order. The page shows
  # them in `COMPANY_ASPECTS`' order
  aspects: [CompanyAspect!]! @default(sql: "'{}'")
  deletedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# A task that cannot start until another is done, on the same board. Keyed by the pair, so a link
# exists once and adding it again changes nothing. A link to a deleted task is kept, so an Undo
# brings it back, and the board reads past it; pruning either task cascades it away
type TaskDependency @table(key: ["task", "dependency"]) {
  # The one that waits. Implies a `taskId: UUID!` column, cascade deleting
  task: Task!
  # The one it waits on. Implies a `dependencyId: UUID!` column, cascade deleting
  dependency: Task!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A piece of what an organization knows, such as a plan, some notes or a decision, which the
# Knowledge pages list and each aspect's page shows when it is tagged with that aspect. Any member
# reads, writes, tags, deletes and sets what agents may do with any of its organization's
# documents: it is the team's, not its author's.
#
# Deleted by setting `deletedAt`, so an Undo is one update. `DeleteDocument` prunes the
# organization's documents deleted over a day ago, as lazily as `DeleteChecklistItem` prunes habits. One
# emptied of its title and its text is deleted outright by `DiscardDocument` instead, since there is
# nothing to undo
type Document @table @index(fields: ["organizationId", "updatedAt"]) {
  id: UUID! @default(expr: "uuidV4()")
  # Implies an `organizationId: UUID!` column, cascade deleting
  organization: Organization!
  # Who started it. Optional, which Data Connect makes a foreign key that is set to null when the
  # account goes, so deleting an account keeps its team's documents. Nothing reads it yet
  createdBy: User
  # One line of at most 200 characters (`MAX_DOCUMENT_TITLE_LENGTH` in strategydance-core), and
  # empty until somebody writes one, which the pages read as "Untitled"
  title: String! @default(value: "")
  # BlockNote's blocks, serialized, at most 200000 characters (`MAX_DOCUMENT_CONTENT_LENGTH` in
  # strategydance-core), and an empty string when there is no text, never an empty document.
  # Once `state` is set it is a copy of it, written with each compaction, for what reads the text
  # without an editor: anything drawing it draws it through the design system's `RichText`, and
  # `DiscardDocument` reads it for emptiness. The editor reads `state` instead
  content: String! @default(value: "")
  # The text as a Yjs document, every edit folded in, in base64 and at most 2000000 characters
  # (`MAX_DOCUMENT_STATE_LENGTH`). It is what the editor opens on, merged with the `DocumentUpdate`
  # rows pending since, and what a compaction rewrites with them folded in. Null for a document
  # stored before the editor was shared, until somebody opens it and `SeedDocumentState` converts
  # its `content`. Another member's for most of its readers, and it reaches the editor without
  # `parseRichText`: the editor's schema is what keeps it to the blocks it knows, and a tab on an
  # older bundle deletes a block its schema lacks, so a new block reaches every tab before anybody
  # writes one
  state: String
  # Which aspects of the company it is about, each once, in no particular order. The pages show
  # them in `COMPANY_ASPECTS`' order
  aspects: [CompanyAspect!]! @default(sql: "'{}'")
  # Whether the team lets agents read it. Nothing reads it yet: it keeps their choice for the agents
  # to come
  isAiReadable: Boolean! @default(value: true)
  # Whether the team lets agents change it, which they may only while they may read it too. One they
  # may not read keeps this as it was, for when they may again
  isAiWritable: Boolean! @default(value: true)
  # How many times its `state` or its `content` was written. A compaction names the revision of the
  # snapshot it folded the pending updates into and is refused when it is not the stored one, so it
  # never writes over a newer snapshot, and a tab that sees it move reads the snapshot again. A
  # page from before the editor was shared saves `content` the same way, which a document with a
  # `state` refuses
  revision: Int! @default(value: 0)
  deletedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  # When its title, content or aspects last changed, or what agents may do with it. Deleting it and
  # taking the delete back leave it alone, so an Undo puts it back where it was in the list
  updatedAt: Timestamp! @default(expr: "request.time")
}

# An edit to a document's text not folded into its `state` yet: a Yjs update, as one tab pushed it
# while somebody typed. Every open tab reads the document's pending ones live and applies those it
# has not seen, and applying one twice, or out of order, comes to the same text, so a tab's own
# echo and a retried push change nothing.
#
# The tab names the id, and a retry sends the same id with the same bytes, so a push whose answer
# was lost is stored once. Keyed with its document, so an id cannot move a row to another one.
# `CompactDocument` deletes the ones it folded into the snapshot, which keeps a document's few
type DocumentUpdate @table(key: ["document", "id"]) @index(fields: ["documentId", "createdAt"]) {
  # Implies a `documentId: UUID!` column, cascade deleting
  document: Document!
  id: UUID!
  # Who pushed it. Optional, set to null when the account goes. Nothing reads it yet
  createdBy: User
  # The update, in base64, at most 50000 characters (`MAX_DOCUMENT_UPDATE_LENGTH`), and never
  # changed once stored. Not named `update`, which SQL reserves
  payload: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Somebody with a document open, one row per tab, so the others draw their caret and their face.
# A tab writes its row as its caret moves and every 15 seconds while it is visible, and deletes it
# when it hides or leaves the page. A tab that went without a word ages out: readers list the rows
# written in the last 45 seconds, and each write prunes the document's rows older than a minute.
# Keyed with the user, so nobody writes over another member's row
type DocumentPresence @table(key: ["document", "user", "sessionId"]) {
  # Implies a `documentId: UUID!` column, cascade deleting
  document: Document!
  # Implies a `userId: String!` column, cascade deleting
  user: User!
  # The tab's, made when its page opens
  sessionId: UUID!
  # Where their caret and selection are, as the JSON of two Yjs relative positions, which follow
  # the text typed in front of them. Null while their focus is out of the text
  cursor: String
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Who set something on a conversation: the member, or the agent on their behalf
enum ConversationActor {
  MEMBER
  AGENT
}

# What a thread's entry is. Append a value; never reorder: the order is the Postgres enum's
enum ConversationMessageKind {
  # The member's message
  MEMBER_TEXT
  # Strategy Dance's text, in Markdown, or one piece of a reply too long for one message
  AGENT_TEXT
  # A tool the agent called, web search included
  TOOL_CALL
  # A question the agent asked, with the options it offered
  QUESTION
  # The aspects the conversation was tagged with, by the agent or the member
  ASPECTS
  # A line the thread draws on its own, such as "You stopped this response."
  NOTE
}

# Where a tool call stands. Append a value; never reorder
enum ConversationToolStatus {
  RUNNING
  SUCCEEDED
  FAILED
  CANCELLED
}

# Which note the thread draws. Append a value; never reorder
enum ConversationNoteKind {
  # The member stopped the response
  STOPPED
  # The run failed, at a limit or after the API's retries
  FAILED
  # Claude refused, and so did the model it fell back to
  REFUSED
  # The run died with its worker and was finalized by somebody else
  INTERRUPTED
  # The conversation holds as much as it can, and takes no more messages
  FULL
}

# What started a run. Append a value; never reorder
enum ConversationRunTrigger {
  MESSAGE
  ANSWER
  RESUME
  RETRY
}

# Where a run stands. Append a value; never reorder
enum ConversationRunStatus {
  # Waiting for a worker to claim it
  QUEUED
  # Claimed by a worker, whose lease says it is still alive
  RUNNING
  # Ended on a question, until an answer or a send consumes its turn
  WAITING
  COMPLETED
  STOPPED
  FAILED
  REFUSED
  INTERRUPTED
  # A waiting run whose turn was consumed. It never waits again, so an answer or a send arriving
  # after another has consumed it finds nothing to consume
  CONTINUED
}

# Who an entry of the transcript is from, as Claude reads it. Append a value; never reorder
enum ConversationTranscriptRole {
  USER
  ASSISTANT
  # A run's context message, which sits between the member's entry and the reply it led to
  SYSTEM
}

# A member's chat with Strategy Dance in an organization. Private: only its author reads it,
# administrators included, and only through operations keyed by the uid off the token and by their
# current membership.
#
# Only the backend creates one, with its first message, its first run and its first transcript
# entry in one mutation, so a conversation exists only once something was sent. The browser
# deletes, restores, marks read and changes the aspects.
#
# It references the account and the organization rather than the membership, as `ChecklistItem` does:
# a member removed and invited again finds their conversations where they left them. Deleting the
# account or the organization cascades, to the messages, the runs and the transcript with it.
#
# Deleted by setting `deletedAt`, so an Undo is one update. A prune removes it a day later, after
# claiming it with `pruneClaimedAt`
type Conversation @table @index(fields: ["userId", "organizationId", "updatedAt"]) {
  # Made by the browser, as a document's is, so a draft has its address before anything is stored
  id: UUID! @default(expr: "uuidV4()")
  # Implies a `userId: String!` column, cascade deleting
  user: User!
  # Implies an `organizationId: UUID!` column, cascade deleting
  organization: Organization!
  # One line of at most 120 characters (`MAX_CONVERSATION_TITLE_LENGTH` in strategydance-core): the
  # first message's text, a suggestion's title, or the first file's name, cut short. Searchable,
  # with the `simple` configuration, as `ConversationMessage.text` is: see there
  title: String! @searchable(language: "simple")
  # Which aspects of the company it is about, each once, in no particular order. The pages show
  # them in `COMPANY_ASPECTS`' order
  aspects: [CompanyAspect!]! @default(sql: "'{}'")
  # Who set `aspects` last, and null until anybody has. The agent tags a conversation after its
  # first message only while this is null, so once the member sets them they stay the member's
  aspectsSetBy: ConversationActor
  # The catalogue key of the suggestion it started from (`CONVERSATION_SUGGESTION_IDS`), so the
  # aspect page stops offering it. Null for one the member started themselves
  suggestionId: String
  # The run in flight, and null while none is. A plain UUID rather than a reference: the first send
  # inserts the conversation and its run in one mutation, and a reference would have it write this
  # row a second time to point at the run, which Data Connect skips
  activeRunId: UUID
  # Whether a question waits for the member. The write that ends a run `WAITING` sets it and the
  # one that consumes its turn clears it, both of which write this row anyway, so the sidebar's
  # badge reads one column rather than every question
  isAwaitingAnswer: Boolean! @default(value: false)
  # What the list and the cards show of the last entry that is not an aspects note, as
  # strategydance-core's `buildConversationPreview` builds it: the entry's kind and a little of its
  # plain text, never the words around it, which the web writes in the reader's language. Null
  # until there is one. Whoever inserts an entry writes it, so the list selects no message text
  preview: Any
  # Which message `preview` was built from. A question or a tool call changes in place, so whatever
  # changes one rebuilds the preview only while this still names it
  previewMessageId: UUID
  # How many replies the member has not read yet. Each reply and each question adds one, in the
  # write that inserts it; the page clears it when it shows them
  unreadCount: Int! @default(value: 0)
  # The `number` the next run takes, claimed in the write that starts it
  nextRunNumber: Int! @default(value: 0)
  # The `position` the next message takes. A mutation that inserts messages claims their positions
  # here first, moving it on by as many as it inserts under `@check(this == 1)`, and a writer that
  # loses the race reads it again and retries. It only grows, so a deleted message leaves a gap
  # rather than a position used twice
  nextMessagePosition: Int! @default(value: 0)
  # How many messages it holds, at most 2000 (`MAX_CONVERSATION_MESSAGES`). Each insert raises it
  # as it claims a position, and a retry lowers it by what it deletes
  messageCount: Int! @default(value: 0)
  # Bumped by every retry, which deletes messages a tab may hold beyond the live tail, so each tab
  # that sees it move reads its history again
  historyRevision: Int! @default(value: 0)
  # Set once the next request to Claude would not fit its context, which refuses new messages
  # until a retry shortens the conversation
  isFull: Boolean! @default(value: false)
  deletedAt: Timestamp
  # When a prune claimed it, past its day of Undo. A restore refuses a claimed conversation, so an
  # Undo and a prune never both win, and a prune that failed partway is finished by the next
  pruneClaimedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  # Its last activity, which orders the list
  updatedAt: Timestamp! @default(expr: "request.time")
}

# One go of the agent in a conversation, from the member's action to its end: queued by the
# backend, then claimed and finished by a worker. Only the backend writes it; the page reads its
# status, its step and its times to draw the thinking indicator.
#
# Indexed on its status, then its conversation, so the runs a member has in flight, which every
# send counts, are found among the few runs in flight rather than through every run their
# conversations ever had
type ConversationRun @table @unique(fields: ["conversation", "number"]) @index(fields: ["status", "conversationId"]) {
  id: UUID! @default(expr: "uuidV4()")
  # Implies a `conversationId: UUID!` column, cascade deleting
  conversation: Conversation!
  # Counted from 0 in its conversation, claimed on its `nextRunNumber`, so the latest run is the
  # one with the highest number, never decided by a tie between timestamps
  number: Int!
  trigger: ConversationRunTrigger!
  # No default: an insert says which, as a membership's `role` does
  status: ConversationRunStatus!
  # The `createdAt` of the membership it was started under. Every write of its worker matches it,
  # so removing the member stops the run at its next step, and a member invited back, whose new
  # membership has a new `createdAt`, never passes for an old run
  membershipCreatedAt: Timestamp!
  # The latest progress line, which the thinking indicator shows. Null when there is none
  step: String
  # The transcript position of the `USER` entry it answers, where a retry goes back to. A resumed
  # run takes the anchor of the run it resumes
  anchorPosition: Int!
  # Its context message and the hash of its profile part, as JSON text: built once when the run
  # starts, so a worker taking over sends the same bytes, and stored in the transcript with the
  # run's first reply. It stays once stored. A `String` rather than `Any`, for the transcript's
  # reason
  context: String
  # When the member asked it to stop, which its worker reads between steps
  stopRequestedAt: Timestamp
  # Until when it counts as alive: a minute out once a worker claims it, renewed as it goes, and
  # twenty minutes out while it is queued, when it only says when to ask the queue again
  leaseExpiresAt: Timestamp
  # How many times a worker claimed it. Every write of a worker matches the attempt it claimed, so
  # one that lost the run writes nothing more
  attempts: Int! @default(value: 0)
  # The results of the tool calls that ran beside a question, as JSON text, kept until the answer
  # goes back with them
  pendingToolResults: String
  # Why it failed, for the logs. Never shown to the member
  failure: String
  # The tokens and web searches each model used, and whether a figure is an estimate: the ledger
  # credits will be counted from
  usage: Any
  # When it was queued
  createdAt: Timestamp! @default(expr: "request.time")
  # When a worker first claimed it
  startedAt: Timestamp
  endedAt: Timestamp
}

# An entry of a conversation's thread, as the page draws it: one wide table rather than one per
# kind, so the thread is one query. Each kind fills its own columns and leaves the others null.
#
# The thread is a drawing of the transcript, never what Claude reads. Ordered by `position` rather
# than by time, since two mutations can share an instant: each insert claims its position on the
# conversation's `nextMessagePosition`
type ConversationMessage @table @unique(fields: ["conversation", "position"]) {
  # The member's message has the id the browser made for it, so a send retried stores it once. A
  # message the backend draws has an id derived from its transcript entry and block, so drawing it
  # twice after a crash is a conflict rather than a duplicate
  id: UUID! @default(expr: "uuidV4()")
  # Implies a `conversationId: UUID!` column, cascade deleting
  conversation: Conversation!
  # The run that drew it, or the run the member's message started. Optional, as an aspects note the
  # member writes belongs to none, and a retry deletes a run's messages by it
  run: ConversationRun
  kind: ConversationMessageKind!
  # The text of a message or a reply, in Markdown, at most 20000 characters
  # (`MAX_CONVERSATION_MESSAGE_LENGTH`), without U+0000, which Postgres refuses in `text`.
  #
  # Searchable, which keeps a generated `tsvector` column and its index beside it. The `simple`
  # configuration splits words and lowercases them, in any of the app's languages, and stems
  # nothing, so "run" never matches "running". Chinese and Japanese put no space between words, so
  # the backend searches them by substring instead
  text: String @searchable(language: "simple")
  # Where a reply cites the web: each span's offsets in `text`, with its sources' addresses, titles
  # and quoted text
  citations: Any
  # A tool call's: the id Claude gave it, the tool's name, its status, its input and output as JSON
  # text, lossless as the transcript is, when it started and how long it took. The output arrives
  # after the message, so only the dialog that shows it reads it
  toolUseId: String
  toolName: String
  toolStatus: ConversationToolStatus
  toolInput: String
  toolOutput: String
  toolStartedAt: Timestamp
  toolDurationMs: Int
  # A question's: its prompt and options as the agent wrote them, and whether several may be
  # chosen. They go back into the transcript as they are, so the backend refuses them, rather than
  # cuts them, past `MAX_QUESTION_PROMPT_LENGTH` and `MAX_QUESTION_OPTION_LENGTH`
  questionPrompt: String
  questionOptions: [String!]
  isMultipleChoice: Boolean
  # The answer: the options chosen, by their text, and the member's own words, on one line of at
  # most 500 characters (`MAX_ANSWER_OTHER_LENGTH`)
  answerSelected: [String!]
  answerOther: String
  # Whether the member sent a message instead of answering. Not null, so a count of the questions
  # left never has to match a null as well as a false
  isAnswerSkipped: Boolean! @default(value: false)
  # When it was answered or skipped, and null while it waits
  answeredAt: Timestamp
  # An aspects note's: the aspects set, and who set them
  aspects: [CompanyAspect!]
  aspectsSetBy: ConversationActor
  noteKind: ConversationNoteKind
  position: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# What Claude is sent: the exact content blocks of every turn, kept apart from the thread, which
# only draws them. Only the backend reads or writes it.
#
# Claude's thinking blocks are bound to the history they were made with, so the transcript is
# replayed byte for byte as stored. It is append-only, with one exception: a retry cuts the tail
# back to a run's anchor, which leaves a prefix the remaining thinking blocks were made with.
# Nothing else ever edits or deletes an entry
type ConversationTranscriptEntry @table @unique(fields: ["conversation", "position"]) {
  id: UUID! @default(expr: "uuidV4()")
  # Implies a `conversationId: UUID!` column, cascade deleting
  conversation: Conversation!
  # Implies a `runId: UUID!` column, cascade deleting
  run: ConversationRun!
  # Dense from 0 in its conversation
  position: Int!
  role: ConversationTranscriptRole!
  # The entry's content blocks, signatures included, as the JSON text of exactly what was sent,
  # parsed again only to be sent. A `String` rather than `Any`: Data Connect stores `Any` as
  # Postgres `jsonb`, which keeps one of two duplicate keys and refuses U+0000 in a string, so a
  # file or a tool result holding either could not come back as it went
  content: String!
  # On a context message, a hash of its profile part, which the next run's context leaves out
  # while it has not changed
  contextHash: String
  # How many of its blocks the thread has drawn, advanced in the mutation that draws each, so a
  # worker taking over after a crash draws the rest and nothing twice
  drawnBlocks: Int! @default(value: 0)
  # Within a text drawn in pieces, past 20000 characters, how many of its pieces are drawn: the
  # cursor's piece, 0 between texts
  drawnPieces: Int! @default(value: 0)
  createdAt: Timestamp! @default(expr: "request.time")
}

# A search somebody made of their conversations, kept so the backend can hold them to 120 searches
# in ten minutes in an organization. Counted in the database rather than in a server's memory,
# because Cloud Run spreads one caller's requests over several instances, and each would keep its
# own count.
#
# Written by the search route, under a lock on the searcher's membership, and read only by the
# backend. The daily sweep deletes the rows over a day old, whoever made them, which the index on
# `createdAt` alone serves, since the count's index leads with the searcher
type ConversationSearch @table @index(fields: ["userId", "organizationId", "createdAt"]) @index(fields: ["createdAt"]) {
  id: UUID! @default(expr: "uuidV4()")
  # Implies a `userId: String!` column, cascade deleting
  user: User!
  # Implies an `organizationId: UUID!` column, cascade deleting
  organization: Organization!
  createdAt: Timestamp! @default(expr: "request.time")
}
