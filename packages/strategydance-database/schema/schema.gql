# The languages the product speaks. A second declaration of `Locale` in strategydance-core,
# which is what the message catalogues and the language picker are built from, and the two have
# to agree: `schema.test.ts` is what fails when they stop agreeing
enum Locale {
  EN
  FR
  ES
  DE
  PT
  ZH
  JA
}

# How somebody proves who they are. An enum rather than a string, so Postgres refuses a value
# this app never defined and the generated SDK types it as a union rather than as `string[]`
enum AuthenticationProvider {
  PASSWORD
  GOOGLE
}

# The reader's account, one row per Firebase Auth uid.
#
# Distinct from the Firebase account itself, which the SDK holds and this table only mirrors:
# `email`, `displayName` and `imageUrl` are copies kept in step so a join can render somebody's
# name without a round trip to the auth service, which has no bulk read anyway.
type User @table {
  # `@default(expr: "auth.uid")` fills this in from the caller's token on insert and upsert, so
  # the key is never something a client chooses and nobody can write a row as somebody else
  id: String! @default(expr: "auth.uid")
  # Mandatory and unique, which is what lets the sign-in screen ask about an address before
  # anybody has signed in. Firebase is configured one account per email address, so two rows
  # sharing one would be a bug rather than a pair of accounts
  email: String! @unique
  displayName: String
  imageUrl: String
  # The language the account was created in, as a hint for anything sent to this reader rather
  # than rendered for them. Written once: the interface language is a preference the browser
  # holds, and an account page will own this one
  locale: Locale!
  # An IANA identifier, validated against `Intl` before it is sent. Unlike `locale` this is
  # observed rather than chosen, so the newest answer overwrites the stored one
  timezone: String
  # Which buttons this account can sign in with, so a screen can say so without asking Firebase
  # and getting an answer shaped by email enumeration protection
  authenticationProviders: [AuthenticationProvider!]!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# What somebody can do inside an organization. Two values because there are two answers the
# product needs so far: everybody reads, and somebody has to be able to change the roster.
#
# Unlike `Locale` this one has no second declaration in strategydance-core, so there is nothing
# for `schema.test.ts` to keep in step. Add one the day the frontend has to enumerate roles
# rather than render the one it was handed
enum OrganizationRole {
  MEMBER
  ADMINISTRATOR
}

# A team, and the thing every row this product stores will eventually hang off.
#
# It names no members. `OrganizationUser` owns that, so somebody can be added or removed without
# this row being written and `updatedAt` keeps meaning "the organization itself changed"
type Organization @table {
  # Written out rather than left implicit. `@table` adds exactly this field when `key` names
  # nothing, and having it on the page is what makes `response.organization.id` in
  # `CreateOrganization` obviously refer to something
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Who is in which organization, and as what.
#
# The composite key does two jobs. It is the uniqueness constraint, so a second insert for a pair
# is a Postgres error rather than a second membership. And it is what tells Data Connect this is
# a join table: seeing two reference fields as the primary key, it generates
# `organizations_via_OrganizationUser` on `User` and `users_via_OrganizationUser` here.
#
# Neither of those carries `role`: they are typed `[Organization!]!` and `[User!]!`, so the join
# row's own columns have nowhere to appear. That is why `GetCurrentUserOrganizations` is rooted
# at this table rather than at the reader
type OrganizationUser @table(key: ["organization", "user"]) {
  # Implies an `organizationId: UUID!` column, and a foreign key that cascade deletes: a
  # membership of an organization that is gone is not a membership
  organization: Organization!
  # Implies a `userId: String!` column, String rather than UUID because `User.id` is a Firebase
  # uid. That is what lets `where: { userId: { eq_expr: "auth.uid" } }` compare like with like
  user: User!
  # No default, deliberately. An insert has to say which, so nobody becomes an administrator by
  # omission and nobody is quietly demoted to member by one either
  role: OrganizationRole!
  createdAt: Timestamp! @default(expr: "request.time")
  # Written when the role changes, which is the only thing about a membership that can change
  updatedAt: Timestamp! @default(expr: "request.time")
}
