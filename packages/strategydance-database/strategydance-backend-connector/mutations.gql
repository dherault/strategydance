        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  )
    @check(expr: "this == 1", message: "The run is no longer this worker's")
    @check(
      expr: "vars.toBlock > vars.fromBlock && size(vars.questionPrompt) <= 1000 && size(vars.questionOptions) >= 2 && size(vars.questionOptions) <= 6 && vars.questionOptions.all(option, size(option) <= 200)"
      message: "A question is drawn from its call, with a prompt of at most 1000 characters and 2 to 6 options of at most 200"
