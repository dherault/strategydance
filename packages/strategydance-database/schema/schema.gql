# How somebody proves who they are. An enum rather than a string, so Postgres refuses a value
# this app never defined and the generated SDK types it as a union rather than as `string[]`
enum AuthenticationProvider {
  PASSWORD
  GOOGLE
}

# The reader's account, one row per Firebase Auth uid.
#
# Distinct from the Firebase account itself, which the SDK holds and this table only mirrors:
# `email`, `displayName` and `imageUrl` are copies kept in step so a join can render somebody's
# name without a round trip to the auth service, which has no bulk read anyway.
type User @table {
  # `@default(expr: "auth.uid")` fills this in from the caller's token on insert and upsert, so
  # the key is never something a client chooses and nobody can write a row as somebody else
  id: String! @default(expr: "auth.uid")
  # Mandatory and unique, which is what lets the sign-in screen ask about an address before
  # anybody has signed in. Firebase is configured one account per email address, so two rows
  # sharing one would be a bug rather than a pair of accounts
  email: String! @unique
  displayName: String
  imageUrl: String
  # The language the account was created in, as a hint for anything sent to this reader rather
  # than rendered for them. Written once: the interface language is a preference the browser
  # holds, and an account page will own this one.
  #
  # A string rather than an enum, unlike `authenticationProviders` below: the set of locales is
  # already declared in `strategydance-core`, which is what the catalogues and the language
  # picker are built from, and a second copy here would be a second place to edit
  locale: String!
  # An IANA identifier, validated against `Intl` before it is sent. Unlike `locale` this is
  # observed rather than chosen, so the newest answer overwrites the stored one
  timezone: String
  # Which buttons this account can sign in with, so a screen can say so without asking Firebase
  # and getting an answer shaped by email enumeration protection
  authenticationProviders: [AuthenticationProvider!]!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}
