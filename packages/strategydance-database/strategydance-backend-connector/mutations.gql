# Invites somebody to an organization, from one of its administrators, and answers with the id
# the invitation's email carries.
#
# One address per call, which the backend makes once for each address in parallel: the generated
# Admin SDK cannot pass the `_Data` list `_insertMany` would need. Each call checks for itself
# that the inviter is an administrator, that the address belongs to no member, and that the team
# has room. The pair of organization and address is unique, so an address invited in the
# meantime fails its own call rather than being invited twice.
#
# A team holds at most 100 members and pending invitations together, `MAX_TEAM_SIZE` in
# strategydance-core. The first step takes the organization's row lock, so the calls for one
# organization run one after the other and each counts what the one before it committed: a
# batch, or two administrators inviting at once, cannot slip past the limit together
mutation CreateOrganizationInvitation($organizationId: UUID!, $userId: String!, $email: String!)
@auth(level: NO_ACCESS)
@transaction {
  organization_update(id: $organizationId, data: { updatedAt_expr: "request.time" }) @redact
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can invite people to it") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can invite people")
    }
    userOrganizations(where: { organizationId: { eq: $organizationId }, user: { email: { eq: $email } } }, limit: 1)
      @check(expr: "size(this) == 0", message: "The address belongs to a member already", optional: true) {
      userId
    }
    organization(id: $organizationId)
      @check(
        expr: "size(this.userOrganizations_on_organization) + size(this.organizationInvitations_on_organization) < 100"
        message: "The team is full"
      ) {
      userOrganizations_on_organization(limit: 100) {
        userId
      }
      organizationInvitations_on_organization(limit: 100) {
        id
      }
    }
  }
  organizationInvitation_insert(data: { organizationId: $organizationId, email: $email, invitedById: $userId })
  # Counted against the inviter's hourly allowance, `MAX_INVITATIONS_PER_HOUR` in the backend's
  # `createOrganizationInvitations`. Every sender's rows from before the hour it counts are pruned,
  # not the inviter's alone, so somebody who stops sending does not leave theirs behind
  sentInvitation_insert(data: { invitedById: $userId }) @redact
  sentInvitation_deleteMany(where: { createdAt: { lt_time: { now: true, sub: { hours: 1 } } } }) @redact
}

# Claims the account's welcome email for the request that makes it, and answers how many rows it
# claimed: 1 when this request may send it, 0 when it went out already, another request holds it,
# the account is more than a week old, or it has no row.
#
# A claim is a ten-minute lease rather than a flag. A request that sends completes it; one that
# fails, or dies with its process, leaves it to lapse, and the next request after that sends
# again. Ten minutes outlasts any request Cloud Run lets run, so a live claim never lapses under
# the request holding it.
#
# One conditional update rather than a read and a write, so two requests landing together cannot
# both find it free: Postgres re-checks the condition on the row the first one locked, and the
# second claims nothing. `$userId` is the uid the backend verified
mutation ClaimWelcomeEmail($userId: String!) @auth(level: NO_ACCESS) {
  user_updateMany(
    # One `_and`, because a filter cannot put `_or` beside plain fields
    where: {
      _and: [
        { id: { eq: $userId } }
        { welcomeEmailSentAt: { isNull: true } }
        # `WELCOME_EMAIL_WINDOW_DAYS` in strategydance-core: an older account is never welcomed
        { createdAt: { ge_time: { now: true, sub: { days: 7 } } } }
        {
          _or: [
            { welcomeEmailClaimedAt: { isNull: true } }
            { welcomeEmailClaimedAt: { lt_time: { now: true, sub: { minutes: 10 } } } }
          ]
        }
      ]
    }
    data: { welcomeEmailClaimedAt_expr: "request.time" }
  )
}

# Records that the welcome email went out, which ends the claim for good
mutation CompleteWelcomeEmail($userId: String!) @auth(level: NO_ACCESS) {
  user_update(key: { id: $userId }, data: { welcomeEmailSentAt_expr: "request.time" })
}

# Takes back an invitation whose email could not be sent, so the team page does not list an
# invitation nobody received and the address is free to invite again. `$organizationId` scopes the
# delete, and is what the team's live query refreshes on
mutation DeleteUnsentOrganizationInvitation($id: UUID!, $organizationId: UUID!) @auth(level: NO_ACCESS) {
  organizationInvitation_deleteMany(where: { id: { eq: $id }, organizationId: { eq: $organizationId } })
}

# Points an organization's logo and its thumbnail at the files the backend has just put in
# Storage, or clears them with null, for one of its administrators. Answers with the URLs it
# replaced, whose files the backend then deletes. The backend passes both, the thumbnail null for
# a logo sent without one, which clears the thumbnail the previous logo had.
#
# Data Connect runs one write per row in a mutation, a second one silently changing nothing, so
# there is no separate row lock here as elsewhere: the URL is read, then written, which takes the
# lock, then the administrator is checked, a failure rolling the write back. The read comes before
# the lock, so two uploads in the same instant can both read the URL the first replaces: the file
# the second wrote over is then named by neither answer and stays behind. That costs a file, never
# a row pointing at one that was deleted, since nothing is deleted that an answer did not name.
# Only the membership is redacted, since the URLs are the answer
mutation UpdateOrganizationLogo($organizationId: UUID!, $userId: String!, $logoUrl: String, $logoThumbnailUrl: String)
@auth(level: NO_ACCESS)
@transaction {
  previous: query {
    organization(id: $organizationId) {
      logoUrl
      logoThumbnailUrl
    }
  }
  organization_update(
    id: $organizationId
    data: { logoUrl: $logoUrl, logoThumbnailUrl: $logoThumbnailUrl, updatedAt_expr: "request.time" }
  )
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its logo") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can change an organization's logo")
    }
  }
}

# The banner's twin of `UpdateOrganizationLogo`, on the same terms, with no thumbnail
mutation UpdateOrganizationBanner($organizationId: UUID!, $userId: String!, $bannerUrl: String)
@auth(level: NO_ACCESS)
@transaction {
  previous: query {
    organization(id: $organizationId) {
      bannerUrl
    }
  }
  organization_update(id: $organizationId, data: { bannerUrl: $bannerUrl, updatedAt_expr: "request.time" })
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its banner") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can change an organization's banner")
    }
  }
}

# Deletes an organization, for one of its administrators. Its memberships and pending invitations
# go with it, and so does everything its members keep in it on their Today pages, checklists and
# log entries, the tasks on its board, and its knowledge: all of them reference it as required, which Data
# Connect cascades. Its files are the
# backend's, which sweeps them before running this, so a failed sweep leaves the organization to
# delete again, and once more after, for an upload that raced it (`deleteOrganization`).
#
# The lock is the caller's own membership rather than the organization's row, as elsewhere an
# administrator acts: Data Connect runs one write per row in a mutation, so a delete after an
# `organization_update` would find nothing. Demoting or removing the caller writes their
# membership too: one that has written it commits before the check below reads the member it
# left, and one that comes after this delete finds nothing. Those take the organization's row
# first, though, the opposite order, so the two landing in the same instant deadlock, and
# Postgres fails one of the two requests, leaving the other's outcome whole. A consistent order
# would take a second write to one row, which Data Connect skips. The membership goes with the
# organization anyway, so touching it costs nothing.
#
# `$organizationId` is also what every live query scoped to an organization refreshes on, the
# team, the log, knowledge and conversations among them, so a member watching any of them sees it
# go
mutation DeleteOrganization($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) @transaction {
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  ) @redact
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can delete it") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can delete an organization")
    }
  }
  organization_delete(id: $organizationId) @check(expr: "this != null", message: "The organization is gone")
}

# Starts a conversation with its first message, for its author: the conversation, its first run,
# queued, the message, which names that run, and the transcript's first entry, in one mutation, so a
# conversation exists only once something was sent, and whole. The ids are the browser's, the
# conversation's and the message's, so a send retried after this went through finds them, and the
# run's is the backend's.
#
# The first step writes the caller's membership, which is the lock every start and every restore
# takes (see `RestoreConversation`), so the counts after it see what the ones before committed:
# somebody keeps at most 1000 conversations in an organization (`MAX_CONVERSATIONS` in
# strategydance-core), and has at most 3 runs in flight there (`MAX_ACTIVE_RUNS_PER_MEMBER`), dead
# ones included, which the backend finalizes before it sends. The membership has to be the one the
# backend read, whose `createdAt` the run records. Subagents count toward neither: they are the
# agent's, launched and run apart from what the member starts.
#
# Conversations deleted over a day ago are left to the daily sweep, which claims them first and
# deletes what they keep beside their rows, their module call results among them.
#
# `$aspects` are the ones the member picked on the draft, written as the member's with
# `$aspectsSetBy` `MEMBER`, so the agent leaves them alone. Both are omitted when the member picked
# none, which leaves the conversation for the agent to tag after its first exchange. Optional, so a
# backend from before M23 still starts one.
#
# `$userId` is the uid the backend verified. `$conversationId` and `$organizationId` are what the
# conversation's live queries refresh on#
# `$attachmentIds` are the files the message sends, at most 10 (`MAX_CONVERSATION_ATTACHMENTS_PER_MESSAGE`
# in strategydance-core), which the backend always passes, empty for a message without files.
# Optional, so a backend from before M25 still sends.
mutation StartConversation(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $membershipCreatedAt: Timestamp!
  $title: String!
  $messageId: UUID!
  $text: String!
  $preview: Any!
  $runId: UUID!
  $content: String!
  $aspects: [CompanyAspect!]
  $aspectsSetBy: ConversationActor
  $attachmentIds: [UUID!]
) @auth(level: NO_ACCESS) @transaction {
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this != null", message: "Only a member of an organization can keep conversations in it")
    @check(
      expr: "size(vars.title) <= 120 && size(vars.text) <= 20000"
      message: "A conversation's title holds at most 120 characters, and a message 20000"
    )
    @check(
      expr: "(!has(vars.aspects) || vars.aspects == null) ? (!has(vars.aspectsSetBy) || vars.aspectsSetBy == null) : (has(vars.aspectsSetBy) && vars.aspectsSetBy == 'MEMBER' && vars.aspects.all(aspect, vars.aspects.exists_one(other, other == aspect)))"
      message: "A conversation starts with the aspects its member picked, each at most once, or with none"
    )
    @check(
      expr: "!has(vars.attachmentIds) || vars.attachmentIds == null || size(vars.attachmentIds) <= 10"
      message: "A message sends at most 10 files"
    )
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The membership changed since the send read it") {
      userId
    }
    existing: conversations(where: { id: { eq: $conversationId } }, limit: 1)
      @check(expr: "size(this) == 0", message: "The conversation exists already") {
      id
    }
    sent: conversationMessages(where: { id: { eq: $messageId } }, limit: 1)
      @check(expr: "size(this) == 0", message: "The message was sent already") {
      id
    }
    kept: conversations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        parentId: { isNull: true }
      }
      limit: 1000
    ) @check(expr: "size(this) < 1000", message: "Somebody keeps at most 1000 conversations in an organization") {
      id
    }
    inFlight: conversationRuns(
      where: {
        status: { in: [QUEUED, RUNNING] }
        conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: true } }
      }
      limit: 3
    ) @check(expr: "size(this) < 3", message: "Somebody has at most 3 runs in flight in an organization") {
      id
    }
  }
  conversation_insert(
    data: {
      id: $conversationId
      userId: $userId
      organizationId: $organizationId
      title: $title
      aspects: $aspects
      aspectsSetBy: $aspectsSetBy
      activeRunId: $runId
      preview: $preview
      previewMessageId: $messageId
      nextRunNumber: 1
      nextMessagePosition: 1
      messageCount: 1
    }
  )
  # Twenty minutes out, which in a queued run only says when to ask whether it is still coming
  conversationRun_insert(
    data: {
      id: $runId
      conversationId: $conversationId
      number: 0
      trigger: MESSAGE
      status: QUEUED
      membershipCreatedAt: $membershipCreatedAt
      anchorPosition: 0
      leaseExpiresAt_time: { now: true, add: { minutes: 20 } }
    }
  )
  conversationMessage_insert(
    data: {
      id: $messageId
      conversationId: $conversationId
      runId: $runId
      kind: MEMBER_TEXT
      text: $text
      position: 0
    }
  )
  conversationTranscriptEntry_insert(
    data: { conversationId: $conversationId, runId: $runId, position: 0, role: USER, content: $content }
  )
  # The files the message sends, the caller's in this conversation, stored and not sent yet, each set
  # to this message once. Exactly those named, so a file a prune claimed or another send took since
  # the backend read them refuses the send. A backend from before M25 names none, and a message of
  # its sends none
  conversationAttachment_updateMany(
    where: {
      id: { in: $attachmentIds }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      conversationId: { eq: $conversationId }
      status: { eq: READY }
      messageId: { isNull: true }
    }
    data: { messageId: $messageId }
  )
    @check(
      expr: "(!has(vars.attachmentIds) || vars.attachmentIds == null) ? this == 0 : this == size(vars.attachmentIds)"
      message: "The message's files changed since the send read them"
    )
}

# Sends a message to one of the caller's conversations and queues the run that answers it: the
# message, which names that run, and its transcript entry, after the last.
#
# The membership lock and the counts are `StartConversation`'s. Then the conversation's row, written
# once, is the guard: it takes the message only while it is not deleted, has no run in flight, is
# not full, holds fewer than 2000 messages (`MAX_CONVERSATION_MESSAGES` in strategydance-core), and
# still has the counters the backend read, which it moves on, the message's position and the run's
# number. A run or an aspects note that got there first moved them, and the backend reads again#
# `$attachmentIds` are the files the message sends, at most 10 (`MAX_CONVERSATION_ATTACHMENTS_PER_MESSAGE`
# in strategydance-core), which the backend always passes, empty for a message without files.
# Optional, so a backend from before M25 still sends.
mutation SendConversationMessage(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $membershipCreatedAt: Timestamp!
  $messageId: UUID!
  $text: String!
  $preview: Any!
  $position: Int!
  $runId: UUID!
  $runNumber: Int!
  $content: String!
  $transcriptPosition: Int!
  $attachmentIds: [UUID!]
) @auth(level: NO_ACCESS) @transaction {
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this != null", message: "Only a member of an organization can keep conversations in it")
    @check(expr: "size(vars.text) <= 20000", message: "A message holds at most 20000 characters")
    @check(
      expr: "!has(vars.attachmentIds) || vars.attachmentIds == null || size(vars.attachmentIds) <= 10"
      message: "A message sends at most 10 files"
    )
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The membership changed since the send read it") {
      userId
    }
    sent: conversationMessages(where: { id: { eq: $messageId } }, limit: 1)
      @check(expr: "size(this) == 0", message: "The message was sent already") {
      id
    }
    inFlight: conversationRuns(
      where: {
        status: { in: [QUEUED, RUNNING] }
        conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: true } }
      }
      limit: 3
    ) @check(expr: "size(this) < 3", message: "Somebody has at most 3 runs in flight in an organization") {
      id
    }
  }
  conversation_updateMany(
    where: {
      id: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      parentId: { isNull: true }
      activeRunId: { isNull: true }
      isFull: { eq: false }
      messageCount: { lt: 2000 }
      nextMessagePosition: { eq: $position }
      nextRunNumber: { eq: $runNumber }
    }
    data: {
      activeRunId: $runId
      preview: $preview
      previewMessageId: $messageId
      nextMessagePosition_update: { inc: 1 }
      nextRunNumber_update: { inc: 1 }
      messageCount_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not take the message")
  conversationRun_insert(
    data: {
      id: $runId
      conversationId: $conversationId
      number: $runNumber
      trigger: MESSAGE
      status: QUEUED
      membershipCreatedAt: $membershipCreatedAt
      anchorPosition: $transcriptPosition
      leaseExpiresAt_time: { now: true, add: { minutes: 20 } }
    }
  )
  conversationMessage_insert(
    data: {
      id: $messageId
      conversationId: $conversationId
      runId: $runId
      kind: MEMBER_TEXT
      text: $text
      position: $position
    }
  )
  conversationTranscriptEntry_insert(
    data: {
      conversationId: $conversationId
      runId: $runId
      position: $transcriptPosition
      role: USER
      content: $content
    }
  )
  # The files the message sends, the caller's in this conversation, stored and not sent yet, each set
  # to this message once. Exactly those named, so a file a prune claimed or another send took since
  # the backend read them refuses the send. A backend from before M25 names none, and a message of
  # its sends none
  conversationAttachment_updateMany(
    where: {
      id: { in: $attachmentIds }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      conversationId: { eq: $conversationId }
      status: { eq: READY }
      messageId: { isNull: true }
    }
    data: { messageId: $messageId }
  )
    @check(
      expr: "(!has(vars.attachmentIds) || vars.attachmentIds == null) ? this == 0 : this == size(vars.attachmentIds)"
      message: "The message's files changed since the send read them"
    )
}

# Sends a message to one of the caller's conversations whose last turn left calls open, a question
# waiting or calls a stop or a crash kept from running, and queues the run that answers it: the
# message's transcript entry answers those calls first, as the backend built it. As
# `SendConversationMessage`, and besides:
#
# - the last run, when it waits for an answer (`$isLastRunWaiting`), moves from `WAITING` to
#   `CONTINUED`, so a continuation an answer started meanwhile and this send never both consume
#   its turn, and a run that does not wait is left as it is
# - the questions still waiting are skipped, exactly those the backend read as waiting
#   (`$skippedQuestionIds`), so an answer recorded since it read them refuses the send, which reads
#   again rather than tell Claude a question answered was skipped, and so are the calls waiting for
#   the member's approval, denied (`$deniedApprovalIds`), and those allowed that never ran, answered
#   as not run (`$closedApprovalIds`)
# - the conversation waits for no answer any more
#
# Its files are associated as `SendConversationMessage`'s are
mutation SendConversationMessageAnsweringCalls(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $membershipCreatedAt: Timestamp!
  $messageId: UUID!
  $text: String!
  $preview: Any!
  $position: Int!
  $runId: UUID!
  $runNumber: Int!
  $content: String!
  $transcriptPosition: Int!
  $lastRunId: UUID!
  $isLastRunWaiting: Boolean!
  $skippedQuestionIds: [UUID!]!
  $attachmentIds: [UUID!]
  $deniedApprovalIds: [UUID!]
  $deniedApprovalOutput: String
  $closedApprovalIds: [UUID!]
  $closedApprovalOutput: String
) @auth(level: NO_ACCESS) @transaction {
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this != null", message: "Only a member of an organization can keep conversations in it")
    @check(expr: "size(vars.text) <= 20000", message: "A message holds at most 20000 characters")
    @check(
      expr: "!has(vars.attachmentIds) || vars.attachmentIds == null || size(vars.attachmentIds) <= 10"
      message: "A message sends at most 10 files"
    )
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The membership changed since the send read it") {
      userId
    }
    sent: conversationMessages(where: { id: { eq: $messageId } }, limit: 1)
      @check(expr: "size(this) == 0", message: "The message was sent already") {
      id
    }
    inFlight: conversationRuns(
      where: {
        status: { in: [QUEUED, RUNNING] }
        conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: true } }
      }
      limit: 3
    ) @check(expr: "size(this) < 3", message: "Somebody has at most 3 runs in flight in an organization") {
      id
    }
  }
  conversation_updateMany(
    where: {
      id: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      parentId: { isNull: true }
      activeRunId: { isNull: true }
      isFull: { eq: false }
      messageCount: { lt: 2000 }
      nextMessagePosition: { eq: $position }
      nextRunNumber: { eq: $runNumber }
    }
    data: {
      activeRunId: $runId
      isAwaitingAnswer: false
      preview: $preview
      previewMessageId: $messageId
      nextMessagePosition_update: { inc: 1 }
      nextRunNumber_update: { inc: 1 }
      messageCount_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not take the message")
  conversationRun_updateMany(
    where: {
      id: { eq: $lastRunId }
      status: { eq: WAITING }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    data: { status: CONTINUED }
  ) @check(expr: "this == (vars.isLastRunWaiting ? 1 : 0)", message: "The last run no longer waits as the send read it")
  conversationMessage_updateMany(
    where: {
      id: { in: $skippedQuestionIds }
      conversationId: { eq: $conversationId }
      kind: { eq: QUESTION }
      answeredAt: { isNull: true }
    }
    data: { isAnswerSkipped: true, answeredAt_expr: "request.time" }
  ) @check(expr: "this == size(vars.skippedQuestionIds)", message: "The questions changed since the send read them")
  # The calls still waiting for the member's approval, which the message denies, and those they
  # allowed that never ran, which it answers as not run, exactly those the backend read so. A backend
  # from before M29 names none: a conversation with any is refused it, rather than left with calls
  # nothing answers
  deniedApprovals: conversationMessage_updateMany(
    where: {
      id: { in: $deniedApprovalIds }
      conversationId: { eq: $conversationId }
      kind: { eq: APPROVAL }
      approvalState: { eq: PENDING }
      answeredAt: { isNull: true }
    }
    data: {
      approvalState: DENIED
      toolStatus: FAILED
      toolOutput: $deniedApprovalOutput
      answeredAt_expr: "request.time"
    }
  )
    @check(
      expr: "(!has(vars.deniedApprovalIds) || vars.deniedApprovalIds == null) ? this == 0 : this == size(vars.deniedApprovalIds)"
      message: "The calls waiting for approval changed since the send read them"
    )
  closedApprovals: conversationMessage_updateMany(
    where: {
      id: { in: $closedApprovalIds }
      conversationId: { eq: $conversationId }
      kind: { eq: APPROVAL }
      approvalState: { eq: ALLOWED }
      toolStatus: { isNull: true }
    }
    data: { toolStatus: FAILED, toolOutput: $closedApprovalOutput }
  )
    @check(
      expr: "(!has(vars.closedApprovalIds) || vars.closedApprovalIds == null) ? this == 0 : this == size(vars.closedApprovalIds)"
      message: "The calls allowed changed since the send read them"
    )
  conversationRun_insert(
    data: {
      id: $runId
      conversationId: $conversationId
      number: $runNumber
      trigger: MESSAGE
      status: QUEUED
      membershipCreatedAt: $membershipCreatedAt
      anchorPosition: $transcriptPosition
      leaseExpiresAt_time: { now: true, add: { minutes: 20 } }
    }
  )
  conversationMessage_insert(
    data: {
      id: $messageId
      conversationId: $conversationId
      runId: $runId
      kind: MEMBER_TEXT
      text: $text
      position: $position
    }
  )
  conversationTranscriptEntry_insert(
    data: {
      conversationId: $conversationId
      runId: $runId
      position: $transcriptPosition
      role: USER
      content: $content
    }
  )
  # The files the message sends, the caller's in this conversation, stored and not sent yet, each set
  # to this message once. Exactly those named, so a file a prune claimed or another send took since
  # the backend read them refuses the send. A backend from before M25 names none, and a message of
  # its sends none
  conversationAttachment_updateMany(
    where: {
      id: { in: $attachmentIds }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      conversationId: { eq: $conversationId }
      status: { eq: READY }
      messageId: { isNull: true }
    }
    data: { messageId: $messageId }
  )
    @check(
      expr: "(!has(vars.attachmentIds) || vars.attachmentIds == null) ? this == 0 : this == size(vars.attachmentIds)"
      message: "The message's files changed since the send read them"
    )
}

# Records the member's answer to a question of the turn their conversation waits on, and answers
# with the questions of that turn still waiting, which the backend continues the conversation once
# none are. Answers are serialized on the conversation, so two sent at once never both see the
# other missing:
#
# - the conversation's row is locked first, only while it is the caller's, not deleted, waits for an
#   answer, and its preview still shows the message the backend read (`$previewMessageId`, always
#   passed). `$preview` rebuilds it, given only when that message is the question answered, so the
#   list's "Question: …" turns into "Answered: …" for the last question shown, and stays for an
#   earlier one
# - the run the backend read waits still
# - the question is answered, only while it waits, its options by their text and its own words on
#   one line, as the backend checked them against it
# - the other questions of the turn still waiting are read, after the lock, with its calls still
#   waiting for the member's approval, so an answer another request recorded first is seen. A step
#   reading what its own mutation wrote does not see it, so the question answered is left out by its
#   id rather than by its answer
#
# The answer goes into the transcript as it is recorded, so it is bounded here too
mutation AnswerConversationQuestion(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $messageId: UUID!
  $previewMessageId: UUID!
  $preview: Any
  $answerSelected: [String!]!
  $answerOther: String
) @auth(level: NO_ACCESS) @transaction {
  conversation_updateMany(
    where: {
      id: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      parentId: { isNull: true }
      isAwaitingAnswer: { eq: true }
      previewMessageId: { eq: $previewMessageId }
    }
    data: { preview: $preview, updatedAt_expr: "request.time" }
  )
    @check(expr: "this == 1", message: "The conversation waits for no answer, or its preview moved")
    @check(
      expr: "size(vars.answerSelected) <= 6 && (!has(vars.answerOther) || vars.answerOther == null || size(vars.answerOther) <= 500) && (size(vars.answerSelected) > 0 || (has(vars.answerOther) && vars.answerOther != null))"
      message: "An answer chooses at most 6 options, or says something in at most 500 characters"
    )
  query @redact {
    waiting: conversationRuns(
      where: {
        id: { eq: $runId }
        status: { eq: WAITING }
        conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The run no longer waits for an answer") {
      id
    }
  }
  conversationMessage_updateMany(
    where: {
      id: { eq: $messageId }
      conversationId: { eq: $conversationId }
      kind: { eq: QUESTION }
      answeredAt: { isNull: true }
    }
    data: { answerSelected: $answerSelected, answerOther: $answerOther, answeredAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "The question waits no more")
  left: query {
    conversationMessages(
      where: {
        id: { ne: $messageId }
        conversationId: { eq: $conversationId }
        kind: { in: [QUESTION, APPROVAL] }
        answeredAt: { isNull: true }
      }
      limit: 1000
    ) {
      id
    }
  }
}

# Records the member's decision on a call of the turn their conversation waits on, which waits for
# their approval, and answers with what of that turn still waits, as `AnswerConversationQuestion`
# records an answer and serialized with it on the conversation's row:
#
# - the conversation's row is locked first, only while it is the caller's, not deleted, waits for an
#   answer, and its preview still shows the message the backend read. `$preview` rebuilds it, given
#   only when that message is the approval decided
# - the run the backend read waits still
# - the approval is decided, only while it waits: allowed, its call left to the run that carries the
#   conversation on, or denied, answered as failed with `$toolOutput`, which says why, the member's
#   Deny or the server having changed since the call was proposed, which the backend checked
# - the questions and approvals of the turn still waiting are read, after the lock, the one decided
#   left out by its id
mutation AnswerConversationApproval(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $messageId: UUID!
  $previewMessageId: UUID!
  $preview: Any
  $approvalState: ConversationApprovalState!
  $toolStatus: ConversationToolStatus
  $toolOutput: String
) @auth(level: NO_ACCESS) @transaction {
  conversation_updateMany(
    where: {
      id: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      parentId: { isNull: true }
      isAwaitingAnswer: { eq: true }
      previewMessageId: { eq: $previewMessageId }
    }
    data: { preview: $preview, updatedAt_expr: "request.time" }
  )
    @check(expr: "this == 1", message: "The conversation waits for no answer, or its preview moved")
    @check(
      expr: "(vars.approvalState == 'ALLOWED' && (!has(vars.toolStatus) || vars.toolStatus == null) && (!has(vars.toolOutput) || vars.toolOutput == null)) || (vars.approvalState == 'DENIED' && has(vars.toolStatus) && vars.toolStatus == 'FAILED' && has(vars.toolOutput) && vars.toolOutput != null)"
      message: "An approval is allowed, its call left to run, or denied, failed with why"
    )
  query @redact {
    waiting: conversationRuns(
      where: {
        id: { eq: $runId }
        status: { eq: WAITING }
        conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The run no longer waits for an answer") {
      id
    }
  }
  conversationMessage_updateMany(
    where: {
      id: { eq: $messageId }
      conversationId: { eq: $conversationId }
      kind: { eq: APPROVAL }
      approvalState: { eq: PENDING }
      answeredAt: { isNull: true }
    }
    data: {
      approvalState: $approvalState
      toolStatus: $toolStatus
      toolOutput: $toolOutput
      answeredAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The approval waits no more")
  left: query {
    conversationMessages(
      where: {
        id: { ne: $messageId }
        conversationId: { eq: $conversationId }
        kind: { in: [QUESTION, APPROVAL] }
        answeredAt: { isNull: true }
      }
      limit: 1000
    ) {
      id
    }
  }
}

# Carries a conversation on once every question of the turn it waits on is answered: the answers,
# with the results of the calls that ran beside them, go into the transcript as the backend built
# them, and a run answers them, as a send starts one. Reached from the answer route, the same answer
# sent again, and the reconcile route, so a backend that stopped between the last answer and this
# leaves nothing behind. In one mutation:
#
# - the caller's membership row is locked, as a send locks it, and they hold fewer than 3 runs in
#   flight in the organization: past them the continuation starts later, from the reconcile route
# - no question waits any more, nor any call for the member's approval, and no call they allowed
#   waits to run
# - the waiting run moves from `WAITING` to `CONTINUED`, which a send consuming the turn also does,
#   so only one of them carries it on, and a late one finds nothing to consume
# - the conversation takes the run and waits for no answer any more. A full one too: the run then
#   ends at once with the full note, which is how a question waiting there is still answered
# - the run is inserted, queued with a twenty minutes' lease and anchored on the answers' entry,
#   then the entry
mutation ContinueConversationRun(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $membershipCreatedAt: Timestamp!
  $waitingRunId: UUID!
  $runId: UUID!
  $runNumber: Int!
  $content: String!
  $transcriptPosition: Int!
) @auth(level: NO_ACCESS) @transaction {
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  ) @redact @check(expr: "this != null", message: "Only a member of an organization can keep conversations in it")
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The membership changed since the continuation read it") {
      userId
    }
    inFlight: conversationRuns(
      where: {
        status: { in: [QUEUED, RUNNING] }
        conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: true } }
      }
      limit: 3
    ) @check(expr: "size(this) < 3", message: "Somebody has at most 3 runs in flight in an organization") {
      id
    }
    waitingQuestions: conversationMessages(
      where: {
        conversationId: { eq: $conversationId }
        kind: { in: [QUESTION, APPROVAL] }
        answeredAt: { isNull: true }
      }
      limit: 1
    ) @check(expr: "size(this) == 0", message: "A question of the turn still waits") {
      id
    }
    # A call the member allowed has not run, so nothing can answer it yet: its run carries the turn
    # on through `ContinueConversationRunWithCalls`
    allowedCalls: conversationMessages(
      where: {
        conversationId: { eq: $conversationId }
        kind: { eq: APPROVAL }
        approvalState: { eq: ALLOWED }
        toolStatus: { isNull: true }
      }
      limit: 1
    ) @check(expr: "size(this) == 0", message: "A call the member allowed waits to run") {
      id
    }
  }
  conversationRun_updateMany(
    where: {
      id: { eq: $waitingRunId }
      status: { eq: WAITING }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    data: { status: CONTINUED }
  ) @check(expr: "this == 1", message: "The run's turn was consumed already")
  conversation_updateMany(
    where: {
      id: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      parentId: { isNull: true }
      activeRunId: { isNull: true }
      nextRunNumber: { eq: $runNumber }
    }
    data: {
      activeRunId: $runId
      isAwaitingAnswer: false
      nextRunNumber_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not take the run")
  conversationRun_insert(
    data: {
      id: $runId
      conversationId: $conversationId
      number: $runNumber
      trigger: ANSWER
      status: QUEUED
      membershipCreatedAt: $membershipCreatedAt
      anchorPosition: $transcriptPosition
      leaseExpiresAt_time: { now: true, add: { minutes: 20 } }
    }
  )
  conversationTranscriptEntry_insert(
    data: {
      conversationId: $conversationId
      runId: $runId
      position: $transcriptPosition
      role: USER
      content: $content
    }
  )
}

# Carries a conversation on once every question and approval of the turn it waits on is answered,
# as `ContinueConversationRun` does, when the member allowed a call of it: the call has not run, so
# nothing can answer the turn yet. The run starts with no entry, anchored where the waiting run was
# (`$anchorPosition`) and with the results of its calls that finished (`$pendingToolResults`), as a
# resumed run carries on the run it resumes, so its worker makes the calls allowed before it stores
# the entry that answers the turn, and anchors itself there. In one mutation, besides what
# `ContinueConversationRun` checks and writes:
#
# - the calls of the turn a stop or the run's time kept from running, which a resumed run would make,
#   are answered as stopped, `$stoppedCallIds`, failed with `$stoppedCallOutput`, exactly those named
mutation ContinueConversationRunWithCalls(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $membershipCreatedAt: Timestamp!
  $waitingRunId: UUID!
  $runId: UUID!
  $runNumber: Int!
  $anchorPosition: Int!
  $pendingToolResults: String
  $stoppedCallIds: [UUID!]!
  $stoppedCallOutput: String!
) @auth(level: NO_ACCESS) @transaction {
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  ) @redact @check(expr: "this != null", message: "Only a member of an organization can keep conversations in it")
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The membership changed since the continuation read it") {
      userId
    }
    inFlight: conversationRuns(
      where: {
        status: { in: [QUEUED, RUNNING] }
        conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: true } }
      }
      limit: 3
    ) @check(expr: "size(this) < 3", message: "Somebody has at most 3 runs in flight in an organization") {
      id
    }
    waitingQuestions: conversationMessages(
      where: {
        conversationId: { eq: $conversationId }
        kind: { in: [QUESTION, APPROVAL] }
        answeredAt: { isNull: true }
      }
      limit: 1
    ) @check(expr: "size(this) == 0", message: "A question of the turn still waits") {
      id
    }
  }
  conversationRun_updateMany(
    where: {
      id: { eq: $waitingRunId }
      status: { eq: WAITING }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    data: { status: CONTINUED }
  ) @check(expr: "this == 1", message: "The run's turn was consumed already")
  conversation_updateMany(
    where: {
      id: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      parentId: { isNull: true }
      activeRunId: { isNull: true }
      nextRunNumber: { eq: $runNumber }
    }
    data: {
      activeRunId: $runId
      isAwaitingAnswer: false
      nextRunNumber_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not take the run")
  conversationMessage_updateMany(
    where: {
      id: { in: $stoppedCallIds }
      conversationId: { eq: $conversationId }
      kind: { eq: TOOL_CALL }
      toolStatus: { eq: CANCELLED }
      toolStartedAt: { isNull: true }
    }
    data: { toolStatus: FAILED, toolOutput: $stoppedCallOutput }
  )
    @check(
      expr: "this == size(vars.stoppedCallIds)"
      message: "The turn's calls changed since the continuation read them"
    )
  conversationRun_insert(
    data: {
      id: $runId
      conversationId: $conversationId
      number: $runNumber
      trigger: ANSWER
      status: QUEUED
      membershipCreatedAt: $membershipCreatedAt
      anchorPosition: $anchorPosition
      pendingToolResults: $pendingToolResults
      leaseExpiresAt_time: { now: true, add: { minutes: 20 } }
    }
  )
}

# Finalizes a run that died with its worker, which a route finds past its lease: queued and never
# claimed in time, or claimed by a worker that stopped renewing. It ends `INTERRUPTED`, its calls
# still running are cancelled, and the thread says so in a note, at a position claimed on the
# conversation's counter, and `$failure` says why, for the logs. Only while the run is still dead,
# so a worker that renewed its lease in the meantime keeps it.
#
# The conversation's row is written once: it takes the note and lets go of the run, which it names.
# Or which it names no longer, which can only be a run something else let go of, and the note is
# still right. A deleted conversation is finalized too, so it is not stuck busy once restored.
#
# `$conversationId` is the run's own, which its page's live queries refresh on
mutation InterruptDeadConversationRun(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $noteId: UUID!
  $position: Int!
  $preview: Any!
  $failure: String
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { in: [QUEUED, RUNNING] }
      leaseExpiresAt: { lt_time: { now: true } }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        parentId: { isNull: true }
      }
    }
    data: { status: INTERRUPTED, failure: $failure, endedAt_expr: "request.time", leaseExpiresAt: null }
  ) @check(expr: "this == 1", message: "The run is not dead")
  conversationMessage_updateMany(
    where: { conversationId: { eq: $conversationId }, kind: { in: [TOOL_CALL, APPROVAL] }, toolStatus: { eq: RUNNING } }
    data: { toolStatus: CANCELLED }
  )
  conversation_updateMany(
    # One `_and`, because a filter cannot put `_or` beside plain fields
    where: {
      _and: [
        { id: { eq: $conversationId } }
        { nextMessagePosition: { eq: $position } }
        { _or: [{ activeRunId: { eq: $runId } }, { activeRunId: { isNull: true } }] }
      ]
    }
    data: {
      activeRunId: null
      preview: $preview
      previewMessageId: $noteId
      nextMessagePosition_update: { inc: 1 }
      messageCount_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not take the note at that position")
  conversationMessage_insert(
    data: {
      id: $noteId
      conversationId: $conversationId
      runId: $runId
      kind: NOTE
      noteKind: INTERRUPTED
      position: $position
    }
  )
}

# Pushes a queued run's lease twenty minutes out again, once the backend has seen its task still in
# Cloud Tasks' queue: a queued run's lease only says when to ask the queue whether the run is still
# coming, and a backlog can outlast it. Only while the run is still queued, in the caller's
# conversation. One conditional update and no transaction, and the backend reads whether it moved
# the lease.
#
# `$conversationId` is the run's own, which its page's live run refreshes on, so the page waits for
# the new lease before it asks again
mutation RenewQueuedConversationRunLease(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
) @auth(level: NO_ACCESS) {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: QUEUED }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    data: { leaseExpiresAt_time: { now: true, add: { minutes: 20 } } }
  )
}

# Brings a queued run's lease in to now, when the backend could not queue its task, so its page asks
# the backend to reconcile it at once rather than twenty minutes later: the reconcile queues the task
# again while the run is young, and the member is not left waiting on a run nothing will deliver.
# Only while the run is still queued, in the caller's conversation.
#
# `$conversationId` is the run's own, which its page's live run refreshes on
mutation ExpireQueuedConversationRunLease(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
) @auth(level: NO_ACCESS) {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: QUEUED }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    data: { leaseExpiresAt_expr: "request.time" }
  )
}

# Asks a claimed run to stop, as its member did: its worker reads `stopRequestedAt` before each
# request and every two seconds while one streams, then ends the run `STOPPED` with its note. Only
# while the run is running and not asked already, in the caller's conversation. One conditional
# update and no transaction, and the backend reads whether it asked.
#
# `$conversationId` is the run's own, which its page's live run refreshes on, so every tab shows it
# stopping
mutation RequestConversationRunStop($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $runId: UUID!)
@auth(level: NO_ACCESS) {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      stopRequestedAt: { isNull: true }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        parentId: { isNull: true }
      }
    }
    data: { stopRequestedAt_expr: "request.time" }
  )
}

# Stops a run still waiting in the queue, as its member asked, at once rather than when a worker
# claims it, so they can send again straight away: it ends `STOPPED` with its note, at a position
# claimed on the conversation's counter, and a task delivered later finds it ended and does
# nothing. Only while the run is still queued, so one a worker claimed meanwhile is asked to stop
# instead.
#
# The conversation's row is written once, as `InterruptDeadConversationRun` writes it
mutation StopQueuedConversationRun(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $noteId: UUID!
  $position: Int!
  $preview: Any!
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: QUEUED }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        parentId: { isNull: true }
      }
    }
    data: {
      status: STOPPED
      failure: "Its member stopped it while it was queued"
      endedAt_expr: "request.time"
      leaseExpiresAt: null
    }
  ) @check(expr: "this == 1", message: "The run is no longer queued")
  conversation_updateMany(
    # One `_and`, because a filter cannot put `_or` beside plain fields
    where: {
      _and: [
        { id: { eq: $conversationId } }
        { nextMessagePosition: { eq: $position } }
        { _or: [{ activeRunId: { eq: $runId } }, { activeRunId: { isNull: true } }] }
      ]
    }
    data: {
      activeRunId: null
      preview: $preview
      previewMessageId: $noteId
      nextMessagePosition_update: { inc: 1 }
      messageCount_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not take the note at that position")
  conversationMessage_insert(
    data: {
      id: $noteId
      conversationId: $conversationId
      runId: $runId
      kind: NOTE
      noteKind: STOPPED
      position: $position
    }
  )
}

# Resumes a run its member stopped, or that died with its worker, from its note: the note goes,
# which is the thread's newest message, and a run starts on the anchor of the run it resumes, which
# carries that run's response on. In one mutation:
#
# - the caller's membership row is locked, as a send locks it, and they hold fewer than 3 runs in
#   flight in the organization
# - the resumed run is the conversation's latest, numbered right before the new one, and stopped or
#   interrupted
# - the conversation is idle, not deleted, its counter right after the note, and it takes the new
#   run, with one message fewer and the preview of the message before the note
# - the note is deleted
# - the run is inserted, queued with a twenty minutes' lease, as a send queues one, with the
#   results of the calls the resumed run's turn finished (`$pendingToolResults`), which it carries
#   on: it runs the others, and sends them all
#
# A resume sent again after its first try went through finds the conversation taken, and the
# backend answers with the run it started
mutation ResumeConversationRun(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $membershipCreatedAt: Timestamp!
  $resumedRunId: UUID!
  $resumedRunNumber: Int!
  $anchorPosition: Int!
  $noteId: UUID!
  $notePosition: Int!
  $nextMessagePosition: Int!
  $preview: Any
  $previewMessageId: UUID
  $runId: UUID!
  $runNumber: Int!
  $pendingToolResults: String
) @auth(level: NO_ACCESS) @transaction {
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this != null", message: "Only a member of an organization can keep conversations in it")
    @check(
      expr: "vars.runNumber == vars.resumedRunNumber + 1 && vars.nextMessagePosition == vars.notePosition + 1"
      message: "A run resumes the run right before it, from the newest message"
    )
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The membership changed since the resume read it") {
      userId
    }
    resumed: conversationRuns(
      where: {
        id: { eq: $resumedRunId }
        number: { eq: $resumedRunNumber }
        anchorPosition: { eq: $anchorPosition }
        status: { in: [STOPPED, INTERRUPTED] }
        conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "Only a stopped or interrupted run resumes") {
      id
    }
    inFlight: conversationRuns(
      where: {
        status: { in: [QUEUED, RUNNING] }
        conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: true } }
      }
      limit: 3
    ) @check(expr: "size(this) < 3", message: "Somebody has at most 3 runs in flight in an organization") {
      id
    }
  }
  conversation_updateMany(
    where: {
      id: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      parentId: { isNull: true }
      activeRunId: { isNull: true }
      nextRunNumber: { eq: $runNumber }
      nextMessagePosition: { eq: $nextMessagePosition }
    }
    data: {
      activeRunId: $runId
      preview: $preview
      previewMessageId: $previewMessageId
      nextRunNumber_update: { inc: 1 }
      messageCount_update: { dec: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not resume that run")
  conversationMessage_deleteMany(
    where: {
      id: { eq: $noteId }
      conversationId: { eq: $conversationId }
      runId: { eq: $resumedRunId }
      kind: { eq: NOTE }
      position: { eq: $notePosition }
    }
  ) @check(expr: "this == 1", message: "The run's note is not the newest message")
  conversationRun_insert(
    data: {
      id: $runId
      conversationId: $conversationId
      number: $runNumber
      trigger: RESUME
      status: QUEUED
      membershipCreatedAt: $membershipCreatedAt
      anchorPosition: $anchorPosition
      pendingToolResults: $pendingToolResults
      leaseExpiresAt_time: { now: true, add: { minutes: 20 } }
    }
  )
}

# Retries a run that stopped, failed, was refused or died with its worker: the transcript is cut
# back to the run's anchor, the member's entry it answers, its context message included, and every
# message the runs on that anchor drew is deleted, the run retried and those it resumed, never the
# member's message that started one, which names the run too. A run starts on that anchor, with a
# context message of its own. In one mutation:
#
# - the caller's membership row is locked, as a send locks it, and they hold fewer than 3 runs in
#   flight in the organization
# - the retried run is the conversation's latest, numbered right before the new one, and ended
#   with a note
# - the conversation is idle, not deleted, its history where the retry read it, and it takes the new
#   run, with as many messages fewer as are deleted, its history moved on so every page reads it
#   again, nothing unread, no longer full, and the preview of the newest message kept
# - the messages are deleted, exactly as many as the retry counted
# - the transcript after the anchor is deleted
# - the run is inserted, queued with a twenty minutes' lease, as a send queues one
#
# A retry sent again after its first try went through finds the conversation taken, and the backend
# answers with the run it started
mutation RetryConversationRun(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $membershipCreatedAt: Timestamp!
  $retriedRunId: UUID!
  $retriedRunNumber: Int!
  $anchorPosition: Int!
  $historyRevision: Int!
  $deletedCount: Int!
  $preview: Any
  $previewMessageId: UUID
  $runId: UUID!
  $runNumber: Int!
) @auth(level: NO_ACCESS) @transaction {
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this != null", message: "Only a member of an organization can keep conversations in it")
    @check(expr: "vars.runNumber == vars.retriedRunNumber + 1", message: "A run retries the run right before it")
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The membership changed since the retry read it") {
      userId
    }
    retried: conversationRuns(
      where: {
        id: { eq: $retriedRunId }
        number: { eq: $retriedRunNumber }
        anchorPosition: { eq: $anchorPosition }
        status: { in: [STOPPED, FAILED, REFUSED, INTERRUPTED] }
        conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "Only a run that ended with a note is retried") {
      id
    }
    inFlight: conversationRuns(
      where: {
        status: { in: [QUEUED, RUNNING] }
        conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: true } }
      }
      limit: 3
    ) @check(expr: "size(this) < 3", message: "Somebody has at most 3 runs in flight in an organization") {
      id
    }
  }
  conversation_updateMany(
    where: {
      id: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      parentId: { isNull: true }
      activeRunId: { isNull: true }
      nextRunNumber: { eq: $runNumber }
      historyRevision: { eq: $historyRevision }
    }
    data: {
      activeRunId: $runId
      preview: $preview
      previewMessageId: $previewMessageId
      unreadCount: 0
      isFull: false
      nextRunNumber_update: { inc: 1 }
      historyRevision_update: { inc: 1 }
      messageCount_update: { dec: $deletedCount }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not retry that run")
  conversationMessage_deleteMany(
    where: {
      conversationId: { eq: $conversationId }
      kind: { ne: MEMBER_TEXT }
      run: { anchorPosition: { eq: $anchorPosition } }
    }
  ) @check(expr: "this == vars.deletedCount", message: "The runs' messages changed since the retry read them")
  conversationTranscriptEntry_deleteMany(
    where: { conversationId: { eq: $conversationId }, position: { gt: $anchorPosition } }
  )
  conversationRun_insert(
    data: {
      id: $runId
      conversationId: $conversationId
      number: $runNumber
      trigger: RETRY
      status: QUEUED
      membershipCreatedAt: $membershipCreatedAt
      anchorPosition: $anchorPosition
      leaseExpiresAt_time: { now: true, add: { minutes: 20 } }
    }
  )
}

# Claims a queued run for the worker that runs it: `RUNNING`, a minute's lease, and one more
# attempt, which every later write of that worker matches, so a worker that lost the run writes
# nothing more. `$attempts` is the count the worker read, so of two workers claiming at once only
# one moves it. The author's membership has to be the one the run was queued under.
#
# One conditional update, as `ClaimWelcomeEmail` is, and no transaction: it claims 1 run or 0,
# and the backend reads which
mutation ClaimQueuedConversationRun(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
) @auth(level: NO_ACCESS) {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: QUEUED }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: {
      status: RUNNING
      attempts_update: { inc: 1 }
      leaseExpiresAt_time: { now: true, add: { seconds: 60 } }
      startedAt_expr: "request.time"
    }
  )
}

# Takes over a run whose worker stopped renewing its lease, a minute after its last write, with
# one more attempt, as claiming a queued run does. `startedAt` stays when the first worker claimed
# it
mutation ReclaimConversationRun(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
) @auth(level: NO_ACCESS) {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      leaseExpiresAt: { lt_time: { now: true } }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { attempts_update: { inc: 1 }, leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  )
}

# Renews a claimed run's lease for another minute, and writes the progress line the thinking
# indicator shows when there is a new one: an omitted `$step` leaves the one before. Before a
# request to Claude it also writes the run's context, built once, and its usage with the request
# reserved, each left as it was when omitted.
#
# This is the fence every write of a worker starts with: the run still `RUNNING`, at the attempt
# the worker claimed (`$attempts`, after its claim), and its author still the member it was queued
# under, so removing them, or a run claimed again, stops the worker at its next write. One
# conditional update and no transaction, and the backend reads whether it renewed
mutation RenewConversationRunLease(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $step: String
  $context: String
  $usage: Any
) @auth(level: NO_ACCESS) {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { step: $step, context: $context, usage: $usage, leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  )
}

# Stores a turn of the agent in the transcript, as the JSON text of exactly what it answered, after
# the last entry: a whole turn, or one part of a turn paused by `pause_turn`. Fenced as
# `RenewConversationRunLease` is, which renews the lease in the same write, and settles the
# request's usage there. The entry's id is the backend's, so the messages drawn from it can derive
# theirs
mutation StoreConversationTurn(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $entryId: UUID!
  $position: Int!
  $content: String!
  $usage: Any
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { usage: $usage, leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  ) @check(expr: "this == 1", message: "The run is no longer this worker's")
  conversationTranscriptEntry_insert(
    data: {
      id: $entryId
      conversationId: $conversationId
      runId: $runId
      position: $position
      role: ASSISTANT
      content: $content
    }
  )
}

# Stores a run's first turn with its context message, which every request of the run sent last
# until now: the `SYSTEM` entry, with the hash of its profile part, then the `ASSISTANT` entry, at
# consecutive positions, so the transcript never ends on a context message. Fenced and settling the
# request's usage as `StoreConversationTurn` does
mutation StoreConversationTurnWithContext(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $contextEntryId: UUID!
  $contextPosition: Int!
  $contextContent: String!
  $contextHash: String!
  $entryId: UUID!
  $position: Int!
  $content: String!
  $usage: Any
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { usage: $usage, leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  )
    @check(expr: "this == 1", message: "The run is no longer this worker's")
    @check(expr: "vars.position == vars.contextPosition + 1", message: "The reply follows its context")
  system: conversationTranscriptEntry_insert(
    data: {
      id: $contextEntryId
      conversationId: $conversationId
      runId: $runId
      position: $contextPosition
      role: SYSTEM
      content: $contextContent
      contextHash: $contextHash
    }
  )
  assistant: conversationTranscriptEntry_insert(
    data: {
      id: $entryId
      conversationId: $conversationId
      runId: $runId
      position: $position
      role: ASSISTANT
      content: $content
    }
  )
}

# Draws text the agent wrote as a message of the thread, at a position claimed on the
# conversation's counter, and moves its transcript entry's cursor past the blocks it was drawn
# from, in one mutation, so a worker taking over after a crash draws the rest and nothing twice.
# The message's id derives from the entry and the blocks, so drawing it twice is a conflict anyway.
# Its citations, the spans web search sources, go with it. The entry is found by its id and cursor,
# whichever run stored it, so a resumed run draws what the run it carries on left undrawn, under
# its own name.
#
# A text past 20000 characters is drawn in pieces: this draws the first, with `$toPiece` 1 and the
# cursor moved to the text's first block, past the blocks before it that draw nothing, and
# `DrawConversationAgentTextPiece` the rest. An omitted `$toPiece`
# draws the whole text and leaves the cursor's piece at 0.
#
# A reply adds one to the unread count and becomes the preview. A conversation deleted meanwhile
# takes nothing, and its worker stops. Fenced as `RenewConversationRunLease` is
mutation DrawConversationAgentText(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $entryId: UUID!
  $fromBlock: Int!
  $toBlock: Int!
  $messageId: UUID!
  $position: Int!
  $text: String!
  $citations: Any
  $preview: Any!
  $toPiece: Int
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  )
    @check(expr: "this == 1", message: "The run is no longer this worker's")
    @check(
      expr: "size(vars.text) <= 20000 && ((vars.toBlock > vars.fromBlock && (!has(vars.toPiece) || vars.toPiece == 0)) || (has(vars.toPiece) && vars.toPiece == 1 && vars.toBlock >= vars.fromBlock))"
      message: "A message is drawn from one block or more, or is the first piece of a longer text, and holds at most 20000 characters"
    )
  conversation_updateMany(
    where: { id: { eq: $conversationId }, deletedAt: { isNull: true }, nextMessagePosition: { eq: $position } }
    data: {
      preview: $preview
      previewMessageId: $messageId
      nextMessagePosition_update: { inc: 1 }
      messageCount_update: { inc: 1 }
      unreadCount_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not take the message at that position")
  conversationTranscriptEntry_updateMany(
    where: {
      id: { eq: $entryId }
      conversationId: { eq: $conversationId }
      drawnBlocks: { eq: $fromBlock }
      drawnPieces: { eq: 0 }
    }
    data: { drawnBlocks: $toBlock, drawnPieces: $toPiece }
  ) @check(expr: "this == 1", message: "Those blocks were drawn already")
  conversationMessage_insert(
    data: {
      id: $messageId
      conversationId: $conversationId
      runId: $runId
      kind: AGENT_TEXT
      text: $text
      citations: $citations
      position: $position
    }
  )
}

# Draws a later piece of a text past 20000 characters, the first having gone through
# `DrawConversationAgentText`: at a position claimed on the counter, with the cursor moved from
# this piece to the next, or past the text's blocks for its last piece, so a crash between two
# pieces draws the rest once. It becomes the preview, and adds nothing to the unread count, which
# the reply's first piece counted. Fenced as `RenewConversationRunLease` is
mutation DrawConversationAgentTextPiece(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $entryId: UUID!
  $block: Int!
  $fromPiece: Int!
  $toBlock: Int!
  $toPiece: Int!
  $messageId: UUID!
  $position: Int!
  $text: String!
  $citations: Any
  $preview: Any!
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  )
    @check(expr: "this == 1", message: "The run is no longer this worker's")
    @check(
      expr: "size(vars.text) <= 20000 && vars.fromPiece >= 1 && ((vars.toBlock == vars.block && vars.toPiece == vars.fromPiece + 1) || (vars.toBlock > vars.block && vars.toPiece == 0))"
      message: "A later piece moves the cursor to the next, or past its text, and holds at most 20000 characters"
    )
  conversation_updateMany(
    where: { id: { eq: $conversationId }, deletedAt: { isNull: true }, nextMessagePosition: { eq: $position } }
    data: {
      preview: $preview
      previewMessageId: $messageId
      nextMessagePosition_update: { inc: 1 }
      messageCount_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not take the message at that position")
  conversationTranscriptEntry_updateMany(
    where: {
      id: { eq: $entryId }
      conversationId: { eq: $conversationId }
      drawnBlocks: { eq: $block }
      drawnPieces: { eq: $fromPiece }
    }
    data: { drawnBlocks: $toBlock, drawnPieces: $toPiece }
  ) @check(expr: "this == 1", message: "That piece was drawn already")
  conversationMessage_insert(
    data: {
      id: $messageId
      conversationId: $conversationId
      runId: $runId
      kind: AGENT_TEXT
      text: $text
      citations: $citations
      position: $position
    }
  )
}

# Draws a call to a tool that ran on Claude's side, a web search, as a finished `TOOL_CALL`: its
# input and its output as JSON text, succeeded or failed, at a position claimed on the counter,
# with the cursor moved past the call's block. It becomes the preview, and adds nothing to the
# unread count. A call the worker refused is drawn here too, failed: a call to an integration the
# member cannot use carries the server and the tool it named, `$integrationId` and the names, so
# the thread can say what fixes it. Fenced as `RenewConversationRunLease` is
mutation DrawConversationToolCall(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $entryId: UUID!
  $fromBlock: Int!
  $toBlock: Int!
  $messageId: UUID!
  $position: Int!
  $toolUseId: String!
  $toolName: String!
  $toolStatus: ConversationToolStatus!
  $toolInput: String!
  $toolOutput: String!
  $preview: Any!
  $integrationId: UUID
  $integrationName: String
  $integrationToolName: String
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
      attempts: { eq: $attempts }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      conversation: {
        id: { eq: $conversationId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        organization: {
          userOrganizations_on_organization: {
            exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
          }
        }
      }
    }
    data: { leaseExpiresAt_time: { now: true, add: { seconds: 60 } } }
  )
    @check(expr: "this == 1", message: "The run is no longer this worker's")
    @check(
      expr: "vars.toBlock > vars.fromBlock && (vars.toolStatus == 'SUCCEEDED' || vars.toolStatus == 'FAILED')"
      message: "A call is drawn from one block or more, finished"
    )
  conversation_updateMany(
    where: { id: { eq: $conversationId }, deletedAt: { isNull: true }, nextMessagePosition: { eq: $position } }
    data: {
      preview: $preview
      previewMessageId: $messageId
      nextMessagePosition_update: { inc: 1 }
      messageCount_update: { inc: 1 }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The conversation could not take the message at that position")
  conversationTranscriptEntry_updateMany(
    where: {
      id: { eq: $entryId }
      conversationId: { eq: $conversationId }
      drawnBlocks: { eq: $fromBlock }
      drawnPieces: { eq: 0 }
    }
    data: { drawnBlocks: $toBlock }
  ) @check(expr: "this == 1", message: "Those blocks were drawn already")
  conversationMessage_insert(
    data: {
      id: $messageId
      conversationId: $conversationId
      runId: $runId
      kind: TOOL_CALL
      toolUseId: $toolUseId
      toolName: $toolName
      toolStatus: $toolStatus
      toolInput: $toolInput
      toolOutput: $toolOutput
      integrationId: $integrationId
      integrationName: $integrationName
      integrationToolName: $integrationToolName
      position: $position
    }
  )
}

# Draws a question the agent asked with `ask_user` as a `QUESTION`, waiting: its prompt, its options
# and whether several may be chosen, as the backend checked them against the question's bounds,
# which they go back into the transcript within. At a position claimed on the counter, with the
# cursor moved past the call's block, as `DrawConversationAgentText` draws a reply. A question adds
# one to the unread count and becomes the preview. Fenced as `RenewConversationRunLease` is
mutation DrawConversationQuestion(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $runId: UUID!
  $attempts: Int!
  $membershipCreatedAt: Timestamp!
  $entryId: UUID!
  $fromBlock: Int!
  $toBlock: Int!
  $messageId: UUID!
  $position: Int!
  $toolUseId: String!
  $questionPrompt: String!
  $questionOptions: [String!]!
  $isMultipleChoice: Boolean!
  $preview: Any!
) @auth(level: NO_ACCESS) @transaction {
  conversationRun_updateMany(
    where: {
      id: { eq: $runId }
      status: { eq: RUNNING }
