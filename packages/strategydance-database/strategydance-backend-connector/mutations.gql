# Invites somebody to an organization, from one of its administrators, and answers with the id
# the invitation's email carries.
#
# One address per call, which the backend makes once for each address in parallel: the generated
# Admin SDK cannot pass the `_Data` list `_insertMany` would need. Each call checks for itself
# that the inviter is an administrator, that the address belongs to no member, and that the team
# has room. The pair of organization and address is unique, so an address invited in the
# meantime fails its own call rather than being invited twice.
#
# A team holds at most 100 members and pending invitations together, `MAX_TEAM_SIZE` in
# strategydance-core. The first step takes the organization's row lock, so the calls for one
# organization run one after the other and each counts what the one before it committed: a
# batch, or two administrators inviting at once, cannot slip past the limit together
mutation CreateOrganizationInvitation($organizationId: UUID!, $userId: String!, $email: String!)
@auth(level: NO_ACCESS) @transaction {
  organization_update(id: $organizationId, data: { updatedAt_expr: "request.time" }) @redact
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can invite people to it") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can invite people")
    }
    userOrganizations(where: { organizationId: { eq: $organizationId }, user: { email: { eq: $email } } }, limit: 1)
      @check(expr: "size(this) == 0", message: "The address belongs to a member already", optional: true) {
      userId
    }
    organization(id: $organizationId)
      @check(
        expr: "size(this.userOrganizations_on_organization) + size(this.organizationInvitations_on_organization) < 100"
        message: "The team is full"
      ) {
      userOrganizations_on_organization(limit: 100) {
        userId
      }
      organizationInvitations_on_organization(limit: 100) {
        id
      }
    }
  }
  organizationInvitation_insert(data: { organizationId: $organizationId, email: $email, invitedById: $userId })
  # Counted against the inviter's hourly allowance, `MAX_INVITATIONS_PER_HOUR` in the backend's
  # `createOrganizationInvitations`. Every sender's rows from before the hour it counts are pruned,
  # not the inviter's alone, so somebody who stops sending does not leave theirs behind
  sentInvitation_insert(data: { invitedById: $userId }) @redact
  sentInvitation_deleteMany(where: { createdAt: { lt_time: { now: true, sub: { hours: 1 } } } }) @redact
}

# Claims the account's welcome email for the request that makes it, and answers how many rows it
# claimed: 1 when this request may send it, 0 when it went out already, another request holds it,
# the account is more than a week old, or it has no row.
#
# A claim is a ten-minute lease rather than a flag. A request that sends completes it; one that
# fails, or dies with its process, leaves it to lapse, and the next request after that sends
# again. Ten minutes outlasts any request Cloud Run lets run, so a live claim never lapses under
# the request holding it.
#
# One conditional update rather than a read and a write, so two requests landing together cannot
# both find it free: Postgres re-checks the condition on the row the first one locked, and the
# second claims nothing. `$userId` is the uid the backend verified
mutation ClaimWelcomeEmail($userId: String!) @auth(level: NO_ACCESS) {
  user_updateMany(
    # One `_and`, because a filter cannot put `_or` beside plain fields
    where: {
      _and: [
        { id: { eq: $userId } }
        { welcomeEmailSentAt: { isNull: true } }
        # `WELCOME_EMAIL_WINDOW_DAYS` in strategydance-core: an older account is never welcomed
        { createdAt: { ge_time: { now: true, sub: { days: 7 } } } }
        {
          _or: [
            { welcomeEmailClaimedAt: { isNull: true } }
            { welcomeEmailClaimedAt: { lt_time: { now: true, sub: { minutes: 10 } } } }
          ]
        }
      ]
    }
    data: { welcomeEmailClaimedAt_expr: "request.time" }
  )
}

# Records that the welcome email went out, which ends the claim for good
mutation CompleteWelcomeEmail($userId: String!) @auth(level: NO_ACCESS) {
  user_update(key: { id: $userId }, data: { welcomeEmailSentAt_expr: "request.time" })
}

# Takes back an invitation whose email could not be sent, so the team page does not list an
# invitation nobody received and the address is free to invite again. `$organizationId` scopes the
# delete, and is what the team's live query refreshes on
mutation DeleteUnsentOrganizationInvitation($id: UUID!, $organizationId: UUID!) @auth(level: NO_ACCESS) {
  organizationInvitation_deleteMany(where: { id: { eq: $id }, organizationId: { eq: $organizationId } })
}

# Points an organization's logo at a file the backend has just put in Storage, or clears it with
# null, for one of its administrators. Answers with the URL it replaced, whose file the backend
# then deletes.
#
# Data Connect runs one write per row in a mutation, a second one silently changing nothing, so
# there is no separate row lock here as elsewhere: the URL is read, then written, which takes the
# lock, then the administrator is checked, a failure rolling the write back. The read comes before
# the lock, so two uploads in the same instant can both read the URL the first replaces: the file
# the second wrote over is then named by neither answer and stays behind. That costs a file, never
# a row pointing at one that was deleted, since nothing is deleted that an answer did not name.
# Only the membership is redacted, since the URL is the answer
mutation UpdateOrganizationLogo($organizationId: UUID!, $userId: String!, $logoUrl: String)
@auth(level: NO_ACCESS) @transaction {
  previous: query {
    organization(id: $organizationId) {
      logoUrl
    }
  }
  organization_update(id: $organizationId, data: { logoUrl: $logoUrl, updatedAt_expr: "request.time" })
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its logo") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can change an organization's logo")
    }
  }
}

# The banner's twin of `UpdateOrganizationLogo`, on the same terms
mutation UpdateOrganizationBanner($organizationId: UUID!, $userId: String!, $bannerUrl: String)
@auth(level: NO_ACCESS) @transaction {
  previous: query {
    organization(id: $organizationId) {
      bannerUrl
    }
  }
  organization_update(id: $organizationId, data: { bannerUrl: $bannerUrl, updatedAt_expr: "request.time" })
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its banner") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can change an organization's banner")
    }
  }
}

# Deletes an organization, for one of its administrators. Its memberships and pending invitations
# go with it: both reference it as required, which Data Connect cascades. Its files are the
# backend's, which sweeps them before running this, so a failed sweep leaves the organization to
# delete again, and once more after, for an upload that raced it (`deleteOrganization`).
#
# The lock is the caller's own membership rather than the organization's row, as elsewhere an
# administrator acts: Data Connect runs one write per row in a mutation, so a delete after an
# `organization_update` would find nothing. It serializes all the same, since demoting or
# removing somebody writes their membership: one in flight holds the row until it commits, and
# the check below then reads the member it left; one that starts after waits for this delete.
# The membership goes with the organization anyway, so touching it costs nothing.
#
# `$organizationId` is also what `GetOrganizationTeam` refreshes on, so a member watching the
# team page sees it go
mutation DeleteOrganization($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) @transaction {
  userOrganization_update(key: { userId: $userId, organizationId: $organizationId }, data: { updatedAt_expr: "request.time" })
    @redact
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can delete it") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can delete an organization")
    }
  }
  organization_delete(id: $organizationId) @check(expr: "this != null", message: "The organization is gone")
}
