      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      isAiWritable: { eq: true }
    }
    data: { deletedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "The document was deleted or closed to agents since it was read")
  document_deleteMany(
    where: { organizationId: { eq: $organizationId }, deletedAt: { lt_time: { now: true, sub: { days: 1 } } } }
  ) @redact
}

# Takes back a delete for an agent, as `RestoreDocument` does: within a day of it, and against the
# 1000 documents an organization keeps, under the same lock on its row
mutation RestoreDocumentForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $isKeyed: Boolean!
  $idempotencyScope: String!
  $idempotencyKey: String!
  $tool: String!
  $argumentsHash: String!
  $result: String!
  $expiresAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  organization_updateMany(
    where: {
      id: { eq: $organizationId }
      userOrganizations_on_organization: { exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } } }
    }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this == 1", message: "The caller is no longer a member of the organization")
    @check(
      expr: "!vars.isKeyed || (size(vars.idempotencyKey) >= 1 && size(vars.idempotencyKey) <= 200)"
      message: "An idempotency key is 1 to 200 characters"
    )
  moduleCallResult_insert(
    data: {
      idempotencyScope: $idempotencyScope
      idempotencyKey: $idempotencyKey
      userId: $userId
      organizationId: $organizationId
      tool: $tool
      argumentsHash: $argumentsHash
      result: $result
      expiresAt: $expiresAt
    }
  ) @include(if: $isKeyed)
  query @redact {
    documents(where: { organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }, limit: 1000)
      @check(expr: "size(this) < 1000", message: "An organization keeps at most 1000 documents") {
      id
    }
  }
  document_updateMany(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { gt_time: { now: true, sub: { days: 1 } } }
      isAiReadable: { eq: true }
      isAiWritable: { eq: true }
    }
    data: { deletedAt: null }
  ) @check(expr: "this == 1", message: "The document is gone for good or closed to agents")
}

# Fills a document's plain text from its `content` before a search, where a page from before
# `contentText` left it null, only while the document is at the revision the module read and still
# not indexed: a fold landing in between nulls it again or writes its own, and either way this one
# would be stale, so a conflict writes nothing and leaves it for the next search. `updatedAt` stays,
# since nothing a reader sees changed
mutation IndexDocumentTextForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $revision: Int!
  $contentText: String!
) @auth(level: NO_ACCESS) {
  document_updateMany(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      revision: { eq: $revision }
      contentText: { isNull: true }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    data: { contentText: $contentText }
  )
}

# The backfill's, as `IndexDocumentTextForAgent` without a caller: any organization's document, at
# the revision the script read and still not indexed
mutation IndexDocumentText($id: UUID!, $revision: Int!, $contentText: String!) @auth(level: NO_ACCESS) {
  document_updateMany(
    where: { id: { eq: $id }, revision: { eq: $revision }, contentText: { isNull: true } }
    data: { contentText: $contentText }
  )
}

# The daily sweep's: deletes every organization's documents deleted over a day ago, past their
# restore, so a day means a day whether or not anybody deletes another. Deleting them twice deletes
# nothing, so a sweep that failed is finished by the next
mutation DeleteExpiredDocuments @auth(level: NO_ACCESS) {
  document_deleteMany(where: { deletedAt: { lt_time: { now: true, sub: { days: 1 } } } })
}

# The daily sweep's: deletes the module call results past their expiry, an external agent's a day
# after its call, which no retry reads any more. Strategy Dance's agent's never expire: they go
# with their conversation
mutation DeleteExpiredModuleCallResults @auth(level: NO_ACCESS) {
  moduleCallResult_deleteMany(where: { expiresAt: { lt_time: { now: true } } })
}

# The Tasks module's writes follow, named `…ForAgent`, as its reads are: see `queries.gql`.
#
# Each runs as one transaction that checks the membership the module read, then, when the call
# carries an idempotency key (`$isKeyed`), inserts its `ModuleCallResult` first, `$result` being what
# the module answers, and only then writes, as the Knowledge module's writes do. Each holds a task to
# what the page's operation holds it to, with the same messages where the same rule holds.
#
# Each is named in `GetTasks`' refreshes, on `$organizationId`, but an update carrying a description
# alone, which changes nothing a card shows, and in `GetTaskDescription`'s, on `$id`, when it changes
# a description, deletes or restores, so an open board and an open task follow an agent's change.
# None records an `ActivityDay`: what an agent does on the board counts toward nobody's streak

# Adds a task an agent wrote, held to `CreateTask`'s bounds and to the 1000 tasks an organization
# keeps, counted under the same lock on the organization's row, so an agent and a page adding at once
# cannot pass it. `$position` is past the last of its column as the module read it,
# `$descriptionText` the plain text of `$description`, and `$doneAt` when it was done, the module's
# time, sent for a task created into Done alone
mutation CreateTaskForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $name: String!
  $description: String!
  $descriptionText: String!
  $status: TaskStatus!
  $position: Float!
  $assigneeId: String
  $isAssignedToAgent: Boolean!
  $dueDate: Date
  $aspects: [CompanyAspect!]!
  $doneAt: Timestamp
  $isKeyed: Boolean!
  $idempotencyScope: String!
  $idempotencyKey: String!
  $tool: String!
  $argumentsHash: String!
  $result: String!
  $expiresAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  organization_updateMany(
    where: {
      id: { eq: $organizationId }
      userOrganizations_on_organization: { exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } } }
    }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this == 1", message: "The caller is no longer a member of the organization")
    @check(
      expr: "!vars.isKeyed || (size(vars.idempotencyKey) >= 1 && size(vars.idempotencyKey) <= 200)"
      message: "An idempotency key is 1 to 200 characters"
    )
    @check(
      expr: "size(vars.name) <= 120 && vars.name.matches('^[[:^space:]](.*[[:^space:]])?$')"
      message: "A task's name is 1 to 120 characters on one line, with no space at either end"
    )
    @check(
      expr: "size(vars.description) <= 20000 && size(vars.descriptionText) <= 20000"
      message: "A task's description is at most 20000 characters"
    )
    @check(
      expr: "vars.aspects.all(aspect, vars.aspects.exists_one(other, other == aspect))"
      message: "A task is tagged with each aspect at most once"
    )
    @check(
      expr: "!vars.isAssignedToAgent || !has(vars.assigneeId) || vars.assigneeId == null"
      message: "A task is assigned to a member or to Strategy Dance, not both"
    )
  moduleCallResult_insert(
    data: {
      idempotencyScope: $idempotencyScope
      idempotencyKey: $idempotencyKey
      userId: $userId
      organizationId: $organizationId
      tool: $tool
      argumentsHash: $argumentsHash
      result: $result
      expiresAt: $expiresAt
    }
  ) @include(if: $isKeyed)
  query @redact {
    tasks(where: { organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }, limit: 1000)
      @check(expr: "size(this) < 1000", message: "An organization keeps at most 1000 tasks") {
      id
    }
    # Only a member can be assigned. With no assignee there is nobody to check, whatever this reads
    assignees: userOrganizations(
      where: { organizationId: { eq: $organizationId }, userId: { eq: $assigneeId } }
      limit: 1
    )
      @check(
        expr: "!has(vars.assigneeId) || vars.assigneeId == null || size(this) == 1"
        message: "A task is assigned to a member of its organization"
      ) {
      role
    }
  }
  task_insert(
    data: {
      id: $id
      organizationId: $organizationId
      createdById: $userId
      name: $name
      description: $description
      descriptionText: $descriptionText
      status: $status
      position: $position
      assigneeId: $assigneeId
      isAssignedToAgent: $isAssignedToAgent
      dueDate: $dueDate
      aspects: $aspects
      doneAt: $doneAt
    }
  )
}

# Changes the fields of a task an agent names, and no other, in one write, so a member changing
# another field meanwhile keeps their change. An omitted variable leaves its column alone and a null
# one clears it: `$dueDate` null clears the day, and `$assigneeId` null with `$isAssignedToAgent`
# takes the task off whoever had it. A description comes with its plain text, a move with its column
# and its place in it, an assignment with both its fields, which the module always sends together. A
# move into Done from another column comes with `$doneAt`, the module's time, and any other leaves
# it as it is, so a move within Done keeps the day it was finished.
#
# Refused unless the task is still as the module read it, its `updatedAt` unmoved, which every
# change of a task's fields moves: the module then reads again and reapplies, so a member's save
# landing in between is never written over, and a description the agent replaces whole is checked
# against what it read again
mutation UpdateTaskForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $updatedAt: Timestamp!
  $name: String
  $description: String
  $descriptionText: String
  $status: TaskStatus
  $position: Float
  $assigneeId: String
  $isAssignedToAgent: Boolean
  $dueDate: Date
  $aspects: [CompanyAspect!]
  $doneAt: Timestamp
  $isKeyed: Boolean!
  $idempotencyScope: String!
  $idempotencyKey: String!
  $tool: String!
  $argumentsHash: String!
  $result: String!
  $expiresAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The caller is no longer a member of the organization") {
      userId
        @check(
          expr: "!vars.isKeyed || (size(vars.idempotencyKey) >= 1 && size(vars.idempotencyKey) <= 200)"
          message: "An idempotency key is 1 to 200 characters"
          optional: true
        )
        @check(
          expr: "!has(vars.name) || (vars.name != null && size(vars.name) <= 120 && vars.name.matches('^[[:^space:]](.*[[:^space:]])?$'))"
          message: "A task's name is 1 to 120 characters on one line, with no space at either end"
          optional: true
        )
        @check(
          expr: "(!has(vars.description) || (vars.description != null && size(vars.description) <= 20000)) && (!has(vars.descriptionText) || vars.descriptionText == null || size(vars.descriptionText) <= 20000)"
          message: "A task's description is at most 20000 characters"
          optional: true
        )
        @check(
          expr: "!has(vars.aspects) || (vars.aspects != null && vars.aspects.all(aspect, vars.aspects.exists_one(other, other == aspect)))"
          message: "A task is tagged with each aspect at most once"
          optional: true
        )
        @check(
          expr: "!has(vars.isAssignedToAgent) || vars.isAssignedToAgent != true || !has(vars.assigneeId) || vars.assigneeId == null"
          message: "A task is assigned to a member or to Strategy Dance, not both"
          optional: true
        )
    }
    # Only a member can be assigned. With no assignee there is nobody to check, whatever this reads
    assignees: userOrganizations(
      where: { organizationId: { eq: $organizationId }, userId: { eq: $assigneeId } }
      limit: 1
    )
      @check(
        expr: "!has(vars.assigneeId) || vars.assigneeId == null || size(this) == 1"
        message: "A task is assigned to a member of its organization"
      ) {
      role
    }
  }
  moduleCallResult_insert(
    data: {
      idempotencyScope: $idempotencyScope
      idempotencyKey: $idempotencyKey
      userId: $userId
      organizationId: $organizationId
      tool: $tool
      argumentsHash: $argumentsHash
      result: $result
      expiresAt: $expiresAt
    }
  ) @include(if: $isKeyed)
  task_updateMany(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      updatedAt: { eq: $updatedAt }
    }
    data: {
      name: $name
      description: $description
      descriptionText: $descriptionText
      status: $status
      position: $position
      assigneeId: $assigneeId
      isAssignedToAgent: $isAssignedToAgent
      dueDate: $dueDate
      aspects: $aspects
      doneAt: $doneAt
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The task changed or was deleted since it was read")
}

# Makes a task wait on another for an agent, as `AddTaskDependency` does and under the same lock and
# checks: both live and the organization's, never itself or a task that waits on it, at most 50 links
# counting those to deleted tasks. A longer loop is refused by the module, which reads the board's
# links first; two writers closing one at the same instant only leave its tasks blocked, as two
# members can. A link that exists already changes nothing
mutation AddTaskDependencyForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $taskId: UUID!
  $dependencyId: UUID!
  $isKeyed: Boolean!
  $idempotencyScope: String!
  $idempotencyKey: String!
  $tool: String!
  $argumentsHash: String!
  $result: String!
  $expiresAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  organization_updateMany(
    where: {
      id: { eq: $organizationId }
      userOrganizations_on_organization: { exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } } }
    }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this == 1", message: "The caller is no longer a member of the organization")
    @check(
      expr: "!vars.isKeyed || (size(vars.idempotencyKey) >= 1 && size(vars.idempotencyKey) <= 200)"
      message: "An idempotency key is 1 to 200 characters"
    )
    @check(expr: "vars.taskId != vars.dependencyId", message: "A task cannot wait on itself")
  moduleCallResult_insert(
    data: {
      idempotencyScope: $idempotencyScope
      idempotencyKey: $idempotencyKey
      userId: $userId
      organizationId: $organizationId
      tool: $tool
      argumentsHash: $argumentsHash
      result: $result
      expiresAt: $expiresAt
    }
  ) @include(if: $isKeyed)
  query @redact {
    waiting: tasks(
      where: { id: { eq: $taskId }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "No task by that id in the organization") {
      id
    }
    awaited: tasks(
      where: { id: { eq: $dependencyId }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "No task by that id in the organization") {
      id
    }
    reverse: taskDependencies(where: { taskId: { eq: $dependencyId }, dependencyId: { eq: $taskId } }, limit: 1)
      @check(expr: "size(this) == 0", message: "A task cannot wait on a task that waits on it") {
      taskId
    }
    others: taskDependencies(where: { taskId: { eq: $taskId }, dependencyId: { ne: $dependencyId } }, limit: 50)
      @check(expr: "size(this) < 50", message: "A task waits on at most 50 others") {
      dependencyId
    }
  }
  taskDependency_upsert(data: { taskId: $taskId, dependencyId: $dependencyId })
}

# Stops a task waiting on another for an agent. Unlike the page's, a link that is not there is
# refused, so the agent hears it. The task it named may be deleted, so a link that would close a loop
# once a deleted task is restored can be taken off before the restore
mutation RemoveTaskDependencyForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $taskId: UUID!
  $dependencyId: UUID!
  $isKeyed: Boolean!
  $idempotencyScope: String!
  $idempotencyKey: String!
  $tool: String!
  $argumentsHash: String!
  $result: String!
  $expiresAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The caller is no longer a member of the organization") {
      userId
        @check(
          expr: "!vars.isKeyed || (size(vars.idempotencyKey) >= 1 && size(vars.idempotencyKey) <= 200)"
          message: "An idempotency key is 1 to 200 characters"
          optional: true
        )
    }
  }
  moduleCallResult_insert(
    data: {
      idempotencyScope: $idempotencyScope
      idempotencyKey: $idempotencyKey
      userId: $userId
      organizationId: $organizationId
      tool: $tool
      argumentsHash: $argumentsHash
      result: $result
      expiresAt: $expiresAt
    }
  ) @include(if: $isKeyed)
  taskDependency_deleteMany(
    where: {
      taskId: { eq: $taskId }
      dependencyId: { eq: $dependencyId }
      task: { organizationId: { eq: $organizationId } }
    }
  ) @check(expr: "this == 1", message: "The task does not wait on that one")
}

# Deletes a task for an agent as its dialog's Delete does, setting `deletedAt` and keeping its links,
# so it can be restored with them for a day, then prunes the organization's tasks deleted over a day
# ago, as `DeleteTask` does. Unlike the page's, a task gone already is refused, so the agent hears it
mutation DeleteTaskForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $isKeyed: Boolean!
  $idempotencyScope: String!
  $idempotencyKey: String!
  $tool: String!
  $argumentsHash: String!
  $result: String!
  $expiresAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    membership: userOrganizations(
      where: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        createdAt: { eq: $membershipCreatedAt }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "The caller is no longer a member of the organization") {
      userId
        @check(
          expr: "!vars.isKeyed || (size(vars.idempotencyKey) >= 1 && size(vars.idempotencyKey) <= 200)"
          message: "An idempotency key is 1 to 200 characters"
          optional: true
        )
    }
  }
  moduleCallResult_insert(
    data: {
      idempotencyScope: $idempotencyScope
      idempotencyKey: $idempotencyKey
      userId: $userId
      organizationId: $organizationId
      tool: $tool
      argumentsHash: $argumentsHash
      result: $result
      expiresAt: $expiresAt
    }
  ) @include(if: $isKeyed)
  task_updateMany(
    where: { id: { eq: $id }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
    data: { deletedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "No task by that id in the organization")
  task_deleteMany(
    where: { organizationId: { eq: $organizationId }, deletedAt: { lt_time: { now: true, sub: { days: 1 } } } }
  ) @redact
}

# Takes back a delete for an agent, as `RestoreTask` does: within a day of it, with the links other
# tasks had to it, and against the 1000 tasks an organization keeps, under the same lock on its row.
# The module refuses a restore whose kept links would close a loop with one made meanwhile before it
# writes, naming them, where the page's Undo removes them itself
mutation RestoreTaskForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $isKeyed: Boolean!
  $idempotencyScope: String!
  $idempotencyKey: String!
  $tool: String!
  $argumentsHash: String!
  $result: String!
  $expiresAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  organization_updateMany(
    where: {
      id: { eq: $organizationId }
      userOrganizations_on_organization: { exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } } }
    }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this == 1", message: "The caller is no longer a member of the organization")
    @check(
      expr: "!vars.isKeyed || (size(vars.idempotencyKey) >= 1 && size(vars.idempotencyKey) <= 200)"
      message: "An idempotency key is 1 to 200 characters"
    )
  moduleCallResult_insert(
    data: {
      idempotencyScope: $idempotencyScope
      idempotencyKey: $idempotencyKey
      userId: $userId
      organizationId: $organizationId
      tool: $tool
      argumentsHash: $argumentsHash
      result: $result
      expiresAt: $expiresAt
    }
  ) @include(if: $isKeyed)
  query @redact {
    tasks(where: { organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }, limit: 1000)
      @check(expr: "size(this) < 1000", message: "An organization keeps at most 1000 tasks") {
      id
    }
  }
  task_updateMany(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { gt_time: { now: true, sub: { days: 1 } } }
    }
    data: { deletedAt: null }
  ) @check(expr: "this == 1", message: "The task is gone for good")
}

# Fills a task's plain text from its `description` before a query, where a page from before
# `descriptionText` left it null, only while the task is as the module read it, its `updatedAt`
# unmoved, and still not indexed: a save landing in between writes its own text or nulls it again,
# and either way this one would be stale, so a conflict writes nothing and leaves it for the next
# query. `updatedAt` stays, since nothing a reader sees changed
mutation IndexTaskTextForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $updatedAt: Timestamp!
  $descriptionText: String!
) @auth(level: NO_ACCESS) {
  task_updateMany(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      updatedAt: { eq: $updatedAt }
      descriptionText: { isNull: true }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    data: { descriptionText: $descriptionText }
  )
}

# The backfill's, as `IndexTaskTextForAgent` without a caller: any organization's task, as the script
# read it and still not indexed
mutation IndexTaskText($id: UUID!, $updatedAt: Timestamp!, $descriptionText: String!) @auth(level: NO_ACCESS) {
  task_updateMany(
    where: { id: { eq: $id }, updatedAt: { eq: $updatedAt }, descriptionText: { isNull: true } }
    data: { descriptionText: $descriptionText }
  )
}

# The `doneAt` backfill's: stamps a task done before `doneAt` existed with its last change, the
# nearest the releases before it left, while it is still in Done and nobody has stamped it, as a
# finish meanwhile would. Its `updatedAt` stays, since the task did not change
mutation DateDoneTask($id: UUID!, $doneAt: Timestamp!) @auth(level: NO_ACCESS) {
  task_updateMany(where: { id: { eq: $id }, status: { eq: DONE }, doneAt: { isNull: true } }, data: { doneAt: $doneAt })
}

# The authorization server's writes follow. Most of them run before any `$userId` has been
# verified, finding a request, a code or a token by its id or its hash, as `queries.gql` says of its
# reads. Every lifetime is written out here, since Data Connect takes no duration in a variable:
# each names the backend constant to change with it

# Registers an external agent (RFC 7591), which anybody can do, so registrations are held to 1000 a
# day in all (`MAX_OAUTH_CLIENT_REGISTRATIONS_PER_DAY` in the backend: change the two together). A
# count rather than a lock, since no row stands for all of them: a few registrations at once can
# pass it by as many, which bounds them all the same. Read to 1000, since past that a registration
# is refused whatever the rest are
mutation CreateOAuthClient($name: String, $redirectUris: [String!]!) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    oAuthClients(where: { createdAt: { gt_time: { now: true, sub: { days: 1 } } } }, limit: 1000)
      @check(expr: "size(this) < 1000", message: "Strategy Dance takes no more registrations today")
      @check(
        expr: "!has(vars.name) || vars.name == null || (size(vars.name) >= 1 && size(vars.name) <= 80)"
        message: "A client's name is 1 to 80 characters"
      )
      @check(
        expr: "size(vars.redirectUris) >= 1 && size(vars.redirectUris) <= 10"
        message: "A client registers 1 to 10 redirect addresses"
      ) {
      id
    }
  }
  oAuthClient_insert(data: { name: $name, redirectUris: $redirectUris })
}

# Stores an authorization request an external agent made, pending for ten minutes
# (`OAUTH_AUTHORIZATION_REQUEST_LIFETIME_MS` in the backend). Nobody is signed in yet, so requests
# are held to 1000 in ten minutes in all (`MAX_OAUTH_AUTHORIZATION_REQUESTS` in the backend), past
# what any one address may make: a count, as `CreateOAuthClient`'s is. `$registeredClientId` is null
# for a client ID metadata document's
mutation CreateOAuthAuthorizationRequest(
  $clientId: String!
  $registeredClientId: UUID
  $redirectUri: String!
  $codeChallenge: String!
  $resource: String!
  $scopes: [String!]!
  $state: String
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    oAuthAuthorizationRequests(where: { createdAt: { gt_time: { now: true, sub: { minutes: 10 } } } }, limit: 1000)
      @check(expr: "size(this) < 1000", message: "Strategy Dance takes no more authorization requests for now") {
      id
    }
  }
  oAuthAuthorizationRequest_insert(
    data: {
      clientId: $clientId
      registeredClientId: $registeredClientId
      redirectUri: $redirectUri
      codeChallenge: $codeChallenge
      resource: $resource
      scopes: $scopes
      state: $state
      expiresAt_time: { now: true, add: { minutes: 10 } }
    }
  )
}

# Marks a registered client used when an authorization names it, before its request is stored, so
# the daily sweep never prunes a client an authorization is naming, and answers null for a client
# pruned since it was read. Its own operation, since a skipped step still refuses a null key
mutation RecordOAuthClientUse($id: UUID!) @auth(level: NO_ACCESS) {
  oAuthClient_update(id: $id, data: { lastUsedAt_expr: "request.time" })
}

# A member allows an external agent to act as them on one module in one organization: the connection
# and the code, valid for a minute (`OAUTH_CODE_LIFETIME_MS` in the backend), bound to the request.
#
# The first step writes the member's own row, a lock every consent of theirs takes in whichever
# organization, so their consents take turns, two at once for one client, organization and module
# included. Nothing else writes a user row and a membership both, so taking the two in this order
# waits on nobody holding them the other way. The second writes the member's membership, the lock a
# run's start and a search take too, and refuses anybody who is not that member: by its check, or
# first by the connection's reference to the membership (`agent_connection_membership_fkey`), which
# Data Connect reports before the check, and the backend reads the two as one refusal. A member
# connects at most 100 agents across their organizations (`MAX_AGENT_CONNECTIONS` in
# strategydance-core), counted after both, leaving out the connection this one replaces, so the
# Connected agents tab, which reads that many, lists every one. The earlier connection for that
# client and module goes, with its tokens, and the new one takes its place, so the member holds
# one connection for it, of the access they last allowed. The request is decided last, since it references the connection, and only while it is
# undecided and unexpired, for the client and the resource it names, granting no scope it did not
# ask for: a check refusing it rolls the whole mutation back, so a double submit, or an Allow racing
# a Deny, decides it once. `$userId` is the uid the backend verified, and `$connectionId` and
# `$codeHash` are the backend's own
mutation ApproveOAuthAuthorizationRequest(
  $id: UUID!
  $userId: String!
  $organizationId: UUID!
  $connectionId: UUID!
  $clientId: String!
  $registeredClientId: UUID
  $clientName: String
  $module: String!
  $resource: String!
  $scopes: [String!]!
  $codeHash: String!
) @auth(level: NO_ACCESS) @transaction {
  user_update(key: { id: $userId }, data: { updatedAt_expr: "request.time" }) @redact
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  ) @redact @check(expr: "this != null", message: "Only a member of an organization can connect an agent to it")
  query @redact {
    agentConnections(
      where: {
        _and: [
          { membershipUserId: { eq: $userId } }
          {
            _not: {
              membershipOrganizationId: { eq: $organizationId }
              clientId: { eq: $clientId }
              module: { eq: $module }
            }
          }
        ]
      }
      limit: 100
    ) @check(expr: "size(this) < 100", message: "A member connects at most 100 agents") {
      id
    }
  }
  agentConnection_deleteMany(
    where: {
      membershipUserId: { eq: $userId }
      membershipOrganizationId: { eq: $organizationId }
      clientId: { eq: $clientId }
      module: { eq: $module }
    }
  ) @redact
  agentConnection_insert(
    data: {
      id: $connectionId
      membershipUserId: $userId
      membershipOrganizationId: $organizationId
      clientId: $clientId
      registeredClientId: $registeredClientId
      clientName: $clientName
      module: $module
      scopes: $scopes
    }
  )
  oAuthAuthorizationRequest_updateMany(
    where: {
      id: { eq: $id }
      clientId: { eq: $clientId }
      resource: { eq: $resource }
      scopes: { includesAll: $scopes }
      decidedAt: { isNull: true }
      expiresAt: { gt_time: { now: true } }
    }
    data: {
      decidedAt_expr: "request.time"
      isApproved: true
      connectionId: $connectionId
      codeHash: $codeHash
      codeExpiresAt_time: { now: true, add: { minutes: 1 } }
    }
  ) @check(expr: "this == 1", message: "The authorization request was decided already or has expired")
}

# A member denies an external agent: the request is decided, only while it is undecided and
# unexpired, so a denied request is never allowed after, nor an allowed one denied
mutation DenyOAuthAuthorizationRequest($id: UUID!) @auth(level: NO_ACCESS) @transaction {
  oAuthAuthorizationRequest_updateMany(
    where: { id: { eq: $id }, decidedAt: { isNull: true }, expiresAt: { gt_time: { now: true } } }
    data: { decidedAt_expr: "request.time", isApproved: false }
  ) @check(expr: "this == 1", message: "The authorization request was decided already or has expired")
}

# Exchanges a code for an access token, valid for an hour (`OAUTH_ACCESS_TOKEN_LIFETIME_MS` in the
# backend), and a refresh token, for 30 days (`OAUTH_REFRESH_TOKEN_LIFETIME_MS`), both bound to the
# code's resource and granting its connection's scopes, which they may not exceed. The code is
# consumed first, once, within its minute, on the connection the backend read: a code used already,
# expired, or whose connection was replaced or revoked since issues nothing. The tokens' hashes are
# the backend's own
mutation ExchangeOAuthAuthorizationCode(
  $id: UUID!
  $codeHash: String!
  $connectionId: UUID!
  $resource: String!
  $scopes: [String!]!
  $accessTokenHash: String!
  $refreshTokenHash: String!
) @auth(level: NO_ACCESS) @transaction {
  oAuthAuthorizationRequest_updateMany(
    where: {
      id: { eq: $id }
      codeHash: { eq: $codeHash }
      connectionId: { eq: $connectionId }
      connection: { scopes: { includesAll: $scopes } }
      codeUsedAt: { isNull: true }
      codeExpiresAt: { gt_time: { now: true } }
    }
    data: { codeUsedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "The code was used already or has expired")
  access: agentConnectionToken_insert(
    data: {
      connectionId: $connectionId
      kind: ACCESS
      hash: $accessTokenHash
      resource: $resource
      scopes: $scopes
      issuedFrom: $id
      expiresAt_time: { now: true, add: { hours: 1 } }
    }
  )
  refresh: agentConnectionToken_insert(
    data: {
      connectionId: $connectionId
      kind: REFRESH
      hash: $refreshTokenHash
      resource: $resource
      scopes: $scopes
      issuedFrom: $id
      expiresAt_time: { now: true, add: { days: 30 } }
    }
  )
}

# Rotates a refresh token: it is spent, once, recording the secret's version its successors were
# derived under, and the successors are stored, an access token for an hour and a refresh token for
# 30 days, as a code's are. The refresh token keeps the spent one's scopes, and the access token holds
# those the refresh asked for, neither past the spent token's (RFC 6749, 6). A token spent already,
# or expired, rotates nothing, and the backend reads it again to answer a duplicate or revoke the
# connection
mutation RotateAgentConnectionRefreshToken(
  $id: UUID!
  $connectionId: UUID!
  $resource: String!
  $accessScopes: [String!]!
  $refreshScopes: [String!]!
  $successorKeyVersion: Int!
  $accessTokenHash: String!
  $refreshTokenHash: String!
) @auth(level: NO_ACCESS) @transaction {
  agentConnectionToken_updateMany(
    # One `_and`, since a filter cannot name `scopes` twice beside plain fields
    where: {
      _and: [
        { id: { eq: $id } }
        { connectionId: { eq: $connectionId } }
        { kind: { eq: REFRESH } }
        { usedAt: { isNull: true } }
        { expiresAt: { gt_time: { now: true } } }
        { scopes: { includesAll: $refreshScopes } }
        { scopes: { includesAll: $accessScopes } }
      ]
    }
    data: { usedAt_expr: "request.time", successorKeyVersion: $successorKeyVersion }
  ) @check(expr: "this == 1", message: "The refresh token was used already or has expired")
  access: agentConnectionToken_insert(
    data: {
      connectionId: $connectionId
      kind: ACCESS
      hash: $accessTokenHash
      resource: $resource
      scopes: $accessScopes
      issuedFrom: $id
      expiresAt_time: { now: true, add: { hours: 1 } }
    }
  )
  refresh: agentConnectionToken_insert(
    data: {
      connectionId: $connectionId
      kind: REFRESH
      hash: $refreshTokenHash
      resource: $resource
      scopes: $refreshScopes
      issuedFrom: $id
      expiresAt_time: { now: true, add: { days: 30 } }
    }
  )
}

# Revokes a connection with every token it holds, which their references cascade to: for a code or a
# spent refresh token presented again, whose holder replays what somebody else already used, and for
# a refresh token its client revokes. Revoking it twice revokes nothing
mutation RevokeAgentConnection($id: UUID!) @auth(level: NO_ACCESS) {
  agentConnection_deleteMany(where: { id: { eq: $id } })
}

# Revokes one access token its client revokes, leaving the connection and its refresh token
mutation DeleteAgentConnectionAccessToken($id: UUID!) @auth(level: NO_ACCESS) {
  agentConnectionToken_deleteMany(where: { id: { eq: $id }, kind: { eq: ACCESS } })
}

# Marks a connection used when a module's endpoint verified a token of its, at most once a minute
# whichever instance asks, so an agent calling the module all day costs a write a minute, and the
# Connected agents tab, whose list no refresh names this for, shows it on its next read. A connection
# gone since, or one of another member's, writes nothing. `$id` and `$userId` are the verified
# token's own
mutation RecordAgentConnectionUse($id: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  agentConnection_updateMany(
    where: {
      _and: [
        { id: { eq: $id } }
        { membershipUserId: { eq: $userId } }
        { _or: [{ lastUsedAt: { isNull: true } }, { lastUsedAt: { lt_time: { now: true, sub: { minutes: 1 } } } }] }
      ]
    }
    data: { lastUsedAt_expr: "request.time" }
  )
}

# The daily sweep's: deletes the authorization requests expired over a day ago, so a code presented
# again within that day is still traced to its connection. Deleting them twice deletes nothing, as
# for each of the sweep's deletes
mutation PruneOAuthAuthorizationRequests @auth(level: NO_ACCESS) {
  oAuthAuthorizationRequest_deleteMany(where: { expiresAt: { lt_time: { now: true, sub: { days: 1 } } } })
}

# The daily sweep's: deletes the tokens past their expiry, a refresh token spent or not
mutation PruneAgentConnectionTokens @auth(level: NO_ACCESS) {
  agentConnectionToken_deleteMany(where: { expiresAt: { lt_time: { now: true } } })
}

# The daily sweep's: deletes the registrations made over a day ago that no authorization has named
# for a day and that no connection uses
mutation PruneOAuthClients @auth(level: NO_ACCESS) {
  oAuthClient_deleteMany(
    where: {
      _and: [
        { createdAt: { lt_time: { now: true, sub: { days: 1 } } } }
        { _or: [{ lastUsedAt: { isNull: true } }, { lastUsedAt: { lt_time: { now: true, sub: { days: 1 } } } }] }
        { agentConnections_on_registeredClient: { count: { eq: 0 } } }
      ]
    }
  )
}

# --- Integrations ---
#
# An organization's MCP servers, which its administrators change through the backend alone, since
# adding or changing one reaches the server first. Every operation takes the organization, the
# server and the administrator the backend verified, and checks in its redacted step that they
# administer the organization, in words `isAdministratorRefusal` reads. Each names the organization
# as `$organizationId` and the server as `$integrationId`, which the live queries' refreshes read.
#
# A write made after reaching the server matches the `configRevision` and `keyGeneration` it reached
# it with, under a check that it changed one row, so a result read from a configuration another
# administrator has replaced since is refused rather than stored over theirs. One that also writes
# the name matches the name it read, `$readName`, so a rename made meanwhile is not undone

# Adds a server, with what reaching it found: its tools for one that took no OAuth, or the issuer of
# its authorization server for one that does, whose tools wait for a member's connection (M28).
#
# The first step takes the organization's row lock, so two administrators adding at once count each
# other: at most 50 live servers (`MAX_INTEGRATIONS` in strategydance-core), and no two of one name
mutation CreateOrganizationIntegration(
  $organizationId: UUID!
  $userId: String!
  $integrationId: UUID!
  $name: String!
  $normalizedName: String!
  $url: String!
  $catalogueSlug: String
  $authentication: IntegrationAuthentication!
  $encryptedApiKey: String
  $apiKeyLastFour: String
  $apiKeyScheme: IntegrationApiKeyScheme!
  $apiKeyHeader: String
  $issuer: String
  $tools: String
  $toolCount: Int
  $toolDefinitionHashes: [String!]!
) @auth(level: NO_ACCESS) @transaction {
  organization_update(id: $organizationId, data: { updatedAt_expr: "request.time" }) @redact
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can add a server to it") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can add a server")
    }
    organizationIntegrations(
      where: { organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
      limit: 50
    ) @check(expr: "size(this) < 50", message: "An organization adds at most 50 servers") {
      id
    }
    taken: organizationIntegrations(
      where: {
        organizationId: { eq: $organizationId }
        normalizedName: { eq: $normalizedName }
        deletedAt: { isNull: true }
      }
      limit: 1
    ) @check(expr: "size(this) == 0", message: "Another server of the organization has this name") {
      id
    }
  }
  organizationIntegration_insert(
    data: {
      id: $integrationId
      organizationId: $organizationId
      name: $name
      normalizedName: $normalizedName
      url: $url
      catalogueSlug: $catalogueSlug
      authentication: $authentication
      encryptedApiKey: $encryptedApiKey
      apiKeyLastFour: $apiKeyLastFour
      apiKeyScheme: $apiKeyScheme
      apiKeyHeader: $apiKeyHeader
      issuer: $issuer
      tools: $tools
      toolCount: $toolCount
      toolDefinitionHashes: $toolDefinitionHashes
    }
  )
}

# Renames a server, under the organization's row lock, so two renames cannot take one name, matching
# the name the administrator renamed, so one made meanwhile is not undone
mutation RenameOrganizationIntegration(
  $organizationId: UUID!
  $userId: String!
  $integrationId: UUID!
  $name: String!
  $normalizedName: String!
  $readName: String!
) @auth(level: NO_ACCESS) @transaction {
  organization_update(id: $organizationId, data: { updatedAt_expr: "request.time" }) @redact
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its servers") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can change a server")
    }
    taken: organizationIntegrations(
      where: {
        _and: [
          { organizationId: { eq: $organizationId }, normalizedName: { eq: $normalizedName } }
          { deletedAt: { isNull: true } }
          { _not: { id: { eq: $integrationId } } }
        ]
      }
      limit: 1
    ) @check(expr: "size(this) == 0", message: "Another server of the organization has this name") {
      id
    }
  }
  organizationIntegration_updateMany(
    where: {
      id: { eq: $integrationId }
      organizationId: { eq: $organizationId }
      name: { eq: $readName }
      deletedAt: { isNull: true }
    }
    data: { name: $name, normalizedName: $normalizedName, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "The server was changed or deleted meanwhile")
}

# Points a server at another address or another authentication, with what reaching it there found,
# the external MCP server at its new address, if any, and its name, under the organization's row
# lock, as a rename takes it.
# Everything given for the old ones goes in the same write: the key, unless a new one is given, the
# issuer, the registered client, the tools and every approval, since another server could list
# identical tools. It bumps `configRevision`, and `keyGeneration`, since whatever key it holds now
# was given for this server. Members' connections and their Connects under way go in the same
# mutation.
#
# The server's own write comes first, the deletes after it: under read committed, a member's Connect
# that locked the row first commits before this write takes it, and the deletes then see its
# connection; one that comes after waits for this write and finds the revision moved, refused. The
# other order would let a connection made between the deletes and the write outlive them. The
# emulator runs one transaction at a time, so the order is reasoned here rather than tested.
#
# Every variable is passed, null to clear its column: one left out leaves the column as it was, the
# old server's key included
mutation ReconfigureOrganizationIntegration(
  $organizationId: UUID!
  $userId: String!
  $integrationId: UUID!
  $name: String!
  $normalizedName: String!
  $readName: String!
  $configRevision: Int!
  $keyGeneration: Int!
  $url: String!
  $catalogueSlug: String
  $authentication: IntegrationAuthentication!
  $encryptedApiKey: String
  $apiKeyLastFour: String
  $apiKeyScheme: IntegrationApiKeyScheme!
  $apiKeyHeader: String
  $issuer: String
  $tools: String
  $toolCount: Int
  $toolDefinitionHashes: [String!]!
) @auth(level: NO_ACCESS) @transaction {
  organization_update(id: $organizationId, data: { updatedAt_expr: "request.time" }) @redact
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its servers") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can change a server")
    }
    taken: organizationIntegrations(
      where: {
        _and: [
          { organizationId: { eq: $organizationId }, normalizedName: { eq: $normalizedName } }
          { deletedAt: { isNull: true } }
          { _not: { id: { eq: $integrationId } } }
        ]
      }
      limit: 1
    ) @check(expr: "size(this) == 0", message: "Another server of the organization has this name") {
      id
    }
  }
  organizationIntegration_updateMany(
    where: {
      id: { eq: $integrationId }
      organizationId: { eq: $organizationId }
      name: { eq: $readName }
      configRevision: { eq: $configRevision }
      keyGeneration: { eq: $keyGeneration }
      deletedAt: { isNull: true }
    }
    data: {
      name: $name
      normalizedName: $normalizedName
      url: $url
      catalogueSlug: $catalogueSlug
      authentication: $authentication
      encryptedApiKey: $encryptedApiKey
      apiKeyLastFour: $apiKeyLastFour
      apiKeyScheme: $apiKeyScheme
      apiKeyHeader: $apiKeyHeader
      issuer: $issuer
      tools: $tools
      toolCount: $toolCount
      toolDefinitionHashes: $toolDefinitionHashes
      autoApprovedTools: []
      oauthClientId: null
      encryptedOAuthClientSecret: null
      oauthClientSecretExpiresAt: null
      oauthClientAuthenticationMethod: null
      configRevision_update: { inc: 1 }
      keyGeneration_update: { inc: 1 }
      lastError: null
      lastErrorAt: null
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The server was changed or deleted meanwhile")
  integrationConnection_deleteMany(where: { integrationId: { eq: $integrationId } }) @redact
  integrationAuthorization_deleteMany(where: { integrationId: { eq: $integrationId } }) @redact
}

# Replaces a key-based server's key, or how it is sent, at the same address, with the tools the
# server listed for it, and its name, under the organization's row lock, as a rename takes it. A new key bumps `keyGeneration` and another way of sending it
# `configRevision`, each by the increment the backend passes, 1 or 0. Approvals stay, but for the
# tools the server no longer lists, which `$removedToolDefinitionHashes` names: removed rather than
# rewritten, so an approval given meanwhile for a tool still listed is kept
mutation UpdateOrganizationIntegrationKey(
  $organizationId: UUID!
  $userId: String!
  $integrationId: UUID!
  $name: String!
  $normalizedName: String!
  $readName: String!
  $configRevision: Int!
  $keyGeneration: Int!
  $configRevisionIncrement: Int!
  $keyGenerationIncrement: Int!
  $encryptedApiKey: String!
  $apiKeyLastFour: String
  $apiKeyScheme: IntegrationApiKeyScheme!
  $apiKeyHeader: String
  $tools: String!
  $toolCount: Int!
  $toolDefinitionHashes: [String!]!
  $removedToolDefinitionHashes: [String!]!
) @auth(level: NO_ACCESS) @transaction {
  organization_update(id: $organizationId, data: { updatedAt_expr: "request.time" }) @redact
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its servers") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can change a server")
    }
    taken: organizationIntegrations(
      where: {
        _and: [
          { organizationId: { eq: $organizationId }, normalizedName: { eq: $normalizedName } }
          { deletedAt: { isNull: true } }
          { _not: { id: { eq: $integrationId } } }
        ]
      }
      limit: 1
    ) @check(expr: "size(this) == 0", message: "Another server of the organization has this name") {
      id
    }
  }
  organizationIntegration_updateMany(
    where: {
      id: { eq: $integrationId }
      organizationId: { eq: $organizationId }
      authentication: { eq: API_KEY }
      name: { eq: $readName }
      configRevision: { eq: $configRevision }
      keyGeneration: { eq: $keyGeneration }
      deletedAt: { isNull: true }
    }
    data: {
      name: $name
      normalizedName: $normalizedName
      encryptedApiKey: $encryptedApiKey
      apiKeyLastFour: $apiKeyLastFour
      apiKeyScheme: $apiKeyScheme
      apiKeyHeader: $apiKeyHeader
      tools: $tools
      toolCount: $toolCount
      toolDefinitionHashes: $toolDefinitionHashes
      autoApprovedTools_update: [{ remove: $removedToolDefinitionHashes }]
      configRevision_update: { inc: $configRevisionIncrement }
      keyGeneration_update: { inc: $keyGenerationIncrement }
      lastError: null
      lastErrorAt: null
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The server was changed or deleted meanwhile")
}

# Stores the tools a server listed again, at the configuration it was reached with, its approvals
# kept but for the tools it no longer lists, and clears its error
mutation RecordOrganizationIntegrationTools(
  $organizationId: UUID!
  $userId: String!
  $integrationId: UUID!
  $configRevision: Int!
  $keyGeneration: Int!
  $tools: String!
  $toolCount: Int!
  $toolDefinitionHashes: [String!]!
  $removedToolDefinitionHashes: [String!]!
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
    userOrganization(key: { userId: $userId, organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its servers") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can change a server")
    }
  }
  organizationIntegration_updateMany(
    where: {
      id: { eq: $integrationId }
      organizationId: { eq: $organizationId }
      configRevision: { eq: $configRevision }
      keyGeneration: { eq: $keyGeneration }
      deletedAt: { isNull: true }
    }
    data: {
      tools: $tools
      toolCount: $toolCount
      toolDefinitionHashes: $toolDefinitionHashes
      autoApprovedTools_update: [{ remove: $removedToolDefinitionHashes }]
      lastError: null
      lastErrorAt: null
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "The server was changed or deleted meanwhile")
}

