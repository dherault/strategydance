# Deploys a pull request's Hosting preview, run by hand from the Actions tab with the pull
# request's number. Nothing runs it on its own: a preview takes a production build and one of the
# channels Hosting caps a site at, and most pull requests need neither
#
# GitHub offers it to run by hand only once `main` holds this file, and runs the copy of the
# branch picked under "Use workflow from", `main`'s unless somebody picks another
name: Deploy to Firebase Hosting on PR
run-name: Deploy the preview of pull request ${{ inputs.pull_request }}
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: The number of the pull request to preview
        required: true
        type: number
permissions:
  contents: read
  pull-requests: write
# Shared with delete-preview-channel.yml, so a preview still deploying when its pull request
# closes lands before the channel is deleted rather than after, which would leave it to expire.
# `queue: max` keeps every waiting run: the default keeps one, and a later run would cancel the
# waiting cleanup in its place
concurrency:
  group: preview-${{ inputs.pull_request }}
  cancel-in-progress: false
  queue: max
jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    # This job holds a production service account and runs the pull request's code before it
    # deploys, so it refuses a pull request from a fork. Only somebody with write access can run
    # it, and they could as well run it from a branch whose copy of this file prints the
    # credential: what guards the key is who has write access
    steps:
      # A run that waited in the queue can start once its pull request has closed and the cleanup
      # has run, and deploying then would open the channel again, so it reads the pull request as
      # it is now. Once it has started, a cleanup waits for it
      #
      # The channel is named as the deploy action names one for a `pull_request` event, which the
      # cleanup matches by its `pr<number>-` and a channel opened before this ran by hand reuses
      - name: Read the pull request
        id: pull_request
        run: |
          pull_request=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER")
          state=$(jq -r .state <<< "$pull_request")
          repository=$(jq -r '.head.repo.full_name // ""' <<< "$pull_request")
          sha=$(jq -r .head.sha <<< "$pull_request")
          ref=$(jq -r .head.ref <<< "$pull_request")
          if [ "$state" != open ]; then
            echo "::error::Pull request $NUMBER is $state"
            exit 1
          fi
          if [ "$repository" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull request $NUMBER comes from a fork"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "channel=pr$NUMBER-${ref:0:20}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.pull_request }}
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pull_request.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          # Pins CI to the packageManager version in package.json, as check-pull-request does
          bun-version-file: package.json
      # No `VITE_USE_FIREBASE_EMULATORS`: there is one Firebase project, so a preview talks to
      # it and signing in on a preview URL creates a real account. Accepted deliberately;
      # isolating it means a second project with its own Cloud SQL instance
      #
      # `bun install` generates the Data Connect SDK through postinstall, which the build needs
      - run: bun install --frozen-lockfile && bun run build
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STRATEGYDANCE }}
          projectId: strategydance
          channelId: ${{ steps.pull_request.outputs.channel }}
      # The action comments on the pull request only when one triggered it
      - name: Link the preview from the pull request
        run: |
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "Preview of ${SHA:0:7}: $URL, until $EXPIRES"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.pull_request }}
          SHA: ${{ steps.pull_request.outputs.sha }}
          URL: ${{ steps.deploy.outputs.details_url }}
          EXPIRES: ${{ steps.deploy.outputs.expire_time_formatted }}
