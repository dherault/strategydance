# Deploys a release whenever main moves, in the order it needs: Data Connect first, since the
# backend and the frontend both query it, then the backend, then the Storage rules, and the
# frontend last. A step runs only once the one before it has succeeded, so a run that stops
# partway stops before anything that relies on what failed. The backend deploys through
# `bun run deploy:backend`, the same command a human runs, so its flags stay in one place: the
# backend's package.json
#
# It holds no key. The organization forbids creating service account keys, and a key in the
# repository's secrets is one a pull request's workflow could print, as
# firebase-hosting-pull-request.yml explains. Instead the job trades GitHub's OIDC token for a
# short-lived one of `deployer@strategydance.iam.gserviceaccount.com`, through Workload Identity
# Federation:
#
# - The pool `github` and its provider `strategydance` accept tokens from this repository alone,
#   matched by its numeric id, which survives a rename and cannot be squatted
# - The service account grants `roles/iam.workloadIdentityUser` to one subject,
#   `repo:dherault/strategydance:ref:refs/heads/main`. A pull request's run carries its merge
#   ref instead, so no branch but main can deploy
# - The job impersonates the account rather than holding roles itself, because a migration logs
#   into Postgres as whoever the Firebase CLI runs as, and the CLI only learns that name from the
#   impersonation
# - For Data Connect it holds `roles/firebasedataconnect.admin`, and `roles/cloudsql.admin`,
#   because a migration creates its Postgres user on every run and the CLI checks for the right
#   to create instances before it starts
# - For the backend, `roles/run.sourceDeveloper` to upload and build, `roles/run.admin` because
#   `--no-invoker-iam-check` needs `run.services.setIamPolicy`, and
#   `roles/iam.serviceAccountUser` on the Compute Engine default service account, which the build
#   and the service both run as
# - For the rules, `roles/firebaserules.admin`, and `roles/firebasestorage.viewer` to find the
#   default bucket. For the frontend, `roles/firebasehosting.admin`
#
# That reads and rewrites the production database, so whoever can push to main holds it
#
# None of these names is a secret, like the Firebase config
name: Deploy on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
  # What lets the job ask GitHub for the OIDC token it trades
  id-token: write
# Merges in quick succession deploy one at a time rather than racing, since two migrations or two
# backend builds at once end on whichever finishes last. A run still waiting is replaced by a
# newer one, which deploys the same commits and more
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # A re-run keeps the commit its run started on. Once main has moved past it, re-running an
      # old failed run would deploy that commit over the newer release, connectors and frontend
      # included, so it stops here instead. The tip's own run is the one to re-run: it deploys
      # the same commits and more
      - name: Refuse anything but the tip of main
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::error::main is at $tip, past this run's $GITHUB_SHA. Re-run the deploy of $tip instead"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          # Pins CI to the packageManager version in package.json, as check-pull-request does
          bun-version-file: package.json
      # Before any credential, so a release that does not build never touches production. The
      # backend has no build of its own, since Bun runs its source, so its typecheck is what
      # stands in for one. `bun install` generates the Data Connect SDK through postinstall,
      # which both need, and installs the Firebase CLI the steps below run
      - run: bun install --frozen-lockfile && bun run typecheck && bun run build
      # Writes a credentials file into the workspace, which `--source ../..` uploads:
      # `.gcloudignore` leaves it out, or it would ship in the image
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/995028545701/locations/global/workloadIdentityPools/github/providers/strategydance
          service_account: deployer@strategydance.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      # firebase-tools 15.30.1 turns its `fdcapimigration` experiment on by default, which hands a
      # migration's SQL to a Data Connect endpoint, `schemas/main:migrate`, that answers this
      # service with a 404, "Method not found". Off, the CLI runs the SQL itself, over a Cloud SQL
      # connection as the deploy account. `FIREBASE_CLI_EXPERIMENTS` can only turn experiments on,
      # so this writes the preference instead, which a runner starts without
      - name: Migrate through Cloud SQL rather than the Data Connect API
        run: bunx firebase experiments:disable fdcapimigration
      # Never `--force`. Without a terminal, `firebase deploy` refuses any schema change that
      # needs SQL and says to migrate first, so the migration is its own step. It runs additive SQL
      # and stops on anything destructive, like the drop and create a renamed table becomes. When
      # it stops, read the SQL it printed, run `bun run deploy:database` by hand if that SQL is
      # what the release means, then re-run the deploy of main's tip
      - name: Migrate the database
        run: bunx firebase dataconnect:sql:migrate --non-interactive
      # Stops, the same way, on connector changes Data Connect calls breaking and on new insecure
      # operations. A stop here leaves the database migrated under the previous connectors, which
      # `schemaValidation: "COMPATIBLE"` lets keep serving
      - name: Deploy Data Connect
        run: bunx firebase deploy --only dataconnect --non-interactive
      - name: Deploy the backend
        run: bun run deploy:backend
        # Answers every prompt with its default, so a deploy that has to create the
        # `cloud-run-source-deploy` repository does instead of waiting on a question nobody
        # reads. setup-gcloud sets this for its own step only. Set here rather than as `--quiet`
        # in the script, so a deploy by hand still asks
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: 1
      - name: Deploy the Storage rules
        run: bunx firebase deploy --only storage --non-interactive
      - name: Deploy the frontend
        run: bunx firebase deploy --only hosting --non-interactive
