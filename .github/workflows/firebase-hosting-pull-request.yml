# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
# Shared with delete-preview-channel.yml, so a preview still deploying when its pull request
# closes lands before the channel is deleted rather than after, which would leave it to expire.
# `queue: max` keeps every waiting run: the default keeps one, and a later run would cancel the
# waiting cleanup in its place
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # This job holds a production service account, and `pull_request` runs the workflow from
    # the pull request's own code, so the head-repo check stops forks but not somebody with
    # push access editing this file to print the credential. What stops that is the repository
    # setting requiring approval before a workflow runs: the approver sees the diff, including
    # any change to this file
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          # Pins CI to the packageManager version in package.json, as check-pull-request does
          bun-version-file: package.json
      # No `VITE_USE_FIREBASE_EMULATORS`: there is one Firebase project, so a preview talks to
      # it and signing in on a preview URL creates a real account. Accepted deliberately;
      # isolating it means a second project with its own Cloud SQL instance
      #
      # `bun install` generates the Data Connect SDK through postinstall, which the build needs
      - run: bun install --frozen-lockfile && bun run build
      # A run that waited in the queue can start once its pull request has closed and the cleanup
      # has run, and deploying then would open the channel again, so it reads the pull request's
      # state as it is now rather than when the event fired
      - name: Read whether the pull request is still open
        id: pull_request
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
      - if: steps.pull_request.outputs.state == 'open'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STRATEGYDANCE }}
          projectId: strategydance
