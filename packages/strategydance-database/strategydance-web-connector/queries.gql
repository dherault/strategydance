# The caller's own row, and only ever their own: the key comes from the token rather than from
# a variable, so there is no shape of this query that reads somebody else
query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    email
    displayName
    imageUrl
    bio
    locale
    timezone
    authenticationProviders
    # Whether to ask the backend for the welcome email, and whether it is too late to
    welcomeEmailSentAt
    # Whether to show the administration section. The pages' own queries check it again
    isAdministrator
    createdAt
  }
}

# Which buttons to offer somebody who has typed their email and not yet signed in.
#
# PUBLIC because there is no caller to authenticate yet, and that is the cost of the design:
# the answer distinguishes an address that has an account from one that does not, so this
# endpoint can be asked whether somebody is a member.
#
# App Check is what is meant to keep that to real browsers, and initializing it in the bundle
# only attaches a token: **enforcement has to be switched on for Data Connect in the Firebase
# console**, and until it is, this endpoint enumerates registered emails to anyone who calls
# it directly. That is a deployment prerequisite, not something this file can assert.
#
# It returns the providers and nothing else. The row's existence is inherent to the question,
# so nothing is gained by leaking a name or an id alongside it
query GetAuthenticationProvidersByEmail($email: String!)
@auth(
  level: PUBLIC
  insecureReason: "The sign-in screen has to know which button to offer before anybody has signed in."
) {
  users(where: { email: { eq: $email } }, limit: 1) {
    authenticationProviders
  }
}

# Every organization the caller belongs to, and what they are in it.
#
# Rooted at the join table because `role` lives there: the `_via_` relation is typed
# `[Organization!]!` and has nowhere to put one.
#
# `eq_expr` keeps this as safe as `GetCurrentUser`, the uid coming off the token rather than
# from a variable. The generated `limit` defaults to 100
query GetCurrentUserOrganizations @auth(level: USER) {
  userOrganizations(
    where: { userId: { eq_expr: "auth.uid" } }
    # Joined-at order, so the list does not reshuffle between reads. `organizationId` breaks the
    # tie for two rows written in one transaction, which share `request.time`
    orderBy: [{ createdAt: ASC }, { organizationId: ASC }]
  ) {
    role
    # What the reader does there, which their account page shows beside the organization's name
    jobTitle
    organization {
      id
      name
      exploredAspects
      logoUrl
      bannerUrl
      color
      brief
      isPublic
      # When it was made, which the build in public page counts its days from
      createdAt
    }
  }
}

# An organization's members and its pending invitations, as the team page lists them.
#
# Both lists are filtered on the caller's own membership, keyed by the uid off the token, so
# somebody outside the organization reads two empty lists rather than its people. Invitations
# come without their `id`, which is the secret in their link: a member sees who was invited, and
# cannot answer for them.
#
# A live query. The page subscribes to it, and each `@refresh` names a mutation that changes one
# of the lists, scoped to the organization both carry. The Today page reads it too, for the top
# priority each member sets, which is why `UpdateTopPriority` is among them. `CreateOrganizationInvitation`,
# `DeleteUnsentOrganizationInvitation` and `DeleteOrganization` are the backend connector's, run
# through the Admin SDK; the last empties both lists, which the page reads as the reader having
# left. A profile edit is not among them: refreshing on every `UpdateCurrentUser` would wake every
# team page for anybody's change of name, so a new name shows on the next load instead. Nor is a
# change to the organization's profile, since this query reads none of them.
#
# Each list is read up to 100 rows, named rather than left to the generated default. The database
# keeps a team at 100 members and pending invitations together (`MAX_TEAM_SIZE` in
# strategydance-core), so neither list is ever cut short
query GetOrganizationTeam($organizationId: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "UpdateOrganizationMemberRole"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "UpdateOrganizationMemberJobTitle"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "UpdateTopPriority"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RemoveOrganizationMember"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "AcceptOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeclineOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "CreateOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteUnsentOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganization"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
) {
  userOrganizations(
    where: {
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    # Joined-at order, as the sidebar lists organizations. `userId` breaks the tie between two
    # rows written in one transaction
    orderBy: [{ createdAt: ASC }, { userId: ASC }]
    limit: 100
  ) {
    role
    jobTitle
    topPriority
    topPriorityUpdatedAt
    user {
      id
      email
      displayName
      imageUrl
    }
  }
  organizationInvitations(
    where: {
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    orderBy: [{ createdAt: ASC }, { email: ASC }]
    limit: 100
  ) {
    email
  }
}

# How the caller's own Today page lists the team's priorities: the order they chose and the ones
# they hid. Keyed by the uid off the token, so there is no shape of this query that reads another
# member's. Null for somebody outside the organization
query GetTodayPreferences($organizationId: UUID!) @auth(level: USER) {
  userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId }) {
    priorityOrder
    hiddenPriorities
  }
}

# The invitation a link opens, for its addressee alone.
#
# The address has to be the one on the caller's token, so somebody holding a link meant for
# another address reads nothing. Nothing here tells an invitation addressed elsewhere from one
# that is gone, and the page says as much.
#
# `USER_EMAIL_VERIFIED`, because the token's address is only the addressee's once it is verified.
# A password sign-up proves nothing about the address it names, so without this, whoever held a
# link could register the invited address before its owner did and read the invitation as them
query GetOrganizationInvitation($id: UUID!) @auth(level: USER_EMAIL_VERIFIED) {
  organizationInvitations(where: { id: { eq: $id }, email: { eq_expr: "auth.token.email" } }, limit: 1) {
    organization {
      id
      name
    }
    invitedBy {
      displayName
      email
    }
  }
}

# Every account, newest first, as the administration's users page lists them.
#
# Only an administrator of Strategy Dance gets an answer. The first field reads the caller's own
# row, keyed by the uid off the token and redacted from the result, and its checks fail the whole
# query for anybody whose row does not carry the flag.
#
# Not live: every sign-up and every change of name would have to refresh it. The page reads it
# again on mount and on focus instead.
#
# Read up to 1000 rows, named rather than left to the generated default of 100, which would cut
# the list short without saying so. Past that the page needs pagination. Each account's
# memberships are read up to the same 1000, since nothing caps how many organizations one account
# creates or joins
query GetAdministrationUsers @auth(level: USER) {
  viewer: user(key: { id_expr: "auth.uid" })
    @redact
    @check(expr: "this != null", message: "Only an administrator of Strategy Dance can list every account") {
    isAdministrator
      @check(expr: "this == true", message: "Only an administrator of Strategy Dance can list every account")
  }
  users(
    # `id` breaks the tie between two accounts created in the same instant
    orderBy: [{ createdAt: DESC }, { id: ASC }]
    limit: 1000
  ) {
    id
    email
    displayName
    imageUrl
    authenticationProviders
    isAdministrator
    createdAt
    # Joined-at order, as the sidebar lists organizations
    userOrganizations_on_user(orderBy: [{ createdAt: ASC }, { organizationId: ASC }], limit: 1000) {
      organization {
        id
        name
      }
    }
  }
}

# Every organization, newest first, as the administration's organizations page lists them.
#
# Guarded, read and bounded as `GetAdministrationUsers` is: the caller's own row checks the flag
# first, the list is not live, and it stops at 1000 rows. Each organization's members are counted
# rather than read, since the page only says how many there are
query GetAdministrationOrganizations @auth(level: USER) {
  viewer: user(key: { id_expr: "auth.uid" })
    @redact
    @check(expr: "this != null", message: "Only an administrator of Strategy Dance can list every organization") {
    isAdministrator
      @check(expr: "this == true", message: "Only an administrator of Strategy Dance can list every organization")
  }
  organizations(
    # `id` breaks the tie between two organizations created in the same instant
    orderBy: [{ createdAt: DESC }, { id: ASC }]
    limit: 1000
  ) {
    id
    name
    logoUrl
    color
    isPublic
    exploredAspects
    createdAt
    members: userOrganizations_on_organization {
      _count
    }
  }
}

# The caller's task lists in an organization, in the order they made them, each with how many of
# its tasks are still open, for the pill beside its name. Keyed by the uid off the token, and read
# only while they belong to the organization. A deleted list is left out. A teammate's are
# `GetMemberTaskLists`.
#
# Read up to 100, `MAX_TASK_LISTS` in strategydance-core, which `CreateTaskList` holds them to. The
# tasks themselves are read one list at a time, by `GetTasks`, since a list holds up to 1000
query GetTaskLists($organizationId: UUID!) @auth(level: USER) {
  taskLists(
    where: {
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    # `id` breaks the tie between two lists made in the same instant
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    name
    openTasks: tasks_on_taskList(where: { isDone: { eq: false } }) {
      _count
    }
  }
}

# One of the caller's task lists, its tasks in their order. Scoped as `GetTaskLists` is, through
# the list, so an id that is somebody else's reads nothing. Up to 1000, `MAX_TASKS_PER_LIST` in
# strategydance-core, which `CreateTask` holds a list to
query GetTasks($organizationId: UUID!, $taskListId: UUID!) @auth(level: USER) {
  tasks(
    where: {
      taskListId: { eq: $taskListId }
      taskList: {
        userId: { eq_expr: "auth.uid" }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      }
    }
    # Two tasks added at once can share a position, and then keep the order they were added in
    orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
    limit: 1000
  ) {
    id
    text
    isDone
    position
  }
}

# The caller's task lists in an organization, each with every one of its tasks in their order, for
# the build in public page, whose cards draw across lists. Scoped as `GetTaskLists` is, and in its
# order. Up to 100 lists of up to 1000 tasks, `MAX_TASK_LISTS` and `MAX_TASKS_PER_LIST` in
# strategydance-core
query GetTaskListsWithTasks($organizationId: UUID!) @auth(level: USER) {
  taskLists(
    where: {
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    name
    tasks: tasks_on_taskList(orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }], limit: 1000) {
      id
      text
      isDone
      position
    }
  }
}

# Somebody's task lists in an organization, read only, for the Today page's picker: any member may
# read any member's, and an outsider, or a member reading somebody who left, reads nothing. The
# same lists `GetTaskLists` reads for their owner, in the same order and as many.
#
# The owner's own page keeps `GetTaskLists`, keyed by the token, rather than calling this with their
# own uid: the deployed page calls it, and taking the owner as a variable would break it
query GetMemberTaskLists($organizationId: UUID!, $userId: String!) @auth(level: USER) {
  taskLists(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    name
    openTasks: tasks_on_taskList(where: { isDone: { eq: false } }) {
      _count
    }
  }
}

# One of somebody's task lists, its tasks in their order, read only. Scoped as `GetMemberTaskLists`
# is, through the list, so an id that is not that member's reads nothing
query GetMemberTasks($organizationId: UUID!, $userId: String!, $taskListId: UUID!) @auth(level: USER) {
  tasks(
    where: {
      taskListId: { eq: $taskListId }
      taskList: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
        user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
      }
    }
    orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
    limit: 1000
  ) {
    id
    text
    isDone
    position
  }
}

# Somebody's checklist in an organization, as the Today page opens it: any member may read any
# member's, and an outsider, or a member reading somebody who left, reads nothing.
#
# - `owner` is when they joined and their time zone, which say which rows the table has and which
#   of them is their today
# - `checklistItems` are their live columns in order, each with the days ticked in the last eight,
#   which covers the week the table shows folded in any time zone. The window is the server's
#   today, so the query stays the same across the reader's midnight. Up to 100 columns,
#   `MAX_CHECKLIST_ITEMS` in strategydance-core
# - `earliest` is their oldest tick, so the table can say how many days it would unfold to
# - `anyItem` says whether they ever had a column, deleted ones included, so their own page seeds
#   the default habits once and never again
query GetChecklist($organizationId: UUID!, $userId: String!) @auth(level: USER) {
  owner: userOrganizations(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    limit: 1
  ) {
    createdAt
    user {
      timezone
    }
  }
  checklistItems(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    name
    position
    completions: checklistCompletions_on_checklistItem(
      where: { date: { ge_date: { today: true, sub: { days: 8 } } } }
      orderBy: [{ date: DESC }]
      limit: 10
    ) {
      date
    }
  }
  earliest: checklistCompletions(
    where: {
      checklistItem: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
        user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
      }
    }
    orderBy: [{ date: ASC }]
    limit: 1
  ) {
    date
  }
  anyItem: checklistItems(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    limit: 1
  ) {
    id
  }
}

# Every day somebody ticked each of their live checklist columns, for the table unfolded past the
# week `GetChecklist` reads. Read only when it unfolds, and scoped as that query is. Up to 3660 days
# a column, ten years, `MAX_CHECKLIST_HISTORY_DAYS` in strategydance-core, which is also as far back
# as the table draws: past that it needs pagination
query GetChecklistHistory($organizationId: UUID!, $userId: String!) @auth(level: USER) {
  checklistItems(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    limit: 100
  ) {
    id
    completions: checklistCompletions_on_checklistItem(orderBy: [{ date: DESC }], limit: 3660) {
      date
    }
  }
}

# A week of an organization's log, newest first, as the Today page's feed reads it: every entry
# from `$from` to `$to` by somebody who is a member now. Outsiders read nothing. The authors' names
# and pictures come from the team, which the page already holds live, so only their ids are read.
#
# Read up to 700 entries, a team of 100 (`MAX_TEAM_SIZE` in strategydance-core) writing every day
# of the week, so a week is never cut short. `older` is the day of the newest entry before the week,
# for the page to jump to when it loads the previous one, past any week nobody wrote in.
#
# A live query, for the newest week: each `@refresh` names a mutation that adds, changes or hides
# an entry. Removing somebody hides theirs, accepting an invitation can show a returning member's
# again, and deleting the organization empties it
query GetOrganizationLog($organizationId: UUID!, $from: Date!, $to: Date!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "CreateLogEntry"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "UpdateLogEntry"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RemoveOrganizationMember"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "AcceptOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganization"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
) {
  logEntries(
    where: {
      organizationId: { eq: $organizationId }
      date: { ge: $from, le: $to }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    # `id` breaks the tie between two entries written in the same instant
    orderBy: [{ date: DESC }, { createdAt: DESC }, { id: ASC }]
    limit: 700
  ) {
    id
    date
    content
    createdAt
    updatedAt
    user {
      id
    }
  }
  older: logEntries(
    where: {
      organizationId: { eq: $organizationId }
      date: { lt: $from }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    orderBy: [{ date: DESC }]
    limit: 1
  ) {
    date
  }
}

# Every day the caller was active in an organization, newest first, for the streak the build in
# public page counts: see `ActivityDay`. Keyed by the uid off the token, and read only while they
# belong to the organization. Up to 3660 days, ten years, as `GetChecklistHistory` reads, past which
# the best streak only looks that far back
query GetActivityDays($organizationId: UUID!) @auth(level: USER) {
  activityDays(
    where: {
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    orderBy: [{ date: DESC }]
    limit: 3660
  ) {
    date
  }
}
