# `DeleteDocument` does. Unlike the page's, a document gone already is refused, so the agent hears it
mutation DeleteDocumentForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $id: UUID!
  $isKeyed: Boolean!
  $idempotencyScope: String!
  $idempotencyKey: String!
  $tool: String!
  $argumentsHash: String!
  $result: String!
  $expiresAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  query @redact {
