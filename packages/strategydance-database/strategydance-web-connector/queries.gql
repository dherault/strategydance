# The caller's own row, and only ever their own: the key comes from the token rather than from
# a variable, so there is no shape of this query that reads somebody else
query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    email
    displayName
    imageUrl
    bio
    locale
    timezone
    authenticationProviders
    # Whether to ask the backend for the welcome email, and whether it is too late to
    welcomeEmailSentAt
    # Whether to show the administration section. The pages' own queries check it again
    isAdministrator
    createdAt
  }
}

# Which buttons to offer somebody who has typed their email and not yet signed in.
#
# PUBLIC because there is no caller to authenticate yet, and that is the cost of the design:
# the answer distinguishes an address that has an account from one that does not, so this
# endpoint can be asked whether somebody is a member.
#
# App Check is what is meant to keep that to real browsers, and initializing it in the bundle
# only attaches a token: **enforcement has to be switched on for Data Connect in the Firebase
# console**, and until it is, this endpoint enumerates registered emails to anyone who calls
# it directly. That is a deployment prerequisite, not something this file can assert.
#
# It returns the providers and nothing else. The row's existence is inherent to the question,
# so nothing is gained by leaking a name or an id alongside it
query GetAuthenticationProvidersByEmail($email: String!)
@auth(
  level: PUBLIC
  insecureReason: "The sign-in screen has to know which button to offer before anybody has signed in."
) {
  users(where: { email: { eq: $email } }, limit: 1) {
    authenticationProviders
  }
}

# Every organization the caller belongs to, and what they are in it.
#
# Rooted at the join table because `role` lives there: the `_via_` relation is typed
# `[Organization!]!` and has nowhere to put one.
#
# `eq_expr` keeps this as safe as `GetCurrentUser`, the uid coming off the token rather than
# from a variable. The generated `limit` defaults to 100
query GetCurrentUserOrganizations @auth(level: USER) {
  userOrganizations(
    where: { userId: { eq_expr: "auth.uid" } }
    # Joined-at order, so the list does not reshuffle between reads. `organizationId` breaks the
    # tie for two rows written in one transaction, which share `request.time`
    orderBy: [{ createdAt: ASC }, { organizationId: ASC }]
  ) {
    role
    # What the reader does there, which their account page shows beside the organization's name
    jobTitle
    organization {
      id
      # What its pages' paths lead with
      slug
      name
      exploredAspects
      logoUrl
      bannerUrl
      color
      brief
      isPublic
      # When it was made, which the build in public page counts its days from
      createdAt
    }
  }
}

# An organization's members and its pending invitations, as the team page lists them.
#
# Both lists are filtered on the caller's own membership, keyed by the uid off the token, so
# somebody outside the organization reads two empty lists rather than its people. Invitations
# come without their `id`, which is the secret in their link: a member sees who was invited, and
# cannot answer for them.
#
# A live query. The page subscribes to it, and each `@refresh` names a mutation that changes one
# of the lists, scoped to the organization both carry. The Today page reads it too, for the top
# priority each member sets, which is why `UpdateTopPriority` is among them. `CreateOrganizationInvitation`,
# `DeleteUnsentOrganizationInvitation` and `DeleteOrganization` are the backend connector's, run
# through the Admin SDK; the last empties both lists, which the page reads as the reader having
# left. A profile edit is not among them: refreshing on every `UpdateCurrentUser` would wake every
# team page for anybody's change of name, so a new name shows on the next load instead. Nor is a
# change to the organization's profile, since this query reads none of them.
#
# Each list is read up to 100 rows, named rather than left to the generated default. The database
# keeps a team at 100 members and pending invitations together (`MAX_TEAM_SIZE` in
# strategydance-core), so neither list is ever cut short
query GetOrganizationTeam($organizationId: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "UpdateOrganizationMemberRole"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "UpdateOrganizationMemberJobTitle"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "UpdateTopPriority"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RemoveOrganizationMember"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "AcceptOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeclineOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "CreateOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteUnsentOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganization"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
) {
  userOrganizations(
    where: {
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    # Joined-at order, as the sidebar lists organizations. `userId` breaks the tie between two
    # rows written in one transaction
    orderBy: [{ createdAt: ASC }, { userId: ASC }]
    limit: 100
  ) {
    role
    jobTitle
    topPriority
    topPriorityUpdatedAt
    user {
      id
      email
      displayName
      imageUrl
    }
  }
  organizationInvitations(
    where: {
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    orderBy: [{ createdAt: ASC }, { email: ASC }]
    limit: 100
  ) {
    email
  }
}

# How the caller's own Today page lists the team's priorities: the order they chose and the ones
# they hid. Keyed by the uid off the token, so there is no shape of this query that reads another
# member's. Null for somebody outside the organization
query GetTodayPreferences($organizationId: UUID!) @auth(level: USER) {
  userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId }) {
    priorityOrder
    hiddenPriorities
  }
}

# The invitation a link opens, for its addressee alone.
#
# The address has to be the one on the caller's token, so somebody holding a link meant for
# another address reads nothing. Nothing here tells an invitation addressed elsewhere from one
# that is gone, and the page says as much.
#
# `USER_EMAIL_VERIFIED`, because the token's address is only the addressee's once it is verified.
# A password sign-up proves nothing about the address it names, so without this, whoever held a
# link could register the invited address before its owner did and read the invitation as them
query GetOrganizationInvitation($id: UUID!) @auth(level: USER_EMAIL_VERIFIED) {
  organizationInvitations(where: { id: { eq: $id }, email: { eq_expr: "auth.token.email" } }, limit: 1) {
    organization {
      id
      name
    }
    invitedBy {
      displayName
      email
    }
  }
}

# Every account, newest first, as the administration's users page lists them.
#
# Only an administrator of Strategy Dance gets an answer. The first field reads the caller's own
# row, keyed by the uid off the token and redacted from the result, and its checks fail the whole
# query for anybody whose row does not carry the flag.
#
# Not live: every sign-up and every change of name would have to refresh it. The page reads it
# again on mount and on focus instead.
#
# Read up to 1000 rows, named rather than left to the generated default of 100, which would cut
# the list short without saying so. Past that the page needs pagination. Each account's
# memberships are read up to the same 1000, since nothing caps how many organizations one account
# creates or joins
query GetAdministrationUsers @auth(level: USER) {
  viewer: user(key: { id_expr: "auth.uid" })
    @redact
    @check(expr: "this != null", message: "Only an administrator of Strategy Dance can list every account") {
    isAdministrator
      @check(expr: "this == true", message: "Only an administrator of Strategy Dance can list every account")
  }
  users(
    # `id` breaks the tie between two accounts created in the same instant
    orderBy: [{ createdAt: DESC }, { id: ASC }]
    limit: 1000
  ) {
    id
    email
    displayName
    imageUrl
    authenticationProviders
    isAdministrator
    createdAt
    # Joined-at order, as the sidebar lists organizations
    userOrganizations_on_user(orderBy: [{ createdAt: ASC }, { organizationId: ASC }], limit: 1000) {
      organization {
        id
        name
      }
    }
  }
}

# Every organization, newest first, as the administration's organizations page lists them.
#
# Guarded, read and bounded as `GetAdministrationUsers` is: the caller's own row checks the flag
# first, the list is not live, and it stops at 1000 rows. Each organization's members are counted
# rather than read, since the page only says how many there are
query GetAdministrationOrganizations @auth(level: USER) {
  viewer: user(key: { id_expr: "auth.uid" })
    @redact
    @check(expr: "this != null", message: "Only an administrator of Strategy Dance can list every organization") {
    isAdministrator
      @check(expr: "this == true", message: "Only an administrator of Strategy Dance can list every organization")
  }
  organizations(
    # `id` breaks the tie between two organizations created in the same instant
    orderBy: [{ createdAt: DESC }, { id: ASC }]
    limit: 1000
  ) {
    id
    name
    logoUrl
    color
    isPublic
    exploredAspects
    createdAt
    members: userOrganizations_on_organization {
      _count
    }
  }
}

# The caller's task lists in an organization, in the order they put them in, each with how many of
# its tasks are still open, for the pill beside its name. Keyed by the uid off the token, and read
# only while they belong to the organization. A deleted list is left out. A teammate's are
# `GetMemberTaskLists`.
#
# Read up to 100, `MAX_TASK_LISTS` in strategydance-core, which `CreateTaskList` holds them to. The
# tasks themselves are read one list at a time, by `GetTasks`, since a list holds up to 1000
query GetTaskLists($organizationId: UUID!) @auth(level: USER) {
  taskLists(
    where: {
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    # Lists that share a position, as the ones made before lists could move do, keep the order they
    # were made in, and `id` breaks the tie between two made in the same instant
    orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    name
    position
    openTasks: tasks_on_taskList(where: { isDone: { eq: false } }) {
      _count
    }
  }
}

# One of the caller's task lists, its tasks in their order. Scoped as `GetTaskLists` is, through
# the list, so an id that is somebody else's reads nothing. Up to 1000, `MAX_TASKS_PER_LIST` in
# strategydance-core, which `CreateTask` holds a list to
query GetTasks($organizationId: UUID!, $taskListId: UUID!) @auth(level: USER) {
  tasks(
    where: {
      taskListId: { eq: $taskListId }
      taskList: {
        userId: { eq_expr: "auth.uid" }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      }
    }
    # Two tasks added at once can share a position, and then keep the order they were added in
    orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
    limit: 1000
  ) {
    id
    text
    isDone
    position
  }
}

# The caller's task lists in an organization as the build in public page draws them: each with how
# many tasks it holds and how many are done, and the few tasks a card lists, the first ones, the
# first done and the first still open, in their order. Counts rather than every task, so the page
# reads at most 13 tasks a list whatever a list holds. Scoped as `GetTaskLists` is, and in its order
query GetTaskListSummaries($organizationId: UUID!) @auth(level: USER) {
  taskLists(
    where: {
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    name
    allTasks: tasks_on_taskList {
      _count
    }
    doneTasks: tasks_on_taskList(where: { isDone: { eq: true } }) {
      _count
    }
    firstTasks: tasks_on_taskList(orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }], limit: 6) {
      id
      text
      isDone
    }
    firstDoneTasks: tasks_on_taskList(
      where: { isDone: { eq: true } }
      orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
      limit: 3
    ) {
      id
      text
    }
    firstOpenTasks: tasks_on_taskList(
      where: { isDone: { eq: false } }
      orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
      limit: 4
    ) {
      id
      text
    }
  }
}

# Somebody's task lists in an organization, read only, for the Today page's picker: any member may
# read any member's, and an outsider, or a member reading somebody who left, reads nothing. The
# same lists `GetTaskLists` reads for their owner, in the same order and as many.
#
# The owner's own page keeps `GetTaskLists`, keyed by the token, rather than calling this with their
# own uid: the deployed page calls it, and taking the owner as a variable would break it
query GetMemberTaskLists($organizationId: UUID!, $userId: String!) @auth(level: USER) {
  taskLists(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    name
    position
    openTasks: tasks_on_taskList(where: { isDone: { eq: false } }) {
      _count
    }
  }
}

# One of somebody's task lists, its tasks in their order, read only. Scoped as `GetMemberTaskLists`
# is, through the list, so an id that is not that member's reads nothing
query GetMemberTasks($organizationId: UUID!, $userId: String!, $taskListId: UUID!) @auth(level: USER) {
  tasks(
    where: {
      taskListId: { eq: $taskListId }
      taskList: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
        user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
      }
    }
    orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
    limit: 1000
  ) {
    id
    text
    isDone
    position
  }
}

# Somebody's checklist in an organization, as the Today page opens it: any member may read any
# member's, and an outsider, or a member reading somebody who left, reads nothing.
#
# - `owner` is when they joined and their time zone, which say which rows the table has and which
#   of them is their today
# - `checklistItems` are their live columns in order, each with the days ticked in the last eight,
#   which covers the week the table shows folded in any time zone. The window is the server's
#   today, so the query stays the same across the reader's midnight. Up to 100 columns,
#   `MAX_CHECKLIST_ITEMS` in strategydance-core
# - `earliest` is their oldest tick, so the table can say how many days it would unfold to
# - `anyItem` says whether they ever had a column, deleted ones included, so their own page seeds
#   the default habits once and never again
query GetChecklist($organizationId: UUID!, $userId: String!) @auth(level: USER) {
  owner: userOrganizations(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    limit: 1
  ) {
    createdAt
    user {
      timezone
    }
  }
  checklistItems(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    name
    position
    completions: checklistCompletions_on_checklistItem(
      where: { date: { ge_date: { today: true, sub: { days: 8 } } } }
      orderBy: [{ date: DESC }]
      limit: 10
    ) {
      date
    }
  }
  earliest: checklistCompletions(
    where: {
      checklistItem: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
        user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
      }
    }
    orderBy: [{ date: ASC }]
    limit: 1
  ) {
    date
  }
  anyItem: checklistItems(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    limit: 1
  ) {
    id
  }
}

# Every day somebody ticked each of their live checklist columns, for the table unfolded past the
# week `GetChecklist` reads. Read only when it unfolds, and scoped as that query is. Up to 3660 days
# a column, ten years, `MAX_CHECKLIST_HISTORY_DAYS` in strategydance-core, which is also as far back
# as the table draws: past that it needs pagination
query GetChecklistHistory($organizationId: UUID!, $userId: String!) @auth(level: USER) {
  checklistItems(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    limit: 100
  ) {
    id
    completions: checklistCompletions_on_checklistItem(orderBy: [{ date: DESC }], limit: 3660) {
      date
    }
  }
}

# The days the caller ticked each of their live checklist columns over the last year, for the build
# in public page: its cards lay out a month, and a column's run counts back through the year. The
# window is the server's today, so the query stays the same across the reader's midnight, as
# `GetChecklist`'s does. At most 367 days a column, where `GetChecklistHistory` reads ten years
query GetRecentChecklistTicks($organizationId: UUID!) @auth(level: USER) {
  checklistItems(
    where: {
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    limit: 100
  ) {
    id
    completions: checklistCompletions_on_checklistItem(
      where: { date: { ge_date: { today: true, sub: { days: 366 } } } }
      orderBy: [{ date: DESC }]
      limit: 367
    ) {
      date
    }
  }
}

# A week of an organization's log, newest first, as the Today page's feed reads it: every entry
# from `$from` to `$to` by somebody who is a member now. Outsiders read nothing. The authors' names
# and pictures come from the team, which the page already holds live, so only their ids are read.
#
# Read up to 700 entries, a team of 100 (`MAX_TEAM_SIZE` in strategydance-core) writing every day
# of the week, so a week is never cut short. `older` is the day of the newest entry before the week,
# for the page to jump to when it loads the previous one, past any week nobody wrote in.
#
# A live query, for the newest week: each `@refresh` names a mutation that adds, changes or hides
# an entry. Removing somebody hides theirs, accepting an invitation can show a returning member's
# again, and deleting the organization empties it
query GetOrganizationLog($organizationId: UUID!, $from: Date!, $to: Date!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "CreateLogEntry"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "UpdateLogEntry"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RemoveOrganizationMember"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "AcceptOrganizationInvitation"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganization"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
) {
  logEntries(
    where: {
      organizationId: { eq: $organizationId }
      date: { ge: $from, le: $to }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    # `id` breaks the tie between two entries written in the same instant
    orderBy: [{ date: DESC }, { createdAt: DESC }, { id: ASC }]
    limit: 700
  ) {
    id
    date
    content
    createdAt
    updatedAt
    user {
      id
    }
  }
  older: logEntries(
    where: {
      organizationId: { eq: $organizationId }
      date: { lt: $from }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    orderBy: [{ date: DESC }]
    limit: 1
  ) {
    date
  }
}

# Every day the caller was active in an organization, newest first, for the streak the build in
# public page counts: see `ActivityDay`. Keyed by the uid off the token, and read only while they
# belong to the organization. Up to 3660 days, ten years, as `GetChecklistHistory` reads, past which
# the best streak only looks that far back
query GetActivityDays($organizationId: UUID!) @auth(level: USER) {
  activityDays(
    where: {
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    orderBy: [{ date: DESC }]
    limit: 3660
  ) {
    date
  }
}

# The members of an organization who have written in its log, for the build in public page's
# picker of whose log its cards show: their ids alone, since the entries are read one author at a
# time, by `GetMemberLatestLogEntries`. Read only by a member, as `GetOrganizationLog` is
query GetLogAuthors($organizationId: UUID!) @auth(level: USER) {
  userOrganizations(
    where: {
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { logEntries_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    orderBy: [{ createdAt: ASC }, { userId: ASC }]
    limit: 100
  ) {
    user {
      id
    }
  }
}

# One member's latest entries in an organization's log, newest first, for the build in public
# page's log cards and recap: up to 30, as many as a picker lists, so what the page reads is bound
# by one author whatever the team writes. Read only by a member, and only of a member now, as
# `GetOrganizationLog` is
query GetMemberLatestLogEntries($organizationId: UUID!, $userId: String!) @auth(level: USER) {
  logEntries(
    where: {
      organizationId: { eq: $organizationId }
      userId: { eq: $userId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      user: { userOrganizations_on_user: { exist: { organizationId: { eq: $organizationId } } } }
    }
    orderBy: [{ date: DESC }, { createdAt: DESC }]
    limit: 30
  ) {
    id
    date
    content
    createdAt
    updatedAt
    user {
      id
    }
  }
}

# An organization's knowledge, the latest changed first, as the Knowledge page and each aspect's
# page list it: every document not deleted, without its content, which only the document's own page
# reads. Outsiders read nothing.
#
# Read up to 1000 documents, as many as an organization keeps (`MAX_DOCUMENTS` in
# strategydance-core), so the list is never cut short.
#
# A live query: each `@refresh` names a mutation that adds, hides or reorders a document, or changes
# what a card shows. A save of a document's content is not among them, nor a change to what agents
# may do with it, so somebody writing does not push the whole list to every member with a page open
# at each pause: a card's "Edited" and its place catch up on the next load instead. Removing a
# member empties theirs, and deleting the organization empties everybody's
query GetOrganizationDocuments($organizationId: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "CreateDocument"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RenameDocument"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "UpdateDocumentAspects"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteDocument"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RestoreDocument"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DiscardDocument"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RemoveOrganizationMember"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganization"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
) {
  documents(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    # `id` breaks the tie between two documents changed in the same instant
    orderBy: [{ updatedAt: DESC }, { id: ASC }]
    limit: 1000
  ) {
    id
    title
    aspects
    updatedAt
  }
}

# One document of an organization's knowledge, whole, for its own page. Read only by a member, and
# only while it is not deleted.
#
# Read once as the page opens, and again whenever `GetLiveDocument` says the revision moved: the
# snapshot and the updates pending beside it come in one answer, so a tab merging both has every
# edit, those a compaction deleted before their push reached it included. The live query leaves
# the snapshot out, which would otherwise go to every open tab at each keystroke. A document stored
# before the editor was shared has no `state`, and the page seeds it from `content`. Read up to
# 100 pending updates (`DOCUMENT_UPDATES_LIMIT`), oldest first, twice what a compaction leaves and
# as many as `PushDocumentUpdate` lets pile up, so the read is never cut short
query GetDocument($organizationId: UUID!, $id: UUID!) @auth(level: USER) {
  documents(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    limit: 1
  ) {
    id
    title
    content
    aspects
    isAiReadable
    isAiWritable
    revision
    createdAt
    updatedAt
    state
    documentUpdates_on_document(orderBy: [{ createdAt: ASC }, { id: ASC }], limit: 100) {
      id
      payload
    }
  }
}

# One document's fields and the edits to its text not folded into its snapshot yet, kept live for
# its page: each `@refresh` names a mutation that changes one of them, a push or a compaction above
# all, with the condition that it is this document. The snapshot stays out, read through
# `GetDocument` when `revision` moves, so a keystroke pushes a few small rows rather than the whole
# text to every tab. Deleting the document, or the caller leaving the organization, empties it, and
# taking a delete back fills it again. Up to 100 pending updates, as `GetDocument` reads, of at most
# 50000 characters each, so a push never sends more than a few megabytes to a tab
query GetLiveDocument($organizationId: UUID!, $id: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "PushDocumentUpdate"
    condition: "mutation.variables.documentId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: { operation: "CompactDocument", condition: "mutation.variables.id == request.variables.id" }
)
@refresh(
  onMutationExecuted: { operation: "SeedDocumentState", condition: "mutation.variables.id == request.variables.id" }
)
@refresh(
  onMutationExecuted: { operation: "CreateDocument", condition: "mutation.variables.id == request.variables.id" }
)
@refresh(
  onMutationExecuted: { operation: "RenameDocument", condition: "mutation.variables.id == request.variables.id" }
)
@refresh(
  onMutationExecuted: { operation: "UpdateDocumentAspects", condition: "mutation.variables.id == request.variables.id" }
)
@refresh(
  onMutationExecuted: { operation: "SetDocumentAiReadable", condition: "mutation.variables.id == request.variables.id" }
)
@refresh(
  onMutationExecuted: { operation: "SetDocumentAiWritable", condition: "mutation.variables.id == request.variables.id" }
)
@refresh(
  onMutationExecuted: { operation: "DeleteDocument", condition: "mutation.variables.id == request.variables.id" }
)
@refresh(
  onMutationExecuted: { operation: "RestoreDocument", condition: "mutation.variables.id == request.variables.id" }
)
@refresh(
  onMutationExecuted: { operation: "DiscardDocument", condition: "mutation.variables.id == request.variables.id" }
)
@refresh(
  onMutationExecuted: {
    operation: "RemoveOrganizationMember"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganization"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
) {
  documents(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    limit: 1
  ) {
    title
    aspects
    isAiReadable
    isAiWritable
    revision
    updatedAt
    documentUpdates_on_document(orderBy: [{ createdAt: ASC }, { id: ASC }], limit: 100) {
      id
      payload
    }
  }
}

# Who else has a document open, one row per tab, and where their caret is: the rows written in the
# last 45 seconds, since a tab writes its own every 15 while it is visible. Live, refreshed by each
# write and each leave on this document, and emptied for a member removed from the organization
query GetDocumentPresences($organizationId: UUID!, $id: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "UpdateDocumentPresence"
    condition: "mutation.variables.documentId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: { operation: "LeaveDocument", condition: "mutation.variables.documentId == request.variables.id" }
)
@refresh(
  onMutationExecuted: {
    operation: "RemoveOrganizationMember"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganization"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
) {
  documentPresences(
    where: {
      documentId: { eq: $id }
      updatedAt: { ge_time: { now: true, sub: { seconds: 45 } } }
      document: {
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      }
    }
    limit: 200
  ) {
    sessionId
    cursor
    updatedAt
    user {
      id
      email
      displayName
      imageUrl
    }
  }
}

# The caller's conversations in an organization, latest activity first, as the conversations page
# lists them: each one's title, aspects and preview, never a message's text, which only the
# conversation's own page reads. A conversation is private, so it is keyed by the uid off the token,
# administrators included, and read only while the caller still belongs to the organization, since a
# conversation outlives its author's removal. A deleted one is left out.
#
# Read up to 1000, as many as somebody keeps in an organization (`MAX_CONVERSATIONS` in
# strategydance-core), so the list is never cut short.
#
# A live query. Each `@refresh` names a mutation that adds, hides or reorders a conversation, or
# changes what its row shows, on the variables it carries, so one member's change wakes only their
# own pages. A run's message inserts are not among them: while a run goes the row says "Thinking…"
# from `activeRunId`, and the write that ends it sets the preview the row then shows. Removing a
# member empties theirs, and deleting the organization empties everybody's
query GetConversations($organizationId: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "DeleteConversation"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RestoreConversation"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "UpdateConversationAspects"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "StartConversation"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "SendConversationMessage"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "InterruptDeadConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "FinishConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "FinishConversationRunWithNote"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "InterruptConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "StopQueuedConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RemoveOrganizationMember"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganization"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
) {
  conversations(
    where: {
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    # `id` breaks the tie between two conversations active in the same instant
    orderBy: [{ updatedAt: DESC }, { id: ASC }]
    limit: 1000
  ) {
    id
    title
    aspects
    activeRunId
    isAwaitingAnswer
    preview
    updatedAt
  }
}

# Which of the caller's conversations in an organization wait for their answer, for the sidebar's
# count, read on every page of the app: the ids alone, so it stays small however many conversations
# there are. Read up to 1000, as many as somebody keeps, so the count is exact.
#
# A live query, refreshed only by what sets or clears `isAwaitingAnswer`, and by deleting and
# restoring, which hide and show a conversation that waits. A message inserted during a run never
# wakes it
query GetConversationsAwaitingAnswer($organizationId: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "DeleteConversation"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RestoreConversation"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RemoveOrganizationMember"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganization"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
) {
  conversations(
    where: {
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAwaitingAnswer: { eq: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    limit: 1000
  ) {
    id
  }
}

# One of the caller's conversations, as its page reads it: the conversation's fields and its latest
# 150 messages, newest first, more than a run usually draws, so a run's messages and Retry's
# deletions usually fall inside it. Read only while the caller still belongs to the organization,
# and empty once the conversation is deleted, as every conversation read is.
#
# The messages carry only what is small or changes in place: their kind and position, their run,
# a tool call's name, status and duration, a question's answer, an aspects note's aspects and a
# note's kind. Never their bodies, which never change once written: the page reads each body once,
# by id, through `GetConversationMessageBodies`, so a refresh carries a few hundred bytes a message
# however long the replies. A call's input and output stay out too: its dialog reads them through
# `GetConversationToolCall` as it opens. Older messages are read in pages through
# `GetConversationMessagesBefore`, and `historyRevision`, which only Retry moves, tells the page
# when the pages it holds have to be read again.
#
# A live query. Each `@refresh` names a mutation that changes the conversation or its messages,
# matched on its author and its id, and the backend's run mutations join them as they arrive.
# Marking it read does not wake it: the page never shows the count, and every tab would be sent the
# whole tail after each reply. Removing a member empties theirs, and deleting the organization
# empties everybody's
query GetConversation($organizationId: UUID!, $id: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "DeleteConversation"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.id == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RestoreConversation"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.id == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "UpdateConversationAspects"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.id == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "StartConversation"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "SendConversationMessage"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "InterruptDeadConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DrawConversationAgentText"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "FinishConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "FinishConversationRunWithNote"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "InterruptConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DrawConversationAgentTextPiece"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DrawConversationToolCall"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "StopQueuedConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.id"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RemoveOrganizationMember"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganization"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
) {
  conversations(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    limit: 1
  ) {
    id
    title
    aspects
    aspectsSetBy
    activeRunId
    isAwaitingAnswer
    previewMessageId
    unreadCount
    nextMessagePosition
    messageCount
    historyRevision
    isFull
    createdAt
    updatedAt
    # `CONVERSATION_TAIL_LENGTH` in the web package
    conversationMessages_on_conversation(orderBy: [{ position: DESC }], limit: 150) {
      id
      kind
      position
      run {
        id
      }
      createdAt
      toolName
      toolStatus
      toolDurationMs
      answerSelected
      answerOther
      isAnswerSkipped
      answeredAt
      aspects
      aspectsSetBy
      noteKind
    }
  }
}

# The bodies of some of a conversation's messages, by id, which never change once written: a text's
# Markdown and its citations, and a question's prompt and options. Read once per message, as its id
# first appears on the page, up to 50 at a time. Only the caller's own conversation's messages come
# back, so an id from anywhere else reads nothing
query GetConversationMessageBodies($organizationId: UUID!, $id: UUID!, $messageIds: [UUID!]!) @auth(level: USER) {
  conversationMessages(
    where: {
      id: { in: $messageIds }
      conversationId: { eq: $id }
      conversation: {
        userId: { eq_expr: "auth.uid" }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      }
    }
    # `CONVERSATION_BODIES_LENGTH` in the web package
    limit: 50
  ) {
    id
    text
    citations
    questionPrompt
    questionOptions
    isMultipleChoice
  }
}

# The 100 messages of a conversation before a position, newest first, bodies included, read once
# when the reader scrolls up to them, or again when `historyRevision` has moved. The revision comes
# with them, so the page knows which history they belong to. The two are read apart, and either
# order is safe: messages newer than their revision are still right, and a revision newer than the
# page's is one a pushed tail is about to bring, so the page drops what it read
query GetConversationMessagesBefore($organizationId: UUID!, $id: UUID!, $beforePosition: Int!) @auth(level: USER) {
  conversations(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    limit: 1
  ) {
    historyRevision
  }
  conversationMessages(
    where: {
      conversationId: { eq: $id }
      position: { lt: $beforePosition }
      conversation: {
        userId: { eq_expr: "auth.uid" }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      }
    }
    orderBy: [{ position: DESC }]
    # `CONVERSATION_PAGE_LENGTH` in the web package
    limit: 100
  ) {
    id
    kind
    position
    run {
      id
    }
    createdAt
    toolName
    toolStatus
    toolDurationMs
    answerSelected
    answerOther
    isAnswerSkipped
    answeredAt
    aspects
    aspectsSetBy
    noteKind
    text
    citations
    questionPrompt
    questionOptions
    isMultipleChoice
  }
}

# A conversation's latest run, the one with the highest number, whose status says whether Strategy
# Dance is working and whose step is the progress line it shows meanwhile, or that it is stopping
# once its member asked. A queued run is timed from `createdAt`.
#
# A live query of its own, so the progress lines and lease renewals a run writes wake this small
# read rather than the thread. The backend's run mutations join its `@refresh` list as they arrive
query GetConversationRun($organizationId: UUID!, $conversationId: UUID!)
@auth(level: USER)
@refresh(
  onMutationExecuted: {
    operation: "DeleteConversation"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.id == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RestoreConversation"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.id == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "StartConversation"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "SendConversationMessage"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "InterruptDeadConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "ClaimQueuedConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "ReclaimConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RenewConversationRunLease"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "StoreConversationTurn"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DrawConversationAgentText"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "FinishConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "FinishConversationRunWithNote"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "InterruptConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "StoreConversationTurnWithContext"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DrawConversationAgentTextPiece"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DrawConversationToolCall"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RenewQueuedConversationRunLease"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "ExpireQueuedConversationRunLease"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RequestConversationRunStop"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "StopQueuedConversationRun"
    condition: "mutation.variables.userId == request.auth.uid && mutation.variables.conversationId == request.variables.conversationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "RemoveOrganizationMember"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
)
@refresh(
  onMutationExecuted: {
    operation: "DeleteOrganization"
    condition: "mutation.variables.organizationId == request.variables.organizationId"
  }
) {
  conversationRuns(
    where: {
      conversationId: { eq: $conversationId }
      conversation: {
        userId: { eq_expr: "auth.uid" }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      }
    }
    orderBy: [{ number: DESC }]
    limit: 1
  ) {
    id
    number
    status
    trigger
    step
    createdAt
    startedAt
    leaseExpiresAt
    stopRequestedAt
  }
}

# One tool call's input and output, as its dialog shows them, read each time the dialog opens since
# a call's output arrives after its message. Both are JSON text, exactly as the call took and gave
# them
query GetConversationToolCall($organizationId: UUID!, $messageId: UUID!) @auth(level: USER) {
  conversationMessages(
    where: {
      id: { eq: $messageId }
      kind: { eq: TOOL_CALL }
      conversation: {
        userId: { eq_expr: "auth.uid" }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      }
    }
    limit: 1
  ) {
    id
    toolName
    toolStatus
    toolInput
    toolOutput
    toolStartedAt
    toolDurationMs
    createdAt
  }
}
