# What inviting people to an organization has to know first, in one read:
#
# - the caller's membership, which says whether they may invite, and names them and the
#   organization for the email
# - the team as it stands, members and pending invitations, which says whether any of the
#   addresses is taken and whether the team has room
# - the invitations the caller sent in the last hour, newest first, which says whether they have
#   room for more and when they will. Read to 200, `MAX_INVITATIONS_PER_HOUR` in the backend:
#   past that, a request is refused whatever the rest are, and when it fits depends only on the
#   newest 200
#
# The two lists are read whole: the database keeps a team at 100 of both together, so a limit of
# 100 each is never a cut. `$userId` is the uid the backend verified, never one a client sent
query GetOrganizationInvitationContext($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    role
    user {
      displayName
      email
    }
    organization {
      name
    }
  }
  userOrganizations(where: { organizationId: { eq: $organizationId } }, limit: 100) {
    user {
      email
    }
  }
  organizationInvitations(where: { organizationId: { eq: $organizationId } }, limit: 100) {
    email
  }
  sentInvitations(
    where: { invitedById: { eq: $userId }, createdAt: { ge_time: { now: true, sub: { hours: 1 } } } }
    orderBy: [{ createdAt: DESC }]
    limit: 200
  ) {
    createdAt
  }
}

# Who the welcome email goes to and what it calls them, once the backend has claimed it
query GetWelcomeEmailRecipient($userId: String!) @auth(level: NO_ACCESS) {
  user(key: { id: $userId }) {
    email
    displayName
  }
}

# What somebody is in an organization, so a route only an administrator may call can refuse
# everybody else before it reads a body or touches Storage. The mutation behind the route checks
# again in its own transaction: this is the early answer, not the guard
query GetOrganizationMembership($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    role
  }
}

# Whether Strategy Dance's staff suspended conversations for the account, or in the organization,
# which the routes that start or continue a run refuse (`conversationsSuspensionMiddleware`)
query GetConversationsSuspension($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  user(key: { id: $userId }) {
    conversationsSuspendedAt
  }
  organization(id: $organizationId) {
    conversationsSuspendedAt
  }
}

# The account an address names, which staff's `bun run suspend:conversations` reads by the address
# they typed, lowercased as Firebase writes it
query GetUserByEmail($email: String!) @auth(level: NO_ACCESS) {
  users(where: { email: { eq: $email } }, limit: 1) {
    id
    email
    conversationsSuspendedAt
  }
}

# An organization by its id, and below by its slug, which staff's `bun run suspend:conversations`
# reads by what they typed: two queries, since a filter on an optional variable left out is dropped
# and would match every organization
query GetOrganizationById($id: UUID!) @auth(level: NO_ACCESS) {
  organization(id: $id) {
    id
    name
    slug
    conversationsSuspendedAt
  }
}

query GetOrganizationBySlug($slug: String!) @auth(level: NO_ACCESS) {
  organizations(where: { slug: { eq: $slug } }, limit: 1) {
    id
    name
    slug
    conversationsSuspendedAt
  }
}

# What sending a message to a conversation has to know first, in one read:
#
# - the caller's membership, whose `createdAt` the run records, so a member removed and invited
#   back never passes for the one who sent
# - the conversation, when it exists: whose it is, whether it is deleted, the run in flight, its
#   counters and whether it is full
# - its transcript's last entry, after which the message's entry goes, and whose calls left open,
#   questions waiting or calls a stop kept from running, it answers first, and its latest run,
#   which it consumes when that run waits for an answer
# - the message by the id the browser made for it, when a send with that id went through already,
#   with the run it started, so a retried send answers with that run
# - the caller's runs in flight in the organization, deleted conversations' included, each with its
#   lease, so the dead ones are finalized before they are counted. Never more than 3
#   (`MAX_ACTIVE_RUNS_PER_MEMBER` in strategydance-core), since every start counts them under a lock
# - how many conversations the caller keeps there, deleted ones aside, so a send that would start
#   one past the 1000 (`MAX_CONVERSATIONS`) is refused as such. `StartConversation` counts them again
#   under its lock
#
# Subagents are left out of both counts, and a subagent's `parentId` refuses the send: no member
# writes in one
#
# `$userId` is the uid the backend verified, never one a client sent
query GetConversationSendContext($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $messageId: UUID!)
@auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  # The reports of its live subagents waiting to be delivered, oldest first, which the entry carries
  # after every result of the turn, those of a batch still working included
  waitingReports: conversations(
    where: {
      parentId: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      reportedAt: { isNull: false }
      reportDeliveredAt: { isNull: true }
    }
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    title
    report
    latestRuns: conversationRuns_on_conversation(orderBy: [{ number: DESC }], limit: 1) {
      status
    }
  }
  conversation(id: $conversationId) {
    userId
    organizationId
    deletedAt
    activeRunId
    nextMessagePosition
    nextRunNumber
    messageCount
    isFull

    # A subagent's parent, null on every other conversation
    parentId
  }
  conversationTranscriptEntries(
    where: { conversationId: { eq: $conversationId } }
    orderBy: [{ position: DESC }]
    limit: 1
  ) {
    id
    position
    role
    content
  }
  # The latest run, whose turn the message answers the open calls of first, and which it consumes
  # when it waits for an answer
  latestRuns: conversationRuns(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 1
  ) {
    id
    status
  }
  # The message's kind is selected at the top level of the operation, which is what has the
  # generated SDK declare its enum, here and for the other operations of the connector
  conversationMessages(where: { id: { eq: $messageId } }, limit: 1) {
    kind
    conversation {
      id
      userId
      organizationId
    }
    run {
      id
      status
      leaseExpiresAt
    }
  }
  conversationRuns(
    where: {
      status: { in: [QUEUED, RUNNING] }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: true } }
    }
    limit: 3
  ) {
    id
    status
    leaseExpiresAt
    conversation {
      id
    }
  }
  keptConversations: conversations(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      parentId: { isNull: true }
    }
  ) {
    _count
  }
}

# The usage ledgers of some runs of the caller's conversation, which say how each part they stored
# of a turn ended: the runs a resumed run carries the turn of, after crashes that each left a part
# paused
query GetConversationRunLedgers($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $runIds: [UUID!]!)
@auth(level: NO_ACCESS) {
  conversationRuns(
    where: {
      id: { in: $runIds }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 100
  ) {
    id
    usage
  }
}

# What a resume or a retry reads of a conversation before it starts a run on a run that ended:
#
# - the caller's membership, whose `createdAt` the run records
# - the conversation's counters, and which run it has in flight
# - its two latest runs: the one a resume or a retry acts on, and the one it started already when
#   it is sent again after its first try went through, with the results of the calls their turn
#   finished, which a resumed run carries on
# - the caller's runs in flight in the organization, which a dead one among is finalized before
#   they are counted
# - its two newest messages that are not aspects notes: a stopped note to resume, and what the
#   preview shows once it goes, with what the preview is built from
#
# Only the caller's conversation in that organization
query GetConversationRunControlContext($organizationId: UUID!, $userId: String!, $conversationId: UUID!)
@auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  conversation(id: $conversationId) {
    userId
    organizationId
    deletedAt
    activeRunId
    nextRunNumber
    nextMessagePosition
    messageCount
    historyRevision

    # A subagent's parent, null on every other conversation
    parentId
  }
  latestRuns: conversationRuns(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 2
  ) {
    id
    number
    trigger
    status
    anchorPosition
    leaseExpiresAt
    pendingToolResults
  }
  conversationRuns(
    where: {
      status: { in: [QUEUED, RUNNING] }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: true } }
    }
    limit: 3
  ) {
    id
    status
    leaseExpiresAt
    conversation {
      id
    }
  }
  latestMessages: conversationMessages(
    where: {
      kind: { ne: ASPECTS }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: DESC }]
    limit: 2
  ) {
    id
    kind
    position
    text
    noteKind
    ceilingScope
    ceilingFreesAt
    toolName
    toolStatus
    questionPrompt
    answerSelected
    answerOther
    isAnswerSkipped
    integrationName
    integrationToolName
    approvalState
    run {
      id
    }
    # A message of files alone is previewed by their names, in the order it sends them
    conversationAttachments_on_message(orderBy: [{ createdAt: ASC }, { id: ASC }], limit: 10) {
      name
    }
  }
  # Whether a message follows the newest that is not an aspects note, which a resume refuses
  newestMessages: conversationMessages(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: DESC }]
    limit: 1
  ) {
    id
  }
}

# What a retry reads of the runs on the anchor it goes back to, the member's entry the retried run
# answers, besides the control context:
#
# - the runs on that anchor, the retried run and those it resumed, latest first, which a retry
#   received again answers with, the messages they drew being gone already
# - how many messages those runs drew, which the retry deletes, and the run of each, newest first,
#   which the page drops: as many as a conversation can hold, past its 2000 by what the last runs
#   drew. The member's message that started one names it too, and stays
# - the newest message the retry keeps that is not an aspects note, which the preview then shows
#
# Only the caller's conversation in that organization
query GetConversationRetryContext(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $anchorPosition: Int!
) @auth(level: NO_ACCESS) {
  anchorRuns: conversationRuns(
    where: {
      anchorPosition: { eq: $anchorPosition }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 100
  ) {
    id
  }
  drawnMessages: conversationMessages(
    where: {
      kind: { ne: MEMBER_TEXT }
      run: { anchorPosition: { eq: $anchorPosition } }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
  ) {
    _count
  }
  drawnRuns: conversationMessages(
    where: {
      kind: { ne: MEMBER_TEXT }
      run: { anchorPosition: { eq: $anchorPosition } }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: DESC }]
    limit: 5000
  ) {
    run {
      id
    }
  }
  keptMessages: conversationMessages(
    # One `_and`, because a filter cannot put `_or` beside plain fields
    where: {
      _and: [
        {
          conversation: {
            id: { eq: $conversationId }
            userId: { eq: $userId }
            organizationId: { eq: $organizationId }
          }
        }
        { kind: { ne: ASPECTS } }
        {
          _or: [
            { runId: { isNull: true } }
            { kind: { eq: MEMBER_TEXT } }
            { run: { anchorPosition: { ne: $anchorPosition } } }
          ]
        }
      ]
    }
    orderBy: [{ position: DESC }]
    limit: 1
  ) {
    id
    kind
    text
    noteKind
    ceilingScope
    ceilingFreesAt
    toolName
    toolStatus
    questionPrompt
    answerSelected
    answerOther
    isAnswerSkipped
    integrationName
    integrationToolName
    approvalState
    # A message of files alone is previewed by their names, in the order it sends them
    conversationAttachments_on_message(orderBy: [{ createdAt: ASC }, { id: ASC }], limit: 10) {
      name
    }
  }
}

# What a worker reads of a run before each step it takes, in one read:
#
# - the run, matched with the conversation, its author and its organization it was queued for, so a
#   worker told of a run elsewhere finds nothing
# - the conversation: whether it is deleted, the run it names, its counter and how many messages it
#   holds, and whether it is a subagent, whose run sends its own prompt and tools and writes a report
# - the author's membership, whose `createdAt` has to be the one the run records, and whether staff
#   suspended conversations for their account or in the organization, which a worker claims no run of
# - the transcript's last entry, with how many of its blocks the thread has drawn, which is where a
#   worker taking over after a crash carries on
# - the messages the run has drawn, which it may draw 100 of (`MAX_CONVERSATION_RUN_ENTRIES` in
#   strategydance-core): the member's message that started it is not one, nor a subagent's brief
# - the run's context, once built, and its usage, with each request it reserved and settled
# - the run's latest replies in the transcript, which the worker stores once each
#
# The reconcile route reads it too, with the caller the backend verified as `$userId`
query GetConversationRunContext($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $runId: UUID!)
@auth(level: NO_ACCESS) {
  conversationRuns(
    where: {
      id: { eq: $runId }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 1
  ) {
    id
    number
    trigger
    status
    attempts
    createdAt
    startedAt
    membershipCreatedAt
    leaseExpiresAt
    stopRequestedAt
    anchorPosition
    context
    usage
  }
  # Who set its aspects, which says whether the first exchange's run tags it
  conversation(id: $conversationId) {
    deletedAt
    activeRunId
    nextMessagePosition
    messageCount
    previewMessageId
    aspectsSetBy

    # A subagent's parent, null on every other conversation
    parentId
  }
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  user(key: { id: $userId }) {
    conversationsSuspendedAt
  }
  organization(id: $organizationId) {
    conversationsSuspendedAt
  }
  conversationTranscriptEntries(
    where: { conversationId: { eq: $conversationId } }
    orderBy: [{ position: DESC }]
    limit: 1
  ) {
    id
    position
    role
    content
    drawnBlocks
    drawnPieces
    run {
      id
    }
  }
  # The run's latest replies, newest first, which a write refused partway stored some of: a turn
  # holds a few parts at most, and a run that calls tools stores a turn for each request
  runEntries: conversationTranscriptEntries(
    where: { conversationId: { eq: $conversationId }, runId: { eq: $runId }, role: { eq: ASSISTANT } }
    orderBy: [{ position: DESC }]
    limit: 10
  ) {
    id
    position
    content
    drawnBlocks
    drawnPieces
  }
  # A note's kind is selected at the top level here, which has the generated SDK declare its enum
  conversationMessages(where: { runId: { eq: $runId }, kind: { nin: [MEMBER_TEXT, BRIEF] } }, limit: 100) {
    id
    kind
    noteKind
    toolStatus
  }
}

# The calls of the turn a conversation's transcript ends on, by the ids Claude gave them, as the
# thread draws them: the questions with their answers, the calls to Strategy Dance's own tools with
# their status, their output and whether they started, and the calls to integrations with their
# approval and what it was bound to. And the latest run, with the results of
# the calls of that turn which finished, kept until the entry that sends them is stored. What the
# worker reads before it runs a turn's calls, and what a send, a resume and a continuation read
# before they answer them. Only the caller's conversation in that organization
query GetConversationCalls($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $toolUseIds: [String!]!)
@auth(level: NO_ACCESS) {
  conversationMessages(
    where: {
      toolUseId: { in: $toolUseIds }
      kind: { in: [TOOL_CALL, QUESTION, APPROVAL] }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: ASC }]
    limit: 1000
  ) {
    id
    kind
    toolUseId
    toolName
    toolStatus
    toolOutput
    toolStartedAt
    questionOptions
    isMultipleChoice
    answerSelected
    answerOther
    isAnswerSkipped
    answeredAt
    integrationId
    integrationName
    integrationToolName
    approvalState
    approvalConfigRevision
    approvalToolHash
    approvalCredentialGeneration
  }
  latestRuns: conversationRuns(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 1
  ) {
    id
    status
    pendingToolResults
  }
}

# What answering a question, and carrying a conversation on once its questions are answered, read
# of it first, in one read:
#
# - the caller's membership, whose `createdAt` the run records
# - the conversation: whose it is, whether it is deleted, whether it waits for an answer, the run in
#   flight, which message its preview shows and its run counter
# - its two latest runs: the one waiting, and the one a continuation started already, when it is
#   reached again
# - the caller's runs in flight in the organization, which a dead one among is finalized before
#   they are counted
# - its transcript's last entry, the turn whose calls the answers go back with
# - the questions still waiting, conversation-wide, since only the turn it ends on can hold any
#
# Only the caller's conversation in that organization
query GetConversationTurnContext($organizationId: UUID!, $userId: String!, $conversationId: UUID!)
@auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  # The reports of its live subagents waiting to be delivered, oldest first, which the entry carries
  # after every result of the turn, those of a batch still working included
  waitingReports: conversations(
    where: {
      parentId: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      reportedAt: { isNull: false }
      reportDeliveredAt: { isNull: true }
    }
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    title
    report
    latestRuns: conversationRuns_on_conversation(orderBy: [{ number: DESC }], limit: 1) {
      status
    }
  }
  conversation(id: $conversationId) {
    userId
    organizationId
    deletedAt
    activeRunId
    isAwaitingAnswer
    previewMessageId
    nextRunNumber

    # A subagent's parent, null on every other conversation
    parentId
  }
  latestRuns: conversationRuns(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 2
  ) {
    id
    number
    trigger
    status
    leaseExpiresAt
    # Where the run that waits was anchored, which a run carrying its turn on to make the calls its
    # member allowed is anchored on too, until it stores the turn's results
    anchorPosition
  }
  conversationRuns(
    where: {
      status: { in: [QUEUED, RUNNING] }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: true } }
    }
    limit: 3
  ) {
    id
    status
    leaseExpiresAt
    conversation {
      id
    }
  }
  conversationTranscriptEntries(
    where: {
      conversationId: { eq: $conversationId }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: DESC }]
    limit: 1
  ) {
    id
    position
    role
    content
  }
  # The questions, and the calls waiting for the member's approval, of the turn: what the member
  # answers before the conversation goes on
  waitingQuestions: conversationMessages(
    where: {
      kind: { in: [QUESTION, APPROVAL] }
      answeredAt: { isNull: true }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 1000
  ) {
    id
  }
}

# A call to an integration waiting for the caller's approval, by its id, as Allow and Deny read it:
# what the approval is bound to, which Allow checks against the server as it is, and its answer once
# it has one, so a decision sent again is told from another
query GetConversationApproval($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $messageId: UUID!)
@auth(level: NO_ACCESS) {
  conversationMessages(
    where: {
      id: { eq: $messageId }
      kind: { eq: APPROVAL }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 1
  ) {
    id
    toolUseId
    toolStatus
    toolOutput
    integrationId
    integrationName
    integrationToolName
    approvalState
    approvalConfigRevision
    approvalToolHash
    approvalCredentialGeneration
    answeredAt
  }
}

# A question of the caller's conversation, by its id, as an answer is checked against it: its
# options, whether several may be chosen, and its answer once it has one. Its kind is selected at
# the top level, which has the generated SDK declare its enum
query GetConversationQuestion($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $messageId: UUID!)
@auth(level: NO_ACCESS) {
  conversationMessages(
    where: {
      id: { eq: $messageId }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 1
  ) {
    id
    kind
    toolUseId
    questionPrompt
    questionOptions
    isMultipleChoice
    answerSelected
    answerOther
    isAnswerSkipped
    answeredAt
  }
}

# Whether a run's member asked it to stop, which its worker reads every two seconds while a request
# streams, in the caller's conversation
query GetConversationRunStop($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $runId: UUID!)
@auth(level: NO_ACCESS) {
  conversationRuns(
    where: {
      id: { eq: $runId }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 1
  ) {
    status
    stopRequestedAt
  }
}

# A batch of the conversations the daily sweep has claimed and not deleted yet, whoever's they are,
# which it deletes next. Only those still deleted over a day ago, as the delete takes them. Twenty
# at a time, since each holds up to 2000 messages, which go with it. Its author and organization say
# which of the files uploaded under its id are its own
query GetClaimedConversations @auth(level: NO_ACCESS) {
  conversations(
    where: {
      pruneClaimedAt: { isNull: false }
      deletedAt: { lt_time: { now: true, sub: { days: 1 } } }
      parentId: { isNull: true }
    }
    limit: 20
  ) {
    id
    userId
    organizationId
  }
}

# A batch of the subagents the daily sweep has claimed and not deleted yet, which it prunes before
# any parent, each parent's together, its own `subagentCount` lowered by as many. Only those still
# deleted over a day ago, as the delete takes them. A hundred at a time, a parent's most, since a
# subagent's thread is a few hundred messages at most
query GetClaimedSubagents @auth(level: NO_ACCESS) {
  conversations(
    where: {
      pruneClaimedAt: { isNull: false }
      deletedAt: { lt_time: { now: true, sub: { days: 1 } } }
      parentId: { isNull: false }
    }
    orderBy: [{ parentId: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    parentId
  }
}

# Which of the conversations a prune is about to delete still hold a subagent, claimed or not, which
# it keeps for the next sweep rather than leave the subagent a conversation of its own: the parents
# themselves, so a limit never cuts one off, as one on their subagents' rows could, twenty claimed
# parents holding up to 100 subagents each
query GetConversationsWithSubagents($ids: [UUID!]!) @auth(level: NO_ACCESS) {
  conversations(
    where: { id: { in: $ids }, conversations_on_parent: { exist: { id: { isNull: false } } } }
    limit: 100
  ) {
    id
  }
}

# The subagents of a parent a stop or a retry reaches, those launched on `$anchorPosition`, or named
# by `$subagentIds`, or every one when both are left out, deleted ones included, since a retry deletes
# them as it stops them, each with the run it is busy with, which the backend ends at once when it is
# queued or waiting for a slot, and asks to stop again when a chain swapped it meanwhile
query GetSubagentsToStop(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $anchorPosition: Int
  $subagentIds: [UUID!]
) @auth(level: NO_ACCESS) {
  conversations(
    where: {
      id: { in: $subagentIds }
      parentId: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      launchAnchorPosition: { eq: $anchorPosition }
      activeRunId: { isNull: false }
    }
    limit: 100
  ) {
    id
    activeRunId
    latestRuns: conversationRuns_on_conversation(orderBy: [{ number: DESC }], limit: 1) {
      id
      status
      stopRequestedAt
    }
  }
}

# A page of a conversation's transcript, after a position, in order, which the worker reads whole
# before each request to Claude, and from a run's anchor for the turn it draws: each entry's
# content as the JSON text it was sent as, with its role, its run, how much of it the thread has
# drawn and, on a context message, the hash of its profile part. A hundred at a time, since
# a reply that searched the web carries its encrypted results. Only the caller's conversation in
# that organization, whose author `$userId` is, as the backend verified it
query GetConversationTranscript($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $afterPosition: Int!)
@auth(level: NO_ACCESS) {
  conversationTranscriptEntries(
    where: {
      conversationId: { eq: $conversationId }
      position: { gt: $afterPosition }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: ASC }]
    limit: 100
  ) {
    id
    position
    role
    content
    contextHash
    drawnBlocks
    drawnPieces
    run {
      id
    }
  }
}

# What a run's request to Claude is built and measured from, besides the transcript:
#
# - the member, their membership and the organization, which the context message tells Claude of:
#   the member's name, time zone, language, bio, role and job title, and the organization's name,
#   brief and explored aspects
# - the conversation's aspects, or a subagent's parent's, which its context message names
# - its 20 latest runs' usage, whose latest request with its reply still in the transcript the
#   measurement starts from, so a conversation about to pass Claude's context is marked full
# - its sent files' ids in the Files API with their tokens, counted once when each was stored, which
#   the measurement adds in place of the file blocks the count endpoint refuses. At most 100
#   (`MAX_CONVERSATION_ATTACHMENTS` in strategydance-core)
# - a subagent's parent's sent files the same way, whose brief hands some of them over: the files
#   sent by a message of the conversation that launched this one, never one waiting in a draft
#
# `$userId` is the uid the backend verified, never one a client sent
query GetConversationRequestContext($organizationId: UUID!, $userId: String!, $conversationId: UUID!)
@auth(level: NO_ACCESS) {
  user(key: { id: $userId }) {
    displayName
    timezone
    locale
    bio
  }
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    role
    jobTitle
  }
  organization(id: $organizationId) {
    name
    brief
    exploredAspects
  }
  conversations(
    where: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    limit: 1
  ) {
    aspects
    parent {
      aspects
    }
  }
  conversationRuns(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 20
  ) {
    id
    usage
  }
  conversationAttachments(
    where: {
      conversationId: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      messageId: { isNull: false }
    }
    limit: 100
  ) {
    claudeFileId
    tokenCount
  }
  parentAttachments: conversationAttachments(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      message: { conversation: { conversations_on_parent: { exist: { id: { eq: $conversationId } } } } }
    }
    limit: 100
  ) {
    claudeFileId
    tokenCount
  }
}

# What a launch reads before it launches a subagent of one of the caller's conversations, in one
# read:
#
# - the caller's membership, whose `createdAt` the subagent's runs record
# - the parent: whose it is, whether it is deleted or a subagent itself, which launches none, and
#   how many subagents it holds, at most 100 (`MAX_CONVERSATION_SUBAGENTS` in strategydance-core)
# - its latest run's anchor, which a launch made from no run is made on
# - its live subagents' anchors, at most 100, which the 10 on one anchor are counted from
#   (`MAX_SUBAGENTS_PER_ACTION`), those a retry deleted left out
# - the files the launch hands over, among the parent's: whether each is stored and sent, and what
#   its brief's block and the measurement of its first request read of it. At most 10
# - the subagent at the id the launch derives, with its first run, when a launch sent again made it
#   already
# - whether staff suspended conversations for the caller's account or in the organization, which
#   launches nothing
#
# `$userId` is the uid the backend verified, never one a client sent
query GetSubagentLaunchContext(
  $organizationId: UUID!
  $userId: String!
  $parentId: UUID!
  $subagentId: UUID!
  $attachmentIds: [UUID!]!
) @auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  user(key: { id: $userId }) {
    conversationsSuspendedAt
  }
  organization(id: $organizationId) {
    conversationsSuspendedAt
  }
  parent: conversation(id: $parentId) {
    userId
    organizationId
    deletedAt
    parentId
    subagentCount
  }
  latestRuns: conversationRuns(
    where: { conversation: { id: { eq: $parentId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } } }
    orderBy: [{ number: DESC }]
    limit: 1
  ) {
    anchorPosition
  }
  subagents: conversations(
    where: {
      parentId: { eq: $parentId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
    }
    limit: 100
  ) {
    launchAnchorPosition
  }
  files: conversationAttachments(
    where: {
      id: { in: $attachmentIds }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      conversationId: { eq: $parentId }
    }
    limit: 10
  ) {
    id
    status
    messageId
    name
    contentType
    tokenCount
    claudeFileId
    createdAt
  }
  subagent: conversation(id: $subagentId) {
    userId
    organizationId
    parentId
  }
  subagentRuns: conversationRuns(
    where: {
      number: { eq: 0 }
      conversation: { id: { eq: $subagentId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 1
  ) {
    id
    status
    leaseExpiresAt
  }
  # The member's subagent runs holding one of their five slots in the organization, whatever
  # conversation launched them: those past their lease are finalized before a launch counts
  activeSubagentRuns: conversationRuns(
    where: {
      status: { in: [QUEUED, RUNNING] }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: false } }
    }
    limit: 5
  ) {
    id
    status
    leaseExpiresAt
    conversation {
      id
    }
  }
}

# Where a member's subagent runs stand in an organization, across all their conversations, as the
# launch's count and the reconcile read it first:
#
# - the membership's `createdAt`, which a pending run has to have been launched under to be promoted,
#   and which `GetSubagentPendingRuns` then reads the runs waiting by
# - the runs holding one of the member's five slots (`MAX_ACTIVE_SUBAGENT_RUNS_PER_MEMBER`), queued
#   or running, with their lease, which says whether one died
# - the runs waiting for a slot, oldest first, a hundred at a time, which a reconcile ends once the
#   member is no member any more, each with the membership it was launched under, whether it was
#   asked to stop and whether its subagent was deleted
#
# `$userId` is the uid the backend verified, or the author a sweep found
query GetSubagentSlots(
  $organizationId: UUID!
  $userId: String!
  # The waiting runs a reconcile could not end, which it reads past. Optional: left out, nothing is
  # skipped
  $skippedIds: [UUID!]
) @auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  activeRuns: conversationRuns(
    where: {
      status: { in: [QUEUED, RUNNING] }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: false } }
    }
    limit: 5
  ) {
    id
    status
    leaseExpiresAt
    conversation {
      id
    }
  }
  pendingRuns: conversationRuns(
    where: {
      status: { eq: PENDING }
      id: { nin: $skippedIds }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: false } }
    }
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    createdAt
    membershipCreatedAt
    stopRequestedAt
    conversation {
      id
      deletedAt
    }
  }
}

# A member's subagent runs waiting for a slot in an organization, read by the membership they are as
# `GetSubagentSlots` read it, so no number of runs a promotion skips ever hides one it may promote:
#
# - the runs holding one of the member's five slots, as `GetSubagentSlots` reads them
# - the oldest runs a promotion may promote, as many as there are slots: launched under that
#   membership, not asked to stop, and their subagent not deleted
# - the runs it skips, a hundred at a time, which the reconcile ends and reads again until none is
#   left: asked to stop, their subagent deleted, or launched under another membership
#
# `$userId` is the uid the backend verified, or the author a sweep found
query GetSubagentPendingRuns(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  # The runs a reconcile could not end, which it reads past, so a hundred it fails on never hide the
  # rest. Optional: left out, nothing is skipped
  $skippedIds: [UUID!]
) @auth(level: NO_ACCESS) {
  activeRuns: conversationRuns(
    where: {
      status: { in: [QUEUED, RUNNING] }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: false } }
    }
    limit: 5
  ) {
    id
  }
  promotableRuns: conversationRuns(
    where: {
      status: { eq: PENDING }
      membershipCreatedAt: { eq: $membershipCreatedAt }
      stopRequestedAt: { isNull: true }
      conversation: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        parentId: { isNull: false }
        deletedAt: { isNull: true }
      }
    }
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: 5
  ) {
    id
    conversation {
      id
    }
  }
  skippedRuns: conversationRuns(
    # One `_and`, because a filter cannot put `_or` beside plain fields
    where: {
      _and: [
        { status: { eq: PENDING } }
        {
          conversation: {
            userId: { eq: $userId }
            organizationId: { eq: $organizationId }
            parentId: { isNull: false }
          }
        }
        {
          _or: [
            { stopRequestedAt: { isNull: false } }
            { conversation: { deletedAt: { isNull: false } } }
            { membershipCreatedAt: { ne: $membershipCreatedAt } }
          ]
        }
        { id: { nin: $skippedIds } }
      ]
    }
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    membershipCreatedAt
    stopRequestedAt
    conversation {
      id
      deletedAt
    }
  }
}

# The daily sweep's for subagents: who has a subagent run no page may reconcile, past its lease or
# waiting for a slot, in any organization, a hundred accounts at a time, after the last one read, so
# however many runs one member holds, nobody after them is hidden. The sweep reads each one's
# organizations with `GetSubagentSweepOrganizations`, then reconciles each member there
query GetSubagentSweepMembers($afterUserId: String!) @auth(level: NO_ACCESS) {
  users(
    where: {
      id: { gt: $afterUserId }
      conversations_on_user: {
        exist: {
          parentId: { isNull: false }
          conversationRuns_on_conversation: {
            exist: {
              _or: [
                { status: { eq: PENDING } }
                { _and: [{ status: { in: [QUEUED, RUNNING] } }, { leaseExpiresAt: { lt_time: { now: true } } }] }
              ]
            }
          }
        }
      }
    }
    orderBy: [{ id: ASC }]
    limit: 100
  ) {
    id
  }
}

# The organizations in which an account the sweep found has a subagent run no page may reconcile,
# as `GetSubagentSweepMembers` finds them, whether they are still a member there or not
query GetSubagentSweepOrganizations($userId: String!) @auth(level: NO_ACCESS) {
  organizations(
    where: {
      conversations_on_organization: {
        exist: {
          userId: { eq: $userId }
          parentId: { isNull: false }
          conversationRuns_on_conversation: {
            exist: {
              _or: [
                { status: { eq: PENDING } }
                { _and: [{ status: { in: [QUEUED, RUNNING] } }, { leaseExpiresAt: { lt_time: { now: true } } }] }
              ]
            }
          }
        }
      }
    }
    limit: 1000
  ) {
    id
  }
}

# Why `RecordConversationSearch` refused a search: whether the caller is still a member, and their
# searches in the organization in the last ten minutes, newest first, the 120th of which says when
# the next one fits. Read only once a search has been refused. `$userId` is the uid the backend
# verified
query GetConversationSearchQuota($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    role
  }
  conversationSearches(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      createdAt: { gt_time: { now: true, sub: { minutes: 10 } } }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 120
  ) {
    createdAt
  }
}

# What conversations may have cost in the last 24 hours, in microdollars: the member's runs in the
# organization, the account's across every organization, and the organization's, each run at the
# most its ledger may have cost, as its last write recorded it (`RunSpend`). Read by the backend
# before a start stores anything, to hold it to the daily spend ceilings. A sum over no rows is null.
# `$userId` is the uid the backend verified
query GetDailySpend($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  member: runSpends(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      spentAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
  ) {
    costBound_sum
  }
  account: runSpends(where: { userId: { eq: $userId }, spentAt: { gt_time: { now: true, sub: { hours: 24 } } } }) {
    costBound_sum
  }
  organization: runSpends(
    where: { organizationId: { eq: $organizationId }, spentAt: { gt_time: { now: true, sub: { hours: 24 } } } }
  ) {
    costBound_sum
  }
}

# The same three sums, and what the run's own row holds of them, read in one snapshot, so the worker
# about to send one of its requests counts what the scope's other runs may have cost, and adds its
# own ledger as it stands
query GetRunDailySpend($organizationId: UUID!, $userId: String!, $runId: UUID!) @auth(level: NO_ACCESS) {
  member: runSpends(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      spentAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
  ) {
    costBound_sum
  }
  account: runSpends(where: { userId: { eq: $userId }, spentAt: { gt_time: { now: true, sub: { hours: 24 } } } }) {
    costBound_sum
  }
  organization: runSpends(
    where: { organizationId: { eq: $organizationId }, spentAt: { gt_time: { now: true, sub: { hours: 24 } } } }
  ) {
    costBound_sum
  }
  own: runSpends(
    where: { runId: { eq: $runId }, userId: { eq: $userId }, spentAt: { gt_time: { now: true, sub: { hours: 24 } } } }
    limit: 1
  ) {
    costBound
  }
}

# The runs the three sums count, oldest first, each with what it may have cost and when it last
# spent, which leaves the window 24 hours after: read once a ceiling is reached, to say when enough
# of the window's spend leaves it for a request to fit. The 500 oldest, which say it for all but a
# scope past some five hundred runs in a day, whose next try is told again
query GetDailySpendRows($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  member: runSpends(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      spentAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
    orderBy: [{ spentAt: ASC }]
    limit: 500
  ) {
    costBound
    spentAt
  }
  account: runSpends(
    where: { userId: { eq: $userId }, spentAt: { gt_time: { now: true, sub: { hours: 24 } } } }
    orderBy: [{ spentAt: ASC }]
    limit: 500
  ) {
    costBound
    spentAt
  }
  organization: runSpends(
    where: { organizationId: { eq: $organizationId }, spentAt: { gt_time: { now: true, sub: { hours: 24 } } } }
    orderBy: [{ spentAt: ASC }]
    limit: 500
  ) {
    costBound
    spentAt
  }
}

# What the daily caps counted of a member's starts in the last 24 hours, newest first: the member's
# in the organization, the account's across every organization, and the organization's, as each
# mutation that starts a conversation, a run or a subagent counts them. Read by the backend before
# such a start stores anything, and again once a mutation's count refused one, to say which cap it
# reached and when the cap has room, which the oldest of the newest rows, as many as the cap, says.
# Runs are read to one and a half times each cap, which what finishes work under way passes it by,
# conversations and subagents to each cap (`MAX_DAILY_…` and `DAILY_CAP_OVERRUN_FACTOR` in
# strategydance-core: change them together). `$userId` is the uid the backend verified
query GetCappedStarts($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  memberConversations: cappedStarts(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      kind: { eq: CONVERSATION }
      createdAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 20
  ) {
    createdAt
  }
  accountConversations: cappedStarts(
    where: {
      userId: { eq: $userId }
      kind: { eq: CONVERSATION }
      createdAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 40
  ) {
    createdAt
  }
  organizationConversations: cappedStarts(
    where: {
      organizationId: { eq: $organizationId }
      kind: { eq: CONVERSATION }
      createdAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 100
  ) {
    createdAt
  }
  memberRuns: cappedStarts(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      kind: { eq: RUN }
      createdAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 150
  ) {
    createdAt
  }
  accountRuns: cappedStarts(
    where: { userId: { eq: $userId }, kind: { eq: RUN }, createdAt: { gt_time: { now: true, sub: { hours: 24 } } } }
    orderBy: [{ createdAt: DESC }]
    limit: 300
  ) {
    createdAt
  }
  organizationRuns: cappedStarts(
    where: {
      organizationId: { eq: $organizationId }
      kind: { eq: RUN }
      createdAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 750
  ) {
    createdAt
  }
  memberSubagents: cappedStarts(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      kind: { eq: SUBAGENT }
      createdAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 30
  ) {
    createdAt
  }
  accountSubagents: cappedStarts(
    where: {
      userId: { eq: $userId }
      kind: { eq: SUBAGENT }
      createdAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 60
  ) {
    createdAt
  }
}

# The caller's conversations whose title holds every word of the query, through the title's
# full-text index (see `Conversation.title`): `PLAIN` splits the query into words and requires
# them all, in any order. All of them, as somebody keeps at most 1000 conversations in an
# organization. Only their own, while they are a member, and none deleted. `$userId` is the uid the
# backend verified
query SearchConversationTitles($organizationId: UUID!, $userId: String!, $query: String!) @auth(level: NO_ACCESS) {
  conversations_search(
    query: $query
    queryFormat: PLAIN
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      parentId: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq: $userId } } } }
    }
    limit: 1000
  ) {
    id
  }
}

# The member's and the agent's messages, in the caller's conversations, whose text holds every
# word of the query, through the text's full-text index (see `ConversationMessage.text`), most
# relevant first, and only their conversation's id, since the search answers with conversations.
#
# Read once rather than in pages: a `_search` is ordered by its relevance alone, which its
# `orderBy` cannot name, so pages read by offset could repeat a message across a tie at their
# boundary and skip another, and each page would rank every match again anyway. To 5001: the 5000
# most relevant, and one more, which says that a few conversations with thousands of matches used
# up the read, when the backend answers the best matches, and only then. Only the caller's own conversations, while they are a member, and none deleted.
# `$userId` is the uid the backend verified
query SearchConversationMessages($organizationId: UUID!, $userId: String!, $query: String!) @auth(level: NO_ACCESS) {
  conversationMessages_search(
    query: $query
    queryFormat: PLAIN
    where: {
      kind: { in: [MEMBER_TEXT, AGENT_TEXT] }
      conversation: {
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        parentId: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq: $userId } } } }
      }
    }
    limit: 5001
  ) {
    conversationId
  }
}

# The caller's conversations, most recently active first, with how many messages each holds, from
# which the backend picks those whose messages a search by substring reads. Only their own, while
# they are a member, and none deleted. `$userId` is the uid the backend verified
query GetConversationSearchCorpus($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  conversations(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      parentId: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq: $userId } } } }
    }
    # `id` breaks the tie between two conversations active in the same instant
    orderBy: [{ updatedAt: DESC }, { id: ASC }]
    limit: 1000
  ) {
    id
    messageCount
  }
}

# A search by substring, for Chinese and Japanese, which put no space between words, so the
# full-text indexes cannot find a word inside a sentence: the caller's conversations whose title
# matches every pattern, or, among `$recentIds`, holding a member's or an agent's message whose text
# matches every pattern. Each pattern is a LIKE pattern, `%word%` with the word's `%`, `_` and `\`
# escaped, ignoring case. Always eight, one a word: the backend fills those a query leaves over with
# `%`, which matches any text.
#
# No index serves such a match, so it reads a bounded corpus: the titles of at most 1000
# conversations, and the messages of `$recentIds`, the most recently active conversations whose
# messages add up to at most 20000 (`MAX_SUBSTRING_SEARCH_MESSAGES` in strategydance-core). Only
# the caller's own, while they are a member, and none deleted. `$userId` is the uid the backend
# verified
query SearchConversationsBySubstring(
  $organizationId: UUID!
  $userId: String!
  $recentIds: [UUID!]!
  $pattern0: String!
  $pattern1: String!
  $pattern2: String!
  $pattern3: String!
  $pattern4: String!
  $pattern5: String!
  $pattern6: String!
  $pattern7: String!
) @auth(level: NO_ACCESS) {
  conversations(
    # Data Connect refuses `_and` or `_or` beside plain fields, so each level is one or the other
    where: {
      _and: [
        {
          userId: { eq: $userId }
          organizationId: { eq: $organizationId }
          deletedAt: { isNull: true }
          parentId: { isNull: true }
          organization: { userOrganizations_on_organization: { exist: { userId: { eq: $userId } } } }
        }
        {
          _or: [
            {
              _and: [
                { title: { pattern: { like: $pattern0, ignoreCase: true } } }
                { title: { pattern: { like: $pattern1, ignoreCase: true } } }
                { title: { pattern: { like: $pattern2, ignoreCase: true } } }
                { title: { pattern: { like: $pattern3, ignoreCase: true } } }
                { title: { pattern: { like: $pattern4, ignoreCase: true } } }
                { title: { pattern: { like: $pattern5, ignoreCase: true } } }
                { title: { pattern: { like: $pattern6, ignoreCase: true } } }
                { title: { pattern: { like: $pattern7, ignoreCase: true } } }
              ]
            }
            {
              id: { in: $recentIds }
              conversationMessages_on_conversation: {
                exist: {
                  _and: [
                    { kind: { in: [MEMBER_TEXT, AGENT_TEXT] } }
                    { text: { pattern: { like: $pattern0, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern1, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern2, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern3, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern4, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern5, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern6, ignoreCase: true } } }
                    { text: { pattern: { like: $pattern7, ignoreCase: true } } }
                  ]
                }
              }
            }
          ]
        }
      ]
    }
    limit: 1000
  ) {
    id
  }
}

# What an upload of a file to a conversation reads first: the caller's membership, the conversation
# when it exists, a draft's not yet, and the file's row when an upload with its id got there before,
# whoever's it is, so an id somebody else holds is refused. `$userId` is the uid the backend verified
query GetConversationAttachmentUploadContext(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $attachmentId: UUID!
) @auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  conversation(id: $conversationId) {
    userId
    organizationId
    deletedAt
    # A subagent's parent, null on every other conversation
    parentId
  }
  # The status is selected at the top level of the operation, which is what has the generated SDK
  # declare its enum
  conversationAttachment(id: $attachmentId) {
    userId
    organizationId
    conversationId
    messageId
    status
    name
    contentType
    size
    pageCount
  }
}

# A file of the caller's in a conversation, as the route that reads its bytes and the one that
# removes it read it, with the conversation, which a sent file's reader has to own still. Only the
# caller's in that conversation and organization. `$userId` is the uid the backend verified
query GetConversationAttachment($organizationId: UUID!, $userId: String!, $conversationId: UUID!, $attachmentId: UUID!)
@auth(level: NO_ACCESS) {
  conversationAttachments(
    where: {
      id: { eq: $attachmentId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      conversationId: { eq: $conversationId }
    }
    limit: 1
  ) {
    status
    messageId
    name
    contentType
    size
    claudeFileId
  }
  conversation(id: $conversationId) {
    userId
    organizationId
    deletedAt
  }
}

# What a message with files reads of them before it is sent: the files it names, the caller's in that
# conversation and organization, and the files the conversation already holds, which its budget
# counts. At most 10 named (`MAX_CONVERSATION_ATTACHMENTS_PER_MESSAGE`) and 100 held
# (`MAX_CONVERSATION_ATTACHMENTS`). `$userId` is the uid the backend verified
query GetConversationSendAttachments(
  $organizationId: UUID!
  $userId: String!
  $conversationId: UUID!
  $attachmentIds: [UUID!]!
) @auth(level: NO_ACCESS) {
  named: conversationAttachments(
    where: {
      id: { in: $attachmentIds }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      conversationId: { eq: $conversationId }
    }
    limit: 10
  ) {
    id
    status
    messageId
    name
    contentType
    size
    pageCount
    tokenCount
    claudeFileId
    createdAt
  }
  sent: conversationAttachments(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      conversationId: { eq: $conversationId }
      messageId: { isNull: false }
    }
    limit: 100
  ) {
    contentType
    size
    pageCount
  }
}

# The unsent files of the caller's that a prune claimed and has not deleted yet, a hundred at a
# time, with where their bytes lie, which their prune deletes before their rows. `$userId` is the uid
# the backend verified
query GetPruningMemberConversationAttachments($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  conversationAttachments(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      status: { eq: PRUNING }
      messageId: { isNull: true }
    }
    limit: 100
  ) {
    id
    userId
    organizationId
    conversationId
    claudeFileId
  }
}

# The daily sweep's: a hundred of everybody's unsent files that a prune claimed and has not deleted
# yet, as `GetPruningMemberConversationAttachments` reads one member's
query GetPruningConversationAttachments @auth(level: NO_ACCESS) {
  conversationAttachments(where: { status: { eq: PRUNING }, messageId: { isNull: true } }, limit: 100) {
    id
    userId
    organizationId
    conversationId
    claudeFileId
  }
}

# The daily sweep's: every file of a claimed conversation, sent or not, its author's in its
# organization, which the conversation's prune deletes before its rows. At most 100 sent and 30
# unsent, so 200 reads them all
query GetConversationPruneAttachments($organizationId: UUID!, $userId: String!, $conversationId: UUID!)
@auth(level: NO_ACCESS) {
  conversationAttachments(
    where: { conversationId: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    limit: 200
  ) {
    id
    messageId
    claudeFileId
  }
}

# A page of an organization's files' ids in the Files API, in their order, after one, which deleting
# the organization reads before its rows go, to delete the files once they are gone
query GetOrganizationConversationAttachmentFiles($organizationId: UUID!, $afterClaudeFileId: String!)
@auth(level: NO_ACCESS) {
  conversationAttachments(
    where: { organizationId: { eq: $organizationId }, claudeFileId: { gt: $afterClaudeFileId } }
    orderBy: [{ claudeFileId: ASC }]
    limit: 100
  ) {
    claudeFileId
  }
}

# The daily sweep's: which of some ids in the Files API a file's row still names, so the files no row
# names, left by an upload that failed after it sent them, are deleted
query GetConversationAttachmentsByClaudeFileIds($claudeFileIds: [String!]!) @auth(level: NO_ACCESS) {
  conversationAttachments(where: { claudeFileId: { in: $claudeFileIds } }, limit: 100) {
    claudeFileId
  }
}

# The Documents module's operations follow, named `…ForAgent`: what an agent reads and writes of an
# organization's documents through it, Strategy Dance's own and a member's alike. Each takes the
# member the backend verified, `$userId`, and the `createdAt` of the membership it read,
# `$membershipCreatedAt`, so a member removed, or removed and invited back, stops every agent acting
# as them at its next call. Each holds to what the team lets agents do: a document whose
# `isAiReadable` is off is never loaded, whatever the call, and one whose `isAiWritable` is off is
# never changed.

# Whether the caller is still the member the module read, and what the team lets agents do with a
# document, read only to word a refusal once a read or a write that filters on them found nothing.
# Never anything of the document's text
query GetDocumentAccessForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!, $id: UUID!)
@auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  documents(where: { id: { eq: $id }, organizationId: { eq: $organizationId } }, limit: 1) {
    isAiReadable
    isAiWritable
    deletedAt
  }
}

# The organization's slug, which leads the web addresses an external agent's results carry, or its
# id while it has none
query GetOrganizationForAgent($organizationId: UUID!) @auth(level: NO_ACCESS) {
  organization(key: { id: $organizationId }) {
    id
    slug
  }
}

# Up to 20 documents agents may read whose title and plain text together hold every word of the
# query, by Data Connect's full-text search: one `tsvector` over both columns, with the `simple`
# configuration, read through its index. Tagged with every aspect named, `[]` naming none: a null
# list would match nothing. Only the plain text is loaded, to cut the excerpts, never `content` or
# `state`
query SearchDocumentsForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $query: String!
  $aspects: [CompanyAspect!]!
) @auth(level: NO_ACCESS) {
  documents_search(
    query: $query
    queryFormat: PLAIN
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      aspects: { includesAll: $aspects }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 20
  ) {
    id
    title
    aspects
    updatedAt
    isAiWritable
    contentText
  }
}

# The 100 documents agents may read that changed last (`MAX_SUBSTRING_SEARCH_DOCUMENTS` in
# strategydance-core), whose text a search in Chinese or Japanese reads, since no index serves a
# match inside a sentence
query GetDocumentSearchCorpusForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $aspects: [CompanyAspect!]!
) @auth(level: NO_ACCESS) {
  documents(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      aspects: { includesAll: $aspects }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    # `id` breaks the tie between two documents changed in the same instant
    orderBy: [{ updatedAt: DESC }, { id: ASC }]
    limit: 100
  ) {
    id
  }
}

# A search in Chinese or Japanese, by substring: every pattern in the title of any document agents
# may read, or in the plain text of one of the recent ones, each pattern in either, as the full-text
# search takes each word from the title or the text, up to 20. Always eight patterns, those a query
# leaves over `%`
query SearchDocumentsBySubstringForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $aspects: [CompanyAspect!]!
  $recentIds: [UUID!]!
  $pattern0: String!
  $pattern1: String!
  $pattern2: String!
  $pattern3: String!
  $pattern4: String!
  $pattern5: String!
  $pattern6: String!
  $pattern7: String!
) @auth(level: NO_ACCESS) {
  documents(
    # Data Connect refuses `_and` or `_or` beside plain fields, so each level is one or the other
    where: {
      _and: [
        {
          organizationId: { eq: $organizationId }
          deletedAt: { isNull: true }
          isAiReadable: { eq: true }
          aspects: { includesAll: $aspects }
          organization: {
            userOrganizations_on_organization: {
              exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
            }
          }
        }
        {
          _or: [
            { title: { pattern: { like: $pattern0, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern0, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern1, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern1, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern2, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern2, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern3, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern3, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern4, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern4, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern5, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern5, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern6, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern6, ignoreCase: true } } }] }
          ]
        }
        {
          _or: [
            { title: { pattern: { like: $pattern7, ignoreCase: true } } }
            { _and: [{ id: { in: $recentIds } }, { contentText: { pattern: { like: $pattern7, ignoreCase: true } } }] }
          ]
        }
      ]
    }
    limit: 20
  ) {
    id
    title
    aspects
    updatedAt
    isAiWritable
    contentText
  }
}

# Documents agents may read that are not indexed yet, read before a search to index them from their
# `content`: up to 21, so the backend indexes 20 and knows whether more remain. Only a page from
# before `contentText` leaves one so once the release has run its backfill. With the membership, so
# a search refuses a caller who is no longer the member it read rather than find nothing
query GetUnindexedDocumentsForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!)
@auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  documents(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      contentText: { isNull: true }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 21
  ) {
    id
    content
    revision
  }
}

# A page of the documents agents may read, latest changed first and then by id, since two can share
# an instant. A filter on a UUID takes no `gt`, so the page is read in two parts around the cursor's
# instant: the documents changed at it, all of them, by id, which the backend keeps past the
# cursor's id, and up to 51 changed before it, which say whether more remain. The first page names
# an instant past every document, so it reads the second part alone. With the membership, so a
# caller who is no longer the member the module read is refused rather than shown nothing
query ListDocumentsForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $aspects: [CompanyAspect!]!
  $before: Timestamp!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  atCursor: documents(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      aspects: { includesAll: $aspects }
      updatedAt: { eq: $before }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    orderBy: [{ id: ASC }]
    limit: 1000
  ) {
    id
    title
    aspects
    updatedAt
    isAiWritable
  }
  beforeCursor: documents(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      aspects: { includesAll: $aspects }
      updatedAt: { lt: $before }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    orderBy: [{ updatedAt: DESC }, { id: ASC }]
    limit: 51
  ) {
    id
    title
    aspects
    updatedAt
    isAiWritable
  }
}

# One document agents may read, with everything its text is read from: the snapshot, the updates
# pending since, as `GetDocument` reads them, and `content`, which seeds a document that has no
# snapshot yet. Nothing when the team keeps it from agents, which `GetDocumentAccessForAgent` then
# tells apart from a document that is not there
query GetDocumentForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!, $id: UUID!)
@auth(level: NO_ACCESS) {
  documents(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      isAiReadable: { eq: true }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 1
  ) {
    title
    aspects
    isAiWritable
    revision
    state
    content
    updatedAt
    documentUpdates_on_document(orderBy: [{ createdAt: ASC }, { id: ASC }], limit: 100) {
      id
      payload
    }
  }
}

# A revision of a document the member's organization keeps, with the document's text as it stands,
# for a member going back to it: the snapshot, the updates pending since and `content`, which seeds
# a document that has none. Nothing once the document is deleted or the revision pruned. A member is
# never held to what the team lets agents do, so neither AI permission is read
query GetDocumentRevisionForMember($organizationId: UUID!, $userId: String!, $documentId: UUID!, $revisionId: UUID!)
@auth(level: NO_ACCESS) {
  documentRevisions(
    where: {
      id: { eq: $revisionId }
      documentId: { eq: $documentId }
      organizationId: { eq: $organizationId }
      document: { deletedAt: { isNull: true } }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq: $userId } } } }
    }
    limit: 1
  ) {
    compressedState
    afterFingerprint
    createdAt
    document {
      title
      revision
      state
      content
      documentUpdates_on_document(orderBy: [{ createdAt: ASC }, { id: ASC }], limit: 100) {
        id
        payload
      }
    }
  }
}

# The revisions an agent's edits kept from one scope, a conversation's, as its member made them, the
# newest first, for the thread to offer Undo on the rows of the edits nobody has written over since
query GetConversationDocumentRevisions($organizationId: UUID!, $userId: String!, $scope: String!)
@auth(level: NO_ACCESS) {
  documentRevisions(
    where: {
      scope: { eq: $scope }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq: $userId } } } }
    }
    orderBy: [{ createdAt: DESC }, { id: DESC }]
    limit: 100
  ) {
    id
    callKey
    documentId
    afterFingerprint
  }
}

# One document's text as it stands, for a member, whatever the team lets agents do: the snapshot
# and the updates pending since, as `GetDocument` reads them, and `content`, which seeds a
# document that has no snapshot yet. Nothing once it is deleted
query GetDocumentTextForMember($organizationId: UUID!, $userId: String!, $id: UUID!) @auth(level: NO_ACCESS) {
  documents(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq: $userId } } } }
    }
    limit: 1
  ) {
    state
    content
    documentUpdates_on_document(orderBy: [{ createdAt: ASC }, { id: ASC }], limit: 100) {
      id
      payload
    }
  }
}

# What a module's write answered under an idempotency key, read before the write runs, and again
# when the write finds its key taken, with the membership the module read: a stored result answers
# only a caller who is still that member, as the write itself would refuse anybody else
query GetModuleCallResult(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $idempotencyScope: String!
  $idempotencyKey: String!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  moduleCallResult(key: { idempotencyScope: $idempotencyScope, idempotencyKey: $idempotencyKey }) {
    userId
    organizationId
    tool
    argumentsHash
    result
  }
}

# The backfill's, run by hand after a release: up to 100 documents of any organization not indexed
# yet, deleted ones included, leaving out those it could not index, so it pages through them and can
# stop and start again at any point
query GetUnindexedDocuments($skippedIds: [UUID!]!) @auth(level: NO_ACCESS) {
  documents(where: { contentText: { isNull: true }, id: { nin: $skippedIds } }, limit: 100) {
    id
    content
    revision
  }
}

# The Tasks module's operations follow, named `…ForAgent`: what an agent reads and writes of an
# organization's board through it, Strategy Dance's own and a member's alike. Each takes the member
# the backend verified, `$userId`, and the `createdAt` of the membership it read,
# `$membershipCreatedAt`, so a member removed, or removed and invited back, stops every agent acting
# as them at its next call. Each read answers that membership beside its rows, so such a caller is
# refused rather than shown an empty board. A task carries no AI permission: the board is the team's,
# and an agent acting as a member reads and changes any task, as the member could

# The live board, without descriptions, as `GetTasks` reads it: each task with the live tasks it waits
# on, its count of every link, those to deleted tasks included, which `AddTaskDependencyForAgent`
# counts against the cap, and when it last changed, which an update is guarded on. With the members,
# up to 100 (`MAX_TEAM_SIZE`), by when they joined, so an agent can name and assign them
query GetTaskBoardForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!)
@auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  members: userOrganizations(
    where: {
      organizationId: { eq: $organizationId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    orderBy: [{ createdAt: ASC }, { userId: ASC }]
    limit: 100
  ) {
    userId
    user {
      displayName
    }
  }
  tasks(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    orderBy: [{ position: ASC }, { createdAt: ASC }, { id: ASC }]
    limit: 1000
  ) {
    id
    name
    status
    position
    assigneeId
    isAssignedToAgent
    dueDate
    aspects
    createdAt
    updatedAt
    dependencies: taskDependencies_on_task(where: { dependency: { deletedAt: { isNull: true } } }, limit: 50) {
      dependencyId
    }
    linkCount: taskDependencies_on_task {
      _count
    }
  }
}

# One task, deleted or not, with its description and who made it, and its links to live tasks both
# ways, as bare ids: what it waits on, and what waits on it. `read_task` refuses one that is deleted;
# `restore_task` reads when it was deleted and the links a restore brings back. Names and statuses
# come from the board
query GetTaskForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!, $id: UUID!)
@auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  tasks(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 1
  ) {
    id
    name
    status
    assigneeId
    isAssignedToAgent
    dueDate
    aspects
    description
    createdAt
    updatedAt
    deletedAt
    createdBy {
      id
      displayName
    }
    dependencies: taskDependencies_on_task(where: { dependency: { deletedAt: { isNull: true } } }, limit: 50) {
      dependencyId
    }
    dependents: taskDependencies_on_dependency(where: { task: { deletedAt: { isNull: true } } }, limit: 1000) {
      taskId
    }
  }
}

# The ids of the live tasks whose name or plain text holds a piece of text, whatever its case, as the
# board's own search matches it: `$pattern` is `%text%`, its `\`, `%` and `_` escaped so it matches
# only itself. No index serves a pattern, so this scans the board, which `MAX_TASKS` bounds. Never a
# description: the plain text is matched, never the serialized blocks, whose structural words every
# description holds
query SearchTasksForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!, $pattern: String!)
@auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  tasks(
    # Data Connect refuses `_and` or `_or` beside plain fields, so each level is one or the other
    where: {
      _and: [
        {
          organizationId: { eq: $organizationId }
          deletedAt: { isNull: true }
          organization: {
            userOrganizations_on_organization: {
              exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
            }
          }
        }
        {
          _or: [
            { name: { pattern: { like: $pattern, ignoreCase: true } } }
            { descriptionText: { pattern: { like: $pattern, ignoreCase: true } } }
          ]
        }
      ]
    }
    limit: 1000
  ) {
    id
  }
}

# Live tasks whose plain text is not indexed yet, read before a query to index them from their
# `description`: up to 21, so the backend indexes 20 and knows whether more remain. Only a page from
# before `descriptionText` leaves one so once the release has run its backfill
query GetUnindexedTasksForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!)
@auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  tasks(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      descriptionText: { isNull: true }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 21
  ) {
    id
    description
    updatedAt
  }
}

# The backfill's, run by hand after a release: up to 100 tasks of any organization not indexed yet,
# deleted ones included, leaving out those it could not index, so it pages through them and can stop
# and start again at any point
query GetUnindexedTasks($skippedIds: [UUID!]!) @auth(level: NO_ACCESS) {
  tasks(where: { descriptionText: { isNull: true }, id: { nin: $skippedIds } }, limit: 100) {
    id
    description
    updatedAt
  }
}

# The `doneAt` backfill's, run by hand after the release that added it: up to 100 tasks of any
# organization in Done that nobody stamped, deleted ones included, each with its last change, which
# the backfill stamps it with, leaving out those it could not stamp. A stamped one leaves the list,
# so it pages through them and can stop and start again at any point
query GetUndatedDoneTasks($skippedIds: [UUID!]!) @auth(level: NO_ACCESS) {
  tasks(where: { status: { eq: DONE }, doneAt: { isNull: true }, id: { nin: $skippedIds } }, limit: 100) {
    id
    updatedAt
  }
}

# The Subagents module's operations follow, named `…ForAgent`: what a conversation's agent reads of
# the subagents it launched, and how it launches and stops them, through the module. Each takes the
# member the backend verified, `$userId`, and the `createdAt` of the membership it read,
# `$membershipCreatedAt`, as the other modules' operations do, and each read answers that membership
# beside its rows. The module reaches nobody but Strategy Dance's own agents, whose caller names the
# run that is calling, its launcher

# The run calling the Subagents module, its launcher, as every tool of the module reads it first:
# whether it is still running and not asked to stop, the anchor a launch from it is made on, and
# whether its conversation is a subagent, which launches none, or deleted. Read on the member, so a
# run of somebody else's reads as none
query GetSubagentLauncherForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $conversationId: UUID!
  $runId: UUID!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  runs: conversationRuns(
    where: {
      id: { eq: $runId }
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    limit: 1
  ) {
    status
    trigger
    stopRequestedAt
    anchorPosition
    conversation {
      parentId
      deletedAt
    }
  }
}

# The live subagents a conversation launched, those a retry deleted left out, newest first and then
# by id, each with its latest run, whose status says where it stands, and when it ended, which its
# report is written at however it ends. A conversation holds at most 100 subagents until they are
# pruned (`MAX_CONVERSATION_SUBAGENTS` in strategydance-core), so every one is read and the backend
# pages them
query ListSubagentsForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $parentId: UUID!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  subagents: conversations(
    where: {
      parentId: { eq: $parentId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
    }
    orderBy: [{ createdAt: DESC }, { id: ASC }]
    limit: 100
  ) {
    id
    title
    createdAt
    reportedAt
    reportDeliveredAt
    latestRuns: conversationRuns_on_conversation(orderBy: [{ number: DESC }], limit: 1) {
      status
    }
  }
}

# One live subagent of a conversation, with its report once written, the run it is busy with, if
# any, its latest run's status, step and stop, and how many runs it took. Nothing for a subagent of
# another conversation, somebody else's, or one a retry deleted, whose launch the transcript no
# longer holds
query GetSubagentForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $parentId: UUID!
  $id: UUID!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  subagents: conversations(
    where: {
      id: { eq: $id }
      parentId: { eq: $parentId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
    }
    limit: 1
  ) {
    id
    title
    createdAt
    activeRunId
    nextMessagePosition
    report
    reportedAt
    latestRuns: conversationRuns_on_conversation(orderBy: [{ number: DESC }], limit: 1) {
      id
      number
      status
      step
      stopRequestedAt
    }
    runCount: conversationRuns_on_conversation {
      _count
    }
  }
}

# A page of what a subagent wrote through the modules, oldest first: the results its successful
# writes kept under its idempotency scope, `$scope`, `conversation:<subagent id>`, since every write
# of an agent carries a key and only a write that went through keeps one. Each with its tool and what
# it answered. Read past `$afterCreatedAt` and `$afterKey`, the last of the page before, the first
# page naming an instant before any, up to 51 for a page of 50, so the backend knows whether more
# remain, and how many there are in all. The backend reads the subagent first, as the caller's and
# its parent's
query GetSubagentWritesForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $scope: String!
  $afterCreatedAt: Timestamp!
  $afterKey: String!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  writes: moduleCallResults(
    # One `_and`, because a filter cannot put `_or` beside plain fields
    where: {
      _and: [
        { idempotencyScope: { eq: $scope }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
        {
          _or: [
            { createdAt: { gt: $afterCreatedAt } }
            { createdAt: { eq: $afterCreatedAt }, idempotencyKey: { gt: $afterKey } }
          ]
        }
      ]
    }
    orderBy: [{ createdAt: ASC }, { idempotencyKey: ASC }]
    limit: 51
  ) {
    idempotencyKey
    tool
    result
    createdAt
  }
  total: moduleCallResults(
    where: { idempotencyScope: { eq: $scope }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
  ) {
    _count
  }
}

# The calls a subagent made to the organization's integrations, oldest first: those that started,
# since a call refused as it was drawn, or one waiting on an approval nobody gave it, reached no
# server. Each with the server and the tool as they were named at call time, its status, whether it
# finished and whether its server never answered. A chain makes at most 200 calls, so 200 is all of
# them, with their count. The backend reads the subagent first, as the caller's and its parent's
query GetSubagentIntegrationCallsForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $subagentId: UUID!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  calls: conversationMessages(
    where: {
      conversation: {
        id: { eq: $subagentId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        parentId: { isNull: false }
      }
      kind: { in: [TOOL_CALL, APPROVAL] }
      integrationToolName: { isNull: false }
      toolStartedAt: { isNull: false }
    }
    orderBy: [{ position: ASC }]
    limit: 200
  ) {
    integrationName
    integrationToolName
    toolStatus
    toolDurationMs
    isToolUnanswered
  }
  total: conversationMessages(
    where: {
      conversation: {
        id: { eq: $subagentId }
        userId: { eq: $userId }
        organizationId: { eq: $organizationId }
        parentId: { isNull: false }
      }
      kind: { in: [TOOL_CALL, APPROVAL] }
      integrationToolName: { isNull: false }
      toolStartedAt: { isNull: false }
    }
  ) {
    _count
  }
}

# What a parent's reaction to its subagents' reports reads before it starts, and what a send, an
# answer and a full ending read of the reports waiting:
#
# - the caller's membership, whose `createdAt` the reaction's run records
# - the parent: whether it is the caller's, live and idle, waiting on no answer, and its next run
# - its latest run, whose status and note say whether it completed, or ended full
# - the transcript's last entry, after which the reaction's goes
# - its live subagents, at most 100 (`MAX_CONVERSATION_SUBAGENTS`), oldest first, each with its batch,
#   the anchor it was launched on, its report and whether it was delivered, and its latest run, whose
#   status says how it ended
# - the caller's runs in flight in the organization, which a dead one among is finalized before they
#   are counted
# - whether staff suspended conversations for the caller's account or in the organization, which
#   starts no reaction: its reports wait until the suspension is lifted
#
# Only the caller's conversation in that organization
query GetSubagentReactionContext($organizationId: UUID!, $userId: String!, $conversationId: UUID!)
@auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    createdAt
  }
  user(key: { id: $userId }) {
    conversationsSuspendedAt
  }
  organization(id: $organizationId) {
    conversationsSuspendedAt
  }
  conversation(id: $conversationId) {
    userId
    organizationId
    deletedAt
    parentId
    activeRunId
    isAwaitingAnswer
    nextRunNumber
  }
  latestRuns: conversationRuns(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ number: DESC }]
    limit: 1
  ) {
    id
    number
    status
    notes: conversationMessages_on_run(where: { kind: { eq: NOTE } }, limit: 1) {
      noteKind
    }
  }
  lastEntries: conversationTranscriptEntries(
    where: {
      conversation: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    }
    orderBy: [{ position: DESC }]
    limit: 1
  ) {
    position
  }
  subagents: conversations(
    where: {
      parentId: { eq: $conversationId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
    }
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    title
    launchAnchorPosition
    report
    reportedAt
    reportDeliveredAt
    latestRuns: conversationRuns_on_conversation(orderBy: [{ number: DESC }], limit: 1) {
      status
    }
  }
  conversationRuns(
    where: {
      status: { in: [QUEUED, RUNNING] }
      conversation: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, parentId: { isNull: true } }
    }
    limit: 3
  ) {
    id
    status
    leaseExpiresAt
    conversation {
      id
    }
  }
}

# The caller's conversations in an organization a reaction may be due in: live and idle, waiting on
# no answer, with a report of a live subagent waiting, the longest idle first. Every one, up to the
# 1000 a member keeps (`MAX_CONVERSATIONS`), ids alone, since one whose latest run did not complete
# stays here until the member writes to it, and a page of them would hide one due behind it. Whether
# one is due, its latest run completed and a batch reported whole, the backend reads of each in turn
# (`GetSubagentReactionContext`), which a run of theirs ending, freeing one of their 3, asks
query GetDueSubagentReactions($organizationId: UUID!, $userId: String!) @auth(level: NO_ACCESS) {
  conversations(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      parentId: { isNull: true }
      deletedAt: { isNull: true }
      activeRunId: { isNull: true }
      isAwaitingAnswer: { eq: false }
      conversations_on_parent: {
        exist: { deletedAt: { isNull: true }, reportedAt: { isNull: false }, reportDeliveredAt: { isNull: true } }
      }
    }
    orderBy: [{ updatedAt: ASC }, { id: ASC }]
    limit: 1000
  ) {
    id
  }
}

# The daily sweep's backstop for reactions no run's end or page started: the accounts with a
# conversation in which a report of a live subagent waits while it is live and idle, waiting on no
# answer, a hundred at a time after the last one read, whose reactions it starts or, in a
# conversation that is full, whose reports it marks delivered
query GetSubagentReactionSweepMembers($afterUserId: String!) @auth(level: NO_ACCESS) {
  users(
    where: {
      id: { gt: $afterUserId }
      conversations_on_user: {
        exist: {
          parentId: { isNull: true }
          deletedAt: { isNull: true }
          activeRunId: { isNull: true }
          isAwaitingAnswer: { eq: false }
          conversations_on_parent: {
            exist: { deletedAt: { isNull: true }, reportedAt: { isNull: false }, reportDeliveredAt: { isNull: true } }
          }
        }
      }
    }
    orderBy: [{ id: ASC }]
    limit: 100
  ) {
    id
  }
}

# The organizations in which an account the sweep found has such a conversation, as
# `GetSubagentReactionSweepMembers` finds them
query GetSubagentReactionSweepOrganizations($userId: String!) @auth(level: NO_ACCESS) {
  organizations(
    where: {
      conversations_on_organization: {
        exist: {
          userId: { eq: $userId }
          parentId: { isNull: true }
          deletedAt: { isNull: true }
          activeRunId: { isNull: true }
          isAwaitingAnswer: { eq: false }
          conversations_on_parent: {
            exist: { deletedAt: { isNull: true }, reportedAt: { isNull: false }, reportDeliveredAt: { isNull: true } }
          }
        }
      }
    }
    limit: 1000
  ) {
    id
  }
}

# The daily sweep's backstop for the runs of members' conversations no page will reconcile, a
# reaction's above all, whose reports were delivered as it started, so nothing of its parent's page
# polls for it: those queued or running past their lease, the longest past first, a hundred at a time,
# each asked of Cloud Tasks and queued again, or finalized once dead
query GetDeadConversationRunSweep @auth(level: NO_ACCESS) {
  conversationRuns(
    where: {
      status: { in: [QUEUED, RUNNING] }
      leaseExpiresAt: { lt_time: { now: true } }
      conversation: { parentId: { isNull: true } }
    }
    orderBy: [{ leaseExpiresAt: ASC }, { id: ASC }]
    limit: 100
  ) {
    id
    status
    leaseExpiresAt
    conversation {
      id
      userId
      organizationId
    }
  }
}

# The authorization server's operations follow, which the backend's OAuth endpoints run for the
# external agents a member connects to a module (`documents/conversations.md`, Modules, External
# agents).
#
# Unlike every other operation here, most of them run before any `$userId` has been verified: they
# find a registered client, an authorization request, a code or a token by its id or its hash,
# which whoever presents it holds. That is the OAuth flow itself, and the one exception beside the
# sign-in screen's public lookup. An id is a random UUID, and a code or a token is 256 random bits
# kept only as its SHA-256 hash, so nothing is found without holding it. The consent page's
# operations take the member's verified `$userId`, as every other operation does

# A registered client, by the `client_id` its registration answered
query GetOAuthClient($id: UUID!) @auth(level: NO_ACCESS) {
  oAuthClient(id: $id) {
    id
    name
    redirectUris
  }
}

# An authorization request a member can still decide: undecided and unexpired, by the database's
# clock, which measured its ten minutes
query GetPendingOAuthAuthorizationRequest($id: UUID!) @auth(level: NO_ACCESS) {
  oAuthAuthorizationRequests(
    where: { id: { eq: $id }, decidedAt: { isNull: true }, expiresAt: { gt_time: { now: true } } }
    limit: 1
  ) {
    id
    clientId
    redirectUri
    resource
    scopes
    state
    expiresAt
  }
}

# The authorization request a code was issued on, whatever became of the code, so a code presented
# again is told from one never issued, with the connection it opens. Its expiry is checked by the
# exchange itself, on the database's clock
query GetOAuthAuthorizationRequestByCode($codeHash: String!) @auth(level: NO_ACCESS) {
  oAuthAuthorizationRequests(where: { codeHash: { eq: $codeHash } }, limit: 1) {
    id
    clientId
    redirectUri
    codeChallenge
    resource
    codeUsedAt
    connection {
      id
      scopes
    }
  }
}

# A refresh token, unexpired, with its connection, and the same token again when it was rotated
# within the last 30 seconds (`OAUTH_REFRESH_GRACE_SECONDS` in the backend: change the two
# together), by the database's clock, which wrote `usedAt`: a duplicate within them is answered
# with the pair its first use issued, and one after them revokes the connection
query GetAgentConnectionRefreshToken($hash: String!) @auth(level: NO_ACCESS) {
  token: agentConnectionTokens(
    where: { hash: { eq: $hash }, kind: { eq: REFRESH }, expiresAt: { gt_time: { now: true } } }
    limit: 1
  ) {
    id
    resource
    scopes
    usedAt
    successorKeyVersion
    connection {
      id
      clientId
      scopes
    }
  }
  recentlySpent: agentConnectionTokens(
    where: {
      hash: { eq: $hash }
      kind: { eq: REFRESH }
      expiresAt: { gt_time: { now: true } }
      usedAt: { ge_time: { now: true, sub: { seconds: 30 } } }
    }
    limit: 1
  ) {
    id
  }
}

# The successors a duplicate refresh answers with, found by the hashes derived again from the spent
# token, so the duplicate hands out nothing that was revoked or has expired since, with whether the
# refresh token was spent in turn, and under which version, so the duplicate follows the chain to
# the pair the client holds now
query GetAgentConnectionTokens($hashes: [String!]!) @auth(level: NO_ACCESS) {
  agentConnectionTokens(where: { hash: { in: $hashes }, expiresAt: { gt_time: { now: true } } }, limit: 2) {
    hash
    kind
    scopes
    expiresAt
    connectionId
    usedAt
    successorKeyVersion
  }
}

# The token verifier's one read, on every call an external agent makes to a module: an unexpired
# access token alone, never a refresh token, with its connection and the membership it belongs to
query GetAgentConnectionAccessToken($hash: String!) @auth(level: NO_ACCESS) {
  agentConnectionTokens(
    where: { hash: { eq: $hash }, kind: { eq: ACCESS }, expiresAt: { gt_time: { now: true } } }
    limit: 1
  ) {
    resource
    scopes
    expiresAt
    connection {
      id
      clientId
      module
      scopes
      membership {
        userId
        organizationId
        createdAt
      }
    }
  }
}

# A token a client asks to revoke, of either kind and whether or not it has expired, with the client
# it was issued to, since a client revokes only its own (RFC 7009)
query GetAgentConnectionTokenForRevocation($hash: String!) @auth(level: NO_ACCESS) {
  agentConnectionTokens(where: { hash: { eq: $hash } }, limit: 1) {
    id
    kind
    connection {
      id
      clientId
    }
  }
}

# A server of an organization as its administrators' routes change it, and its members' Connects
# read it, deleted or not, its key's and its client secret's ciphertexts included: read after a
# route's middleware has checked the caller, and every write that follows checks them again. Null for
# a server of another organization
query GetOrganizationIntegrationForAdministrator($organizationId: UUID!, $integrationId: UUID!)
@auth(level: NO_ACCESS) {
  organizationIntegrations(where: { id: { eq: $integrationId }, organizationId: { eq: $organizationId } }, limit: 1) {
    id
    name
    normalizedName
    url
    catalogueSlug
    authentication
    isEnabled
    configRevision
    encryptedApiKey
    apiKeyLastFour
    keyGeneration
    apiKeyScheme
    apiKeyHeader
    issuer
    oauthClientId
    encryptedOAuthClientSecret
    oauthClientSecretExpiresAt
    oauthClientAuthenticationMethod
    toolCount
    toolDefinitionHashes
    lastError
    deletedAt
  }
}

# The organization's live servers as a conversation's agent lists them for one member, with that
# member's own connection to each: what works for them, each server's tools as last listed, and which
# of them run without approval. No secret: a call reads its own server through
# `GetConversationIntegration`. The membership is matched on the `createdAt` the run recorded, so a
# member removed, or removed and invited back, reads nothing
query GetConversationIntegrations($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!)
@auth(level: NO_ACCESS) {
  userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  organizationIntegrations(
    where: { organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: 50
  ) {
    id
    name
    authentication
    isEnabled
    configRevision
    keyGeneration
    apiKeyLastFour
    tools
    autoApprovedTools
  }
  integrationConnections(
    where: {
      membershipUserId: { eq: $userId }
      membershipOrganizationId: { eq: $organizationId }
      integration: { deletedAt: { isNull: true } }
    }
    limit: 50
  ) {
    integrationId
    generation
    configRevision
    status
  }
}

# One live server of the organization as a conversation's agent calls it for one member, its key's
# ciphertext included, which a call decrypts to reach it, with that member's own connection to it.
# Read when a call is drawn, to decide whether it waits for the member's approval, and again right
# before it is made, to check what the approval was bound to. Null for a server deleted or of
# another organization, and nothing at all once the membership changed
query GetConversationIntegration(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $integrationId: UUID!
) @auth(level: NO_ACCESS) {
  userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  organizationIntegrations(
    where: { id: { eq: $integrationId }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
    limit: 1
  ) {
    id
    name
    url
    authentication
    isEnabled
    configRevision
    keyGeneration
    encryptedApiKey
    apiKeyScheme
    apiKeyHeader
    tools
    autoApprovedTools
  }
  integrationConnections(
    where: {
      integrationId: { eq: $integrationId }
      membershipUserId: { eq: $userId }
      membershipOrganizationId: { eq: $organizationId }
    }
    limit: 1
  ) {
    integrationId
    generation
    configRevision
    status
  }
}

# The Connect a sign-in's state names, found by the state's hash alone, before anybody is known, as
# the authorization server's own requests are: whoever holds a 256-bit state is whom the callback
# trusts to bring its code back, and only the member's own page finishes it
query GetIntegrationAuthorizationByState($stateHash: String!) @auth(level: NO_ACCESS) {
  integrationAuthorizations(where: { stateHash: { eq: $stateHash } }, limit: 1) {
    id
    integrationId
    membershipUserId
    membershipOrganizationId
    issuer
    isIssuerParameterSupported
  }
}

# A Connect of the organization's server by its id, whoever started it, so the finish can tell
# another account's from one that is gone, and refuses both. Null once it is finished or replaced
query GetIntegrationAuthorizationForMember($organizationId: UUID!, $integrationId: UUID!, $authorizationId: UUID!)
@auth(level: NO_ACCESS) {
  integrationAuthorizations(
    where: {
      id: { eq: $authorizationId }
      integrationId: { eq: $integrationId }
      membershipOrganizationId: { eq: $organizationId }
    }
    limit: 1
  ) {
    id
    membershipUserId
    encryptedCodeVerifier
    encryptedCode
    codeExpiresAt
    configRevision
    oauthClientId
    oauthClientAuthenticationMethod
    resource
    scope
    issuer
    isIssuerParameterSupported
    tokenEndpoint
    revocationEndpoint
    expiresAt
  }
}

# A member's connection to a server, its tokens' ciphertexts included, with what of the server it is
# used against, in one read: a token goes to the address read here, and only while the server is at
# the revision the connection was made under. Null when they have none
query GetIntegrationConnectionForMember($organizationId: UUID!, $userId: String!, $integrationId: UUID!)
@auth(level: NO_ACCESS) {
  integrationConnections(
    where: {
      integrationId: { eq: $integrationId }
      membershipUserId: { eq: $userId }
      membershipOrganizationId: { eq: $organizationId }
    }
    limit: 1
  ) {
    id
    generation
    configRevision
    status
    accountLabel
    oauthClientId
    oauthClientAuthenticationMethod
    resource
    issuer
    isIssuerParameterSupported
    tokenEndpoint
    revocationEndpoint
    encryptedAccessToken
    encryptedRefreshToken
    accessTokenExpiresAt
    scope
    refreshingUntil
    refreshLeaseId
    integration {
      url
      authentication
      configRevision
      isEnabled
      oauthClientId
      encryptedOAuthClientSecret
      deletedAt
    }
  }
}

# Every currency and year of exchange rates stored, without the rates, from which the daily sync
# carries on: from the least advanced currency's latest year, which a run before may have written
# only partly, or before the ECB's last day of it, or from 1999 for a currency with no row at all,
# as one added to the list since. As many rows as 29 currencies hold for every year from 1999 to
# past 2060
query GetExchangeRateYearKeys @auth(level: NO_ACCESS) {
  exchangeRateYears(orderBy: [{ year: DESC }, { currency: ASC }], limit: 2000) {
    currency
    year
  }
}

# The ECB's daily rates of the currencies and years asked for, as `GetExchangeRates` reads them, for
# the Budget module. It matches no membership, since the rates are public and say nothing of any
# organization: the module reads them beside the budget, whose read checks its caller. Both lists
# are required, since a filter on a list left out matches every row. As many rows as 29 currencies
# hold for every year from 1999 to past 2060, in order, so a request never loses a year to the limit
query GetExchangeRatesForAgent($currencies: [Currency!]!, $years: [Int!]!) @auth(level: NO_ACCESS) {
  exchangeRateYears(
    where: { currency: { in: $currencies }, year: { in: $years } }
    orderBy: [{ currency: ASC }, { year: ASC }]
    limit: 2000
  ) {
    currency
    year
    rates
  }
}

# A bill's receipt by its id alone, with whether the caller belongs to the organization the route
# names: the backend serves its file to any member of the receipt's own organization, and its upload
# reads it to tell a retry from an id another member or organization holds. `$userId` is the uid the
# backend verified
query GetBillReceiptForMember($organizationId: UUID!, $userId: String!, $receiptId: UUID!) @auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    role
  }
  billReceipt(id: $receiptId) {
    organizationId
    userId
    status
    name
    contentType
    size
    createdAt
  }
}

# A receipt by its id alone, for the receipt reader: whether the caller belongs to the organization
# the route names, and its name, which the reader's request quotes so the model tells the seller from
# the buyer, then the receipt with what a read found already, and when it was uploaded, since a read
# takes only a receipt uploaded within a day. `$userId` is the uid the backend verified
query GetBillReceiptForReader($organizationId: UUID!, $userId: String!, $receiptId: UUID!) @auth(level: NO_ACCESS) {
  userOrganization(key: { userId: $userId, organizationId: $organizationId }) {
    role
    organization {
      name
    }
  }
  billReceipt(id: $receiptId) {
    organizationId
    userId
    status
    name
    contentType
    size
    readFields
    createdAt
  }
}

# The receipts the reader claimed in the last 24 hours but the one it is asked to read, as
# `ClaimBillReceiptRead` counts them: the caller's in the organization and the organization's, newest
# first, each as many as its cap counts, so the oldest of them says when the next read fits. `$userId`
# is the uid the backend verified
query GetBillReceiptReads($organizationId: UUID!, $userId: String!, $receiptId: UUID!) @auth(level: NO_ACCESS) {
  memberReads: billReceipts(
    where: {
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      id: { ne: $receiptId }
      readAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
    orderBy: [{ readAt: DESC }]
    limit: 50
  ) {
    id
    readAt
  }
  organizationReads: billReceipts(
    where: {
      organizationId: { eq: $organizationId }
      id: { ne: $receiptId }
      readAt: { gt_time: { now: true, sub: { hours: 24 } } }
    }
    orderBy: [{ readAt: DESC }]
    limit: 200
  ) {
    id
    readAt
  }
}

# The daily sweep's: a hundred receipts that no bill holds nor keeps as an earlier receipt, deleted
# bills included, uploaded over three days ago, whatever their status, whose files it deletes before
# their rows (`DeleteBillReceipts`). A bill's save takes no receipt over two days old unless it holds
# it already or keeps it, so none of these is taken meanwhile, a save in flight as its two days ran
# out included. `$skippedIds` are those whose files this sweep failed to delete, which it reads past,
# so a hundred that keep failing never hold back the rest. Required, since a filter on a list left
# out matches every row
query GetPrunableBillReceipts($skippedIds: [UUID!]!) @auth(level: NO_ACCESS) {
  billReceipts(
    where: {
      _and: [
        { createdAt: { lt_time: { now: true, sub: { days: 3 } } } }
        { _not: { bill_on_receipt: { id: { isNull: false } } } }
        { formerBillId: { isNull: true } }
        { _not: { id: { in: $skippedIds } } }
      ]
    }
    orderBy: [{ createdAt: ASC }]
    limit: 100
  ) {
    id
    organizationId
  }
}

# The Budget module's operations follow, named `…ForAgent`: what an agent reads and writes of an
# organization's bills through it. Each takes the member the backend verified, `$userId`, and the
# `createdAt` of the membership it read, `$membershipCreatedAt`, so a member removed, or removed and
# invited back, stops every agent acting as them at its next call. Each read answers that membership
# beside its rows, so such a caller is refused rather than shown no bills. Bills carry no AI
# permission, as tasks do not: an agent acting as a member reads and changes any bill, as the member
# could, and never the budget itself, which stays an administrator's, on the page

# The budget and every live bill, as `GetBudget` and `GetBills` read them, which the module computes
# from as the page does: up to 2000 bills (`MAX_BILLS` in strategydance-core), so nothing is left out
# of a sum. With the member's time zone, from which the module tells their today, and the members, up
# to 100 (`MAX_TEAM_SIZE`), by when they joined, so an agent can name a payer and is refused one who
# is not a member before anything is written
query GetBudgetForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!)
@auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
    user {
      timezone
    }
  }
  budgets(
    where: {
      organizationId: { eq: $organizationId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 1
  ) {
    currency
    amountMinor
    period
  }
  members: userOrganizations(
    where: {
      organizationId: { eq: $organizationId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    orderBy: [{ createdAt: ASC }, { userId: ASC }]
    limit: 100
  ) {
    userId
    user {
      displayName
    }
  }
  bills(
    where: {
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    orderBy: [{ createdAt: ASC }, { id: ASC }]
    limit: 2000
  ) {
    id
    name
    description
    company
    amountMinor
    currency
    paidOn
    recurrence
    endsOn
    paidById
    paidBy {
      displayName
    }
    receiptId
    # An update is guarded on it, and `update_bill`'s `version` is it
    updatedAt
  }
}

# One bill by its id, deleted or not, so a restore can tell a bill deleted from one never there, with
# its receipt's name, type and size, its earlier receipts, who paid it, who created it and who saved
# it last, and the budget's currency, which
# its payments are converted into. With the member's time zone, from which the module tells their
# today
query GetBillForAgent($organizationId: UUID!, $userId: String!, $membershipCreatedAt: Timestamp!, $id: UUID!)
@auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
    user {
      timezone
    }
  }
  budgets(
    where: {
      organizationId: { eq: $organizationId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 1
  ) {
    currency
  }
  bills(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 1
  ) {
    id
    name
    description
    company
    amountMinor
    currency
    paidOn
    recurrence
    endsOn
    paidById
    paidBy {
      displayName
    }
    receipt {
      id
      name
      contentType
      size
    }
    # The receipts it held before an edit replaced or removed them, newest first, which an update
    # can take back
    earlierReceipts: billReceipts_on_formerBill(
      where: { _not: { bill_on_receipt: { id: { isNull: false } } } }
      orderBy: [{ createdAt: DESC }]
      limit: 50
    ) {
      id
      name
      contentType
      size
    }
    createdById
    createdBy {
      displayName
    }
    createdAt
    updatedById
    updatedBy {
      displayName
    }
    updatedAt
    deletedAt
  }
}

# A file the member sent in a conversation, which Strategy Dance's agent hands the Budget module as a
# bill's receipt by its id: the conversation calling, its launcher's, with its parent and its brief,
# and the file, the member's, stored and sent, as `GetConversationBriefAttachments` reads a brief's
# files for the page. A conversation's own files are its own; a subagent's are the files of its
# parent's its brief lists, which the module checks. Its type, size and pages are the row's, written
# once the upload checked the bytes, so the module judges the file as a receipt without reading it
query GetConversationAttachmentForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $conversationId: UUID!
  $attachmentId: UUID!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  conversations(
    where: { id: { eq: $conversationId }, userId: { eq: $userId }, organizationId: { eq: $organizationId } }
    limit: 1
  ) {
    parentId
    deletedAt
    briefs: conversationMessages_on_conversation(where: { position: { eq: 0 }, kind: { eq: BRIEF } }, limit: 1) {
      attachmentIds
    }
  }
  attachments: conversationAttachments(
    where: {
      id: { eq: $attachmentId }
      userId: { eq: $userId }
      organizationId: { eq: $organizationId }
      status: { eq: READY }
      messageId: { isNull: false }
    }
    limit: 1
  ) {
    conversationId
    name
    contentType
    size
    pageCount
  }
}

# The Knowledge module's operations follow, named `…ForAgent`: what an organization uses of the
# knowledge catalogue, which lives in strategydance-knowledge and never here, and what each item is
# linked to. Each takes the member the backend verified, `$userId`, and the `createdAt` of the
# membership it read, `$membershipCreatedAt`, so a member removed, or removed and invited back, stops
# every agent acting as them at its next call. Each read answers that membership beside its rows, so
# such a caller is refused rather than shown nothing in use. None can read the catalogue: the backend
# holds every id to it before it calls one, and reads past a row whose id the catalogue lost. A link
# to a document follows the document's AI permission, as every read of a document by an agent does

# The items of a kind the organization uses, for `list_knowledge`'s `inUse`: up to 5000, past every
# kind's catalogue. The kind is selected at the top level, which has the generated SDK declare its
# enum
query GetKnowledgeUsesForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $kind: KnowledgeKind!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  knowledgeUses(
    where: {
      organizationId: { eq: $organizationId }
      kind: { eq: $kind }
      isInUse: { eq: true }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 5000
  ) {
    kind
    itemId
  }
}

# Up to 10 items of a kind (`MAX_KNOWLEDGE_READ_IDS`), as `read_knowledge` reads them: their uses and
# every link of theirs the agent may see, newest first, at most 100 of each kind of target per item
# (`MAX_KNOWLEDGE_LINKS`), so 1000 of each in all. The backend keeps each item's 20 newest with their
# total, since a list's limit is the whole list's, not each item's share. A link to a document kept
# from AI or deleted, or to a deleted task, is left out, and back once the document or the task is
# restored. A membership has none of that: its links go with it
query GetKnowledgeItemsForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $kind: KnowledgeKind!
  $itemIds: [String!]!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  knowledgeUses(
    where: {
      organizationId: { eq: $organizationId }
      kind: { eq: $kind }
      itemId: { in: $itemIds }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 10
  ) {
    itemId
    isInUse
    changedAt
  }
  knowledgeDocumentLinks(
    where: {
      organizationId: { eq: $organizationId }
      kind: { eq: $kind }
      itemId: { in: $itemIds }
      document: { deletedAt: { isNull: true }, isAiReadable: { eq: true } }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    orderBy: [{ createdAt: DESC }, { documentId: ASC }]
    limit: 1000
  ) {
    itemId
    document {
      id
      title
    }
  }
  knowledgeTaskLinks(
    where: {
      organizationId: { eq: $organizationId }
      kind: { eq: $kind }
      itemId: { in: $itemIds }
      task: { deletedAt: { isNull: true } }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    orderBy: [{ createdAt: DESC }, { taskId: ASC }]
    limit: 1000
  ) {
    itemId
    task {
      id
      name
      status
    }
  }
  knowledgeMemberLinks(
    where: {
      organizationId: { eq: $organizationId }
      kind: { eq: $kind }
      itemId: { in: $itemIds }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    orderBy: [{ createdAt: DESC }, { membershipUserId: ASC }]
    limit: 1000
  ) {
    itemId
    membership {
      userId
      user {
        displayName
      }
    }
  }
}

# What `link_knowledge` and `unlink_knowledge` read of a document before they write, since the result
# a call keeps under its idempotency key is written with the link: the document, whether the team
# keeps it from AI or deleted it, and every document the item links, those kept from AI or deleted
# included, which `LinkKnowledgeDocumentForAgent` counts against the cap
query GetKnowledgeDocumentLinkForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $kind: KnowledgeKind!
  $itemId: String!
  $documentId: UUID!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  documents(
    where: {
      id: { eq: $documentId }
      organizationId: { eq: $organizationId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 1
  ) {
    title
    isAiReadable
    deletedAt
  }
  knowledgeDocumentLinks(
    where: {
      organizationId: { eq: $organizationId }
      kind: { eq: $kind }
      itemId: { eq: $itemId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 100
  ) {
    documentId
  }
}

# The same for a task: the task, whether it is deleted, and every task the item links, deleted ones
# included, which `LinkKnowledgeTaskForAgent` counts
query GetKnowledgeTaskLinkForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $kind: KnowledgeKind!
  $itemId: String!
  $taskId: UUID!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  tasks(
    where: {
      id: { eq: $taskId }
      organizationId: { eq: $organizationId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 1
  ) {
    name
    status
    deletedAt
  }
  knowledgeTaskLinks(
    where: {
      organizationId: { eq: $organizationId }
      kind: { eq: $kind }
      itemId: { eq: $itemId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 100
  ) {
    taskId
  }
}

# The same for a member: the member, when they belong to the organization, and every member the item
# links, which `LinkKnowledgeMemberForAgent` counts
query GetKnowledgeMemberLinkForAgent(
  $organizationId: UUID!
  $userId: String!
  $membershipCreatedAt: Timestamp!
  $kind: KnowledgeKind!
  $itemId: String!
  $memberId: String!
) @auth(level: NO_ACCESS) {
  membership: userOrganizations(
    where: { userId: { eq: $userId }, organizationId: { eq: $organizationId }, createdAt: { eq: $membershipCreatedAt } }
    limit: 1
  ) {
    userId
  }
  members: userOrganizations(
    where: {
      userId: { eq: $memberId }
      organizationId: { eq: $organizationId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 1
  ) {
    user {
      displayName
    }
  }
  knowledgeMemberLinks(
    where: {
      organizationId: { eq: $organizationId }
      kind: { eq: $kind }
      itemId: { eq: $itemId }
      organization: {
        userOrganizations_on_organization: {
          exist: { userId: { eq: $userId }, createdAt: { eq: $membershipCreatedAt } }
        }
      }
    }
    limit: 100
  ) {
    membershipUserId
  }
}
