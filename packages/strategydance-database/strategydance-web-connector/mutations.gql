# Insert and update are separate rather than one upsert, and `locale` is why: it is written at
# creation and then only by the account page, so an upsert carrying it would quietly reset the
# account's language every time an unrelated field changed.
#
# Neither takes an email. `email_expr` reads it off the verified token, so a signed-in caller
# cannot put somebody else's address on their own row: `email` is unique, and a client that
# chose its own could squat the address a real person is about to sign up with

mutation CreateCurrentUser(
  $displayName: String
  $imageUrl: String
  $locale: Locale!
  $timezone: String
  $authenticationProviders: [AuthenticationProvider!]!
) @auth(level: USER) {
  user_insert(
    data: {
      id_expr: "auth.uid"
      email_expr: "auth.token.email"
      displayName: $displayName
      imageUrl: $imageUrl
      locale: $locale
      timezone: $timezone
      authenticationProviders: $authenticationProviders
    }
  )
}

# The fields that mirror the Firebase profile, plus the observed time zone. The caller sends
# this only when one of them has actually drifted, so `updatedAt` keeps meaning something
mutation UpdateCurrentUser(
  $displayName: String
  $imageUrl: String
  $timezone: String
  $authenticationProviders: [AuthenticationProvider!]!
) @auth(level: USER) {
  user_update(
    key: { id_expr: "auth.uid" }
    data: {
      email_expr: "auth.token.email"
      displayName: $displayName
      imageUrl: $imageUrl
      timezone: $timezone
      authenticationProviders: $authenticationProviders
      updatedAt_expr: "request.time"
    }
  )
}

# What the account page saves: the name, the picture, the bio and the language, written whole.
#
# The name and the picture are the Firebase profile's, which the page updates first, so this
# writes the same two values the mirror in `UpdateCurrentUser` would and nothing drifts. The bio
# and the language live here alone.
#
# The language is optional because it came after the rest: a tab still running a bundle from
# before it leaves the account's language as it is rather than failing to save the profile, and
# Data Connect does not count the change as a breaking one, which would stop the release
#
# The checks are here as well as in the page, since the page is not the only possible caller, and
# sit on the caller's own row, read first and redacted, because an operation takes no `@check` of
# its own. A new name is held to what an organization's is, at most 80 characters
# (`MAX_USER_NAME_LENGTH` in strategydance-core), and a bio to 200 (`MAX_USER_BIO_LENGTH`), over
# as many lines as it likes.
#
# The name stored is let through as it is, since the page sends it back untouched when only the
# picture or the bio changed. One mirrored from Google can be longer than the page allows, or carry
# spaces at an end, and refusing it would refuse the picture and the bio with it
mutation UpdateCurrentUserProfile($displayName: String!, $imageUrl: String, $bio: String, $locale: Locale)
@auth(level: USER)
@transaction {
  query @redact {
    user(key: { id_expr: "auth.uid" }) {
      displayName
        @check(
          expr: "this == vars.displayName || (size(vars.displayName) <= 80 && vars.displayName.matches('^[[:^space:]](.*[[:^space:]])?$'))"
          message: "A name is 1 to 80 characters on one line, with no space at either end"
        )
        @check(expr: "vars.bio == null || size(vars.bio) <= 200", message: "A bio is at most 200 characters")
    }
  }
  user_update(
    key: { id_expr: "auth.uid" }
    data: { displayName: $displayName, imageUrl: $imageUrl, bio: $bio, locale: $locale, updatedAt_expr: "request.time" }
  )
}

# An organization and its first administrator, which are one act: an organization nobody can
# administer is unreachable, and a membership without its organization is a foreign key
# violation. `@transaction` rolls the first insert back if the second fails.
#
# `userId_expr` reads the uid off the token, so nobody can be made an administrator of an
# organization they never asked for. `response.organization.id` is the uuid the step above
# generated, keyed by the alias.
#
# The name and the brief are held to what `UpdateOrganization` holds them to, so an organization
# never starts with details its profile page would refuse to save. The brief is null when there
# is none. The checks sit on the caller's own row, read first and redacted, because an operation
# takes no `@check` of its own.
#
# The slug is the browser's to draw, from the name and a random suffix, since a check can test a
# string but not build one. It is held to strategydance-core's `ORGANIZATION_SLUG_PATTERN`, which
# `schema.test.ts` keeps this one agreeing with, and a slug somebody else holds fails the column's
# unique index, upon which the browser draws again. It is optional so a page from before slugs can
# still create one, which `backfillOrganizationSlugs` then gives a slug
mutation CreateOrganization($name: String!, $brief: String, $slug: String) @auth(level: USER) @transaction {
  query @redact {
    user(key: { id_expr: "auth.uid" }) {
      id
        @check(
          expr: "size(vars.name) <= 80 && vars.name.matches('^[[:^space:]](.*[[:^space:]])?$')"
          message: "A name is 1 to 80 characters on one line, with no space at either end"
        )
        @check(expr: "vars.brief == null || size(vars.brief) <= 500", message: "A brief is at most 500 characters")
        @check(
          expr: "!has(vars.slug) || vars.slug == null || (size(vars.slug) <= 37 && vars.slug.matches('^[a-z0-9]+(-[a-z0-9]+)*-[a-z0-9]{4}$'))"
          message: "A slug is lowercase words joined by dashes, then a dash and four letters or digits"
        )
    }
  }
  organization: organization_insert(data: { name: $name, brief: $brief, slug: $slug })
  userOrganization: userOrganization_insert(
    data: {
      organizationId_expr: "response.organization.id"
      userId_expr: "auth.uid"
      # Whoever creates it administers it
      role: ADMINISTRATOR
    }
  )
}

# Adds one aspect to those an organization has started on. The list is written whole, because
# Data Connect has no `add` for a list of enums as it has for scalar lists, so the caller sends
# the list it expects: the one it read, with the aspect added.
#
# The server trusts none of it. Its `@check` accepts the list only when it is exactly the stored
# one with the aspect appended, and the aspect not already in it: no removal, no duplicate, no
# list longer than the aspects there are. It also refuses a write over a list that changed since
# the caller read it, so two tabs or two members adding aspects at once cannot drop each other's;
# the one refused reads the list again and retries.
#
# Only a member may add one. The first step reads the caller's own membership, keyed by the uid
# off the token, and its `@check` fails the transaction when there is none, before the update
# runs. `@redact` keeps both reads out of the response
mutation AddOrganizationExploredAspect(
  $organizationId: UUID!
  $aspect: CompanyAspect!
  $exploredAspects: [CompanyAspect!]!
) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change what it explores") {
      role
    }
    organization(id: $organizationId) {
      exploredAspects
        @check(
          expr: "!(vars.aspect in this) && vars.exploredAspects == this + [vars.aspect]"
          message: "The aspect is explored already, or the explored aspects changed since they were read"
        )
    }
  }
  organization_update(id: $organizationId, data: { exploredAspects: $exploredAspects, updatedAt_expr: "request.time" })
}

# Sets how an organization appears: its name, the color of its mark, its brief, and whether its
# profile is public. Only an administrator may.
#
# All four are written whole: the profile page sends what it shows whenever any of them changed,
# the color as stored, null for the default, and the brief null when there is none. The logo and
# the banner are not here. Only the backend writes those, since each is a file in Storage first.
#
# The checks on the variables are here as well as in the page, since the page is not the only
# possible caller, and sit on the redacted read's field because an operation takes no `@check` of
# its own. A name is refused empty, over 80 characters (`MAX_ORGANIZATION_NAME_LENGTH` in
# strategydance-core), across lines, or with whitespace at either end, which the page trims away:
# CEL has no standard `trim()`, so the pattern says it instead. A color is six uppercase hex digits.
# A brief is at most 500 characters (`MAX_ORGANIZATION_BRIEF_LENGTH`).
#
# The write comes first rather than a separate row lock, because Data Connect runs one write per
# row in a mutation: a second `organization_update`, aliased or not, silently changes nothing. The
# write takes the organization's row lock itself, as the lock step of `UpdateOrganizationMemberRole`
# does, so the checks after it read what a demotion in the same instant committed, and a check
# that fails rolls the write back
mutation UpdateOrganization($organizationId: UUID!, $name: String!, $color: String, $brief: String, $isPublic: Boolean!)
@auth(level: USER)
@transaction {
  organization_update(
    id: $organizationId
    data: { name: $name, color: $color, brief: $brief, isPublic: $isPublic, updatedAt_expr: "request.time" }
  )
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its settings") {
      role
        @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can change an organization's settings")
        @check(
          expr: "size(vars.name) <= 80 && vars.name.matches('^[[:^space:]](.*[[:^space:]])?$')"
          message: "A name is 1 to 80 characters on one line, with no space at either end"
        )
        @check(
          expr: "vars.color == null || vars.color.matches('^#[0-9A-F]{6}$')"
          message: "A color is six uppercase hex digits after a #"
        )
        @check(expr: "vars.brief == null || size(vars.brief) <= 500", message: "A brief is at most 500 characters")
    }
  }
}

# Makes a member an administrator, or an administrator a member. Only an administrator may.
#
# The organization keeps at least one: making somebody a member is refused unless another
# administrator remains. Since the caller is one, that only ever refuses the last administrator
# demoting themselves.
#
# The first step touches the organization's row, which takes its lock until the transaction
# ends, so every change to who administers an organization runs one after the other. Without it
# two administrators demoting each other at once would each read the other as an administrator
# and both succeed, leaving none. The one that waited reads after the other commits, since
# Postgres starts each statement on what is committed by then
mutation UpdateOrganizationMemberRole($organizationId: UUID!, $userId: String!, $role: OrganizationRole!)
@auth(level: USER)
@transaction {
  organization_update(id: $organizationId, data: { updatedAt_expr: "request.time" }) @redact
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change a role in it") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can change a role")
    }
    userOrganizations(
      where: { organizationId: { eq: $organizationId }, role: { eq: ADMINISTRATOR }, userId: { ne: $userId } }
      limit: 1
    )
      @check(
        expr: "vars.role == 'ADMINISTRATOR' || size(this) > 0"
        message: "An organization keeps at least one administrator"
      ) {
      userId
    }
  }
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { role: $role, updatedAt_expr: "request.time" }
  ) @check(expr: "this != null", message: "Nobody by that id belongs to the organization")
}

# Sets what somebody does in an organization, or clears it with null. A member may write their
# own, and an administrator anybody's.
#
# The length is checked here as well as by the form, since the form is not the only possible
# caller. It sits on the first step's field because an operation takes no `@check` of its own.
#
# The organization's row lock comes first, as in `UpdateOrganizationMemberRole`, so an
# administrator demoted in the same instant cannot still write somebody else's title: whichever
# runs second reads what the first committed
mutation UpdateOrganizationMemberJobTitle($organizationId: UUID!, $userId: String!, $jobTitle: String)
@auth(level: USER)
@transaction {
  organization_update(id: $organizationId, data: { updatedAt_expr: "request.time" }) @redact
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change a job title in it") {
      role
        @check(
          expr: "this == 'ADMINISTRATOR' || vars.userId == auth.uid"
          message: "Only an administrator can change somebody else's job title"
        )
        @check(
          expr: "vars.jobTitle == null || size(vars.jobTitle) <= 60"
          message: "A job title is at most 60 characters"
        )
    }
  }
  userOrganization_update(
    key: { userId: $userId, organizationId: $organizationId }
    data: { jobTitle: $jobTitle, updatedAt_expr: "request.time" }
  ) @check(expr: "this != null", message: "Nobody by that id belongs to the organization")
}

# Sets the caller's top priority in an organization, or clears it with null, for their team to
# read on its Today page.
#
# Keyed by the uid off the token, so a member writes their own and nobody else's. The first step
# reads that membership and fails for anybody outside the organization. The priority is BlockNote's
# blocks, serialized, whose words nothing here can count, so what is checked is its size, as
# the log's is: at most 100000 characters, `MAX_TOP_PRIORITY_LENGTH` in strategydance-core, since
# the dialog is not the only possible caller. `$organizationId` is also what the team's live query
# refreshes on
mutation UpdateTopPriority($organizationId: UUID!, $topPriority: String) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can set a top priority in it") {
      role
        @check(
          expr: "vars.topPriority == null || (size(vars.topPriority) > 0 && size(vars.topPriority) <= 100000)"
          message: "A top priority is a serialized editor state of 1 to 100000 characters"
        )
    }
  }
  userOrganization_update(
    key: { userId_expr: "auth.uid", organizationId: $organizationId }
    data: { topPriority: $topPriority, topPriorityUpdatedAt_expr: "request.time", updatedAt_expr: "request.time" }
  ) @check(expr: "this != null", message: "Only a member of an organization can set a top priority in it")
}

# Saves how the caller's own Today page lists the team's priorities, both lists written whole.
#
# Keyed by the uid off the token, like `UpdateTopPriority`. Each list holds user ids, and neither
# is checked against the team: an id that names nobody only sorts or hides nobody, and the page
# drops those of people who left. What is checked is the size, at most the 100 a team holds
# (`MAX_TEAM_SIZE` in strategydance-core), so a caller cannot grow a row without bound
mutation UpdateTodayPreferences($organizationId: UUID!, $priorityOrder: [String!]!, $hiddenPriorities: [String!]!)
@auth(level: USER)
@transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can arrange its priorities") {
      role
        @check(
          expr: "size(vars.priorityOrder) <= 100 && size(vars.hiddenPriorities) <= 100"
          message: "A team's priorities are arranged by at most 100 ids"
        )
    }
  }
  userOrganization_update(
    key: { userId_expr: "auth.uid", organizationId: $organizationId }
    data: { priorityOrder: $priorityOrder, hiddenPriorities: $hiddenPriorities, updatedAt_expr: "request.time" }
  ) @check(expr: "this != null", message: "Only a member of an organization can arrange its priorities")
}

# Takes somebody out of an organization: the page calls it banning. Only an administrator may,
# and never on themselves, which is also what keeps this from removing the last administrator.
#
# It deletes the membership and nothing else, so they can be invited again later, as the page
# promises. It takes the organization's row lock first, as `UpdateOrganizationMemberRole` does,
# so two administrators removing each other at once cannot both succeed and leave none
mutation RemoveOrganizationMember($organizationId: UUID!, $userId: String!) @auth(level: USER) @transaction {
  organization_update(id: $organizationId, data: { updatedAt_expr: "request.time" }) @redact
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can remove somebody from it") {
      role
        @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can remove somebody")
        @check(expr: "vars.userId != auth.uid", message: "Nobody can remove themselves from an organization")
    }
  }
  userOrganization_delete(key: { userId: $userId, organizationId: $organizationId })
    @check(expr: "this != null", message: "Nobody by that id belongs to the organization")
}

# Cancels a pending invitation. Only an administrator may.
#
# Keyed by the address rather than the id, which the team page never reads. Canceling one that
# was accepted or canceled a moment ago deletes nothing and succeeds, since the outcome is the
# one asked for. The organization's row lock comes first, so an administrator demoted in the
# same instant cannot still cancel
mutation DeleteOrganizationInvitation($organizationId: UUID!, $email: String!) @auth(level: USER) @transaction {
  organization_update(id: $organizationId, data: { updatedAt_expr: "request.time" }) @redact
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can cancel an invitation to it") {
      role @check(expr: "this == 'ADMINISTRATOR'", message: "Only an administrator can cancel an invitation")
    }
  }
  organizationInvitation_deleteMany(where: { organizationId: { eq: $organizationId }, email: { eq: $email } })
}

# Joins the organization an invitation is for, as a member.
#
# The caller has to hold the invitation's id, which only its email carried, and be signed in with
# the address it was sent to, verified. The two together are the proof: the id that the email
# arrived, the verified address that it arrived to this account. Unverified, the address would
# prove nothing, since a password sign-up can name any address its owner has not claimed yet.
# `$organizationId` is asked for rather than read off the invitation so the first step can check
# the pair, and so the team page's live query can tell which organization changed
mutation AcceptOrganizationInvitation($id: UUID!, $organizationId: UUID!)
@auth(level: USER_EMAIL_VERIFIED)
@transaction {
  query @redact {
    organizationInvitations(
      where: { id: { eq: $id }, organizationId: { eq: $organizationId }, email: { eq_expr: "auth.token.email" } }
      limit: 1
    ) @check(message: "The invitation is gone, or was sent to another address") {
      id
    }
  }
  userOrganization_insert(data: { userId_expr: "auth.uid", organizationId: $organizationId, role: MEMBER })
  # Has to find the row: an invitation canceled or declined after the first step read it, which
  # nothing locked, would otherwise be accepted all the same. A delete that finds nothing fails,
  # and the transaction takes the membership back with it
  organizationInvitation_delete(id: $id)
    @check(expr: "this != null", message: "The invitation is gone, or was sent to another address")
}

# Declines an invitation, which deletes it. Only its addressee may, on the same terms as accepting,
# verified address included
mutation DeclineOrganizationInvitation($id: UUID!, $organizationId: UUID!) @auth(level: USER_EMAIL_VERIFIED) {
  organizationInvitation_deleteMany(
    where: { id: { eq: $id }, organizationId: { eq: $organizationId }, email: { eq_expr: "auth.token.email" } }
  )
}

# Adds a task list for the caller in an organization. The id is the page's, which writes the list
# into its cache before the server answers, and so is the position, one past the last list's.
# `$position` is optional only because the page deployed before lists could move sends none, and
# its list then takes the column's 0, as the lists made before then did.
#
# At most 100 lists a person in an organization (`MAX_TASK_LISTS` in strategydance-core), counted
# under a lock: the first step writes the caller's own membership, which also refuses anybody
# outside the organization, so two tabs adding at once count one after the other. A name is one
# line of at most 120 characters (`MAX_TASK_LIST_NAME_LENGTH`)
mutation CreateTaskList($organizationId: UUID!, $id: UUID!, $name: String!, $position: Float)
@auth(level: USER)
@transaction {
  userOrganization_update(
    key: { userId_expr: "auth.uid", organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this != null", message: "Only a member of an organization can keep task lists in it")
    @check(
      expr: "size(vars.name) <= 120 && vars.name.matches('^[[:^space:]](.*[[:^space:]])?$')"
      message: "A task list's name is 1 to 120 characters on one line, with no space at either end"
    )
  query @redact {
    taskLists(
      where: { userId: { eq_expr: "auth.uid" }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
      limit: 100
    ) @check(expr: "size(this) < 100", message: "Somebody keeps at most 100 task lists in an organization") {
      id
    }
  }
  taskList_insert(
    data: { id: $id, userId_expr: "auth.uid", organizationId: $organizationId, name: $name, position: $position }
  )
}

# Renames one of the caller's task lists, held to what `CreateTaskList` holds a name to
mutation RenameTaskList($organizationId: UUID!, $id: UUID!, $name: String!) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can keep task lists in it") {
      role
        @check(
          expr: "size(vars.name) <= 120 && vars.name.matches('^[[:^space:]](.*[[:^space:]])?$')"
          message: "A task list's name is 1 to 120 characters on one line, with no space at either end"
        )
    }
  }
  taskList_updateMany(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
    }
    data: { name: $name, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "No task list of yours by that id")
}

# Moves one of the caller's task lists in their rail. The page sends the position halfway between
# its new neighbours', and renumbers the rail one list at a time when they are too close for that
mutation MoveTaskList($organizationId: UUID!, $id: UUID!, $position: Float!) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can keep task lists in it") {
      role
    }
  }
  taskList_updateMany(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
    }
    data: { position: $position, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "No task list of yours by that id")
}

# Deletes one of the caller's task lists by setting `deletedAt`, so `RestoreTaskList` can take it
# back with its tasks. Deleting one that is gone already changes nothing and succeeds, since the
# outcome is the one asked for.
#
# It also prunes the caller's lists deleted more than a day ago, in every organization, their tasks
# cascading with them, since nothing undoes a delete that old. Pruning here is lazy: the lists
# deleted in the day before the caller's latest delete stay until their next one, unread by
# anything but `RestoreTaskList`, which bounds them by what one person deletes in a day. A
# guaranteed expiry would take a scheduled job
mutation DeleteTaskList($organizationId: UUID!, $id: UUID!) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can keep task lists in it") {
      role
    }
  }
  taskList_updateMany(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
    }
    data: { deletedAt_expr: "request.time", updatedAt_expr: "request.time" }
  )
  taskList_deleteMany(
    where: { userId: { eq_expr: "auth.uid" }, deletedAt: { lt_time: { now: true, sub: { days: 1 } } } }
  ) @redact
}

# Takes back a delete, which the page offers for a few seconds after one. Fails once the list was
# pruned, a day after it was deleted.
#
# A list brought back counts against the 100 as a new one does, under the same lock on the caller's
# membership: without it, deleting a list at the cap, adding another and taking the delete back
# would keep 101
mutation RestoreTaskList($organizationId: UUID!, $id: UUID!) @auth(level: USER) @transaction {
  userOrganization_update(
    key: { userId_expr: "auth.uid", organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  ) @redact @check(expr: "this != null", message: "Only a member of an organization can keep task lists in it")
  query @redact {
    taskLists(
      where: { userId: { eq_expr: "auth.uid" }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
      limit: 100
    ) @check(expr: "size(this) < 100", message: "Somebody keeps at most 100 task lists in an organization") {
      id
    }
  }
  taskList_updateMany(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: false }
    }
    data: { deletedAt: null, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "The task list is gone for good")
}

# Adds a task to one of the caller's task lists, or puts back one just deleted, which is why it
# takes whether it is done. The id is the page's, as with a list.
#
# The first step writes the list, which is the lock the count below is taken under, and finds
# nothing unless the list is the caller's, alive, and in an organization they belong to. At most
# 1000 tasks a list (`MAX_TASKS_PER_LIST` in strategydance-core), each one line of at most 120
# characters (`MAX_TASK_LENGTH`)
mutation CreateTask(
  $organizationId: UUID!
  $id: UUID!
  $taskListId: UUID!
  $text: String!
  $position: Float!
  $isDone: Boolean!
) @auth(level: USER) @transaction {
  taskList_updateMany(
    where: {
      id: { eq: $taskListId }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
    }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this == 1", message: "A task goes on a task list of yours, in an organization you belong to")
    @check(
      expr: "size(vars.text) <= 120 && vars.text.matches('^[[:^space:]](.*[[:^space:]])?$')"
      message: "A task is 1 to 120 characters on one line, with no space at either end"
    )
  query @redact {
    tasks(where: { taskListId: { eq: $taskListId } }, limit: 1000)
      @check(expr: "size(this) < 1000", message: "A task list holds at most 1000 tasks") {
      id
    }
  }
  task_insert(data: { id: $id, taskListId: $taskListId, text: $text, position: $position, isDone: $isDone })
}

# Writes one of the caller's tasks whole: its text, whether it is done, and where it sits. The page
# sends all three from what it shows, whichever changed, and queues its writes to one task so they
# land in order
mutation UpdateTask($organizationId: UUID!, $id: UUID!, $text: String!, $isDone: Boolean!, $position: Float!)
@auth(level: USER)
@transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can keep task lists in it") {
      role
        @check(
          expr: "size(vars.text) <= 120 && vars.text.matches('^[[:^space:]](.*[[:^space:]])?$')"
          message: "A task is 1 to 120 characters on one line, with no space at either end"
        )
    }
  }
  task_updateMany(
    where: {
      id: { eq: $id }
      taskList: {
        userId: { eq_expr: "auth.uid" }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
      }
    }
    data: { text: $text, isDone: $isDone, position: $position, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "No task of yours by that id")
}

# Deletes one of the caller's tasks. One that is gone already changes nothing and succeeds
mutation DeleteTask($organizationId: UUID!, $id: UUID!) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can keep task lists in it") {
      role
    }
  }
  task_deleteMany(
    where: { id: { eq: $id }, taskList: { userId: { eq_expr: "auth.uid" }, organizationId: { eq: $organizationId } } }
  )
}

# Starts the caller's checklist in an organization with the four default habits, named by the page
# in the caller's language, the first time they open it there.
#
# The first step writes the caller's own membership, which refuses anybody outside the
# organization and is the lock the rest runs under: a second tab asking at the same time waits,
# then finds the four the first made and is refused. Any column at all, a deleted one included,
# refuses it too, so a member who removed the defaults does not get them back, and a member invited
# again keeps the checklist they had. Each name is held to what `CreateChecklistItem` holds one to
mutation CreateDefaultChecklistItems(
  $organizationId: UUID!
  $firstName: String!
  $secondName: String!
  $thirdName: String!
  $fourthName: String!
) @auth(level: USER) @transaction {
  userOrganization_update(
    key: { userId_expr: "auth.uid", organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this != null", message: "Only a member of an organization can keep a checklist in it")
    @check(
      expr: "size(vars.firstName) <= 40 && vars.firstName.matches('^[[:^space:]](.*[[:^space:]])?$') && size(vars.secondName) <= 40 && vars.secondName.matches('^[[:^space:]](.*[[:^space:]])?$') && size(vars.thirdName) <= 40 && vars.thirdName.matches('^[[:^space:]](.*[[:^space:]])?$') && size(vars.fourthName) <= 40 && vars.fourthName.matches('^[[:^space:]](.*[[:^space:]])?$')"
      message: "A checklist column's name is 1 to 40 characters on one line, with no space at either end"
    )
  query @redact {
    checklistItems(where: { userId: { eq_expr: "auth.uid" }, organizationId: { eq: $organizationId } }, limit: 1)
      @check(expr: "size(this) == 0", message: "The checklist was started already") {
      id
    }
  }
  first: checklistItem_insert(
    data: { userId_expr: "auth.uid", organizationId: $organizationId, name: $firstName, position: 1 }
  )
  second: checklistItem_insert(
    data: { userId_expr: "auth.uid", organizationId: $organizationId, name: $secondName, position: 2 }
  )
  third: checklistItem_insert(
    data: { userId_expr: "auth.uid", organizationId: $organizationId, name: $thirdName, position: 3 }
  )
  fourth: checklistItem_insert(
    data: { userId_expr: "auth.uid", organizationId: $organizationId, name: $fourthName, position: 4 }
  )
}

# Adds a column to the caller's checklist in an organization. The id is the page's, which shows the
# column before the server answers.
#
# At most 100 live columns (`MAX_CHECKLIST_ITEMS` in strategydance-core), counted under a lock on
# the caller's own membership, as `CreateTaskList` counts lists. A name is one line of at most 40
# characters (`MAX_CHECKLIST_ITEM_NAME_LENGTH`)
mutation CreateChecklistItem($organizationId: UUID!, $id: UUID!, $name: String!, $position: Float!)
@auth(level: USER)
@transaction {
  userOrganization_update(
    key: { userId_expr: "auth.uid", organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this != null", message: "Only a member of an organization can keep a checklist in it")
    @check(
      expr: "size(vars.name) <= 40 && vars.name.matches('^[[:^space:]](.*[[:^space:]])?$')"
      message: "A checklist column's name is 1 to 40 characters on one line, with no space at either end"
    )
  query @redact {
    checklistItems(
      where: { userId: { eq_expr: "auth.uid" }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
      limit: 100
    ) @check(expr: "size(this) < 100", message: "A checklist holds at most 100 columns") {
      id
    }
  }
  checklistItem_insert(
    data: { id: $id, userId_expr: "auth.uid", organizationId: $organizationId, name: $name, position: $position }
  )
}

# Renames or moves one of the caller's checklist columns, both written whole, held to what
# `CreateChecklistItem` holds a name to
mutation UpdateChecklistItem($organizationId: UUID!, $id: UUID!, $name: String!, $position: Float!)
@auth(level: USER)
@transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can keep a checklist in it") {
      role
        @check(
          expr: "size(vars.name) <= 40 && vars.name.matches('^[[:^space:]](.*[[:^space:]])?$')"
          message: "A checklist column's name is 1 to 40 characters on one line, with no space at either end"
        )
    }
  }
  checklistItem_updateMany(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
    }
    data: { name: $name, position: $position, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "No checklist column of yours by that id")
}

# Removes one of the caller's checklist columns by setting `deletedAt`, so `RestoreChecklistItem`
# can take it back with its history, and prunes the caller's columns removed over a day ago, in
# every organization, their ticks cascading with them. The pruning is as lazy as
# `DeleteTaskList`'s: the columns removed in the day before the caller's latest removal stay until
# their next one. Removing one that is gone already succeeds
mutation DeleteChecklistItem($organizationId: UUID!, $id: UUID!) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can keep a checklist in it") {
      role
    }
  }
  checklistItem_updateMany(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
    }
    data: { deletedAt_expr: "request.time", updatedAt_expr: "request.time" }
  )
  checklistItem_deleteMany(
    where: { userId: { eq_expr: "auth.uid" }, deletedAt: { lt_time: { now: true, sub: { days: 1 } } } }
  ) @redact
}

# Takes back a removal, which the page offers for a few seconds after one. Fails once the column was
# pruned, a day after it was removed.
#
# A column brought back counts against the 100 as a new one does, under the same lock on the
# caller's membership, as `RestoreTaskList` counts lists
mutation RestoreChecklistItem($organizationId: UUID!, $id: UUID!) @auth(level: USER) @transaction {
  userOrganization_update(
    key: { userId_expr: "auth.uid", organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  ) @redact @check(expr: "this != null", message: "Only a member of an organization can keep a checklist in it")
  query @redact {
    checklistItems(
      where: { userId: { eq_expr: "auth.uid" }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
      limit: 100
    ) @check(expr: "size(this) < 100", message: "A checklist holds at most 100 columns") {
      id
    }
  }
  checklistItem_updateMany(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: false }
    }
    data: { deletedAt: null, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "The checklist column is gone for good")
}

# Ticks a day on one of the caller's checklist columns. An upsert, so ticking a day that is ticked
# already, from a second tab or a double click, changes nothing.
#
# Any past day may be ticked, since a day the reader unlocks is one they forgot. A day ahead is not,
# checked against the caller's own day: in CEL a date is the instant it starts in UTC, so its UTC
# calendar day is compared with the one `request.time` falls on in the zone stored on their row,
# which the app keeps in step with the browser's. With no zone stored, the latest day allowed is
# the one it already is at UTC+14, the zone furthest ahead.
#
# Nor is a day before the caller joined the organization, give or take the zones behind UTC, so a
# checklist's history is as long as its owner's time there and no longer: a tick sent for a day in
# 1900 would otherwise make every teammate who unfolds it draw a century of rows
mutation CheckChecklistItem($organizationId: UUID!, $checklistItemId: UUID!, $date: Date!)
@auth(level: USER)
@transaction {
  query @redact {
    checklistItems(
      where: {
        id: { eq: $checklistItemId }
        userId: { eq_expr: "auth.uid" }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        organization: { userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } } }
      }
      limit: 1
    )
      @check(
        expr: "size(this) == 1"
        message: "Only a column on your own checklist, in an organization you belong to, can be ticked"
      ) {
      id
    }
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId }) {
      createdAt
        @check(
          expr: "(vars.date.getFullYear('UTC') * 10000 + vars.date.getMonth('UTC') * 100 + vars.date.getDate('UTC')) >= ((this - duration('12h')).getFullYear('UTC') * 10000 + (this - duration('12h')).getMonth('UTC') * 100 + (this - duration('12h')).getDate('UTC'))"
          message: "A day before you joined cannot be ticked"
        )
    }
    user(key: { id_expr: "auth.uid" }) {
      timezone
        @check(
          expr: "this != null ? (vars.date.getFullYear('UTC') * 10000 + vars.date.getMonth('UTC') * 100 + vars.date.getDate('UTC')) <= (request.time.getFullYear(this) * 10000 + request.time.getMonth(this) * 100 + request.time.getDate(this)) : (vars.date.getFullYear('UTC') * 10000 + vars.date.getMonth('UTC') * 100 + vars.date.getDate('UTC')) <= ((request.time + duration('14h')).getFullYear('UTC') * 10000 + (request.time + duration('14h')).getMonth('UTC') * 100 + (request.time + duration('14h')).getDate('UTC'))"
          message: "A day that has not come yet cannot be ticked"
        )
    }
  }
  checklistCompletion_upsert(data: { checklistItemId: $checklistItemId, date: $date })
}

# Unticks a day on one of the caller's checklist columns. A day that is not ticked stays so, and
# the call succeeds
mutation UncheckChecklistItem($organizationId: UUID!, $checklistItemId: UUID!, $date: Date!)
@auth(level: USER)
@transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can keep a checklist in it") {
      role
    }
  }
  checklistCompletion_deleteMany(
    where: {
      checklistItemId: { eq: $checklistItemId }
      date: { eq: $date }
      checklistItem: { userId: { eq_expr: "auth.uid" }, organizationId: { eq: $organizationId } }
    }
  )
}

# Writes the caller's log entry for a day, which the unique key holds to one: a second for the same
# day is refused, and the page offers to edit the first. The id is the page's.
#
# The day has to be the caller's today, so an entry is neither backdated nor written ahead. In CEL
# a date is the instant it starts in UTC, so its UTC calendar day is compared with the one
# `request.time` falls on in the zone stored on their row, which the app keeps in step with the
# browser's. With no zone stored, it has to be today somewhere, from UTC-12 to UTC+14. At most
# 50000 characters of serialized state, `MAX_LOG_ENTRY_LENGTH` in strategydance-core.
# `$organizationId` is also what the log's live query refreshes on
mutation CreateLogEntry($organizationId: UUID!, $id: UUID!, $date: Date!, $content: String!)
@auth(level: USER)
@transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can write in its log") {
      role
        @check(
          expr: "size(vars.content) > 0 && size(vars.content) <= 50000"
          message: "A log entry is at most 50000 characters"
        )
    }
    user(key: { id_expr: "auth.uid" }) {
      timezone
        @check(
          expr: "this != null ? (vars.date.getFullYear('UTC') * 10000 + vars.date.getMonth('UTC') * 100 + vars.date.getDate('UTC')) == (request.time.getFullYear(this) * 10000 + request.time.getMonth(this) * 100 + request.time.getDate(this)) : (vars.date.getFullYear('UTC') * 10000 + vars.date.getMonth('UTC') * 100 + vars.date.getDate('UTC')) >= ((request.time - duration('12h')).getFullYear('UTC') * 10000 + (request.time - duration('12h')).getMonth('UTC') * 100 + (request.time - duration('12h')).getDate('UTC')) && (vars.date.getFullYear('UTC') * 10000 + vars.date.getMonth('UTC') * 100 + vars.date.getDate('UTC')) <= ((request.time + duration('14h')).getFullYear('UTC') * 10000 + (request.time + duration('14h')).getMonth('UTC') * 100 + (request.time + duration('14h')).getDate('UTC'))"
          message: "A log entry is for today"
        )
    }
  }
  logEntry_insert(
    data: { id: $id, userId_expr: "auth.uid", organizationId: $organizationId, date: $date, content: $content }
  )
}

# Rewrites one of the caller's log entries, whichever day it is for, held to what `CreateLogEntry`
# holds an entry to
mutation UpdateLogEntry($organizationId: UUID!, $id: UUID!, $content: String!) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can write in its log") {
      role
        @check(
          expr: "size(vars.content) > 0 && size(vars.content) <= 50000"
          message: "A log entry is at most 50000 characters"
        )
    }
  }
  logEntry_updateMany(
    where: { id: { eq: $id }, userId: { eq_expr: "auth.uid" }, organizationId: { eq: $organizationId } }
    data: { content: $content, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "No log entry of yours by that id")
}

# Marks today as a day the caller changed something of their own on their Today page in an
# organization, for the streak the build in public page counts. The app sends it once a change to
# their top priority, a task list or a task, their checklist or their log has gone through. An
# upsert, so every change after the first that day writes nothing new.
#
# It is its own operation rather than a step in each of those, which would take a `$date` they do
# not otherwise need, a breaking change to every one of them. The day is held to what
# `CreateLogEntry` holds a log entry's to, the caller's today in the zone stored on their row, so a
# past day cannot be marked, nor one to come
mutation RecordActivity($organizationId: UUID!, $date: Date!) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization has a streak in it") {
      role
    }
    user(key: { id_expr: "auth.uid" }) {
      timezone
        @check(
          expr: "this != null ? (vars.date.getFullYear('UTC') * 10000 + vars.date.getMonth('UTC') * 100 + vars.date.getDate('UTC')) == (request.time.getFullYear(this) * 10000 + request.time.getMonth(this) * 100 + request.time.getDate(this)) : (vars.date.getFullYear('UTC') * 10000 + vars.date.getMonth('UTC') * 100 + vars.date.getDate('UTC')) >= ((request.time - duration('12h')).getFullYear('UTC') * 10000 + (request.time - duration('12h')).getMonth('UTC') * 100 + (request.time - duration('12h')).getDate('UTC')) && (vars.date.getFullYear('UTC') * 10000 + vars.date.getMonth('UTC') * 100 + vars.date.getDate('UTC')) <= ((request.time + duration('14h')).getFullYear('UTC') * 10000 + (request.time + duration('14h')).getMonth('UTC') * 100 + (request.time + duration('14h')).getDate('UTC'))"
          message: "Only today can be marked active"
        )
    }
  }
  activityDay_upsert(data: { userId_expr: "auth.uid", organizationId: $organizationId, date: $date })
}

# Adds a document to an organization's knowledge, which any of its members may do. The id is the
# page's, which opens a draft at its address and stores it only once it has a title or some text,
# so a document never starts blank: a page that would add nothing adds nothing.
#
# At most 1000 documents an organization (`MAX_DOCUMENTS` in strategydance-core), counted under a
# lock: the first step writes the organization's row, and finds nothing unless the caller belongs
# to it, so two members adding at once count one after the other. A title is one line of at most
# 200 characters (`MAX_DOCUMENT_TITLE_LENGTH`), spaces and all since it is saved as it is typed,
# and the content at most 200000 characters of serialized blocks (`MAX_DOCUMENT_CONTENT_LENGTH`).
# Each aspect is there once. What agents may do with it, chosen on the draft, comes with it.
#
# `$state` is the draft's text as a Yjs document, the same text as `$content`, so the document is
# shared from its first save and nobody seeds a second copy of it. Optional, since a page from
# before the editor was shared sends none, and its document is seeded once somebody opens it
mutation CreateDocument(
  $organizationId: UUID!
  $id: UUID!
  $title: String!
  $content: String!
  $aspects: [CompanyAspect!]!
  $isAiReadable: Boolean!
  $isAiWritable: Boolean!
  $state: String
) @auth(level: USER) @transaction {
  organization_updateMany(
    where: {
      id: { eq: $organizationId }
      userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } }
    }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this == 1", message: "Only a member of an organization can add to its knowledge")
    @check(
      expr: "size(vars.title) <= 200 && vars.title.matches('^[^\\r\\n]*$')"
      message: "A document's title is at most 200 characters on one line"
    )
    @check(expr: "size(vars.content) <= 200000", message: "A document's content is at most 200000 characters")
    @check(
      expr: "!has(vars.state) || vars.state == null || size(vars.state) <= 2000000"
      message: "A document's state is at most 2000000 characters"
    )
    @check(
      expr: "vars.title.matches('[[:^space:]]') || vars.content != ''"
      message: "A document starts with a title or some text"
    )
    @check(
      expr: "vars.aspects.all(aspect, vars.aspects.exists_one(other, other == aspect))"
      message: "A document is tagged with each aspect at most once"
    )
  query @redact {
    documents(where: { organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }, limit: 1000)
      @check(expr: "size(this) < 1000", message: "An organization keeps at most 1000 documents") {
      id
    }
  }
  document_insert(
    data: {
      id: $id
      organizationId: $organizationId
      createdById_expr: "auth.uid"
      title: $title
      content: $content
      aspects: $aspects
      isAiReadable: $isAiReadable
      isAiWritable: $isAiWritable
      state: $state
    }
  )
}

# Retitles a document, held to what `CreateDocument` holds a title to. An empty one is allowed,
# which the pages read as "Untitled".
#
# Each of a document's fields is written by an operation of its own, so two members changing two
# of them at once never write back each other's old value
mutation RenameDocument($organizationId: UUID!, $id: UUID!, $title: String!) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its knowledge") {
      role
        @check(
          expr: "size(vars.title) <= 200 && vars.title.matches('^[^\\r\\n]*$')"
          message: "A document's title is at most 200 characters on one line"
        )
    }
  }
  document_updateMany(
    where: { id: { eq: $id }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
    data: { title: $title, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "No document by that id in the organization")
}

# Saves a document's content, held to what `CreateDocument` holds it to, and an empty string when it
# has no text.
#
# `$revision` is the one the page read or last saved, and the save is refused unless it is still
# the stored one: two members writing at once would otherwise each save their whole document over
# the other's, and neither would know. The one refused keeps their words on screen and is told to
# reload.
#
# Only a page from before the editor was shared calls it. A document with a `state` is edited
# through its Yjs updates, and `content` is a copy the next compaction writes over, so a save here
# is refused like one made over another revision, and that page reloads into the shared editor
mutation UpdateDocumentContent($organizationId: UUID!, $id: UUID!, $content: String!, $revision: Int!)
@auth(level: USER)
@transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its knowledge") {
      role @check(expr: "size(vars.content) <= 200000", message: "A document's content is at most 200000 characters")
    }
  }
  document_updateMany(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      revision: { eq: $revision }
      state: { isNull: true }
    }
    data: { content: $content, revision_update: { inc: 1 }, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "The document was deleted or changed elsewhere since it was read")
}

# Sets which aspects a document is tagged with, the list written whole, each aspect once. A list of
# enums has no `add` or `remove` in Data Connect, so two members retagging at once keep whichever
# list was saved last
mutation UpdateDocumentAspects($organizationId: UUID!, $id: UUID!, $aspects: [CompanyAspect!]!)
@auth(level: USER)
@transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its knowledge") {
      role
        @check(
          expr: "vars.aspects.all(aspect, vars.aspects.exists_one(other, other == aspect))"
          message: "A document is tagged with each aspect at most once"
        )
    }
  }
  document_updateMany(
    where: { id: { eq: $id }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
    data: { aspects: $aspects, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "No document by that id in the organization")
}

# Lets agents read a document, or keeps it from them. Whether they may change it is kept apart, by
# `SetDocumentAiWritable`, and counts only while they may read it
mutation SetDocumentAiReadable($organizationId: UUID!, $id: UUID!, $isAiReadable: Boolean!)
@auth(level: USER)
@transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its knowledge") {
      role
    }
  }
  document_updateMany(
    where: { id: { eq: $id }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
    data: { isAiReadable: $isAiReadable, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "No document by that id in the organization")
}

# Lets agents change a document, or asks that none does
mutation SetDocumentAiWritable($organizationId: UUID!, $id: UUID!, $isAiWritable: Boolean!)
@auth(level: USER)
@transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its knowledge") {
      role
    }
  }
  document_updateMany(
    where: { id: { eq: $id }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
    data: { isAiWritable: $isAiWritable, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "No document by that id in the organization")
}

# Deletes a document by setting `deletedAt`, so `RestoreDocument` can take it back. Deleting one that
# is gone already changes nothing and succeeds, since the outcome is the one asked for. `updatedAt`
# is left alone, so a document brought back takes its place in the list again rather than the top.
#
# It also prunes the organization's documents deleted more than a day ago, since nothing undoes a
# delete that old, as lazily as `DeleteTaskList` prunes lists: the ones deleted in the day before
# the latest delete stay, unread by anything but `RestoreDocument`, until the next one
mutation DeleteDocument($organizationId: UUID!, $id: UUID!) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its knowledge") {
      role
    }
  }
  document_updateMany(
    where: { id: { eq: $id }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
    data: { deletedAt_expr: "request.time" }
  )
  document_deleteMany(
    where: { organizationId: { eq: $organizationId }, deletedAt: { lt_time: { now: true, sub: { days: 1 } } } }
  ) @redact
}

# Takes back a delete, which the page offers for a few seconds after one. Fails once the document
# was pruned, a day after it was deleted.
#
# A document brought back counts against the 1000 as a new one does, under the same lock on the
# organization's row: without it, deleting a document at the cap, adding another and taking the
# delete back would keep 1001
mutation RestoreDocument($organizationId: UUID!, $id: UUID!) @auth(level: USER) @transaction {
  organization_updateMany(
    where: {
      id: { eq: $organizationId }
      userOrganizations_on_organization: { exist: { userId: { eq_expr: "auth.uid" } } }
    }
    data: { updatedAt_expr: "request.time" }
  ) @redact @check(expr: "this == 1", message: "Only a member of an organization can change its knowledge")
  query @redact {
    documents(where: { organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }, limit: 1000)
      @check(expr: "size(this) < 1000", message: "An organization keeps at most 1000 documents") {
      id
    }
  }
  document_updateMany(
    where: { id: { eq: $id }, organizationId: { eq: $organizationId }, deletedAt: { isNull: false } }
    data: { deletedAt: null }
  ) @check(expr: "this == 1", message: "The document is gone for good")
}

# Deletes a document that somebody emptied, title and text both, as they leave its page: there is
# nothing in it to take back. The emptiness is checked here rather than trusted, so a teammate who
# wrote in it meanwhile keeps what they wrote. One that is not empty, or gone already, is left as it
# is, and the call succeeds all the same.
#
# `content` is only as recent as the last compaction, so a document with updates pending is not
# empty as far as this knows, and one open in any other tab, another member's or the caller's own,
# may have words on their way: both are left. `$sessionId` is the tab asking, whose own presence row
# does not count. Optional, since a page from before the editor was shared sends none, and keeps no
# row, so any fresh row leaves the document then
mutation DiscardDocument($organizationId: UUID!, $id: UUID!, $sessionId: UUID) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its knowledge") {
      role
    }
  }
  document_deleteMany(
    where: {
      _and: [
        {
          id: { eq: $id }
          organizationId: { eq: $organizationId }
          deletedAt: { isNull: true }
          title: { pattern: { regex: "^[[:space:]]*$" } }
          content: { eq: "" }
          documentUpdates_on_document: { count: { eq: 0 } }
        }
        {
          _not: {
            documentPresences_on_document: {
              exist: { sessionId: { ne: $sessionId }, updatedAt: { ge_time: { now: true, sub: { seconds: 45 } } } }
            }
          }
        }
      ]
    }
  )
}

# Stores the first Yjs snapshot of a document stored before the editor was shared, which the first
# tab to open it converts from its `content`. Written only while there is none, and while the
# document is still at the revision that tab read: two tabs opening it at once store one snapshot,
# and the other takes it rather than merge in a second copy of the text, and a page from before the
# editor was shared that saved content meanwhile has the tab convert that instead. `content` holds
# the same text, so it is left alone, and so is `updatedAt`
mutation SeedDocumentState($organizationId: UUID!, $id: UUID!, $state: String!, $revision: Int!)
@auth(level: USER)
@transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its knowledge") {
      role @check(expr: "size(vars.state) <= 2000000", message: "A document's state is at most 2000000 characters")
    }
  }
  document_updateMany(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      state: { isNull: true }
      revision: { eq: $revision }
    }
    data: { state: $state, revision_update: { inc: 1 } }
  ) @check(expr: "this == 1", message: "The document was seeded or changed elsewhere since it was read")
}

# Adds an edit to a document's text, a Yjs update a tab pushes as somebody types, which every tab
# with the document open reads through `GetLiveDocument` and merges. The tab names the id, and a
# retry sends the same id with the same bytes, so a push whose answer was lost is stored once. Only
# for a document with a `state`, which a tab seeds before it pushes anything.
#
# It leaves the document's row alone, `updatedAt` included, so a keystroke writes one small row:
# the compaction that folds it in moves `updatedAt`.
#
# An update is at most 50000 characters (`MAX_DOCUMENT_UPDATE_LENGTH`), and a document keeps at
# most 100 pending (`DOCUMENT_UPDATES_LIMIT`), which `GetLiveDocument` sends whole to every open tab
# at each push: a tab folds an edit too long to push into the snapshot instead, and folds the
# pending ones long before there are 100. A push is refused once 99 are pending, counted before the
# write, as a step after an insert does not see it, and a retry of a push already stored is not
# counted against it. Without a transaction the count is not a lock, so pushes at once can pass it
# together, and only a caller pushing on purpose ever would: what holds every push to a few
# megabytes is the reads' limit of 100, which a tab that finds the list that long folds at once.
#
# An update is never changed once stored: every tab dedupes them by id, so one rewritten under its
# id would reach the tabs that had not merged it yet and none of the others. So it is inserted, and
# a push under a stored id is refused as a duplicate, which a retry, whose answer was lost, takes
# as stored: its id is fresh, so only its own earlier send can hold it.
#
# Not a transaction: its one write is an insert, so a push cut off midway, as
# a closing tab cuts one off, is stored or not, and never half. As a transaction the cutoff leaves
# the Data Connect emulator's database stuck in it, refusing every mutation after
mutation PushDocumentUpdate($organizationId: UUID!, $documentId: UUID!, $id: UUID!, $payload: String!)
@auth(level: USER) {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its knowledge") {
      role
        @check(
          expr: "size(vars.payload) > 0 && size(vars.payload) <= 50000"
          message: "A document update is at most 50000 characters"
        )
    }
    documents(
      where: {
        id: { eq: $documentId }
        organizationId: { eq: $organizationId }
        deletedAt: { isNull: true }
        state: { isNull: false }
      }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "No document by that id in the organization") {
      id
      documentUpdates_on_document(limit: 100)
        @check(
          expr: "size(this) < 99 || this.exists(update, update.id == vars.id)"
          message: "A document has too many updates pending"
        ) {
        id
      }
    }
  }
  documentUpdate_insert(data: { documentId: $documentId, id: $id, createdById_expr: "auth.uid", payload: $payload })
}

# Folds a document's pending updates into its snapshot: the tab sends the snapshot it holds with
# them merged in, the text it reads as `content`, and the ids of the updates it folded, which are
# deleted. Any tab may, once it has seen the updates, which is what keeps a document's few.
#
# `$revision` is the revision of the snapshot the tab merged, and the fold is refused unless it is
# still the stored one, so it never writes over a snapshot somebody folded more into. A push that
# lands while it is out is not among the ids and stays pending. Every tab reads the snapshot again
# when the revision moves, which brings back an update deleted before it reached them. A fold may
# name none, to store an edit of the tab's own too long to push as an update, and then deletes none
mutation CompactDocument(
  $organizationId: UUID!
  $id: UUID!
  $state: String!
  $content: String!
  $revision: Int!
  $updateIds: [UUID!]!
) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can change its knowledge") {
      role
        @check(expr: "size(vars.state) <= 2000000", message: "A document's state is at most 2000000 characters")
        @check(expr: "size(vars.content) <= 200000", message: "A document's content is at most 200000 characters")
    }
  }
  document_updateMany(
    where: {
      id: { eq: $id }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      revision: { eq: $revision }
    }
    data: { state: $state, content: $content, revision_update: { inc: 1 }, updatedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "The document was compacted or deleted elsewhere since it was read")
  documentUpdate_deleteMany(where: { documentId: { eq: $id }, id: { in: $updateIds } })
}

# Says that the caller has a document open in one tab, and where their caret is, or null while
# their focus is out of the text. A tab sends it as the caret moves and every 15 seconds while it is
# visible, and `GetDocumentPresences` lists what was written in the last 45.
#
# The row is the caller's, keyed with their uid, so nobody writes over another member's. Then the
# rows older than a minute go, left by tabs that closed without a word, on every document of the
# organization, so a document nobody opens again keeps none for long either. In that order:
# the upsert has moved this row's `updatedAt`, and a mutation that wrote the row once would skip a
# second write to it.
#
# Not a transaction, as a heartbeat can be out when its tab closes: cut off midway, the row is
# written or not and the stale ones pruned or not, which the next write and the readers' 45 seconds
# make up for, where a transaction would leave the Data Connect emulator stuck in it
mutation UpdateDocumentPresence($organizationId: UUID!, $documentId: UUID!, $sessionId: UUID!, $cursor: String)
@auth(level: USER) {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can open its knowledge") {
      role
        @check(
          expr: "!has(vars.cursor) || vars.cursor == null || size(vars.cursor) <= 2000"
          message: "A cursor is at most 2000 characters"
        )
    }
    documents(
      where: { id: { eq: $documentId }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
      limit: 1
    ) @check(expr: "size(this) == 1", message: "No document by that id in the organization") {
      id
    }
  }
  documentPresence_upsert(
    data: {
      documentId: $documentId
      userId_expr: "auth.uid"
      sessionId: $sessionId
      cursor: $cursor
      updatedAt_expr: "request.time"
    }
  )
  documentPresence_deleteMany(
    where: {
      document: { organizationId: { eq: $organizationId } }
      updatedAt: { lt_time: { now: true, sub: { minutes: 1 } } }
    }
  )
}

# Says that the caller closed a document in one tab, or hid it, so the others stop drawing them.
# Their own row only. One that is gone already changes nothing and succeeds.
#
# Not a transaction: deleting one's own row needs none, and a tab sends this as it closes, which can
# cut the request off midway. The Data Connect emulator then fails to roll the transaction back and
# leaves its database stuck in it, refusing every mutation after
mutation LeaveDocument($organizationId: UUID!, $documentId: UUID!, $sessionId: UUID!) @auth(level: USER) {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can open its knowledge") {
      role
    }
  }
  documentPresence_delete(key: { documentId: $documentId, userId_expr: "auth.uid", sessionId: $sessionId })
}

# Deletes one of the caller's conversations by setting `deletedAt`, so `RestoreConversation` can
# take it back, and asks its run to stop, if one goes: the worker reads `stopRequestedAt` at its next
# step, and stops at its next write once the conversation is deleted anyway. Two rows, each written
# once. Deleting one that is gone already changes nothing and succeeds, since the outcome is the one
# asked for. `updatedAt` is left alone, so a conversation brought back takes its place in the list
# again rather than the top.
#
# `$userId` is the caller's own, checked against the token: the conversations list's refresh
# condition reads it, since a mutation's variables are all a condition can match. Nothing here
# prunes, since a conversation's files live in Storage beside its rows: the backend removes what
# was deleted over a day ago
mutation DeleteConversation($organizationId: UUID!, $userId: String!, $id: UUID!) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can keep conversations in it")
      @check(expr: "vars.userId == auth.uid", message: "A conversation is changed by its author alone") {
      role
    }
  }
  conversation_updateMany(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
    }
    data: { deletedAt_expr: "request.time" }
  )
  conversationRun_updateMany(
    where: {
      conversation: { id: { eq: $id }, userId: { eq_expr: "auth.uid" }, organizationId: { eq: $organizationId } }
      status: { in: [QUEUED, RUNNING] }
      stopRequestedAt: { isNull: true }
    }
    data: { stopRequestedAt_expr: "request.time" }
  )
}

# Takes back a delete, which the page offers for a few seconds after one. Fails once a prune has
# claimed the conversation, a day after it was deleted, so an Undo and a prune never both win.
#
# A conversation brought back counts against the 1000 as a new one does, under the same lock: the
# first step writes the caller's own membership, as starting a conversation does, so deleting one at
# the cap, starting another and taking the delete back cannot keep 1001
mutation RestoreConversation($organizationId: UUID!, $userId: String!, $id: UUID!) @auth(level: USER) @transaction {
  userOrganization_update(
    key: { userId_expr: "auth.uid", organizationId: $organizationId }
    data: { updatedAt_expr: "request.time" }
  )
    @redact
    @check(expr: "this != null", message: "Only a member of an organization can keep conversations in it")
    @check(expr: "vars.userId == auth.uid", message: "A conversation is changed by its author alone")
  query @redact {
    conversations(
      where: { userId: { eq_expr: "auth.uid" }, organizationId: { eq: $organizationId }, deletedAt: { isNull: true } }
      limit: 1000
    ) @check(expr: "size(this) < 1000", message: "Somebody keeps at most 1000 conversations in an organization") {
      id
    }
  }
  conversation_updateMany(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: false }
      pruneClaimedAt: { isNull: true }
    }
    data: { deletedAt: null }
  ) @check(expr: "this == 1", message: "The conversation is gone for good")
}

# Marks the caller's conversation read, setting `unreadCount` back to 0 once its page has shown
# what it counted. `$previewMessageId` is the latest entry the page showed, and the count is
# cleared only while that is still the conversation's latest, so a reply that lands meanwhile stays
# unread until the page shows it too. Neither that nor a conversation read already is an error.
#
# `updatedAt` is left alone: reading is not activity, and the list would move the conversation up
mutation MarkConversationRead($organizationId: UUID!, $userId: String!, $id: UUID!, $previewMessageId: UUID!)
@auth(level: USER)
@transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can keep conversations in it")
      @check(expr: "vars.userId == auth.uid", message: "A conversation is changed by its author alone") {
      role
    }
  }
  conversation_updateMany(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      previewMessageId: { eq: $previewMessageId }
      unreadCount: { gt: 0 }
    }
    data: { unreadCount: 0 }
  )
}

# Sets which aspects the caller's conversation is tagged with, as theirs, so Strategy Dance never
# tags it after, and adds the note that says so to the thread, at `$position`. The list is written
# whole, each aspect once.
#
# The note's position is claimed on the conversation's counter, in the write that sets the aspects:
# it holds only while `nextMessagePosition` is still `$position`, and moves it on by one, as every
# insert of a message does. A run that inserted first moved it, and the page reads the counter
# again and retries. The same write counts the note in `messageCount`, and refuses once the
# conversation holds 2000 entries (`MAX_CONVERSATION_MESSAGES` in strategydance-core), when the
# page says it is full. Its refusal reads the same for all three, a moved counter, a full
# conversation and one that is gone, and the page reads the conversation again to tell them apart.
#
# Nothing else moves: an aspects note never shows as the conversation's preview, so `preview` and
# `unreadCount` stay, and neither does `updatedAt`, so retagging does not move the conversation up
# the list
mutation UpdateConversationAspects(
  $organizationId: UUID!
  $userId: String!
  $id: UUID!
  $aspects: [CompanyAspect!]!
  $position: Int!
) @auth(level: USER) @transaction {
  query @redact {
    userOrganization(key: { userId_expr: "auth.uid", organizationId: $organizationId })
      @check(expr: "this != null", message: "Only a member of an organization can keep conversations in it")
      @check(expr: "vars.userId == auth.uid", message: "A conversation is changed by its author alone") {
      role
        @check(
          expr: "vars.aspects.all(aspect, vars.aspects.exists_one(other, other == aspect))"
          message: "A conversation is tagged with each aspect at most once"
        )
    }
  }
  conversation_updateMany(
    where: {
      id: { eq: $id }
      userId: { eq_expr: "auth.uid" }
      organizationId: { eq: $organizationId }
      deletedAt: { isNull: true }
      nextMessagePosition: { eq: $position }
      messageCount: { lt: 2000 }
    }
    data: {
      aspects: $aspects
      aspectsSetBy: MEMBER
      nextMessagePosition_update: { inc: 1 }
      messageCount_update: { inc: 1 }
    }
  ) @check(expr: "this == 1", message: "The conversation's aspects could not take a note at that position")
  conversationMessage_insert(
    data: { conversationId: $id, kind: ASPECTS, aspects: $aspects, aspectsSetBy: MEMBER, position: $position }
  )
}
