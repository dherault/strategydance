# The languages the product speaks. A second declaration of `Locale` in strategydance-core,
# which is what the message catalogues and the language picker are built from, and the two have
# to agree: `schema.test.ts` is what fails when they stop agreeing
enum Locale {
  EN
  FR
  ES
  DE
  PT
  ZH
  JA
}

# How somebody proves who they are. An enum rather than a string, so Postgres refuses a value
# this app never defined and the generated SDK types it as a union rather than as `string[]`
enum AuthenticationProvider {
  PASSWORD
  GOOGLE
}

# The reader's account, one row per Firebase Auth uid.
#
# Distinct from the Firebase account itself, which the SDK holds and this table only mirrors:
# `email`, `displayName` and `imageUrl` are copies kept in step so a join can render somebody's
# name without a round trip to the auth service, which has no bulk read anyway.
type User @table {
  # `@default(expr: "auth.uid")` fills this in from the caller's token on insert and upsert, so
  # the key is never something a client chooses and nobody can write a row as somebody else
  id: String! @default(expr: "auth.uid")
  # Mandatory and unique, which is what lets the sign-in screen ask about an address before
  # anybody has signed in. Firebase is configured one account per email address, so two rows
  # sharing one would be a bug rather than a pair of accounts
  email: String! @unique
  displayName: String
  imageUrl: String
  # The language the account was created in, as a hint for anything sent to this reader rather
  # than rendered for them. Written once: the interface language is a preference the browser
  # holds, and an account page will own this one
  locale: Locale!
  # An IANA identifier, validated against `Intl` before it is sent. Unlike `locale` this is
  # observed rather than chosen, so the newest answer overwrites the stored one
  timezone: String
  # Which buttons this account can sign in with, so a screen can say so without asking Firebase
  # and getting an answer shaped by email enumeration protection
  authenticationProviders: [AuthenticationProvider!]!
  # When a request last claimed the account's welcome email, which it holds for ten minutes while
  # it sends, so two requests cannot both mail. Left to lapse rather than handed back when the
  # send fails or the process dies, so a later request retries it, never sooner. Only the
  # backend's connector reads or writes it
  welcomeEmailClaimedAt: Timestamp
  # When the account's one welcome email went out, and null until it has. Only the backend's
  # connector writes it. The reader's own row carries it, so the web app knows to ask for it
  welcomeEmailSentAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# The aspects of a company the product guides it through, in the order it presents them. This is
# its only declaration: the generated SDK exports it in this order, and the frontend lists the
# aspects from there
enum CompanyAspect {
  STRATEGY
  PEOPLE
  FINANCES
  PRODUCT
  ENGINEERING
  DESIGN
  MARKETING
  SALES
  LEGAL
}

# What somebody can do inside an organization
enum OrganizationRole {
  MEMBER
  ADMINISTRATOR
}

# A team. It names no members: `UserOrganization` owns those, so adding or removing somebody
# does not touch this row
type Organization @table {
  # Written out rather than left implicit, so `response.organization.id` in `CreateOrganization`
  # refers to something on the page
  id: UUID! @default(expr: "uuidV4()")
  name: String!
  # The aspects the organization has started working on, each once. None to begin with: the
  # sidebar lists these, and the rest wait behind the explore page
  exploredAspects: [CompanyAspect!]! @default(sql: "'{}'")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Which organizations somebody is in, and as what.
#
# Two reference fields as the primary key is what tells Data Connect this is a join table. The
# pair is unique, so a repeated insert is an error rather than a second membership, and `user`
# leads because a composite key indexes left to right: filtering on it is the read this table
# exists for
type UserOrganization @table(key: ["user", "organization"]) {
  # Implies a `userId: String!` column, String because `User.id` is a Firebase uid
  user: User!
  # Implies an `organizationId: UUID!` column, cascade deleting
  organization: Organization!
  # No default. An insert has to say which, so nobody becomes an administrator by omission
  role: OrganizationRole!
  # What they do there, like "Product designer", written by them or by an administrator. On the
  # membership rather than on `User`, since one person does different things in different
  # organizations. Null until somebody writes one. Named apart from the design's "Role" column
  # it fills, because `role` above is already something else
  jobTitle: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Somebody asked to join an organization, by email, who has not answered yet.
#
# Every row is pending: accepting inserts the `UserOrganization` and deletes this row, and
# declining or canceling deletes it alone. The pair of organization and address is unique, so
# nobody is invited to the same organization twice.
#
# `id` doubles as the secret in the invitation's link. Holding it is what proves the email
# reached its reader, which the address on a token cannot: password accounts are never verified.
# So no operation a member can call selects it, and only the backend reads it, to put it in the
# email
type OrganizationInvitation @table @unique(fields: ["organization", "email"]) {
  id: UUID! @default(expr: "uuidV4()")
  # Implies an `organizationId: UUID!` column, cascade deleting
  organization: Organization!
  # Lowercased before it is written, because Firebase Auth lowercases the address on a token and
  # accepting compares the two
  email: String!
  # Who sent it, for the page the link opens to name
  invitedBy: User!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# An invitation somebody sent, kept after the invitation itself is accepted, declined or
# canceled, so the backend can hold everybody to an hourly number of invitation emails. Counted
# in the database rather than in a server's memory, because Cloud Run spreads one caller's
# requests over several instances, and each would keep its own count.
#
# Written in the same transaction as the invitation, and read only by the backend. Every invitation
# prunes the rows older than the window, whoever sent them, so the table holds about the last hour
# of everybody's invitations
type SentInvitation @table @index(fields: ["invitedById", "createdAt"]) {
  id: UUID! @default(expr: "uuidV4()")
  # Implies an `invitedById: String!` column, cascade deleting
  invitedBy: User!
  createdAt: Timestamp! @default(expr: "request.time")
}
