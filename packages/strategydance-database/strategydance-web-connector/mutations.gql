# Insert and update are separate rather than one upsert, and `locale` is why: it is written at
# creation and never again, so an upsert carrying it would quietly reset the account's language
# every time an unrelated field changed.
#
# Neither takes an email. `email_expr` reads it off the verified token, so a signed-in caller
# cannot put somebody else's address on their own row: `email` is unique, and a client that
# chose its own could squat the address a real person is about to sign up with

mutation CreateCurrentUser(
  $displayName: String
  $imageUrl: String
  $locale: Locale!
  $timezone: String
  $authenticationProviders: [AuthenticationProvider!]!
) @auth(level: USER) {
  user_insert(
    data: {
      id_expr: "auth.uid"
      email_expr: "auth.token.email"
      displayName: $displayName
      imageUrl: $imageUrl
      locale: $locale
      timezone: $timezone
      authenticationProviders: $authenticationProviders
    }
  )
}

# The fields that mirror the Firebase profile, plus the observed time zone. The caller sends
# this only when one of them has actually drifted, so `updatedAt` keeps meaning something
mutation UpdateCurrentUser(
  $displayName: String
  $imageUrl: String
  $timezone: String
  $authenticationProviders: [AuthenticationProvider!]!
) @auth(level: USER) {
  user_update(
    key: { id_expr: "auth.uid" }
    data: {
      email_expr: "auth.token.email"
      displayName: $displayName
      imageUrl: $imageUrl
      timezone: $timezone
      authenticationProviders: $authenticationProviders
      updatedAt_expr: "request.time"
    }
  )
}

# An organization and its first administrator, which are one act rather than two: an organization
# nobody can administer is unreachable, and a membership without its organization is a foreign key
# violation. `@transaction` is what makes the pair atomic, so a failure on the second step rolls
# the first back rather than leaving an orphan behind.
#
# The caller never names themselves. `userId_expr` reads the uid off the token, so this cannot be
# shaped to make somebody else an administrator of an organization they never asked for, and it is
# also what keeps the operation out of the insecure set: `@auth(level: USER)` counts as insecure
# unless `auth.uid` is referenced somewhere in the operation.
#
# `response.organization.id` is the uuid Postgres generated a step ago. It is keyed by the response
# key, so it is the alias rather than `organization_insert`, which is also what gives the generated
# `CreateOrganizationData` a field called `organization`
mutation CreateOrganization($name: String!) @auth(level: USER) @transaction {
  organization: organization_insert(data: { name: $name })
  organizationUser: organizationUser_insert(
    data: {
      organizationId_expr: "response.organization.id"
      userId_expr: "auth.uid"
      # Whoever creates it administers it. A second member arrives through an invitation mutation
      # that does not exist yet, and that one will say `MEMBER`
      role: ADMINISTRATOR
    }
  )
}
